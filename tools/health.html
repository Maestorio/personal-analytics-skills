    var r = m.ref && typeof m.ref.low === "number" && typeof m.ref.high === "number" ? m.ref : null;
    set({ labEdit: { mode: "point", mid: id, mname: m.name, orig: "", date: todayISO(), value: "", unit: m.unit || "",
                     low: r ? trim(r.low) : "", high: r ? trim(r.high) : "", lab: "", note: "", err: "", busy: false } });
  },
  "lab-edit": function(key){
    var k = key.split("|"), m = labsMarkerOf(S.labs, k[0]);
    var pt = m && m.series.filter(function(x){ return x.date === k[1] && x.source === "manual"; })[0];
    if (!pt || !labsManualOn()) return;
    var r = pt.ref && typeof pt.ref.low === "number" && typeof pt.ref.high === "number" ? pt.ref : null;
    set({ labEdit: { mode: "point", mid: m.id, mname: m.name, orig: pt.date, date: pt.date,
                     value: pt.value != null ? trim(pt.value) : (pt.text || ""), unit: pt.unit || m.unit || "",
                     low: r ? trim(r.low) : "", high: r ? trim(r.high) : "", lab: pt.lab || "", note: pt.note || "", err: "", busy: false } });
  },
  "lab-newmarker": function(){
    if (!labsManualOn()) return;
    var c = (S.labs.categories || [])[0];
    set({ labEdit: { mode: "marker", mid: "", mname: "", orig: "", name: "", category: c ? c.key : "", date: todayISO(), value: "",
                     unit: "", low: "", high: "", lab: "", note: "", err: "", busy: false }, panes: [] });
  },
  "lab-del": function(key){
    if (!labsManualOn()) return;
    var k = key.split("|"), m = labsMarkerOf(S.labs, k[0]);
    var pt = m && m.series.filter(function(x){ return x.date === k[1] && x.source === "manual"; })[0];
    if (!pt) return;
    uiConfirm({ title: "Удалить точку?", name: m.name + " — " + uiDateNum(pt.date),
                text: "Удалится только эта ручная точка. Точки из документов не затрагиваются." }).then(function(ok){
      if (!ok) return;
      var doc = labsClone(), dm = labsMarkerOf(doc, k[0]);
      dm.series = dm.series.filter(function(x){ return !(x.date === k[1] && x.source === "manual"); });
      labsSend(doc, null);
    });
  },
  "lab-save": function(){
    var e = S.labEdit;
    if (!e || e.busy) return;
    var d = val("f-date"), raw = val("f-labval").replace(",", "."), unit = e.mode === "marker" ? val("f-labunit") : e.unit;
    var lo = val("f-labl").replace(",", "."), hi = val("f-labh").replace(",", ".");
    e.date = d; e.value = val("f-labval"); e.unit = unit; e.low = val("f-labl"); e.high = val("f-labh");
    e.lab = val("f-lablab"); e.note = val("f-labnote");
    if (e.mode === "marker"){ e.name = val("f-labname"); e.category = val("f-labcat") || e.category; }
    var fail = function(t){ e.err = t; render(); };
    if (e.mode === "marker" && !e.name) return fail("Укажите название показателя.");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return fail("Дата — введите как ДД.ММ.ГГГГ или выберите в календаре.");
    if (!raw) return fail("Укажите значение — число или текст.");
    var num = /^-?\d+(\.\d+)?$/.test(raw) ? parseFloat(raw) : null;
    var ref = null;
    if (lo !== "" || hi !== ""){
      var a = parseFloat(lo), b = parseFloat(hi);
      if (!/^-?\d+(\.\d+)?$/.test(lo) || !/^-?\d+(\.\d+)?$/.test(hi)) return fail("Референс — обе границы числом или обе пустые.");
      if (a > b) return fail("Референс: «от» не может быть больше «до».");
      ref = { low: a, high: b };
    }
    var pt = { date: d, value: num, text: num == null ? e.value : null, unit: unit || "", ref: ref, status: "na",
               lab: e.lab || null, source: "manual" };

    if (age != null && (isNaN(age) || age > 120)){ set({ saveNote: "Возраст начала — целое число от 0 до 120 или пусто." }); return; }
    var c = Object.assign({}, e.c, { name: name, group: val("f-cgroup") || "other", kind: val("f-ckind") || "disease",
      onset_age: age, onset_note: val("f-onset_note"), value: val("f-cvalue"), certainty: val("f-ccert") || "known", note: val("f-cnote") });
    var fam = S.anamnesis.family.map(function(f){
      if (f.id !== e.pid) return f;
      var cs = (f.conditions || []).slice();
      if (e.idx == null) cs.push(c); else cs[e.idx] = c;
      return Object.assign({}, f, { conditions: cs });
    });
    S.anamnesis = Object.assign({}, S.anamnesis, { family: fam });
    S.anCond = null;
    saveAnamnesis();
  },
  "an-cdel": function(key){
    var k = key.split("|"), f = S.anamnesis.family.filter(function(x){ return x.id === k[0]; })[0];
    var c = f && (f.conditions || [])[+k[1]];
    uiConfirm({ title: "Удалить запись?", name: c ? c.name : "" }).then(function(ok){
      if (!ok) return;
      S.anamnesis = Object.assign({}, S.anamnesis, { family: S.anamnesis.family.map(function(x){
        return x.id !== k[0] ? x : Object.assign({}, x, { conditions: (x.conditions || []).filter(function(_, i){ return i !== +k[1]; }) });
      }) });
      saveAnamnesis();
    });
  },
  "weight-add": function(){ set({ weightEdit: { kg: "", date: todayISO() } }); },
  "weight-del": function(date){
    if (!S.writable) return;
    var w = (S.vitals.weight || []).filter(function(x){ return x.date === date; })[0];
    uiConfirm({ title: "Удалить запись веса?", name: uiDateNum(date) + (w ? " — " + trim(w.kg) + " кг" : "") }).then(function(ok){
      if (!ok) return;
      S.vitals.weight = (S.vitals.weight || []).filter(function(x){ return x.date !== date; });
      saveVitals();
    });
  },
  "weight-save": function(){
    var kg = parseFloat(val("f-kg").replace(",", "."));
    var d = val("f-date");
    var h = parseFloat(val("f-height").replace(",", "."));
    if (!(kg > 0)){ set({ saveNote: "Вес — число больше нуля." }); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)){ set({ saveNote: "Дата — введите как ДД.ММ.ГГГГ или выберите в календаре." }); return; }
    var v = S.vitals || { schema: "health-vitals@1", height_cm: null, weight: [] };
    v.height_cm = h > 0 ? h : null;
    var w = (v.weight || []).filter(function(x){ return x.date !== d; });
    w.push({ date: d, kg: kg });
    w.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    v.weight = w;
    S.vitals = v; S.weightEdit = null;
    saveVitals();
  }
};

/* ── события ────────────────────────────────────────────────────────────── */
document.addEventListener("click", function(ev){
  var dpOpen = ev.target.closest("[data-dp-open]");
  if (dpOpen){ ev.preventDefault(); openCalendar(dpOpen); return; }
  var mp = ev.target.closest("[data-mp]");
  if (mp){ ev.preventDefault(); openMonthPicker(mp); return; }
  if (!ev.target.closest(".dp-pop")) closeCalendars();   // клик мимо — закрыть
  var t = ev.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  if (!ACTS[act]) return;
  // Переключатель приёма внутри кликабельной строки не должен открывать карточку.
  if (act === "med-toggle") ev.stopPropagation();
  ev.preventDefault();
  ACTS[act](t.getAttribute("data-id"), t);
});
/* Кнопку темы ведёт ui-kit (uiSetTheme); здесь — перерисовка (узор фона). */
document.addEventListener("ui-select", function(ev){
  var d = ev.detail || {};
  if (d.name === "f-evkind"){
    var ch = d.value === "chronic", w = document.querySelector("[data-evwin]"), m = document.querySelector("[data-evmk]");
    if (w) w.style.display = ch ? "none" : "grid";
    if (m) m.style.display = ch ? "" : "none";
    var lb = document.querySelector('[data-evd="eve"] > .fld-lbl');
    if (lb) lb.textContent = anEveLabel(d.value);
  } else if (d.name === "f-evmkadd" && d.value && S.anEv){
    S.anEv.mk = (S.anEv.mk || []);
    if (S.anEv.mk.indexOf(d.value) < 0 && S.anEv.mk.length < 30) S.anEv.mk.push(d.value);
    setTimeout(function(){ var box = document.querySelector("[data-evmkbox]"); if (box) box.innerHTML = anMkBoxHTML(); }, 0);
  }
});
document.addEventListener("ui-theme", function(ev){ set({ theme: ev.detail }); });
document.addEventListener("input", function(ev){
  var act = ev.target.getAttribute && ev.target.getAttribute("data-act");
  // Поиск правит три узла точечно (patchMarkers/patchMeds) вместо полной
  // пересборки документа: поле с фокусом не пересоздаётся, каретка и
  // клавиатура на телефоне остаются на месте. render() — только откат, если
  // узлов нет (ушли с вкладки между вводом и обработчиком).
  if (act === "query"){ S.query = ev.target.value; if (!patchMarkers()) render(); }
  else if (act === "med-query"){ S.medQuery = ev.target.value; if (!patchMeds()) render(); }
  else if (act === "study-query"){ S.stQuery = ev.target.value; if (!patchStudies()) render(); }
  // текст окон «Сохранить отчёт» / «Править справку» переживает перерисовку (онлайн-очередь, ответ сервера)
  else if (S.repAdd && ev.target.id === "f-reptext") S.repAdd.text = ev.target.value;
  else if (S.repAdd && ev.target.id === "f-reptopic") S.repAdd.topic = ev.target.value;
  else if (S.miEdit && ev.target.id === "f-miwhat") S.miEdit.what = ev.target.value;
  else if (S.miEdit && ev.target.id === "f-miup") S.miEdit.up = ev.target.value;
  else if (S.miEdit && ev.target.id === "f-midown") S.miEdit.down = ev.target.value;
  // Ручной ввод даты (dateField): маска ДД.ММ.ГГГГ на лету, ISO — в скрытое
  // поле, которое читает val() при сохранении. Открытый попап того же поля
  // не синхронизируем — печатают и кликают по календарю не одновременно.
  var dpv = ev.target.getAttribute && ev.target.getAttribute("data-dpv");
  if (dpv){
    var masked = maskDMY(ev.target.value);
    if (masked !== ev.target.value) ev.target.value = masked;
    var hidden = document.getElementById("f-" + dpv);
    var parsed = masked.length === 10 ? parseDMY(masked) : null;
    if (hidden) hidden.value = parsed || "";
    ev.target.classList.toggle("is-invalid", masked.length === 10 && !parsed);
  }
});
document.addEventListener("focusout", function(ev){
  // Поле оставили с неполной/непонятной датой («21.07» или опечаткой) —
  // подсветить красным. Пустое поле (next_due необязателен) — не ошибка.
  var dpv = ev.target.getAttribute && ev.target.getAttribute("data-dpv");
  if (!dpv) return;
  var v = ev.target.value.trim();
  ev.target.classList.toggle("is-invalid", !!v && !parseDMY(v));
});
document.addEventListener("change", function(ev){
  var act = ev.target.getAttribute && ev.target.getAttribute("data-act");
  if (act === "sort") set({ sort: ev.target.value });
  else if (act === "an-ev-winb" || act === "an-ev-wina") anEvWinSet(ev.target.getAttribute("data-id"), act === "an-ev-winb" ? "window_before" : "window_after", ev.target.value);
  else if (act === "med-group") ACTS["med-group"](ev.target.value);
  // Селект подстановки: значение приходит на change, не на click.
  else if (act === "med-tpl") ACTS["med-tpl"]();
  // Радио состояния перерисовывает подсветку выбранного варианта. Форма
  // живёт в innerHTML-рендере, поэтому просто чиним классы на месте, не
  // перерисовывая модалку (иначе слетел бы ввод в других полях).
  else if (ev.target.name === "f-status"){
    var opts = document.querySelectorAll(".st-opt");
    for (var i = 0; i < opts.length; i++){
      var r = opts[i].querySelector("input");
      opts[i].classList.toggle("is-on", !!(r && r.checked));
    }
  }
});
document.addEventListener("ui-noai", function(){ if (S.labEdit && uiAiMode() !== "off") S.labEdit = null; render(); });
// Слой страницы (ui-kit uiLayerBind): Escape и пункты меню при открытых окнах.
// Escape = «назад», а не «закрыть всё»: верхняя панель уходит, под ней — та,
// откуда пришли (панели стопкой); последняя — закрывается.
function formOpen(){ return !!(S.medEdit || S.vaxEdit || S.weightEdit || S.studyEdit || S.bpEdit || S.anPerson || S.anCond || S.anAlg || S.anEv || S.repAdd || S.miEdit || S.labEdit); }
uiLayerBind({
  depth: function(){ return (document.querySelector(".dp-pop") ? 1 : 0) + (S.doc ? 1 : 0) + (formOpen() ? 1 : 0) + S.panes.length; },
  closeTop: function(){
    if (document.querySelector(".dp-pop")){ closeCalendars(); return; }
    if (S.panes.length && S.panesOverDoc && S.doc){ panePop(S.panes.length - 1); return; }
    if (S.doc){ closeDocAnim(); return; }
    if (formOpen()){ closeForm(); return; }
    if (S.panes.length){ panePop(S.panes.length - 1); return; }
    return false;
  },
  dirty: function(){ return formOpen() && uiFormDirty(document.querySelector(".ui-modal")); },
  closeAll: function(){
    closeCalendars();
    if (S.doc) closeDoc(true);
    set({ medEdit: null, vaxEdit: null, weightEdit: null, studyEdit: null, bpEdit: null, anPerson: null, anCond: null, anAlg: null, anEv: null, repAdd: null, miEdit: null, labEdit: null, panes: [], panesOverDoc: false });
  }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") return;
  // стрелки листают каталог — только у панели маркера, открытой из каталога
  var t = paneTop();
  if (!t || t.k !== "marker" || S.panes.length > 1) return;
  if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});
boot();
})();
</script>
