<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Здоровье · Личный кабинет</title>
<!-- иконка кабинета (вкладка и экран «Домой»): шесть ромбов — цвета разделов --c-1…--c-6 -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/hub-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/hub-180.png?v=2">
<meta name="apple-mobile-web-app-title" content="Кабинет">
<!-- Светлая тема по умолчанию: системную prefers-color-scheme НЕ подхватываем
     (правило кабинета 2026-07-13) — тёмная только при явном hub-theme==="dark". -->
<script>(function(){try{if(localStorage.getItem("hub-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/ui-kit.css?v=1.72.0">
<style>
/* ── Дизайн-система и стили экрана — ВЕРБАТИМ из «Здоровье.dc.html»
     (Claude Design, проект 553ebbf1-…). Не переписывать вручную:
     при обновлении макета переносить блок целиком. Из макета убран
     только <link> на Google Fonts — шрифты выше self-host. ── */


/* База (сброс, шрифт, цвет и фон body) — в assets/ui-kit.css; здесь только своё. */
/* акцент раздела для общих компонентов ui-kit (выпадающий список и др.) */
body{ --sec-acc:var(--c-3); }
a{ color:var(--c-3); text-decoration:none; }
@media (hover:hover){ a:hover{ filter:brightness(.92); } }

:focus-visible{ outline:2px solid var(--c-3); outline-offset:3px; }
/* hover — только у устройств с наведением: на касании :hover «залипает» на кнопке под пальцем
   (после закрытия окна крестиком кнопка темы в той же точке оставалась подсвеченной) */
@media (hover:hover){ .chip-btn:hover{ background:var(--bg-alt) !important; border-color:var(--border-strong) !important; } }
summary{ list-style:none; cursor:pointer; }
summary::-webkit-details-marker{ display:none; }
.fchip{ background:var(--bg-elev); border:1px solid var(--border); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; min-height:32px; font-family:inherit; transition:background .15s,border-color .15s,color .15s; }
.ui-btn.study-link{ padding:0; height:32px; width:32px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
@media (hover:hover){ .fchip:hover{ border-color:var(--border-strong); color:var(--text); } }
/* родные флажок и поле времени: акцент раздела; в тёмной теме — тёмные (иначе белый квадрат) */
input[type="checkbox"]{ accent-color:var(--c-3); }
[data-theme="dark"] input[type="checkbox"], [data-theme="dark"] input[type="time"]{ color-scheme:dark; }
.attn-card,.mrow,.vit-card{ transition:border-color .16s,box-shadow .16s,background .13s; }
@media (hover:hover){ .attn-card:hover{ border-color:var(--border-strong); box-shadow:0 2px 4px rgba(60,52,38,.10),0 12px 30px rgba(60,52,38,.08); } }
@media (hover:hover){
.mrow:hover{ background:var(--bg-alt); }
.mrow:hover .mrow-name{ color:var(--c-3); }
}
.mrow-name{ transition:color .13s; }
@media (hover:hover){ .cause:hover summary{ color:var(--c-3); } }
.cause-chev{ transition:transform .2s; display:inline-block; }
.cause[open] .cause-chev{ transform:rotate(180deg); }
/* Шапка окна отчёта. На телефоне имя, кнопка «открыть отдельно» и крестик в
   одну строку не влезают: имя сминалось в «2026-08-04 …» и отчёт становилось
   не отличить от соседнего. Ниже 560 px имя занимает свою строку целиком. */
/* шапка окна документа — общая ui-kit (.ui-docwin-head; на узком экране имя
   своей строкой, если есть «Открыть отдельно») */
/* ── Навигация раздела: рельс (десктоп) ⇄ нижняя панель (телефон/портрет) ──
   Общая ui-kit (.ui-rail/.ui-mnav, uiRailHTML/uiNavMount): ширина рельса,
   высота панели, слои и порог («узкий экран или портрет») — там, в одном
   месте. Плашка сохранения поднимается над панелью через --ui-mnav-offset. */
/* колонки и порог «рельс ↔ нижняя панель» — ui-kit (.ui-shell, раздел «Навигация») */
.shell{ display:grid; gap:28px; align-items:start; margin-top:24px; }
.sc-content{ min-width:0; }
/* Заголовок раздела — как на games.html/food.html: живёт в колонке контента
   рядом с рельсом, а не отдельной шапкой на всю ширину (иначе рельс не
   стартует от верхней панели, а заголовок съедает треть экрана). */
.sc-head{ margin:0 0 6px; }
.hub-masthead{ font-family:var(--font-serif); font-weight:600; font-size:clamp(42px,6vw,58px); line-height:1; letter-spacing:-.02em; margin:12px 0 0; }
.sec-eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--c-3); font-weight:700; }
/* рельс и нижняя панель — общие ui-kit (.ui-rail, .ui-mnav): ширина, высота, слои и порог там */

/* 820px, а не 760: так в макете, и это правильнее по факту — iPad в портрете
   ровно 768px, то есть на 760 он попадал бы в десктопную ветку и получал
   рельс 212px с колонкой контента ~516px. Все четыре правила обязаны жить в
   ОДНОМ брейкпоинте: разъедутся — на 761–820 появится нижняя навигация без
   поднятой .savebar и без нижнего отступа контента, то есть ровно тот
   конфликт, ради развязки которого они и написаны. */
@media (max-width:820px){ .shell{ margin-top:16px; } }
/* Строка списка (отчёты, исследования): подсвечивается ЦЕЛИКОМ. Фон строки задан
   инлайном, поэтому hover-фон — с !important; filter:none снимает общий a:hover
   (у отчётов строка — ссылка), иначе два вида подсветки. */
@media (hover:hover){
.med-row:hover{ background:var(--bg-alt); }
.med-row:hover .mrow-name{ color:var(--c-3); }
.rep-row:hover{ background:var(--bg-alt) !important; filter:none; }
.rep-row:hover .rep-title{ color:var(--c-3) !important; }
}
@media (max-width:820px){
  .hub-masthead{ font-size:46px !important; }
  .cat-spark{ display:none !important; }
  .mrow{ grid-template-columns:1fr 118px 116px !important; }
}
@media (max-width:600px){
  .hub-wrap{ padding:20px 14px 52px !important; }
  .hub-masthead{ font-size:33px !important; }
  .np-sub{ font-size:12.5px !important; margin-top:10px !important; }
  .sec-head{ margin:26px 0 12px !important; }
  .chip-btn:not(.ui-top .chip-btn){ padding:7px 11px !important; font-size:11.5px !important; }   /* шапку ведёт ui-kit */
  /* Две колонки (как в макете), а НЕ горизонтальная карусель: список
     «требует внимания» надо охватить взглядом целиком, а карусель прятала
     хвост за краем экрана и требовала прокрутки вбок.
     grid-template-columns с !important перебивает инлайновый auto-fill
     у .attn-grid — display:grid там же в инлайне и остаётся. */
  .attn-grid{ grid-template-columns:1fr 1fr !important; gap:10px !important; }
  .attn-card{ padding:12px 13px !important; gap:7px !important; }
  .ac-val{ font-size:22px !important; }
  .vit-grid{ grid-template-columns:1fr !important; }
  .vit-card{ padding:14px 16px !important; }
  .vit-val{ font-size:30px !important; }
  .cat-card{ padding:2px 12px 6px !important; }
  /* minmax(0,auto) вместо auto: колонка значения должна уметь сжиматься —
     иначе длинный качественный результат (см. .qual-val ниже, на узком экране
     он переносится, а не режется многоточием) распирал бы строку. */
  .mrow{ grid-template-columns:40px minmax(0,1fr) minmax(0,auto) !important; gap:11px !important; padding:9px 4px !important; margin:0 -4px !important; }
  .cat-ref{ display:block !important; order:-1; height:28px !important; border-radius:7px !important; }
  .cat-spark{ display:none !important; }
  .mrow-name{ font-size:13px !important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mval{ font-size:13px !important; }
  table{ font-size:12.5px !important; }
  table thead th, table tbody td{ padding:10px 12px !important; }
}
@media (max-width:380px){
  .vax-hide{ display:none !important; }
  .attn-card{ padding:11px 12px !important; }
}
/* Шапка раздела (.ui-top: крошка «← Хаб» · ромб и имя · действия) — общая,
   ui-kit 1.17.0 (uiTopHTML); своих стилей шапки страница не держит. Липкая и
   живёт вне .hub-wrap, поэтому position:sticky работает от вьюпорта. */
/* .chip-btn теперь класс, а не инлайн-строка: инлайн перебивал бы медиазапросы
   (тач-мишени и скрытие подписей на узком экране). */
.chip-btn{ background:var(--bg-elev); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 11px; font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:none; text-decoration:none; transition:background .15s,border-color .15s; }

/* Строка «Истории измерений»: дата | значение | место (+ссылка) | статус.
   Узкий экран: место уходит отдельной строкой под дату/значение — ничто не перекрывается. */
html:not([data-noai]) .noai-only{ display:none !important; }
.hist-row{ display:grid; grid-template-columns:auto minmax(min-content,1fr) auto auto; align-items:center; gap:12px; padding:11px 2px; border-top:1px solid var(--border); font-size:13px; }
.hist-place{ display:inline-flex; align-items:center; justify-content:flex-end; gap:8px; min-width:0; }
.hist-place-t{ font-size:12px; color:var(--text-faint); line-height:1.3; text-align:right; min-width:0; overflow-wrap:anywhere; }
@media (max-width:600px){
  .hist-row{ grid-template-columns:auto minmax(0,1fr) auto; }
  .hist-row > .hist-st{ grid-row:1; grid-column:3; }
  .hist-row > .hist-place{ grid-row:2; grid-column:1 / -1; justify-content:flex-start; }
  .hist-place-t{ text-align:left; }
}

/* ── Добавления к дизайн-системе (в её же грамматике) ───────────────────────
   Дизайн Claude Design не знал про: качественные маркеры, форму входа,
   правку прививок/веса и состояние сохранения. Стили ниже follow тем же
   токенам, радиусам и теням. */

/* Заголовок блока назначения липнет под шапкой .ui-top, пока блок на экране,
   и выталкивается заголовком следующего блока — так на длинной прокрутке всегда
   видно, в каком назначении ты сейчас. Работает само, без JS-наблюдателей:
   sticky ограничен своим родителем, а каждый блок — отдельный div.
   Высоту шапки НЕ зашиваем числом: на узком экране кнопки другие, и константа
   разъехалась бы с вёрсткой. Её меряет syncStickyTop() и кладёт в переменную;
   50px — только запасной вариант на случай, если панели ещё нет в DOM.
   Фон обязателен и непрозрачен: без него строки просвечивают сквозь заголовок. */
.md-ghead{ position:sticky; top:var(--h-top-h, 50px); z-index:5; background:var(--bg-elev); }

/* Состояние лекарства: три взаимоисключающих варианта. */
.st-pick{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.st-opt{ display:flex; flex-direction:column; gap:2px; border:1px solid var(--border); border-radius:9px; padding:9px 11px; cursor:pointer; background:var(--bg); }
@media (hover:hover){ .st-opt:hover{ border-color:var(--border-strong); } }
.st-opt.is-on{ border-color:var(--c-3); background:var(--accent-bg); }
.st-opt input{ position:absolute; opacity:0; pointer-events:none; }
.st-opt .st-t{ font-size:13px; font-weight:600; }
.st-opt.is-on .st-t{ color:var(--c-3); }
/* --text-faint на --accent-bg давал контраст 3.9 при пороге 4.5 — подсказка
   мелкая, ей нужен muted, а не faint. */
.st-opt .st-h{ font-size:11px; color:var(--text-muted); }
@media (max-width:520px){ .st-pick{ grid-template-columns:1fr; } }
/* Истёкший срок — не мелкий серый текст, а заметная метка. */
.exp-chip{ font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; border-radius:999px; padding:2px 8px; background:var(--err-bg); color:var(--err); white-space:nowrap; }
.med-row.is-gone .mrow-name{ color:var(--text-muted); }
.med-row.is-arch{ opacity:.62; }
/* «Раньше покупал» — история аптечки: свёрнутая, приглушённая, но доступная. */
.was-bought{ margin:18px -20px 0; padding:0 20px; border-top:1px solid var(--border); background:var(--bg-alt); border-radius:0 0 var(--radius) var(--radius); }
.was-bought > summary{ display:flex; align-items:center; gap:9px; padding:13px 2px; cursor:pointer; list-style:none; }
.was-bought > summary::-webkit-details-marker{ display:none; }
.was-bought .wb-t{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); }
.was-bought .wb-n{ font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
.was-bought .wb-chev{ margin-left:auto; color:var(--text-faint); font-size:11px; transition:transform .15s; }
.was-bought[open] .wb-chev{ transform:rotate(180deg); }
.was-bought .wb-list{ padding-bottom:8px; }
.was-bought .wb-empty{ padding:0 2px 14px; font-size:12.5px; color:var(--text-faint); }
.qual-val{ max-width:116px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:inline-block; }
.login-card{ max-width:420px; margin:60px auto; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 28px; }
.ui-pane-box .fld{ margin-top:2px; }
/* Ширина ограничена: текст ошибки записи бывает длинным («Данные изменились с
   другого устройства…») и без max-width плашка уезжала за края экрана вместе с
   текстом. bottom учитывает домашнюю полосу iPhone (safe-area). Радиус 18px
   вместо пилюли — пилюля рассчитана на одну строку, перенос её ломал. */
/* плашка сохранения — общая ui-kit (.ui-savebar, uiSaveBarHTML) */
.ro-note{ font-size:11.5px; color:var(--text-faint); }

/* ── Мобильные правки (аудит вёрстки под телефон) ──────────────────────────*/

/* Правка прививки с телефона. Раньше вся колонка действий пряталась на ≤600 —
   запись невозможно было отредактировать в принципе. Теперь колонка остаётся,
   а кнопка схлопывается в иконку: место экономится, действие доступно. */
.vax-edit-ic{ display:none; }
@media (max-width:600px){
  .vax-edit-lbl{ display:none; }
  .vax-edit-ic{ display:inline; }
  /* Полный текст качественного маркера («обнаружены единичные…») на таче был
     доступен только через hover-title. На узком экране снимаем обрезку. */
  .qual-val{ max-width:none; white-space:normal; overflow:visible; text-overflow:clip; text-align:right; overflow-wrap:anywhere; }
  /* Отрицательные поля должны совпадать с padding .cat-card на этом брейкпоинте
     (12px), иначе фон секции вылезал за карточку на ~8px с каждой стороны. */
  .was-bought{ margin:18px -12px 0; padding:0 12px; }
}

/* Тач-устройства (не «узкий экран»: у iPad ширина большая, а палец тот же).
     • поля ввода <16px заставляют iOS Safari зумить страницу при фокусе;
     • мишени меньше ~40px промахиваются пальцем. */
@media (pointer:coarse){
  .fld, .h-search, #sort{ font-size:16px !important; }
  .fchip{ min-height:40px; }
  .ui-btn.study-link{ width:40px; height:40px; }
  /* Тумблер приёма 38×22 остаётся 38×22 визуально (его размеры заданы инлайном
     в switchStyle/knobStyle и завязаны на transform кнопки), но зона нажатия
     расширяется псевдоэлементом до 50×40. */
  .tgl::after{ content:""; position:absolute; inset:-9px -6px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script src="assets/ui-kit.js?v=1.72.0"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Здоровье · Personal Hub                                                    

   Порт экрана «Здоровье.dc.html» (Claude Design, проект 553ebbf1-…) на
   реальные данные. Вёрстка, токены и компоненты перенесены вербатим;
   отличия от макета — только там, где он расходился с реальностью:

     • данные из /health-data/* вместо выдуманных (макет сочинил и маркеры,
       и сюжет «ЛПНП 4.9 / B12 145» — в реальных анализах этого нет);
     • качественные маркеры (56 из 148: копрограмма, серология, моча) —
       свой рендер без бара и графика, в «Требует внимания» не пускаются
       (иначе 14 из 21 отклонения — находки копрограммы одного дня);
     • аптечка/прививки/вес пишутся в файлы через write-API (/api/hd/*),
       а НЕ в localStorage: макет предлагал localStorage + синк скиллом, но
       тогда правки скилла никогда не были бы видны (см. health-plan.md §0);
     • прививки и вес редактируемые (в макете — статичная таблица);
     • светлая тема по умолчанию, шрифты self-host (макет подхватывал системную
       prefers-color-scheme — правило кабинета это запрещает).

   v1.13 · переработанный макет + мобильный аудит:
     • липкая панель раздела .h-top (крошка · ромб --c-3 «Здоровье» · ⟳ ◐) —
       общая с travel.html/hub.html; рендерится ВНЕ .hub-wrap, иначе sticky
       упирался бы в поля обёртки;
     • тач-правки: ввод 16px и мишени ≥40px под @media (pointer:coarse),
       форма модалки в одну колонку и правка прививки на ≤600.

   v1.14 · боковой рельс навигации (как на games.html):
     • на десктопе вкладки переехали из горизонтальной полосы в липкий рельс
       .nav-rail (иконка · название · подпись · счётчик), контент — соседняя
       колонка .sc-content в гриде .shell; акцент активного пункта зелёный
       --c-3 (цвет раздела), как слива --c-5 в «Играх»;
     • активное состояние — класс .on от рендера вместо цепочек
       [data-tab="x"] .seg[data-key="x"]: те перечисляли вкладки поимённо и
       уже отстали от жизни (вкладку «Исследования» в них не дописали, её
       кнопка не подсвечивалась). Список вкладок теперь один — tabList().

   v1.15 · нижняя навигация телефона (макет «Здоровье.dc.html», решение
   владельца — паритет с games.html):
     • на ≤760 вместо прокручиваемой полосы .segbar — фиксированная .h-mnav:
       шесть мишеней по 56px, иконка над короткой подписью, safe-area снизу.
       .segbar и все .seg* удалены: на десктопе их закрывал рельс, на телефоне
       теперь панель — правил не осталось ни для одного состояния;
     • развязка с .savebar (тоже фиксирована снизу): на телефоне её низ
       поднимается на высоту панели, а .shell получает padding-bottom:84px,

  var n = pts.length;
  if (n < 2) return "";
  var vals = pts.map(function(p){ return p.value; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mx === mn){ mx += 1; mn -= 1; }
  var t0 = tms(pts[0].date), tspan = (tms(pts[n - 1].date) - t0) || 1;
  return "M" + pts.map(function(p){
    return r1((tms(p.date) - t0) / tspan * 60) + " " +
           r1(3 + (1 - (p.value - mn) / (mx - mn)) * 14);
  }).join(" L");
}

/* ── пары маркеров ──────────────────────────────────────────────────────────
   Хранятся двумя рядами labs.json (у каждого своя норма, статус, связь с
   лекарствами через affects), а показываются одной карточкой: давление читают
   парой «120/80». Каталог, «Требует внимания», листание ◀ ▶ и панель берут
   markerList(); второй маркер пары открывает карточку первого (headId). */
var MARKER_PAIRS = [
  { a: "exam_bp_sys", b: "exam_bp_dia", name: "Артериальное давление", la: "верхнее", lb: "нижнее" }
];
function pairOf(id){ return MARKER_PAIRS.filter(function(p){ return p.a === id || p.b === id; })[0] || null; }
function markerList(){
  var all = bioList(), byId = {}, out = [];
  all.forEach(function(m){ byId[m.id] = m; });
  all.forEach(function(m){
    var p = pairOf(m.id);
    if (!p || !byId[p.a] || !byId[p.b]){ out.push(m); return; }
    if (m.id === p.a) out.push(Object.assign({}, m, { name: p.name, pair: { p: p, b: byId[p.b], aName: m.name } }));
  });
  return out;
}
function headId(id){
  var p = pairOf(id), all = bioList();
  var has = function(x){ return all.some(function(m){ return m.id === x; }); };
  return p && has(p.a) && has(p.b) ? p.a : id;
}
/* Ряды маркеров = labs.json + ручные замеры vitals.bp (контракт §12). Ручные
   точки получают lab «Вручную»; нормы и статус — от ряда labs.json (нет нормы —
   «без референса»). Ряда нет, а ручные точки есть — ряд создаётся на лету.
   Кэш по идентичности labs и bp: страница перерисовывается часто. */
var BIO_SPEC = [
  { id: "exam_bp_sys", f: "sys", name: "АД систолическое", unit: "мм рт. ст." },
  { id: "exam_bp_dia", f: "dia", name: "АД диастолическое", unit: "мм рт. ст." },
  { id: "exam_pulse", f: "pulse", name: "Пульс", unit: "уд/мин" }
];
var BIO_CACHE = { l: null, b: null, v: [] };
function bpStatus(v, ref){
  var b = refBounds(ref);
  return !b ? "na" : v > b.high ? "high" : v < b.low ? "low" : "norm";
}
function bioList(){
  var labs = (S.labs && S.labs.biomarkers) || [];
  var bp = (S.vitals && S.vitals.bp) || [];
  if (BIO_CACHE.l === labs && BIO_CACHE.b === bp) return BIO_CACHE.v;
  var spec = {}; BIO_SPEC.forEach(function(x){ spec[x.id] = x; });
  var manual = function(sp, ref){
    var out = [];
    bp.forEach(function(b){
      var v = b[sp.f];
      if (typeof v !== "number") return;
      out.push({ date: b.date, value: v, text: null, unit: sp.unit, ref: null, status: bpStatus(v, ref),
                 lab: "Вручную" + (b.time ? " · " + b.time : ""), manual: true, bpid: b.id, time: b.time || "" });
    });
    return out;
  };
  var merge = function(m, sp){
    var add = manual(sp, m.ref);
    var ser = m.series.map(function(x, i){ return { x: x, i: i }; }).concat(add.map(function(x, i){ return { x: x, i: 1e6 + i }; }));
    ser.sort(function(a, b){
      return a.x.date < b.x.date ? -1 : a.x.date > b.x.date ? 1 : (a.x.time || "") < (b.x.time || "") ? -1 : (a.x.time || "") > (b.x.time || "") ? 1 : a.i - b.i;
    });
    return Object.assign({}, m, { name: sp.f === "pulse" ? "Пульс" : m.name, series: ser.map(function(o){ return o.x; }) });
  };
  var seen = {};
  var out = labs.map(function(m){
    var sp = spec[m.id];
    if (!sp) return m;
    seen[m.id] = 1;
    return merge(m, sp);
  });
  BIO_SPEC.forEach(function(sp){
    if (seen[sp.id] || !manual(sp, null).length) return;
    out.push(merge({ id: sp.id, name: sp.name, category: "exam", kind: "num", unit: sp.unit, ref: null, series: [] }, sp));
  });
  BIO_CACHE = { l: labs, b: bp, v: out };
  return out;
}
var STATUS_RANK = { high: 3, low: 2, norm: 1, na: 0 };
function worseStatus(a, b){ return (STATUS_RANK[b || "na"] || 0) > (STATUS_RANK[a || "na"] || 0) ? b : (a || "na"); }

/* ── ручные точки анализа (labs.json, source: manual) ──────────────────────
   Форма и кнопки — только при режиме «без ИИ»: при включённом ИИ labs.json пишет один скилл (intake.py), сервер
   на ручную запись отвечает 403. Править и удалять можно только свои точки; точки из документов — только читаются.
   Давление и пульс (exam_bp_*, exam_pulse) вводит окно замера в vitals.bp, не эта форма. */
function labsManualOn(){
  return !!(S.writable && S.caps.labs && S.hash.labs && S.apiSkew.indexOf("labs") < 0 && uiAiMode() === "off");
}
function labsFormMarker(raw){
  return !raw.pair && !BIO_SPEC.some(function(x){ return x.id === raw.id; });
}
function labsClone(){ return clone(S.labs); }
function labsMarkerOf(doc, id){ return (doc.biomarkers || []).filter(function(m){ return m.id === id; })[0]; }
/* Строка ручной точки: пометка «вручную» и (в режиме «без ИИ») правка/удаление. */
function labRowExtra(h, mid){
  if (h.source !== "manual") return "";
  var can = labsManualOn();
  return '<div style="grid-column:1 / -1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:-4px;">' +
    '<span class="ui-tag lab-manual" style="white-space:normal;">вручную</span>' +
    (h.note ? '<span style="font-size:12px; color:var(--text-faint); min-width:0; overflow-wrap:anywhere;">' + esc(h.note) + '</span>' : '') +
    '<span style="margin-right:auto;"></span>' +
    (can ? '<button class="ui-btn plain sm" data-act="lab-edit" data-id="' + esc(mid + "|" + h.date) + '">Изменить</button>' +
      '<button class="ui-btn danger sm" data-act="lab-del" data-id="' + esc(mid + "|" + h.date) + '" aria-label="Удалить точку">✕</button>' : '') + '</div>';
}

/* ── обогащение маркера (перенос enrich() макета на нашу модель) ─────────── */
function enrich(m){ return m.pair ? enrichPair(m) : enrichOne(m); }
// Пара: «120/80», статус — худший из двух, полосы нормы нет (их две).
function enrichPair(m){
  var a = enrichOne(m), b = enrichOne(m.pair.b), sk = worseStatus(a.statusKey, b.statusKey);
  a.lastVal = a.lastVal + "/" + b.lastVal;
  a.refText = m.ref || m.pair.b.ref ? refText(m.ref) + " / " + refText(m.pair.b.ref) + (m.unit ? " " + m.unit : "") : "—";
  a.statusKey = sk; a.statusColor = statusColor(sk); a.statusText = statusText(sk); a.arrow = arrow(sk);
  a.valColor = sk === "norm" || sk === "na" ? "var(--text)" : statusColor(sk);
  a.sev = Math.max(a.sev, b.sev); a.hasBar = false;
  if (b.lastMs > a.lastMs){ a.lastMs = b.lastMs; a.lastDate = b.lastDate; }
  a.search = (m.pair.aName + " " + m.pair.b.name + " " + m.pair.p.name).toLowerCase();
  return a;
}
function enrichOne(m){
  var last = m.series[m.series.length - 1];
  var sk = last.status || "na";
  var pts = m.series.filter(function(s){ return s.value != null; });
  var vals = pts.map(function(s){ return s.value; });
  var b = refBounds(m.ref);
  var out = {
    id: m.id, name: m.name, cat: m.category, kind: m.kind, unit: m.unit,
    search: m.name.toLowerCase(),
    refText: refText(m.ref, m.unit),
    lastDate: uiMonthShort(last.date), lastMs: new Date(last.date + "T00:00:00").getTime(),
    count: m.series.length,
    statusKey: sk, statusColor: statusColor(sk), statusText: statusText(sk), arrow: arrow(sk),
    valColor: sk === "norm" || sk === "na" ? "var(--text)" : statusColor(sk),
    // С двух точек: у исследований (ЭКГ, УЗИ) повторов мало, а направление
    // видно уже по двум.
    hasSpark: vals.length >= 2, sparkPath: sparkPath(pts),
    isNum: m.kind === "num",
    lastVal: last.value != null ? trim(last.value) : (last.text || "—"),
    sev: 0, hasBar: false
  };
  if (b && last.value != null){
    var span0 = (b.high - b.low) || b.high || 1;
    var domMin = b.low === 0 ? 0 : Math.max(0, b.low - span0 * 0.6);
    var domMax = b.high + span0 * 0.6;
    var span = (domMax - domMin) || 1;
    var clamp = function(x, a, bb){ return Math.max(a, Math.min(bb, x)); };
    out.hasBar = true;
    out.zoneLeft = r1((b.low - domMin) / span * 100) + "%";
    out.zoneWidth = r1((b.high - b.low) / span * 100) + "%";
    out.dotLeft = r1(clamp((last.value - domMin) / span * 100, 3, 97)) + "%";
    if (last.value > b.high) out.sev = (last.value - b.high) / span0;
    else if (last.value < b.low) out.sev = (b.low - last.value) / span0;
  }
  return out;
}

/* ── сеть ───────────────────────────────────────────────────────────────── */
function bust(url){ return uiBust("health", url); }   // метка «Обновить» — ui-kit

// authToken()/loginUrl(why)/authBtnHTML()/authFetch()/uiGoLogin() — общие, из
// ui-kit.js (вход — одна реализация на кабинет, ui-kit 1.16.0); копий здесь нет.
function getJSON(url){
  return authFetch(bust(url), { cache: "no-store" }).then(function(r){
    if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r.json();
  });
}
// Живые файлы читаем через API — нужен base_hash для безопасной записи.
function apiGet(name){
  return authFetch(bust(API + "file?path=" + encodeURIComponent(name + ".json")), { cache: "no-store" })
    .then(function(r){
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    })
    .then(function(j){ S.hash[name] = j.hash; S.server[name] = JSON.parse(j.content); return JSON.parse(j.content); });
}
function apiSave(name, doc){
  /* без связи (v1.57) правка не теряется — в очередь на телефоне, как у «Еды» */
  if (outboxGet()[name] || offlineKnown()) return Promise.resolve(outboxPut(name, doc));
  return postSave(name, doc, S.hash[name]).then(function(res){
      if (res.net) return outboxPut(name, doc);
      if (res.st === 200){ S.hash[name] = res.j.hash; S.server[name] = clone(doc); return true; }
      if (res.st === 409) throw new Error("Данные изменились с другого устройства или их правил скилл. Нажмите «Обновить».");
      if (res.st === 400) throw new Error("Структура файла не прошла проверку: " + (res.j.detail || "") + ". Файл не тронут.");
      if (res.st === 401 || res.st === 403) throw new Error("Нет прав на запись — войдите заново.");
      throw new Error("Не удалось сохранить (код " + res.st + ").");
    });
}
/* Запись на сервер → { st, j } | { net: true }. Без ответа дольше SAVE_WAIT_MS — тоже net: на телефоне
   без связи запрос не падает, а висит. Дошёл всё же — отправка очереди получит 409, а слияние увидит
   ту же правку с обеих сторон. */
var SAVE_WAIT_MS = 8000;
function postSave(name, doc, baseHash){
  var body = JSON.stringify({ path: name + ".json", content: JSON.stringify(doc, null, 2) + "\n", base_hash: baseHash });
  var req = authFetch(API + "save", { method: "POST", headers: { "Content-Type": "application/json" }, body: body })
    .then(function(r){
      if (r.status === 502 || r.status === 503 || r.status === 504) return { net: true };
      return r.json().then(function(j){ return { st: r.status, j: j }; }, function(){ return { st: r.status, j: {} }; });
    }, function(){ return { net: true }; });
  return Promise.race([req, new Promise(function(res){ setTimeout(function(){ res({ net: true }); }, SAVE_WAIT_MS); })]);
}
function clone(x){ return JSON.parse(JSON.stringify(x)); }
// Связи нет — уже известно: браузер говорит «офлайн» или ui-kit показывает плашку/метку «нет связи»
function offlineKnown(){
  var o = document.getElementById("ui-offline");
  return navigator.onLine === false || !!(o && !o.hidden);
}

/* ═══ Очередь правок без связи (v1.57, как «Еда» v1.38) ═══════════════════════
   Аптечка, прививки, вес и давление, исследования, анамнез пишутся файлом целиком: в очереди — последняя
   версия файла + с какой версии сервера она начата (base, base_hash). localStorage «health-outbox»:
   переживает перезагрузку, без связи страница показывает свою версию. Отправка — при открытии, по
   «online», раз в 30 с и при возврате на вкладку. Сервер успел измениться (409) — слияние: списки — по
   id записи (моё поверх чужого, добавленное с обеих сторон остаётся, удалённое мной уходит, если там его
   не меняли), остальные поля — моё, если я его менял, иначе их. Молча ничего не затирается. */
var OUTBOX_KEY = "health-outbox";
var _flushing = false;
function outboxGet(){
  try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || "{}") || {}; } catch(e){ return {}; }
}
function outboxSet(o){
  try { if (Object.keys(o).length) localStorage.setItem(OUTBOX_KEY, JSON.stringify(o)); else localStorage.removeItem(OUTBOX_KEY); } catch(e){}
}
function outboxCount(){ return Object.keys(outboxGet()).length; }
function outboxPut(name, doc){
  var o = outboxGet(), e = o[name];
  o[name] = { base_hash: e ? e.base_hash : (S.hash[name] != null ? S.hash[name] : null),
              base: e ? e.base : (S.server[name] || null), doc: clone(doc), t: Date.now() };
  outboxSet(o);
  return "queued";
}
function outboxNote(){
  return outboxCount() ? "Нет связи — изменения сохранены на телефоне и отправятся сами, когда связь появится." : null;
}
function sameJSON(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
function isObj(x){ return !!x && typeof x === "object" && !Array.isArray(x); }
/* Списки — по id: base — откуда начали, local — моё, server — что там сейчас */
function mergeById(base, local, server){
  var key = function(x){ return x && x.id != null ? "id:" + x.id : "js:" + JSON.stringify(x); };
  var idx = function(arr){ var m = {}; (arr || []).forEach(function(x){ m[key(x)] = x; }); return m; };
  var B = idx(base), L = idx(local), R = idx(server);
  var out = [];
  (server || []).forEach(function(r){
    var k = key(r), b = B[k], l = L[k];
    if (!b){ out.push(r); return; }                           // добавлено там
    if (!l){ if (!sameJSON(b, r)) out.push(r); return; }      // удалено мной: остаётся, только если там меняли
    out.push(sameJSON(l, b) ? r : l);                         // менял я — моё, иначе — их
  });
  (local || []).forEach(function(l){ var k = key(l); if (!B[k] && !R[k]) out.push(l); });   // добавлено мной
  return out;
}
/* Файл целиком: объекты — по полям вглубь, списки — mergeById, прочее — моё, если менял */
function mergeDoc(base, local, server){
  base = isObj(base) ? base : {}; local = isObj(local) ? local : {}; server = isObj(server) ? server : {};
  var out = {}, keys = {};
  [base, local, server].forEach(function(o){ Object.keys(o).forEach(function(k){ keys[k] = 1; }); });
  Object.keys(keys).forEach(function(k){
    var b = base[k], l = local[k], r = server[k], v;
    if (Array.isArray(l) && Array.isArray(r)) v = mergeById(Array.isArray(b) ? b : [], l, r);
    else if (isObj(l) && isObj(r)) v = mergeDoc(b, l, r);
    else if (!(k in local)) v = (k in server && !sameJSON(b, r)) ? r : undefined;   // убрано мной: остаётся, если там меняли
    else v = sameJSON(l, b) ? r : l;
    if (v !== undefined) out[k] = v;
  });
  return out;
}
var OUTBOX_APPLY = {
  meds: function(d){ S.meds = d.meds || []; },
  vaccinations: function(d){ S.vax = d.vaccinations || []; },
  vitals: function(d){ S.vitals = d; },
  studies: function(d){ S.studies = d.studies || []; },
  anamnesis: function(d){ S.anamnesis = d; }
};
function outboxApply(){                                        // своя версия поверх загруженной
  var o = outboxGet();
  Object.keys(o).forEach(function(n){ if (OUTBOX_APPLY[n]) OUTBOX_APPLY[n](clone(o[n].doc)); });
}
function flushOutbox(){
  if (_flushing || !outboxCount() || navigator.onLine === false) return Promise.resolve();
  _flushing = true;
  var merged = false;
  var names = Object.keys(outboxGet());
  var step = function(i){
    if (i >= names.length) return Promise.resolve(true);
    var name = names[i], e = outboxGet()[name];
    if (!e) return step(i + 1);
    var send = function(doc, baseHash, tries){
      return postSave(name, doc, baseHash).then(function(res){
        if (res.net) return false;                             // связи всё ещё нет — ждём
        if (res.st === 200){
          S.hash[name] = res.j.hash; S.server[name] = clone(doc);
          var o = outboxGet();
          if (o[name] && o[name].t === e.t){ delete o[name]; if (OUTBOX_APPLY[name]) OUTBOX_APPLY[name](clone(doc)); }  // пока слали, правок не было
          else if (o[name]){ o[name].base_hash = res.j.hash; o[name].base = S.server[name]; }
          outboxSet(o);
          return step(i + 1);
        }
        if (res.st === 409 && tries < 3){
          return apiGet(name).then(function(cur){
            var m = mergeDoc(e.base, doc, cur);
            m.updated = todayISO();
            merged = true;
            return send(m, S.hash[name], tries + 1);
          }, function(){ return false; });
        }
        S.saveNote = res.st === 401 || res.st === 403
          ? "Изменения без связи ждут входа — войдите заново, они на телефоне."
          : "Изменения без связи не отправились (код " + res.st + "). Они на телефоне — нажмите «Обновить» позже.";
        return false;
      });
    };
    return send(e.doc, e.base_hash, 0);
  };
  return step(0).then(function(ok){
    _flushing = false;
    if (ok && !outboxCount()) S.saveInfo = merged
      ? "Изменения без связи отправлены и объединены с правками с другого устройства."
      : "Изменения без связи отправлены.";
    if (!S.loading) render();
  }, function(){ _flushing = false; });
}
window.addEventListener("online", function(){ flushOutbox(); });
document.addEventListener("visibilitychange", function(){ if (!document.hidden) flushOutbox(); });
(function outboxTick(){ setTimeout(function(){ if (outboxCount()) flushOutbox(); outboxTick(); }, 30000); })();

/* ── сохранение живых файлов ────────────────────────────────────────────── */
function persist(name, doc, after){
  S.saving = true; S.saveNote = null; S.saveInfo = null; render();
  apiSave(name, doc).then(function(res){
    S.saving = false;
    if (after) after();
    if (res === "queued") S.saveInfo = outboxNote();
    render();
  }).catch(function(e){
    S.saving = false; S.saveNote = e.message; render();
  });
}
function saveMeds(after){
  persist("meds", { schema: "health-meds@1", updated: todayISO(), meds: S.meds }, after);
}
function saveVax(after){
  persist("vaccinations", { schema: "health-vaccinations@1", updated: todayISO(), vaccinations: S.vax }, after);
}
function saveStudies(after){
  persist("studies", { schema: "health-studies@1", updated: todayISO(), studies: S.studies }, after);
}
function saveVitals(after){
  // Object.assign: bp[] и чужие ключи файла переживают правку веса
  persist("vitals", Object.assign({}, S.vitals, { schema: "health-vitals@1", updated: todayISO(),
                      height_cm: S.vitals.height_cm, weight: S.vitals.weight }), after);
}
function saveAnamnesis(after){
  persist("anamnesis", Object.assign({}, S.anamnesis, { schema: "health-anamnesis@1", updated: todayISO(),
                      family: S.anamnesis.family }), after);
}
// Правка анамнеза: нужен вход И чтобы сайдкар знал anamnesis.json И чтобы файл
// прочитался через API (иначе нет base_hash — писать вслепую нельзя).
function anWritable(){
  return S.writable && S.apiSkew.indexOf("anamnesis") < 0 && !!S.hash.anamnesis;
}

/* ── загрузка ───────────────────────────────────────────────────────────── */
/* Живые файлы (аптечка/прививки/вес/исследования) НИКОГДА не решают вопрос
   авторизации. Их 403 двусмыслен: это и «нет токена», и «путь не в whitelist
   сайдкара» — второе бывает при рассинхроне версий, когда страница новее
   api/server.py на NAS (реальный случай 2026-07-17: страница просит
   studies.json, старый сайдкар о нём не знает → 403 → страница решала, что
   пароль не тот → уходила на login → login видел рабочий токен → возвращал
   назад → БЕСКОНЕЧНАЯ ПЕТЛЯ). Судим про авторизацию ТОЛЬКО по labs.json. */
function liveMiss(e){
  S.liveErr.push(e && e.status ? e.status : 0);
  uiDataDone(false);   // подвал: источник не прочитан
  return null;
}

var NEED_FILES = ["meds", "vaccinations", "vitals", "studies", "anamnesis", "labs"];  // что нужно ЭТОЙ странице

/* источник данных → подвал (ui-kit): прочитан или нет; ошибку отдаём дальше как раньше */
function tally(p){
  return p.then(function(v){ uiDataDone(true); return v; }, function(e){ uiDataDone(false); throw e; });
}

function loadAll(){
  S.loading = true; S.liveErr = []; S.apiSkew = []; uiDataReset(); render();
  var reports = loadReports();
  return Promise.all([
    // labs.json — через API (нужен base_hash для ручной точки); старый сайдкар не знает его → прежний путь (только чтение)
    tally(apiGet("labs").catch(function(){ return getJSON(DATA + "labs.json"); })),
    getJSON(DATA + "biomarkers-info.json").catch(function(){ return {}; }),
    apiGet("meds").catch(liveMiss),
    apiGet("vaccinations").catch(liveMiss),
    apiGet("vitals").catch(liveMiss),
    apiGet("studies").catch(liveMiss),
    // Список отчётов ждём не дольше REPORTS_WAIT_MS: при висящей сети он мимо копии держал всю страницу
    within(reports, REPORTS_WAIT_MS),
    // Проба возможностей сайдкара — см. S.apiState ниже.
    authFetch(bust("../api/health"), { cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
    // Анамнез: через API (нужен base_hash для правки); сайдкар старый или без входа —
    // читаем файл как раньше; файла может не быть (тогда пустое состояние)
    tally(apiGet("anamnesis").catch(function(){
      return getJSON(DATA + "anamnesis.json").catch(function(){ return { family: [] }; });
    }))
  ]).then(function(res){
    S.labs = res[0];
    for (var di = 2; di <= 5; di++) if (res[di]) uiDataDone(true);   // аптечка, прививки, вес, исследования; промах уже посчитан в liveMiss
    S.anamnesis = (res[8] && Array.isArray(res[8].family)) ? res[8] : { family: [] };
    S.info = (res[1] && res[1].info) || res[1] || {};   // health-biomarkers-info@1
    S.meds = (res[2] && res[2].meds) || [];
    S.vax = (res[3] && res[3].vaccinations) || [];
    S.vitals = res[4] || { schema: "health-vitals@1", height_cm: null, weight: [] };
    S.studies = (res[5] && res[5].studies) || [];
    // СТАРЫЙ сайдкар не знает /api/hd/* и на КАЖДЫЙ запрос отвечает 404
    // «unknown endpoint» — снаружи это неотличимо от «файла ещё нет», и
    // страница молча рисовала бы пустые аптечку, прививки и вес, хотя дело
    // в незалитом api/server.py. Отличаем по возможностям: поле
    // health_writable есть только у новой версии.
    var api = res[7];
    // Возрасты сайдкара, которые надо различать (иначе диагноз уводит не туда):
    //   down   — не отвечает;
    //   old    — нет health_writable: не знает /api/hd/* вообще;
    //   nocaps — отвечает, но не сообщает health_files → он СТАРЕЕ этой страницы,
    //            сверить список файлов нельзя, можно лишь честно об этом сказать;
    //   ok     — сообщает возможности, сверяем поимённо.
    S.apiState = !api ? "down"
      : (api.health_writable === undefined ? "old"
      : (api.health_files === undefined ? "nocaps" : "ok"));
    S.writable = (S.apiState === "ok" || S.apiState === "nocaps") && api.health_writable === true;
    S.caps = { report: !!(api && api.health_report), marker: !!(api && api.health_marker_info), upload: !!(api && api.health_upload),
                labs: !!(api && api.health_labs_manual) };
    // Чего сайдкару не хватает из того, что нужно этой странице.
    var have = (api && api.health_files) || [];
    S.apiSkew = have.length ? NEED_FILES.filter(function(f){ return have.indexOf(f) < 0; }) : [];
    /* без связи (v1.57): неотправленное — поверх загруженного, затем попытка отправить */
    if (outboxCount()){ outboxApply(); S.saveInfo = outboxNote(); }
    S.loading = false; S.error = null;
    uiLoginOk("health");   // загрузились — петли нет
    if (res[6]) setReports(res[6]);
    render();
    if (res[6]) loadReportHeads();
    else reports.then(function(list){ setReports(list); render(); loadReportHeads(); });   // успел позже — дорисовать
    flushOutbox();
  });
}

/* Список отчётов необязателен: страница ждёт его не дольше REPORTS_WAIT_MS (успел — один рендер, как
   раньше; сеть висит — страница без отчётов, список дорисуется, когда придёт). */
var REPORTS_WAIT_MS = 1500;
function within(p, ms){
  return Promise.race([p, new Promise(function(res){ setTimeout(function(){ res(null); }, ms); })]);
}
function loadReports(){
  return authFetch(bust(DATA + "reports/"), { headers: { "Accept": "application/json" }, cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
}
function setReports(list){
  S.reports = (list || []).filter(function(f){ return f.name && !f.is_dir && f.name.indexOf(".") !== 0; });
}

/* Отчёты .md несут шапку health-report@1 (заголовок, сводка, флаги) — список
   рисует её, поэтому тексты грузятся сразу после листинга. Файлы маленькие
   (десятки КБ) и их единицы; ошибка одного не мешает остальным. */
function loadReportHeads(){
  var mds = S.reports.filter(function(f){ return isMdReport(f.name); });
  if (!mds.length) return;
  Promise.all(mds.map(function(f){
    return authFetch(docUrl("reports", f.name), { cache: "no-store" })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(t){ if (t != null) S.repMd[f.name] = parseReportHead(t); })
      .catch(function(){});
  })).then(function(){ render(); });
}

/* Диагностика вместо «что-то пошло не так»: коды здесь означают РАЗНОЕ, и
   путать их дорого — 404 при верном пароле отправил бы искать проблему в
   пароле, хотя дело в том, что данные не доехали на сервер. */
function describeError(e){
  if (e.status === 404)
    return "Пароль принят, но данных на сервере нет (404). Обычно это значит: " +
           "каталог Claude-Memory/Health не смонтирован в контейнер (нужна ПЕРЕСБОРКА " +
           "docker-compose, не restart), либо файлы ещё не выложены (deploy.zsh) " +
           "или не доехали синком Synology Drive.";
  if (e.status === 502 || e.status === 503)
    return "Сервер данных не отвечает (" + e.status + ") — проверьте контейнеры на NAS.";
  if (!e.status)
    return "Нет связи с сервером (" + e.message + ").";
  return "Не удалось загрузить данные (код " + e.status + ").";
}

function isAuthError(e){ return e.status === 401 || e.status === 403; }

function boot(){
  var saved = null;
  try { saved = localStorage.getItem("hub-theme"); } catch(e){}
  S.theme = saved === "dark" ? "dark" : "light";
  loadAll().catch(function(e){
    S.loading = false;
    if (isAuthError(e)){ S.error = "auth"; render(); goLogin(); return; }
    S.error = describeError(e);
    render();
  });
}

   (health-meds@1): taking (принимаю) и archived (нет в наличии). Держим
   производную в одном месте, чтобы список, панель и модалка не разошлись.
   archived+taking одновременно валидатор скилла считает ошибкой. */
var STATUSES = [
  { k: "taking", label: "Принимаю сейчас", hint: "есть и пью" },

function expiryInfo(exp){
  if (!exp || !/^\d{4}-\d{2}/.test(exp)) return { label: "срок не указан", color: "var(--text-faint)", soon: false };
  var p = exp.split("-");
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1);
  var now = new Date(); now.setDate(1); now.setHours(0,0,0,0);
  var months = (d.getFullYear()-now.getFullYear())*12 + (d.getMonth()-now.getMonth());
  var lbl = UI_MONTHS_SHORT[parseInt(p[1],10)-1] + " " + p[0];
  if (months < 0) return { label: "истёк " + lbl, color: "var(--err)", soon: true, gone: true };
  if (months <= 3) return { label: "годен до " + lbl, color: "var(--warn)", soon: true };
  return { label: "годен до " + lbl, color: "var(--text-faint)", soon: false };
}

/* ── вкладка: обзор ─────────────────────────────────────────────────────── */
function nextVaccine(){
  var due = S.vax.filter(function(v){ return v.next_due; })
    .map(function(v){ return { v: v, d: daysTo(v.next_due) }; })
    .sort(function(a, b){ return a.d - b.d; });
  var soon = due.filter(function(x){ return x.d <= 60; });
  return soon.length ? soon[0] : null;
}
/* Сроки годности для сводки на обзоре. Архив не считаем: чипы в аптечке тоже
   его не считают, а число на обзоре — ссылка ровно на такой чип, расхождение
   читалось бы как ошибка. */
function expirySummary(){
  var s = { gone: 0, soon: 0 };
  S.meds.forEach(function(m){
    if (m.archived) return;
    var e = expiryInfo(m.expiry);
    if (!e.soon) return;
    if (e.gone) s.gone++; else s.soon++;
  });
  return s;
}

function reminders(){
  var out = [];
  var nv = nextVaccine();
  if (nv){
    var overdue = nv.d < 0;
    out.push({
      title: (nv.v.vaccine || "Ревакцинация") + (nv.v.against ? " (" + nv.v.against + ")" : ""),
      sub: "Плановый срок — " + uiDateLong(nv.v.next_due) + ".",
      chip: overdue ? "просрочено" : "через <b style=\"font-family:var(--font-serif); font-size:15px;\">" + nv.d + "</b> дн.",
      err: overdue
    });
  }
  if (!out.length) return expiryCard();
  return out.map(function(r){
    var c = r.err ? "var(--err)" : "var(--warn)";
    var bg = r.err ? "var(--err-bg)" : "var(--warn-bg)";
    return '<div style="display:flex; align-items:flex-start; gap:12px; margin:30px 0 0; padding:14px 18px; background:' + bg + '; border:1px solid ' + c + '; border-radius:var(--radius);">' +
      '<span style="flex:none; width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:rgba(0,0,0,.05); font-size:14px;">⚑</span>' +
      '<div style="flex:1; min-width:0;">' +
        '<div style="font-size:13.5px; font-weight:600; color:var(--text);">' + esc(r.title) + '</div>' +
        '<div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">' + esc(r.sub) + '</div>' +
      '</div>' +
      '<span style="flex:none; align-self:center; display:inline-flex; align-items:baseline; gap:5px; font-size:12px; font-weight:600; color:' + c + '; background:var(--bg-elev); border:1px solid ' + c + '; border-radius:999px; padding:4px 12px; white-space:nowrap; font-variant-numeric:tabular-nums;">' + r.chip + '</span>' +
    '</div>';
  }).join("") + expiryCard();
}

/* Сроки годности — ОДНА сводка вместо карточки на каждое лекарство: на полусотне
   позиций поимённый список занимал весь обзор и вытеснял всё остальное. Числа
   кликабельны и ведут в аптечку с уже включённым нужным фильтром, поимённый
   разбор — там. Цвет карточки задаёт худшее из двух: есть истёкшие — красная. */
function expiryCard(){
  var s = expirySummary();
  if (!s.gone && !s.soon) return "";
  var c = s.gone ? "var(--err)" : "var(--warn)";
  var bg = s.gone ? "var(--err-bg)" : "var(--warn-bg)";
  var link = function(n, word, id, col){
    return '<button type="button" data-act="med-jump" data-id="' + id + '"' +
      ' style="font:inherit; color:' + col + '; background:none; border:none; padding:0; margin:0;' +
      ' cursor:pointer; font-weight:600; text-decoration:underline; text-underline-offset:2px;">' +
      '<b style="font-family:var(--font-serif); font-size:15px; font-variant-numeric:tabular-nums;">' + n + '</b> ' + word + '</button>';
  };
  var parts = [];
  if (s.gone) parts.push(link(s.gone, s.gone === 1 ? "истёк" : "истекли", "expired", "var(--err)"));
  if (s.soon) parts.push(link(s.soon, (s.soon === 1 ? "истекает" : "истекают") + " в ближайшие 3 мес.", "soon", "var(--warn)"));
  return '<div style="display:flex; align-items:flex-start; gap:12px; margin:30px 0 0; padding:14px 18px; background:' + bg + '; border:1px solid ' + c + '; border-radius:var(--radius);">' +
    '<span style="flex:none; width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:rgba(0,0,0,.05); font-size:14px;">⚑</span>' +
    '<div style="flex:1; min-width:0;">' +
      '<div style="font-size:13.5px; font-weight:600; color:var(--text);">Сроки годности</div>' +
      '<div style="font-size:12.5px; color:var(--text-muted); margin-top:2px; display:flex; flex-wrap:wrap; gap:4px 10px;">' +
        parts.join('<span style="color:var(--text-faint);">·</span>') + '</div>' +
    '</div>' +
  '</div>';
}

function attnCards(){
  // ТОЛЬКО числовые маркеры: у качественных «выше нормы» — механическая
  // отметка лаборатории («единичные в поле зрения»), в герой их не пускаем.
  var all = markerList().map(enrich);
  var out = all.filter(function(m){ return m.isNum && m.statusKey !== "norm" && m.statusKey !== "na"; })
                .sort(function(a, b){ return b.sev - a.sev; });
  // свежие — последний замер не старше 365 дней; давние уходят в свёрнутую строку под сеткой
  var lim = Date.now() - 365 * 86400000;
  var attn = out.filter(function(m){ return m.lastMs >= lim; });
  var old = out.filter(function(m){ return m.lastMs < lim; });
  var oldBlock = old.length ? '<div style="margin-top:14px;">' +
    '<button type="button" class="ui-btn plain sm" data-act="old-dev" aria-expanded="' + (S.oldDevOpen ? "true" : "false") + '">Давние отклонения: ' + old.length + ' · последний замер больше года назад ' + (S.oldDevOpen ? "▴" : "▾") + '</button>' +
    (S.oldDevOpen ? '<div class="old-dev-list" style="margin-top:6px;">' + old.map(function(m){
      return '<button type="button" data-act="open" data-id="' + esc(m.id) + '" style="display:flex; align-items:baseline; gap:10px; width:100%; text-align:left; background:transparent; border:0; border-top:1px solid var(--border); padding:9px 2px; font-family:inherit; cursor:pointer; color:var(--text);">' +
        '<span style="flex:1; min-width:0; font-size:13px; font-weight:600;">' + esc(m.name) + '</span>' +
        '<span style="flex:none; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; color:' + m.statusColor + ';">' + esc(m.lastVal) + (m.unit ? ' <span style="font-size:11px; font-weight:400; color:var(--text-muted);">' + esc(m.unit) + '</span>' : '') + '</span>' +
        '<span style="flex:none; font-size:11.5px; color:var(--text-faint); font-variant-numeric:tabular-nums;">' + esc(m.lastDate) + '</span></button>';
    }).join("") + '</div>' : '') + '</div>' : '';
  var head = '<div class="sec-head" style="display:flex; align-items:center; gap:14px; margin:44px 0 16px;">' +
    '<h2 style="' + H2 + '">Требует внимания</h2>' +
    '<span style="font-size:11px; font-weight:600; color:var(--err); background:var(--err-bg); border-radius:999px; padding:1px 8px; font-variant-numeric:tabular-nums;">' + attn.length + '</span>' +
    '<span style="flex:1; height:1px; background:var(--border);"></span>' +
    '<span style="font-size:12px; color:var(--text-faint);">последнее значение вне нормы · за 12 месяцев</span></div>';
  if (!attn.length)
    return head + '<div style="padding:26px 8px; text-align:center; color:var(--text-faint); font-size:13.5px;">' +
      (old.length ? 'За последний год отклонений нет.' : 'Все числовые показатели последних анализов — в пределах нормы.') + '</div>' + oldBlock;
  return head + '<div class="attn-grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(216px,1fr)); gap:14px;">' +
    attn.map(function(m){
      return '<button class="attn-card" data-act="open" data-id="' + m.id + '" style="text-align:left; font-family:inherit; cursor:pointer; background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid ' + m.statusColor + '; border-radius:var(--radius); box-shadow:var(--shadow); padding:15px 16px; display:flex; flex-direction:column; gap:9px;">' +
        '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">' +
          '<span style="font-size:12.5px; font-weight:600; color:var(--text); line-height:1.3;">' + esc(m.name) + '</span>' +
          '<span style="flex:none; font-size:14px; font-weight:700; color:' + m.statusColor + ';">' + m.arrow + '</span></div>' +
        '<div style="display:flex; align-items:baseline; gap:6px;">' +
          '<span class="ac-val" style="font-family:var(--font-serif); font-size:26px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; color:' + m.statusColor + ';">' + esc(m.lastVal) + '</span>' +
          '<span style="font-size:11.5px; color:var(--text-muted);">' + esc(m.unit) + '</span></div>' +
        (m.hasSpark ? '<svg viewBox="0 0 60 20" preserveAspectRatio="none" style="width:100%; height:22px; overflow:visible;"><path d="' + m.sparkPath + '" fill="none" stroke="' + m.statusColor + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path></svg>'
                    : '<div style="height:22px;"></div>') +
        '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px;">' +
          '<span style="color:var(--text-muted);">норма ' + esc(m.refText) + '</span>' +
          '<span style="color:var(--text-faint); font-variant-numeric:tabular-nums;">' + esc(m.lastDate) + '</span></div>' +
      '</button>';
    }).join("") + '</div>' + oldBlock;
}

function vitalCards(){
  var v = S.vitals || { height_cm: null, weight: [] };
  var w = (v.weight || []).slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  var head = '<div class="sec-head" style="display:flex; align-items:center; gap:14px; margin:44px 0 16px;">' +
    '<h2 style="' + H2 + '">Витальные</h2>' +
    '<span style="flex:1; height:1px; background:var(--border);"></span>' +
    (S.writable ? '<button class="ui-btn ghost sm" data-act="weight-add">＋ Записать вес</button>' : '') + '</div>';
  if (!w.length)
    return head + '<div style="padding:26px 8px; text-align:center; color:var(--text-faint); font-size:13.5px;">' + esc(emptyNote("Измерений веса пока нет" + (S.writable ? " — нажмите «Записать вес»." : "."))) + '</div>';

  // vals — [{date, v}]: ось X по реальной дате, как в остальных графиках.
  function mkLine(vals, band){
    var W = 320, H = 66, T = 8, B = 8;
    var nums = vals.map(function(x){ return x.v; });
    var mn = Math.min.apply(null, nums), mx = Math.max.apply(null, nums);
    if (band){ mn = Math.min(mn, band[0]); mx = Math.max(mx, band[1]); }
    if (mx === mn){ mx += 1; mn -= 1; }
    var rng = mx - mn, ph = H - T - B, n = vals.length;
    var t0 = tms(vals[0].date), tspan = (tms(vals[n - 1].date) - t0) || 1;
    var yAt = function(x){ return r1(T + (1 - (x - mn) / rng) * ph); };
    var xAt = function(i){ return n === 1 ? r1(W / 2) : r1((tms(vals[i].date) - t0) / tspan * W); };
    var o = { linePath: "M" + vals.map(function(x, i){ return xAt(i) + " " + yAt(x.v); }).join(" L"),
              dotX: xAt(n - 1), dotY: yAt(nums[n - 1]) };
    if (band){ o.hasBand = true; o.bandY = yAt(band[1]); o.bandH = r1(yAt(band[0]) - yAt(band[1])); }
    return o;
  }
  function card(name, value, unit, date, tag, tagColor, tagBg, note, line){
    return '<div class="vit-card" data-act="vitals-open" role="button" tabindex="0" style="cursor:pointer; background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--c-3); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px;">' +
      '<div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">' +
        '<span style="font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--c-3); font-weight:700;">' + name + '</span>' +
        (tag ? '<span style="font-size:11.5px; font-weight:600; border-radius:999px; padding:2px 10px; color:' + tagColor + '; background:' + tagBg + '; white-space:nowrap;">' + esc(tag) + '</span>' : '') +
      '</div>' +
      '<div style="display:flex; align-items:baseline; gap:7px; margin-top:12px;">' +
        '<span class="vit-val" style="font-family:var(--font-serif); font-size:40px; font-weight:600; line-height:1; letter-spacing:-.01em; font-variant-numeric:tabular-nums;">' + value + '</span>' +
        '<span style="font-size:13px; color:var(--text-muted);">' + unit + '</span>' +
        '<span style="margin-left:auto; font-size:11.5px; color:var(--text-faint); font-variant-numeric:tabular-nums;">' + date + '</span>' +
      '</div>' +
      (line ? '<svg viewBox="0 0 320 66" preserveAspectRatio="none" style="width:100%; height:60px; margin-top:12px; overflow:visible;">' +
        (line.hasBand ? '<rect x="0" y="' + line.bandY + '" width="320" height="' + line.bandH + '" fill="var(--c-3)" opacity="0.16"></rect>' : '') +
        '<path d="' + line.linePath + '" fill="none" stroke="var(--c-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>' +
        '<circle cx="' + line.dotX + '" cy="' + line.dotY + '" r="3.4" fill="var(--c-3)" vector-effect="non-scaling-stroke"></circle></svg>'
        : '<div style="height:60px; margin-top:12px; display:flex; align-items:center; font-size:12px; color:var(--text-faint);">Одно измерение — динамика появится со следующим.</div>') +
      '<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">' + esc(note) + '</div></div>';
  }

  var last = w[w.length - 1];
  var kgs = w.map(function(x){ return x.kg; });
  var wLine = w.length >= 2 ? mkLine(w.map(function(x){ return { date: x.date, v: x.kg }; }), null) : null;
  var delta = w.length >= 2 ? r1(last.kg - w[0].kg) : null;
  var wTag = delta === null ? "" : (delta > 0 ? "+" : "") + trim(delta) + " кг с " + uiMonthShort(w[0].date);  // тут короткий вид уместен — это период, не измерение
  var cards = [ card("Вес", trim(last.kg), "кг", uiDateNum(last.date), wTag, "var(--text-muted)", "var(--bg-alt)",
                     w.length >= 2 ? "Без референса — отслеживается тренд." : "Без референса — отслеживается тренд.", wLine) ];

  if (v.height_cm){
    var bmis = w.map(function(x){ return r1(x.kg / Math.pow(v.height_cm / 100, 2)); });
    var bmi = bmis[bmis.length - 1];
    // Полоса нормы — по ВОЗ (18.5–25). Ornament помечает нормой всё до 29.99,
    // то есть сливает норму с избыточной массой; берём более строгую рамку и
    // честно называем обе в подписи, а не показываем удобную.
    var bLine = w.length >= 2 ? mkLine(w.map(function(x, i){ return { date: x.date, v: bmis[i] }; }), [18.5, 25]) : null;
    var tag, tc, tb;
    if (bmi >= 30){ tag = "ожирение"; tc = "var(--err)"; tb = "var(--err-bg)"; }
    else if (bmi >= 25){ tag = "избыточная масса"; tc = "var(--warn)"; tb = "var(--warn-bg)"; }
    else if (bmi < 18.5){ tag = "недостаточная масса"; tc = "var(--info)"; tb = "var(--info-bg)"; }
    else { tag = "норма"; tc = "var(--c-3)"; tb = "var(--success-bg)"; }
    var note = "ВОЗ: 18.5–25 норма, 25–30 избыточная масса, 30+ ожирение. Ornament считает нормой всё до 29.99. Рост " + trim(v.height_cm) + " см.";
    cards.push(card("ИМТ", trim(bmi), "кг/м²", uiDateNum(last.date), tag, tc, tb, note, bLine));
  }
  return head + '<div class="vit-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">' + cards.join("") + '</div>';
}

/* Живые данные (аптечка/прививки/вес) ходят через write-API. Если он старый
   или лежит — сказать об этом прямо, а не показывать пустые списки. */
function apiBanner(){
  if (S.loading) return "";
  // «nocaps» без ошибок молчим: сайдкар старее, но всё нужное отдаёт.
  if ((S.apiState === "ok" || S.apiState === "nocaps") && !S.liveErr.length && !S.apiSkew.length) return "";
  var msg;
  if (S.apiState === "old")
    msg = "Аптечка, прививки и вес не загрузились: на сервере работает СТАРАЯ версия write-API — она не знает эндпоинтов /api/hd/*. Скопируйте на NAS свежий tools/api/server.py и: docker restart hub-api.";
  else if (S.apiState === "down")
    msg = "Аптечка, прививки и вес недоступны: сервис write-API не отвечает. Проверьте контейнер hub-api на NAS.";
  else if (S.apiSkew.length)
    // Сайдкар САМ сказал, какие файлы умеет (health_files) — значит можно
    // назвать недостающие поимённо, а не гадать по коду ошибки.
    msg = "На NAS более старая версия api/server.py, чем эта страница: она не знает про " +
          S.apiSkew.map(function(f){ return f + ".json"; }).join(", ") + ". " +
          "Соответствующие вкладки будут пустыми. → скопируйте tools/api/server.py и: docker restart hub-api.";
  else if (S.apiState === "nocaps")
    // Сайдкар отвечает, но не объявляет health_files — он собран до этой
    // возможности, значит заведомо старее страницы. Про права тут говорить
    // нечего: причина почти всегда одна.
    msg = "На NAS более старая версия api/server.py, чем эта страница (она даже не сообщает, " +
          "какие файлы умеет), и часть данных не отдаёт (коды: " + S.liveErr.join(", ") + "). " +
          "→ скопируйте tools/api/server.py в /volume1/docker/portfolio-viewer/api/ и: docker restart hub-api. " +
          "Проверить, что доехало: docker exec hub-api grep -c health_files /app/server.py";
  else if (S.liveErr.length)
    msg = "Часть живых данных не загрузилась (коды: " + S.liveErr.join(", ") + "). " +
          "Проверьте контейнер hub-api на NAS и права на каталог Health.";
  else return "";
  return '<div style="display:flex; align-items:flex-start; gap:12px; margin:26px 0 0; padding:14px 18px; background:var(--err-bg); border:1px solid var(--err); border-radius:var(--radius);">' +
    '<span style="flex:none; width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:rgba(0,0,0,.05); font-size:14px;">⚠</span>' +
    '<div style="flex:1; min-width:0; font-size:13px; line-height:1.5; color:var(--text);">' + esc(msg) + '</div></div>';
}

// Честная подпись пустого списка: «пусто» и «не загрузилось» — разные вещи.
function emptyNote(what){
  if ((S.apiState !== "ok" && S.apiState !== "nocaps") || S.liveErr.length || S.apiSkew.length)
    return "Данные не загрузились — см. сообщение вверху страницы.";
  return what;
}

function tabOverview(){ return reminders() + attnCards() + anamnesisCard() + vitalCards(); }

/* ── полоса фильтров ───────────────────────────────────────────────────────
   Пока в поле поиска есть текст, длинная полоса чипов сворачивается в одну
   строку. Иначе на телефоне между полем и первым найденным лежит 314 px
   фильтров: замер 2026-08-09 на экране 390×660 — из пяти совпадений по слову
   «гем» не видно НИ ОДНОГО, первое на 642 px при рабочей зоне 603 px.
   Активные фильтры из свёрнутой строки НЕ пропадают: каждый остаётся чипом с
   крестиком, снимается тем же действием, которым включён. Спрятать их молча
   нельзя — «ничего не найдено» при включённом «только вне нормы» читалось бы
   как «такого маркера в анализах нет», а это неправда. */
var CHIP_ON = "background:var(--accent-bg); border-color:var(--c-3); color:var(--c-3);";

function chipOff(label, act, id){
  return '<button class="fchip" data-act="' + act + '"' + (id ? ' data-id="' + esc(id) + '"' : '') +
    ' title="снять фильтр" style="' + CHIP_ON + '">' + esc(label) +
    ' <span style="opacity:.55; font-size:11px;">✕</span></button>';
}

function filterBar(searching, found, activeChips, fullRow){
  if (!searching) return fullRow;
  if (S.filtersOpen)
    return fullRow +
      '<button class="fchip" data-act="filters-close" style="align-self:flex-start;">Свернуть фильтры ▴</button>';
  return '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">' +
    '<span style="font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums;">найдено ' + found + '</span>' +
    activeChips +
    '<button class="fchip" data-act="filters-open" style="margin-left:auto;">Фильтры ▾</button>' +
  '</div>';
}

/* ── вкладка: биомаркеры ────────────────────────────────────────────────── */
function markersModel(){
  var all = markerList().map(enrich);
  var q = (S.query || "").trim().toLowerCase();
  var filt = all.filter(function(m){
    if (S.cat !== "all" && m.cat !== S.cat) return false;
    if (S.onlyOut && (m.statusKey === "norm" || m.statusKey === "na")) return false;
    if (S.onlyDyn && !m.hasSpark) return false;
    if (q && m.search.indexOf(q) < 0) return false;
    return true;
  });
  var cmp = function(a, b){
    if (S.sort === "date") return b.lastMs - a.lastMs || a.name.localeCompare(b.name, "ru");
    if (S.sort === "dev") return b.sev - a.sev || a.name.localeCompare(b.name, "ru");
    return a.name.localeCompare(b.name, "ru");
  };
  var cats = (S.labs && S.labs.categories) || [];
  var groups = cats.map(function(c){
    return { name: c.name, items: filt.filter(function(m){ return m.cat === c.key; }).sort(cmp) };
  }).filter(function(g){ return g.items.length; });
  return { q: q, filt: filt, groups: groups, cats: cats };
}

function markersBelowHTML(M){
  var chipStyle = function(on){ return on ? CHIP_ON : ""; };
  var catChips = [{ key: "all", label: "Все" }].concat(M.cats.map(function(c){ return { key: c.key, label: c.name }; }))
    .map(function(c){
      return '<button class="fchip" data-act="cat" data-id="' + c.key + '" style="' + chipStyle(S.cat === c.key) + '">' + esc(c.label) + '</button>';
    }).join("");
  var toggles = '<button class="fchip" data-act="only-out" style="' + chipStyle(S.onlyOut) + '">только вне нормы</button>' +
                '<button class="fchip" data-act="only-dyn" style="' + chipStyle(S.onlyDyn) + '">с динамикой</button>';
  var full = '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">' + catChips +
      '<span style="width:1px; height:22px; background:var(--border); margin:0 4px;"></span>' + toggles +
      '<label style="display:inline-flex; align-items:center; gap:8px; margin-left:auto; font-size:12px; color:var(--text-muted);">' +
        '<span style="white-space:nowrap;">Сортировка</span>' +
        // выпадающий список — общий ui-kit (обычный размер); значение — в скрытом
        // #sort, его "change" ловит общий обработчик ниже, как у <select>
        uiSelectHTML({ id: "sort", act: "sort", size: "md", label: "Сортировка", options: [
          { value: "alpha", t: "по алфавиту", selected: S.sort === "alpha" },
          { value: "date", t: "по дате измерения", selected: S.sort === "date" },
          { value: "dev", t: "по отклонению", selected: S.sort === "dev" }] }) +
        '</label>' +
    '</div>';
  var active = (S.cat !== "all" ? chipOff(catName(S.cat), "cat", "all") : "") +
               (S.onlyOut ? chipOff("только вне нормы", "only-out") : "") +
               (S.onlyDyn ? chipOff("с динамикой", "only-dyn") : "");
  return filterBar(!!M.q, M.filt.length, active, full);
}

function markersListHTML(M){
  var body = M.groups.map(function(g){
    return '<div style="padding-top:8px;">' +
      '<div style="display:flex; align-items:baseline; gap:9px; padding:12px 2px 6px;">' +
        '<h3 style="font-family:var(--font-sans); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--c-3); margin:0;">' + esc(g.name) + '</h3>' +
        '<span style="font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums;">' + g.items.length + '</span></div>' +
      g.items.map(mrow).join("") + '</div>';
  }).join("");

    : '<div style="padding:34px 8px; text-align:center; color:var(--text-faint); font-size:13.5px;">Ничего не найдено — измените фильтры или запрос.</div>');
}

/* Буква в поиске меняет ровно три узла — счётчик, полосу фильтров и список. */
function patchMarkers(){
  var M = markersModel();

function mrow(m){
  // Колонки макета: имя | бар нормы | спарклайн | значение.
  // Качественному маркеру бар и спарклайн не положены — колонки остаются
  // пустыми, сетка не ломается, значение показывается текстом.
  var bar = m.hasBar
    ? '<div class="cat-ref" style="position:relative; height:8px; border-radius:5px; background:var(--bg-sunk);">' +
        '<div style="position:absolute; top:0; bottom:0; border-radius:5px; left:' + m.zoneLeft + '; width:' + m.zoneWidth + '; background:var(--c-3); opacity:.30;"></div>' +
        '<div style="position:absolute; top:50%; transform:translate(-50%,-50%); width:9px; height:9px; border-radius:50%; left:' + m.dotLeft + '; background:' + m.statusColor + '; box-shadow:0 0 0 2px var(--bg-elev);"></div>' +
      '</div>'
    : '<div class="cat-ref" style="height:8px;"></div>';
  var spark = '<div class="cat-spark" style="display:flex; justify-content:center;">' +
    (m.hasSpark
      ? '<svg viewBox="0 0 60 20" preserveAspectRatio="none" style="width:60px; height:20px; overflow:visible;"><path d="' + m.sparkPath + '" fill="none" stroke="' + m.statusColor + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path></svg>'
      : '<span style="color:var(--text-faint); font-size:12px;">—</span>') + '</div>';
  return '<div class="mrow" data-act="open" data-id="' + m.id + '" style="display:grid; grid-template-columns:1fr 118px 62px 116px; align-items:center; gap:14px; padding:11px 6px; margin:0 -6px; border-radius:7px; border-top:1px solid var(--border); cursor:pointer;">' +
    '<span class="mrow-name" style="font-size:13.5px; font-weight:500; min-width:0;">' + esc(m.name) + '</span>' +
    bar + spark +
    '<div style="display:flex; flex-direction:column; align-items:flex-end; gap:3px;">' +
      '<span style="display:inline-flex; align-items:baseline; gap:6px; font-variant-numeric:tabular-nums; max-width:100%;">' +
        '<span class="mval ' + (m.isNum ? "" : "qual-val") + '" title="' + esc(m.lastVal) + '" style="font-size:14px; font-weight:600; color:' + m.valColor + ';">' + esc(m.lastVal) + '</span>' +
        (m.unit ? '<span style="font-size:11px; color:var(--text-faint);">' + esc(m.unit) + '</span>' : '') +
        '<span style="width:8px; height:8px; border-radius:50%; background:' + m.statusColor + '; display:inline-block; flex:none;"></span></span>' +
      '<span style="font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums;">' + esc(m.lastDate) + '</span></div>' +
  '</div>';
}

/* ── вкладка: прививки ──────────────────────────────────────────────────── */
function tabVax(){

  var TD = 'padding:12px 16px; border-bottom:1px solid var(--border);';
  var head = '<div class="sec-head" style="display:flex; align-items:center; gap:14px; margin:44px 0 16px;">' +
    '<h2 style="' + H2 + '">Прививки</h2>' +
    '<span style="font-size:11px; font-weight:600; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:999px; padding:1px 8px; font-variant-numeric:tabular-nums;">' + S.vax.length + '</span>' +
    '<span style="flex:1; height:1px; background:var(--border);"></span>' +
    (S.writable ? '<button class="ui-btn" data-act="vax-add">＋ Добавить</button>' : '') +
  '</div>';
  if (!S.vax.length)
    return head + '<div style="background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:34px 8px; text-align:center; color:var(--text-faint); font-size:13.5px;">' + esc(emptyNote("Прививок пока нет" + (S.writable ? " — нажмите «Добавить»." : "."))) + '</div>';

  var rows = S.vax.slice().sort(function(a, b){ return (b.date || "") < (a.date || "") ? -1 : 1; }).map(function(v){
    var nextCell = "—", nc = "var(--text-muted)";
    if (v.next_due){
      var d = daysTo(v.next_due);
      nextCell = uiDateNum(v.next_due);
      if (d < 0){ nextCell += " · просрочено"; nc = "var(--err)"; }
      else if (d <= 60){ nextCell += " · через " + d + " дн."; nc = "var(--warn)"; }
    } else if (v.next_note) nextCell = esc(v.next_note);
    return '<tr>' +
      '<td style="' + TD + ' font-variant-numeric:tabular-nums; color:var(--text-muted); white-space:nowrap;">' + esc(uiDateNum(v.date)) + '</td>' +
      '<td style="' + TD + ' font-weight:600;">' + esc(v.vaccine || "—") + '</td>' +
      '<td style="' + TD + ' color:var(--text-muted);">' + esc(v.against || "—") + '</td>' +
      '<td class="vax-hide" style="' + TD + ' color:var(--text-muted); white-space:nowrap;">' + esc(v.dose || "—") + '</td>' +
      '<td style="' + TD + ' font-variant-numeric:tabular-nums; max-width:220px; color:' + nc + ';">' + nextCell + '</td>' +
      // На узком экране подпись схлопывается в «✎» (CSS .vax-edit-ic/-lbl):
      // раньше вся колонка пряталась и прививку нельзя было править с телефона.
      (S.writable ? '<td class="vax-row-acts" style="' + TD + ' text-align:right; white-space:nowrap;"><button class="ui-btn plain sm" data-act="vax-edit" data-id="' + esc(v.id) + '" title="Редактировать прививку" aria-label="Редактировать прививку"><span class="vax-edit-lbl">Правка</span><span class="vax-edit-ic">✎</span></button></td>' : '') +
    '</tr>';
