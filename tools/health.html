  return head + '<div style="background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;"><div style="overflow-x:auto;">' +
    '<table style="width:100%; border-collapse:collapse; font-size:13px; min-width:560px;"><thead><tr>' +
      '<th style="' + TH + ' white-space:nowrap; font-variant-numeric:tabular-nums;">Дата</th>' +
      '<th style="' + TH + '">Вакцина</th>' +
      '<th style="' + TH + '">От чего</th>' +
      '<th class="vax-hide" style="' + TH + '">Доза</th>' +
      '<th style="' + TH + ' white-space:nowrap;">Следующая</th>' +
      (S.writable ? '<th class="vax-row-acts" style="' + TH + '"></th>' : '') +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

/* Строка лекарства — общая для аптечки и секции «Раньше покупал»: у архивной
   записи тот же вид, только приглушённый и без переключателя приёма. Держим
   одним хелпером, чтобы список и история не разъехались по виду. */
function medRow(m){
  var ex = expiryInfo(m.expiry), on = !!m.taking;
  // Истёкшее — отдельной меткой, а не мелким серым текстом в ряду прочих:
  // просроченное лекарство надо замечать, не вчитываясь.
  var expCell = ex.gone
    ? '<span class="exp-chip">истёк ' + esc(ex.label.replace(/^истёк /, "")) + '</span>'
    : '<span style="font-size:11px; color:' + ex.color + '; font-variant-numeric:tabular-nums;">' + esc(ex.label) + '</span>';
  return '<div class="med-row' + (ex.gone ? " is-gone" : "") + (m.archived ? " is-arch" : "") + '" data-act="med-open" data-id="' + esc(m.id) + '" style="display:flex; align-items:center; gap:14px; padding:12px 6px; margin:0 -6px; border-radius:7px; border-top:1px solid var(--border); cursor:pointer;">' +
    '<div style="min-width:0; flex:1;">' +
      '<div class="mrow-name" style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .13s;">' + esc(m.name) +
        (m.inn ? '<span style="font-size:11.5px; color:var(--text-faint); font-weight:400; margin-left:8px;">' + esc(m.inn) + '</span>' : '') + '</div>' +
      // Пока скилл не заполнил «от чего» — показываем дозировку, иначе
      // подпись была бы прочерком у всей аптечки.
      '<div style="font-size:12.5px; color:var(--text-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' +
        esc(m.for || m.dose || "—") + '</div>' +
    '</div>' +
    '<div style="display:flex; align-items:center; gap:12px; flex:none; white-space:nowrap;">' +
      (m.archived ? '' : expCell) +
      (m.archived
        ? '<span style="font-size:11px; color:var(--text-faint);">нет в наличии</span>'
        : '<button class="tgl" data-act="med-toggle" data-id="' + esc(m.id) + '" aria-pressed="' + on + '" title="Принимаю сейчас"' +
          (S.writable ? '' : ' disabled') + ' style="' + switchStyle(on) + (S.writable ? '' : ' opacity:.5;') + '"><span style="' + knobStyle(on) + '"></span></button>') +
    '</div></div>';
}

/* ── назначение лекарства: словарь и раскладка ─────────────────────────────
   Группировать по `class`/`for` напрямую нельзя: это свободный текст, и на
   полусотне препаратов вышло бы полсотни «групп» по одному. Поэтому закрытый
   словарь, а раскладка — по ключевым словам из class+for.
   Порядок групп тематический, а не по размеру: простуда-горло-кашель стоят
   рядом, потому что за ними лезут в одной и той же ситуации, и список не
   должен перетасовываться при каждом добавлении лекарства.
   Явное поле `m.group` всегда сильнее эвристики: его заполняет health-meds по
   официальной инструкции, а человек может переопределить на странице. */
var MED_GROUPS = [
  { k: "cold",    label: "Простуда и ОРВИ" },
  { k: "throat",  label: "Горло" },
  { k: "cough",   label: "Кашель" },
  { k: "pain",    label: "Боль и воспаление" },
  { k: "gi",      label: "ЖКТ" },
  { k: "allergy", label: "Аллергия" },
  { k: "skin",    label: "Кожа" },
  { k: "eye",     label: "Глаза" },
  { k: "abx",     label: "Антибиотики" },
  { k: "heart",   label: "Сердце и сосуды" },
  { k: "sleep",   label: "Сон и тонус" },
  { k: "other",   label: "Прочее" }
];
var MED_GROUP_LABEL = {};
MED_GROUPS.forEach(function(g){ MED_GROUP_LABEL[g.k] = g.label; });

/* Правила читаются сверху вниз, первое совпадение выигрывает. Порядок здесь —
   не произвол, он выстрадан на реальной аптечке; каждая перестановка ломает
   разбор конкретных препаратов, поэтому конфликты подписаны. */
var MED_RULES = [
  // Отрицательный просмотр обязателен: у Энтерола показание «диарея, включая
  // АНТИБИОТИК-ассоциированную» — по голому /антибиотик/ пробиотик оказывался
  // в антибиотиках.
  ["abx",     /антибиотик(?!-ассоц)/],
  // Драмина по классу антигистаминное, но лезут за ней от укачивания, а не от
  // аллергии. Диакарб — системный диуретик, хотя в показаниях есть глаукома,
  // и в «Глазах» он вводил бы в заблуждение. Оба ловим до профильных правил.
  ["other",   /укачиван|вестибуляр|диуретик|мочегон/],
  ["gi",      /кишечн|желудк|диаре|энтеросорб|фермент|спазмолит|пробиотик|метеоризм|протонной помпы|гастропрокинетик|ветрогон|жкт/],
  ["eye",     /офтальмолог|роговиц|конъюнктив|глаза|глазн/],
  // «Простуда» ДО «Горла»: у Терафлю в показаниях перечислены симптомы, среди
  // них «боль в горле», и по горлу он уезжал из простуды в пастилки. Обратного
  // конфликта нет — ни у одного местного средства для горла в class/for не
  // упомянуты ОРВИ, грипп или простуда.
  ["cold",    /орви|гриппа|простуд|синусит|заложенность носа|деконгестант|интерферон|противовирусн/],
  // Тантум верде и Гексорал описаны как «обезболивающее противовоспалительное»
  // и по этому признаку уехали бы в «Боль». Горло проверяем раньше боли.
  ["throat",  /полости рта|глотк|горла|горле|оториноларинголог|верхних дыхательных путей/],
  ["cough",   /кашл|мокрот|муколит|отхаркив/],
  // Ключ — «антигистаминное» в классе, а НЕ «зуд» в показаниях: иначе Акридерм
  // (глюкокортикостероид от зудящих дерматозов) уехал бы в аллергию.
  ["allergy", /антигистамин|противоаллерг|h1-гистаминов/],
  ["pain",    /нпвп|анальгетик|обезболив|местнораздражающ|местноанестезирующ|жаропониж/],
  ["skin",    /дерматоз|глюкокортикостероид/],
  // Валокордин седативный, но показание — сердечно-сосудистое; до «Сна».
  ["heart",   /статин|холестерин|сердечно-сосудист/],
  ["sleep",   /снотворн|адаптоген|тонизирующ|десинхроноз|нарушения сна/]
];
function medGroup(m){
  if (m.group && MED_GROUP_LABEL[m.group]) return m.group;
  var t = ((m["class"] || "") + " " + (m["for"] || "")).toLowerCase();
  for (var i = 0; i < MED_RULES.length; i++)
    if (MED_RULES[i][1].test(t)) return MED_RULES[i][0];
  return "other";
}

/* ── вкладка: лекарства ─────────────────────────────────────────────────── */
function medsModel(){
  var mq = (S.medQuery || "").trim().toLowerCase();
  var mf = S.medStatusFilter || "all";
  // Поиск идёт по названию, действующему веществу и «от чего» — «нифуроксазид»
  // должен находить и Экофурил, и Энтерофурил (одно вещество, разные бренды).
  var match = function(m){
    if (!mq) return true;
    return ((m.name || "") + " " + (m.inn || "") + " " + (m.for || ""))
      .toLowerCase().indexOf(mq) >= 0;
  };
  var mg = S.medGroup || "all";              // назначение: all | ключ из MED_GROUPS
  var ms = S.medSort === "name" ? "name" : "group";   // порядок: группы (умолч.) | алфавит
  var base = S.meds.filter(function(m){
    if (m.archived) return false;              // кончилось — своя секция внизу
    if (mf === "taking" && !m.taking) return false;
    if (mf === "expired" && !expiryInfo(m.expiry).gone) return false;
    // «Скоро истекает» — строго БЕЗ уже истёкших: у них свой чип, и смешивать
    // их значило бы показывать одно и то же лекарство под обоими фильтрами.
    if (mf === "soon"){ var es = expiryInfo(m.expiry); if (!es.soon || es.gone) return false; }
    if (mg !== "all" && medGroup(m) !== mg) return false;
    return match(m);
  });
  var byName = function(a, b){ return (a.name || "").localeCompare(b.name || "", "ru"); };
  var taking = base.filter(function(m){ return m.taking; }).sort(byName);
  var lib = base.filter(function(m){ return !m.taking; }).sort(byName);
  var groups = [];
  // «Принимаю сейчас» приколото сверху в любом режиме: это другая ось (что пью
  // прямо сейчас), и она важнее назначения — за ней приходят чаще всего.
  if (taking.length) groups.push({ name: "Принимаю сейчас", items: taking });
  if (ms === "group"){
    // Порядок блоков — из MED_GROUPS, а не по размеру: список не должен
    // перетасовываться от добавления лекарства. Пустые группы не рисуем.
    MED_GROUPS.forEach(function(g){
      var items = lib.filter(function(m){ return medGroup(m) === g.k; });
      if (items.length) groups.push({ name: g.label, items: items, group: g.k });
    });
  } else if (lib.length){
    groups.push({ name: mf === "taking" ? "Принимаю" : "Аптечка", items: lib });
  }

  // «Раньше покупал» — история аптечки: что было и кончилось. Не мешается в
  // основном списке, но и не пропадает: по ней видно, что уже брал (и справка
  // осталась — можно добавить заново по образцу). Поиск сюда достаёт: вопрос
  // «а покупал ли я это вообще» — как раз про архив.
  var gone = S.meds.filter(function(m){ return m.archived && match(m); }).sort(byName);
  var nGoneAll = S.meds.filter(function(m){ return m.archived; }).length;

  // Те же два числа, что стоят в сводке на обзоре (expirySummary): чип — цель
  // ссылки оттуда, счётчики обязаны совпадать.
  var xp = expirySummary();
  // Счётчики назначений в выпадающем списке считаются ДО фильтра по назначению
  // (иначе выбранная группа показывала бы своё число, а остальные — нули) и
  // после остальных: список должен отвечать «а что найдётся, если переключить».
  var pool = S.meds.filter(function(m){
    if (m.archived) return false;
    if (mf === "taking" && !m.taking) return false;
    if (mf === "expired" && !expiryInfo(m.expiry).gone) return false;
    if (mf === "soon"){ var e2 = expiryInfo(m.expiry); if (!e2.soon || e2.gone) return false; }
    return match(m);
  });
  var gcount = {};
  pool.forEach(function(m){ var k = medGroup(m); gcount[k] = (gcount[k] || 0) + 1; });
  return { mq: mq, mf: mf, mg: mg, ms: ms, base: base, groups: groups, gone: gone,
           nGoneAll: nGoneAll, nExpired: xp.gone, nSoon: xp.soon,
           gcount: gcount, nPool: pool.length };
}

function medsBelowHTML(M){
  var chipStyle = function(on){ return on ? CHIP_ON : ""; };
  var chips = [{ k: "all", label: "Все" }, { k: "taking", label: "Принимаю" }];
  if (M.nExpired) chips.push({ k: "expired", label: "Истёк срок · " + M.nExpired });
  if (M.nSoon) chips.push({ k: "soon", label: "Скоро истекает · " + M.nSoon });
  var statusChips = chips.map(function(c){
    return '<button class="fchip" data-act="med-filter" data-id="' + c.k + '" style="' + chipStyle(M.mf === c.k) + '">' + c.label + '</button>';
  }).join("");
  // Назначение — ВЫПАДАЮЩИМ СПИСКОМ, а не чипами: групп двенадцать, и на
  // телефоне ряд чипов развернулся бы в четыре строки поверх и без того
  // непустой полосы. Ширина select'а от числа групп не зависит.
  // Счётчик в каждом пункте отвечает на «а что там найдётся» ДО переключения.
  var opts = [{ value: "all", t: "Назначение: все", aside: M.nPool, selected: M.mg === "all" }];
  MED_GROUPS.forEach(function(g){
    var n = M.gcount[g.k] || 0;
    // Пустые группы не предлагаем, но выбранную оставляем всегда — иначе она
    // молча исчезнет из списка, а фильтр останется включённым.
    if (!n && M.mg !== g.k) return;
    opts.push({ value: g.k, t: g.label, aside: n, selected: M.mg === g.k });
  });
  // общий список ui-kit (обычный размер); число — справа в пункте
  var groupSel = uiSelectHTML({ id: "med-group-sel", act: "med-group", size: "md", label: "Назначение", search: false, options: opts });
  // Порядок — одна кнопка-переключатель, а не два чипа: состояния всего два,
  // и подпись показывает текущее, а не выбор из двух одинаковых на вид.
  var sortBtn = '<button class="fchip" data-act="med-sort" title="Переключить порядок списка">' +
    (M.ms === "group" ? "⇅ По группам" : "⇅ По алфавиту") + '</button>';
  // Пояснение и «Добавить» — часть полной полосы: при поиске они уезжают
  // вместе с чипами. Абзац читают один раз, а 69 px он занимает каждый раз.
  var full = '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">' + statusChips +
      groupSel + sortBtn + '<span style="flex:1;"></span>' +
      (S.writable ? '<button class="ui-btn" data-act="med-add">＋ Добавить</button>' : '') +
    '</div>' +
    '<div style="font-size:11.5px; color:var(--text-faint); line-height:1.5;">По умолчанию лекарства лежат в аптечке. Отметьте «принимаю», когда начинаете приём. Справочные поля — действующее вещество, показания, взаимодействия — заполняет отдельный скилл.' +
      (S.writable ? '' : ' <b>Правки недоступны:</b> нет доступа к записи.') + '</div>';
  var labels = { taking: "принимаю", expired: "истёк срок", soon: "скоро истекает" };
  var active = (M.mf !== "all" ? chipOff(labels[M.mf] || M.mf, "med-filter", "all") : "") +
               (M.mg !== "all" ? chipOff(MED_GROUP_LABEL[M.mg] || M.mg, "med-group", "all") : "");
  return filterBar(!!M.mq, M.base.length + M.gone.length, active, full);
}

/* ── вкладка: отчёты ────────────────────────────────────────────────────── */
// Имя файла кодируем посегментно: в отчётах пробелы и кириллица
// («2026-08-04 Офтальмолог.pdf»), а строку получают и href, и src iframe.
function reportUrl(name){ return docUrl("reports", name); }
function docUrl(dir, name){ return DATA + dir + "/" + encodeURIComponent(name); }

/* Документы здоровья отдаются ТОЛЬКО с заголовком Authorization (Caddy:
   без него — тихий 403). Обычная ссылка и <iframe src> его не несут, поэтому
   файл открывался пустым экраном. Качаем его сами через authFetch и
   показываем blob: во фрейме; «Открыть отдельно» ведёт на тот же blob. */
function openDoc(dir, name, date){
  closeDoc(true);
  var d = { dir: dir, name: name, date: date || "", blob: null, err: null };
  // документ, открытый из панели, — поверх панелей (панели больше не «над отчётом»)
  S.doc = d; S.docFresh = true; S.panesOverDoc = false; render();
  authFetch(docUrl(dir, name), { cache: "no-store" })
    .then(function(r){
      if (r.status === 404) throw new Error("Файла нет в Claude-Memory/Health/" + dir + "/ — проверьте имя.");
      if (r.status === 401 || r.status === 403) throw new Error("Нет доступа — войдите заново.");
      if (!r.ok) throw new Error("Не удалось загрузить файл (код " + r.status + ").");
      return isMdReport(name) ? r.text() : r.blob();
    })
    .then(function(b){
      if (S.doc !== d) return;
      // Markdown рисует страница (uiMarkdown из ui-kit — тот же рендер, что у
      // справки): текст подстраивается под экран, в отличие от PDF.
      if (typeof b === "string"){ d.md = parseReportHead(b); S.repMd[name] = d.md; d.blob = "md"; }
      else d.blob = URL.createObjectURL(b);
      render();
    })
    .catch(function(e){ if (S.doc !== d) return; d.err = e.message; render(); });
}
function closeDoc(silent){
  if (S.doc && S.doc.blob && !S.doc.md) URL.revokeObjectURL(S.doc.blob);
  S.doc = null;
  if (!silent) render();
}

/* Шапка отчёта health-report@1 — та же узкая грамматика, что в
   skills/health-labs/scripts/validate_report.py (parse): «---», строки
   «ключ: значение», пункты «  - …» под flags/todo, «---». Файл без шапки —
   просто markdown: заголовок берём из первой строки «# …». */
var REP_LEVELS = {
  red:  { t: "Срочно",    c: "var(--err)",  bg: "var(--err-bg)" },
  warn: { t: "Обсудить",  c: "var(--warn)", bg: "var(--warn-bg)" },
  info: { t: "Наблюдать", c: "var(--info)", bg: "var(--info-bg)" },
  ok:   { t: "В норме",   c: "var(--c-3)",  bg: "var(--success-bg)" }
};
function isMdReport(name){ return /\.md$/i.test(name || ""); }
function parseReportHead(text){
  var lines = String(text || "").replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").split("\n");
  var meta = null, body = lines;
  if (lines[0] && lines[0].trim() === "---"){
    var end = -1;
    for (var i = 1; i < lines.length; i++) if (lines[i].trim() === "---"){ end = i; break; }
    if (end > 0){
      meta = { flags: [], todo: [] };
      var cur = null;
      lines.slice(1, end).forEach(function(ln){
        if (!ln.trim()) return;
        var it = /^\s+-\s+(.*)$/.exec(ln);
        if (it){ if (cur) meta[cur].push(it[1].trim()); return; }
        var kv = /^([a-z_]+):(?:\s(.*))?$/.exec(ln);
        if (!kv){ cur = null; return; }
        if (kv[1] === "flags" || kv[1] === "todo"){ meta[kv[1]] = []; cur = kv[1]; }
        else { meta[kv[1]] = (kv[2] || "").trim(); cur = null; }
      });
      meta.flags = meta.flags.map(function(f){
        var p = f.split("|"), lvl = (p[0] || "").trim();
        return { lvl: REP_LEVELS[lvl] ? lvl : "info", title: (p[1] || "").trim(), text: p.slice(2).join("|").trim() };
      });
      meta.markers = (meta.markers || "").split(",").map(function(x){ return x.trim(); }).filter(Boolean);
      body = lines.slice(end + 1);
    }
  }
  // Первая строка тела «# …» — заголовок: на странице он уже в шапке окна.
  while (body.length && !body[0].trim()) body = body.slice(1);
  var h1 = body[0] && /^#\s+(.*)$/.exec(body[0]);
  if (h1) body = body.slice(1);
  return { meta: meta, h1: h1 ? h1[1].trim() : "", body: body.join("\n") };
}
function reportTitle(f){
  var r = S.repMd[f.name];
  return (r && r.meta && r.meta.title) || (r && r.h1) || f.name.replace(/\.[a-z]+$/i, "");
}
function reportDate(f){
  var r = S.repMd[f.name], m = /^(\d{4}-\d{2}-\d{2})/.exec(f.name);
  return (r && r.meta && r.meta.date) || (m && m[1]) || (f.mod_time || "").slice(0, 10);
}
function flagChip(lvl, n){
  var L = REP_LEVELS[lvl];
  return '<span style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:' + L.c + '; background:' + L.bg + '; border-radius:999px; padding:2px 9px; white-space:nowrap;">' +
    '<span style="width:6px; height:6px; border-radius:50%; background:' + L.c + ';"></span>' + L.t + (n > 1 ? " · " + n : "") + '</span>';
}
/* Шапка отчёта в окне: сводка, флаги карточками, чек-лист, кнопки биомаркеров. */

        (function(){
          var m = S.repMd[f.name] && S.repMd[f.name].meta;
          if (!m) return "";
          var cnt = {};

          var chips = ["red", "warn", "info", "ok"].filter(function(k){ return cnt[k]; }).map(function(k){ return flagChip(k, cnt[k]); }).join("");
          return (m.summary ? '<div style="font-size:13px; line-height:1.45; color:var(--text-muted); margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">' + esc(m.summary) + '</div>' : '') +

        })() +

/* Окно просмотра документа (отчёт или файл исследования).
   Раньше строка вела на файл вкладкой — читать приходилось «в стороне» от
   раздела. Теперь документ открывается поверх страницы во фрейме.
   Оговорка честная: PDF во фрейме показывает СИСТЕМНЫЙ просмотрщик браузера,
   и на iPhone Safari он умеет отрисовать только первую страницу без листания.
   Поэтому «Открыть отдельно ↗» остаётся в шапке окна как рабочий путь, а не
   как украшение, и подпись под фреймом говорит об этом прямо. */
function docModal(){

        : note("Такой формат в окне не показывается.<br>Откройте файл отдельно — браузер выберет подходящий просмотрщик.");

      '<div class="ui-docwin-head">' +

/* ── боковые панели стопкой (ui-kit 1.37.0: uiPaneHTML + uiStack*) ──────────
   S.panes — стопка открытых панелей [{ k: "marker"|"med"|"study"|"vitals", id }].
   Переход из панели в панель (маркер → лекарство, маркер → исследование и
   обратно) кладёт новую ПОВЕРХ: нижняя видна сдвинутой, «← …», Escape и
   затемнение возвращают к ней; ✕ закрывает все. Было: замена панели и
   указатель «откуда пришёл» глубиной 1 (selFrom/medFrom/studyFrom/selStudy). */
function paneTop(){ return S.panes[S.panes.length - 1] || null; }
function paneOpen(k, id){ set({ panes: [{ k: k, id: id }], paneFresh: 0, paneGen: S.paneGen + 1 }); }
function panePush(k, id){ set({ panes: S.panes.concat([{ k: k, id: id }]), paneFresh: S.panes.length, paneGen: S.paneGen + 1 }); }
// закрыть панели от i и выше: уходят плавно, нижняя возвращается на место
function panePop(i){
  uiStackPop(document.querySelectorAll(".ui-pane"), i, function(){ set({ panes: S.panes.slice(0, i), panesOverDoc: i > 0 && S.panesOverDoc }); });
}
// панели, открытые из окна отчёта, — поверх него (.over): закрыл биомаркер — вернулся в отчёт
function paneCls(i){ return uiStackCls(i, S.panes.length, S.paneFresh) + (S.panesOverDoc && S.doc ? " over" : ""); }
// подпись «← …» — панель под этой (куда вернёт Escape)
function paneBack(i){
  var b = i > 0 ? S.panes[i - 1] : null;
  if (!b) return null;
  if (b.k === "marker"){
    var hid = headId(b.id), mk = markerList().filter(function(m){ return m.id === hid; })[0];
    return { label: mk ? mk.name : "назад" };
  }
  if (b.k === "med"){
    var md = S.meds.filter(function(x){ return x.id === b.id; })[0];
    return { label: md ? md.name : "назад" };
  }
  if (b.k === "event"){
    var eh = anSelf().history.filter(function(x){ return x.id === b.id; })[0];
    return { label: eh ? eh.name : "назад" };
  }
  // исследование: обрезается только название — дата видна всегда (она и
  // отличает два исследования одного вида)
  var st = b.k === "study" ? studyById(b.id) : null;
  return st ? { label: studyShort(st), sub: uiDateNum(st.date) } : { label: "назад" };
}
function panesHTML(){
  return S.panes.map(function(p, i){
    return p.k === "marker" ? markerPane(p.id, i, p.list) : p.k === "med" ? medPane(p.id, i)
      : p.k === "study" ? studyPane(p.id, i) : p.k === "event" ? eventPane(p.id, i) : vitalsPane(p.id, i);
  }).join("");
}

// в порядке отчёта; пара давления — один раз, по головному маркеру; неизвестные — мимо).
function paneMarkers(list){
  var all = markerList();
  if (!list) return all;
  var byId = {}, seen = {}, out = [];
  all.forEach(function(m){ byId[m.id] = m; });
  list.forEach(function(x){ var h = headId(x); if (byId[h] && !seen[h]){ seen[h] = 1; out.push(byId[h]); } });
  return out;
}

      '';
  // Пришли из лекарства/исследования (панель стопкой) — «← назад» к нему вместо
  // листания каталога и счётчика.
  return uiPaneHTML({ title: raw.name, eyebrow: catName(raw.category), width: 680,
    close: "pane-close", back: paneBack(i), cls: paneCls(i), bodyId: "pane-b-" + i,
    lead: '<div class="ui-pane-nav">' +
        '<button type="button" data-act="prev" aria-label="Предыдущий маркер"' + (idx > 0 ? '' : ' disabled') + '>◀</button>' +
        '<button type="button" data-act="next" aria-label="Следующий маркер"' + (idx < all.length - 1 ? '' : ' disabled') + '>▶</button></div>',
    aside: i > 0 ? '' : '<span style="font-size:12px; color:var(--text-faint); font-variant-numeric:tabular-nums; white-space:nowrap;">' + (idx + 1) + " / " + all.length + '</span>',
    body: body });
}

/* Сила влияния лекарства на биомаркер (health-meds@1, поле affects_strength).
   Отсутствует — показываем нейтрально: «не размечено» честнее выдуманной силы. */
var STR_RU = { strong: "сильное", moderate: "умеренное", weak: "слабое" };

/* ── слайд-овер лекарства ───────────────────────────────────────────────── */
function medPane(id, i){
  // боковая панель — общая ui-kit (uiPaneHTML); i — место в стопке панелей
  var m = S.meds.filter(function(x){ return x.id === id; })[0];
  if (!m) return "";
  var ex = expiryInfo(m.expiry), on = !!m.taking;
  var enriched = !!(m.inn || m.class || m.indications || m.interactions);
  // Сила влияния: без неё чипы врали равенством — у статина ЛПНП падает на
  // десятки процентов, а HbA1c сдвигается на десятые доли, и оба выглядели
  // одинаково. Сильные идут первыми, слабые приглушены. Неразмеченные
  // (справка старого прогона) рисуются нейтрально — как раньше.
  var STR_RANK = { strong: 0, moderate: 1, weak: 2 };
  var strengths = m.affects_strength || {};
  var hasStrength = (m.affects || []).some(function(id){ return strengths[id]; });
  var aff = (m.affects || []).slice().sort(function(a, b){
    var ra = STR_RANK[strengths[a]], rb = STR_RANK[strengths[b]];
    return (ra == null ? 1.5 : ra) - (rb == null ? 1.5 : rb);
  }).map(function(id){
    var b = (bioList()).filter(function(x){ return x.id === id; })[0];
    var s = strengths[id];
    var dot = s === "strong" ? '<span title="сильное влияние" style="width:6px; height:6px; border-radius:50%; background:var(--c-3); flex:none;"></span>'
            : s === "moderate" ? '<span title="умеренное влияние" style="width:6px; height:6px; border-radius:50%; background:var(--c-3); opacity:.5; flex:none;"></span>'
            : s === "weak" ? '<span title="слабое влияние" style="width:6px; height:6px; border-radius:50%; border:1px solid var(--c-3); flex:none;"></span>' : '';
    var strong = s === "strong";
    var weak = s === "weak";
    return '<button data-act="open-from-med" data-id="' + esc(id) + '" title="' + (s ? esc(STR_RU[s]) + ' влияние' : "сила влияния не размечена") + '" style="display:inline-flex; align-items:center; gap:6px; background:' + (strong ? "var(--accent-bg)" : "var(--bg-alt)") + '; border:1px solid ' + (strong ? "var(--c-3)" : "var(--border)") + '; border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:' + (strong ? "700" : "600") + '; color:var(--c-3); font-family:inherit; cursor:pointer;' + (weak ? ' opacity:.62;' : '') + '">' + dot + esc(b ? b.name : id) + '<span style="font-size:12px;">→</span></button>';
  }).join("");

  // Пустых строк не печатаем: «Форма —» / «Назначил —» — это шум, а не
  // информация. Незаполненное поле честнее не показывать вовсе.
  // «Назначение» показываем ВСЕГДА, даже когда поле пустое: блок в списке
  // лекарство всё равно занимает, и человек должен видеть какой — иначе
  // непонятно, почему оно лежит там, где лежит, и что менять. Приписка
  // «по описанию» отличает вычисленное значение от проставленного руками.
  var grpVal = (MED_GROUP_LABEL[medGroup(m)] || "Прочее") + (m.group ? "" : " · по описанию");
  var dl = [["Действующее вещество", m.inn], ["Класс", m.class], ["Назначение", grpVal],
            ["Форма", m.form], ["Назначил", m.prescribedBy]]
    .filter(function(p){ return p[1] && String(p[1]).trim(); })
    .map(function(p){
      return '<dt style="color:var(--text-muted);">' + p[0] + '</dt><dd style="margin:0;">' + esc(p[1]) + '</dd>';
    }).join("");

  // «Приём»: две РАЗНЫЕ вещи, которые нельзя мешать — что в таблетке
  // (свойство препарата) и что назначил врач (сколько и когда пить).
  // Раньше они склеивались точкой в одну строку без подписей: «400 мг · —»,
  // а при пустых полях выходило «— · —». Теперь — подписанные строки, и
  // пустое не рисуется вовсе.
  var takeRows = [
    ["Дозировка препарата", m.dose],
    ["Назначено врачом", m.regimen],
    ["Когда", m.timing]
  ].filter(function(p){ return p[1] && String(p[1]).trim(); });
  var takeBlock = takeRows.length
    ? '<div style="margin-top:12px; padding:14px 16px; background:var(--bg-alt); border-radius:10px;">' +
        '<div style="font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:7px;">Приём</div>' +
        '<dl style="display:grid; grid-template-columns:max-content 1fr; gap:6px 14px; margin:0; font-size:13.5px;">' +
          takeRows.map(function(p){
            return '<dt style="color:var(--text-muted);">' + p[0] + '</dt>' +
              '<dd style="margin:0; font-variant-numeric:tabular-nums;">' + esc(p[1]) + '</dd>';
          }).join("") +
        '</dl></div>'
    : '';

  var body =
        '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; border:1px solid var(--border); border-radius:10px;' + (m.archived ? ' opacity:.75;' : '') + '">' +
          (m.archived
            ? '<span style="font-size:13.5px; font-weight:600; color:var(--text-muted);">Нет в наличии — кончилось</span>'
            : '<button class="tgl" data-act="med-toggle" data-id="' + esc(m.id) + '" aria-pressed="' + on + '"' + (S.writable ? '' : ' disabled') + ' style="' + switchStyle(on) + (S.writable ? '' : ' opacity:.5;') + '"><span style="' + knobStyle(on) + '"></span></button>' +
              '<span style="font-size:13.5px; font-weight:600;">' + (on ? "Принимаю сейчас" : "Не принимаю (в аптечке)") + '</span>') +
          '<span style="margin-left:auto;">' + (ex.gone
            ? '<span class="exp-chip">' + esc(ex.label) + '</span>'
            : '<span style="font-size:12.5px; color:' + ex.color + '; font-variant-numeric:tabular-nums;">' + esc(ex.label) + '</span>') + '</span></div>' +
        (enriched ? '' : '<div style="margin-top:12px; padding:10px 14px; background:var(--bg-alt); border-radius:9px; font-size:12px; color:var(--text-muted);">Справка не заполнена — действующее вещество, показания и взаимодействия добавит скилл-обогатитель.</div>') +
        (m.for && m.for.trim() ? '<div style="margin-top:16px; padding:14px 16px; background:var(--accent-bg); border-radius:10px;">' +
          '<div style="font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--c-3); font-weight:700;">От чего</div>' +
          '<div style="font-size:15px; line-height:1.5; margin-top:4px;">' + esc(m.for) + '</div></div>' : '') +
        takeBlock +
        (dl ? '<dl style="display:grid; grid-template-columns:max-content 1fr; gap:10px 18px; font-size:13.5px; margin:20px 0 0;">' + dl + '</dl>' : '') +
        (aff ? '<div style="margin-top:20px;"><div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px;">Влияет на биомаркеры</div>' +
          (hasStrength ? '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--text-faint); margin:-2px 0 9px;">' +
            '<span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:6px; height:6px; border-radius:50%; background:var(--c-3); display:inline-block;"></span>сильное</span>' +
            '<span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:6px; height:6px; border-radius:50%; background:var(--c-3); opacity:.5; display:inline-block;"></span>умеренное</span>' +
            '<span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:6px; height:6px; border-radius:50%; border:1px solid var(--c-3); display:inline-block;"></span>слабое</span></div>' : '') +
          '<div style="display:flex; flex-wrap:wrap; gap:8px;">' + aff + '</div></div>' : '') +
        (m.indications ? '<div style="margin-top:20px;"><div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px;">Показания</div><p style="font-size:13.5px; line-height:1.6; margin:0;">' + esc(m.indications) + '</p></div>' : '') +
        (m.interactions ? '<div style="margin-top:16px; padding:13px 15px; background:var(--warn-bg); border-left:3px solid var(--warn); border-radius:8px;"><div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--warn); margin-bottom:5px;">Взаимодействия</div><p style="font-size:13px; line-height:1.55; margin:0; color:var(--text);">' + esc(m.interactions) + '</p></div>' : '') +
        (m.notes ? '<div style="margin-top:16px;"><div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px;">Заметки</div><p style="font-size:13.5px; line-height:1.6; margin:0; color:var(--text-muted);">' + esc(m.notes) + '</p></div>' : '') +
        (S.writable ? '<div style="display:flex; gap:10px; margin-top:24px;">' +
          '<button class="ui-btn" data-act="med-edit" data-id="' + esc(m.id) + '">Редактировать</button>' +
          '<button class="ui-btn danger" data-act="med-del" data-id="' + esc(m.id) + '">Удалить</button></div>' : '') +
        '<p style="font-size:11.5px; line-height:1.5; color:var(--text-faint); margin:22px 0 0; padding-top:14px; border-top:1px solid var(--border);">Справочная информация, не медицинская рекомендация. Приём и дозировки согласуйте с врачом.</p>' +
      '';
  return uiPaneHTML({ title: m.name, eyebrow: "Лекарство", oneLine: true, width: 560,
    close: "pane-close", back: paneBack(i), cls: paneCls(i), bodyId: "pane-b-" + i, body: body });
}


/* ── панель витальных: все записи веса ─────────────────────────────────────
   Открывается кликом по карточке «Вес»/«ИМТ». Стандартная карточка кабинета:
   крупное последнее значение, график, полная история с датами и удалением. */
function vitalsPane(id, i){
  // боковая панель — общая ui-kit (uiPaneHTML); i — место в стопке панелей
  var v = S.vitals || { height_cm: null, weight: [] };
  var w = (v.weight || []).slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  var last = w.length ? w[w.length - 1] : null;
  var h = v.height_cm;
  var bmiOf = function(kg){ return h ? r1(kg / Math.pow(h / 100, 2)) : null; };

  var chart = "";
  if (w.length >= 2){
    var W = 640, H = 200, L = 34, R = 12, T = 16, B = 34;
    var kgs = w.map(function(x){ return x.kg; });
    var mn = Math.min.apply(null, kgs), mx = Math.max.apply(null, kgs);
    var pad = (mx - mn) * 0.2 || 1; mn -= pad; mx += pad;
    var t0 = tms(w[0].date), tspan = (tms(w[w.length - 1].date) - t0) || 1;
    var xAt = function(i){ return r1(L + (tms(w[i].date) - t0) / tspan * (W - L - R)); };
    var yAt = function(kg){ return r1(T + (1 - (kg - mn) / (mx - mn)) * (H - T - B)); };
    chart = '<div style="margin-top:18px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px 12px 8px;">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:auto; display:block; font-family:var(--font-sans);">' +
        '<path d="M' + w.map(function(x, i){ return xAt(i) + " " + yAt(x.kg); }).join(" L") + '" fill="none" stroke="var(--c-3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>' +
        w.map(function(x, i){
          return '<circle cx="' + xAt(i) + '" cy="' + yAt(x.kg) + '" r="' + (i === w.length - 1 ? 5 : 3.5) + '" fill="var(--c-3)" stroke="var(--bg)" stroke-width="2"><title>' + esc(trim(x.kg) + " кг · " + uiDateNum(x.date)) + '</title></circle>';
        }).join("") +
        '<text x="' + L + '" y="' + (H - 10) + '" text-anchor="start" fill="var(--text-faint)" font-size="11">' + esc(uiDateNum(w[0].date)) + '</text>' +
        '<text x="' + (W - R) + '" y="' + (H - 10) + '" text-anchor="end" fill="var(--text-faint)" font-size="11">' + esc(uiDateNum(w[w.length - 1].date)) + '</text>' +
      '</svg></div>';
  } else {
    chart = '<div style="margin-top:18px; padding:20px; background:var(--bg); border:1px solid var(--border); border-radius:10px; font-size:12.5px; color:var(--text-faint); text-align:center;">Одно измерение — динамика появится со следующим.</div>';
  }

  var rows = w.slice().reverse().map(function(x){
    var b = bmiOf(x.kg);
    return '<div style="display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:12px; padding:11px 2px; border-top:1px solid var(--border); font-size:13px;">' +
      '<span style="color:var(--text-muted); font-variant-numeric:tabular-nums; white-space:nowrap;">' + esc(uiDateNum(x.date)) + '</span>' +
      '<span style="font-weight:600; font-variant-numeric:tabular-nums;">' + esc(trim(x.kg)) + ' <span style="font-size:11px; color:var(--text-faint); font-weight:400;">кг</span></span>' +
      '<span style="font-size:12px; color:var(--text-faint); font-variant-numeric:tabular-nums;">' + (b === null ? "" : "ИМТ " + esc(trim(b))) + '</span>' +
      (S.writable ? '<button class="ui-btn danger sm" data-act="weight-del" data-id="' + esc(x.date) + '" title="Удалить запись">✕</button>' : '<span></span>') +
    '</div>';
  }).join("");

  var body =
        (last ? '<div style="display:flex; align-items:flex-end; flex-wrap:wrap; gap:14px;">' +
          '<div style="display:flex; align-items:baseline; gap:8px;">' +
            '<span style="font-family:var(--font-serif); font-size:46px; font-weight:600; line-height:.95; font-variant-numeric:tabular-nums;">' + esc(trim(last.kg)) + '</span>' +
            '<span style="font-size:14px; color:var(--text-muted);">кг</span></div>' +
          (bmiOf(last.kg) === null ? '' : '<span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; border-radius:999px; padding:5px 12px; color:var(--text-muted); background:var(--bg-alt);">ИМТ ' + esc(trim(bmiOf(last.kg))) + '</span>') +
          '<span style="margin-left:auto; font-size:12.5px; color:var(--text-faint); font-variant-numeric:tabular-nums; align-self:center;">' + esc(uiDateNum(last.date)) + '</span></div>' +
          (h ? '<div style="font-size:12.5px; color:var(--text-muted); margin-top:8px;">Рост — <b style="color:var(--text); font-weight:600;">' + esc(trim(h)) + ' см</b>. ВОЗ: 18.5–25 норма, 25–30 избыточная масса, 30+ ожирение.</div>' : '')
          : '<div style="color:var(--text-faint); font-size:13.5px;">Измерений пока нет.</div>') +
        chart +
        (S.writable ? '<div style="margin-top:18px;"><button class="ui-btn" data-act="weight-add">＋ Записать вес</button></div>' : '') +
        '<h3 style="font-family:var(--font-sans); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); margin:24px 0 10px;">Все записи</h3>' +
        '<div style="display:flex; flex-direction:column;">' + (rows || '<div style="padding:18px 2px; color:var(--text-faint); font-size:13px;">Пусто.</div>') + '</div>' +
      '';
  return uiPaneHTML({ title: "Вес и ИМТ", eyebrow: "Витальные", width: 560,
    close: "pane-close", cls: paneCls(i), bodyId: "pane-b-" + i,
    aside: '<span style="font-size:12px; color:var(--text-faint); font-variant-numeric:tabular-nums;">' + w.length + ' ' + (w.length === 1 ? "запись" : (w.length < 5 ? "записи" : "записей")) + '</span>',
    body: body });
}


/* ── модалка: лекарство ─────────────────────────────────────────────────── */
// type: "text" | "date". Для срока годности НЕ использовать нативный
// month-input: Safari его не поддерживает — есть monthField()/openMonthPicker().
// extra — сырые атрибуты поля (напр. inputmode): у числовых полей без
// inputmode="decimal" телефон открывает буквенную клавиатуру, и вес приходится
// набирать через переключение раскладки.
// Поле формы — общее ui-kit (uiFieldHTML): подсказка после названия, id f-<name>.
function fld(label, name, value, ph, span, hint, type, extra){
  return uiFieldHTML({ label: label, id: "f-" + name, value: value, ph: ph, span: !!span, hint: hint, type: type, extra: extra });
}
// rows — стартовая высота; без неё поле в две строки, как раньше.
function area(label, name, value, span, hint, rows){
  var h = uiFieldHTML({ label: label, id: "f-" + name, value: value, span: !!span, hint: hint, area: true, rows: rows });
  // подсказка «заполняет скилл» — команда ИИ: в режиме «без ИИ» скрыта
  return hint && /скилл/.test(hint) ? h.replace('<span class="fld-hint">', '<span class="fld-hint noai-hide">') : h;
}
// Высота поля под текст: ~95 знаков в строке широкой формы, от 3 до max строк.
function fitRows(v, max){
  var n = String(v || "").split("\n").reduce(function(a, l){ return a + Math.max(1, Math.ceil(l.length / 95)); }, 0);
  return Math.max(3, Math.min(max, n + 1));
}
// Окно формы — общее ui-kit (uiModalHTML): шапка и кнопки закреплены, поля в
// две колонки прокручиваются; на телефоне — во весь экран. width — ширина, px.
// Плавный вход (ui-kit .enter) — только при открытии формы: S.formEnter ставит
// render(), сравнивая открытую форму с прошлой перерисовкой; иначе окно
// «въезжало» бы на каждой букве и каждом выборе в списке.
function modal(title, inner, saveAct, width){
  return uiModalHTML({ title: title, body: inner, close: "close-edit", save: saveAct, width: width || 640, grid: true,
                       cls: S.formEnter ? "enter" : "" });
}
function formKey(){
  return S.medEdit ? "med:" + S.medEdit.id : S.vaxEdit ? "vax:" + (S.vaxEdit.id || "")
    : S.studyEdit ? "study:" + S.studyEdit.id : S.weightEdit ? "weight"
    : S.bpEdit ? "bp:" + (S.bpEdit.id || "") : S.anPerson ? "anp:" + S.anPerson.id
    : S.anCond ? "anc:" + S.anCond.pid + ":" + S.anCond.idx
    : S.anAlg ? "ana:" + S.anAlg.idx : S.anEv ? "ane:" + S.anEv.idx
    : S.repAdd ? "repadd" : S.miEdit ? "mi:" + S.miEdit.id : S.labEdit ? "lab:" + (S.labEdit.mid || "") + (S.labEdit.orig || "") : "";
}
// закрыть форму плавно (✕, «Отмена», затемнение, Escape): окно уходит, потом — перерисовка
function closeForm(){
  uiStackPop(document.querySelectorAll(".ui-modal"), 0, function(){
    set({ medEdit: null, vaxEdit: null, weightEdit: null, studyEdit: null, bpEdit: null, anPerson: null, anCond: null, anAlg: null, anEv: null, repAdd: null, miEdit: null, labEdit: null });
  });
}
// окно документа уходит плавно (✕, затемнение, Escape)
function closeDocAnim(){
  var w = document.querySelector(".ui-docwin");
  if (w) uiHide(w, function(){ closeDoc(); }); else closeDoc();
}

function medModal(){
  if (!S.medEdit) return "";
  var m = S.medEdit;
  var forms = ["таблетки","капсулы","раствор","спрей","мазь","капли","другое"];
  // Подстановка по образцу: у новой записи можно взять всё из прежней —
  // лекарства возвращаются в аптечку, а справку заново не собрать (это
  // веб-поиск скилла). Срок годности НЕ копируем: он у новой пачки свой.
  var tpl = "";

/* ── вкладка: исследования (МРТ / УЗИ / ЭКГ / рентген) ─────────────────────
   Отдельная сущность: результат тут не число и не «норма/не норма», а текст
   заключения. Поэтому ни бара, ни графика — карточка с датой, видом, областью
   и заключением; файл (PDF) кладётся в папку рядом, здесь только ссылка. */
var STUDY_KINDS = ["МРТ", "КТ", "УЗИ", "ЭКГ", "Рентген", "ЭНМГ", "Эндоскопия", "Другое"];

/* Поиск и фильтр по виду — как у биомаркеров: буква в поиске меняет только
   счётчик, полосу чипов и список (patchStudies), поле с фокусом не
   пересоздаётся. Поиск — по всему тексту карточки: вид, область, заключение,
   заметки, клиника, врач («флюорография» найдётся по области). */
function studiesModel(){
  var q = (S.stQuery || "").trim().toLowerCase();
  var all = S.studies.slice().sort(function(a, b){ return (b.date || "") < (a.date || "") ? -1 : 1; });
  var kinds = {};
  all.forEach(function(x){ kinds[x.kind || "Другое"] = (kinds[x.kind || "Другое"] || 0) + 1; });
  var filt = all.filter(function(x){
    if (S.stKind !== "all" && (x.kind || "Другое") !== S.stKind) return false;
    if (!q) return true;
    return [x.kind, x.area, x.conclusion, x.notes, x.clinic, x.doctor, uiDateNum(x.date)]
      .join(" ").toLowerCase().indexOf(q) >= 0;
  });
  return { q: q, all: all, filt: filt,
           kinds: STUDY_KINDS.filter(function(k){ return kinds[k]; }).map(function(k){ return { k: k, n: kinds[k] }; }) };
}
function studiesBelowHTML(M){
  var chip = function(key, label, on){
    return '<button class="fchip" data-act="study-kind" data-id="' + esc(key) + '" style="' + (on ? CHIP_ON : "") + '">' + esc(label) + '</button>';
  };
  var full = '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">' +
    chip("all", "Все", S.stKind === "all") +
    M.kinds.map(function(k){ return chip(k.k, k.k + " · " + k.n, S.stKind === k.k); }).join("") + '</div>';
  var active = S.stKind !== "all" ? chipOff(S.stKind, "study-kind", "all") : "";
  return filterBar(!!M.q, M.filt.length, active, full);
}
function studiesListHTML(M){
  if (!M.filt.length)
    return '<div style="padding:34px 8px; text-align:center; color:var(--text-faint); font-size:13.5px;">Ничего не найдено — измените фильтр или запрос.</div>';
  // Число привязанных показателей на карточку — один проход по labs.json.
  var nm = {};
  (bioList()).forEach(function(m){
    (m.series || []).forEach(function(p){ if (p.study) nm[p.study] = (nm[p.study] || 0) + 1; });
  });
  return M.filt.map(function(x){
    var title = (x.kind || "Исследование") + (x.area ? " · " + x.area : "");
    var excerpt = (x.conclusion || "").replace(/\s+/g, " ").trim();
    if (excerpt.length > 180) excerpt = excerpt.slice(0, 180) + "…";
    return '<div class="rep-row" data-act="study-open" data-id="' + esc(x.id) + '" style="display:flex; align-items:flex-start; gap:16px; background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--c-3); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; cursor:pointer;">' +
      '<span style="flex:none; width:38px; height:38px; border-radius:9px; background:var(--accent-bg); color:var(--c-3); display:grid; place-items:center; font-size:15px; font-weight:700;">▤</span>' +
      '<div style="min-width:0; flex:1;">' +
        '<div class="rep-title" style="font-family:var(--font-serif); font-size:17px; font-weight:600;">' + esc(title) + '</div>' +
        '<div style="font-size:12.5px; color:var(--text-muted); margin-top:3px; font-variant-numeric:tabular-nums;">' + esc(uiDateNum(x.date)) +
          (x.clinic ? ' · ' + esc(x.clinic) : '') + (x.doctor ? ' · ' + esc(x.doctor) : '') +
          (nm[x.id] ? ' · <span style="color:var(--c-3); font-weight:600;">показателей: ' + nm[x.id] + '</span>' : '') + '</div>' +
        (excerpt ? '<div style="font-size:13px; line-height:1.5; color:var(--text); margin-top:7px;">' + esc(excerpt) + '</div>'
                 : '<div style="font-size:12.5px; color:var(--text-faint); margin-top:7px;">Заключение не внесено.</div>') +
      '</div>' +
      // Кнопка, а не надпись: делегат берёт БЛИЖАЙШИЙ [data-act], так что клик
      // по ней открывает файл, а не панель карточки.
      (x.file ? '<button class="ui-btn ghost sm" data-act="study-file" data-id="' + esc(x.id) + '" style="flex:none; white-space:nowrap;">Файл ↗</button>' : '') +
    '</div>';
  }).join("");
}

/* ── вкладка: анамнез (anamnesis.json, health-anamnesis@1) ───────────────────
   Только факты из файла: без выводов, флагов риска и связи с биомаркерами.
   Правка — на странице (write-API, base_hash), как у прививок; писатель — страница. */
var AN_REL = { mother:["Мама",0], father:["Папа",0], brother:["Брат",1], sister:["Сестра",1],
  son:["Сын",1], daughter:["Дочь",1], grandmother:["Бабушка",2], grandfather:["Дедушка",2],
  "great-grandmother":["Прабабушка",3], "great-grandfather":["Прадедушка",3],
  aunt:["Тётя",2], uncle:["Дядя",2], cousin:["Двоюродный родственник",3] };
var AN_GEN = { mother:1, father:1, brother:1, sister:1, son:1, daughter:1, grandmother:2, grandfather:2,
  aunt:2, uncle:2, "great-grandmother":3, "great-grandfather":3, cousin:3 };
var AN_DEGREE = { mother:1, father:1, brother:1, sister:1, son:1, daughter:1, grandmother:2, grandfather:2,
  aunt:2, uncle:2, "great-grandmother":3, "great-grandfather":3, cousin:3 };
var AN_GROUPS = [["cardio","Сердце и сосуды"],["lipid","Липиды"],["metabolic","Обмен веществ"],["onco","Онкология"],
  ["kidney","Почки"],["endocrine","Эндокринная система"],["digestive","Пищеварение"],["neuro","Неврология и психика"],["other","Прочее"]];
function anRelTitle(f){
  var r = (AN_REL[f.relation] || [f.relation || "Родственник"])[0];
  var by = f.side === "maternal" ? " по маме" : f.side === "paternal" ? " по папе" : "";
  // «Двоюродный родственник» + сторона читается плохо, но сторона всё же нужна
  return r + by;
}
function anOrder(f){
  var side = (f.relation === "mother" || f.relation === "father") ? 0 : f.side === "maternal" ? 1 : f.side === "paternal" ? 2 : 3;
  return [side, AN_GEN[f.relation] || 9];
}
function anSorted(){
  return S.anamnesis.family.map(function(f, i){ return { f: f, i: i, o: anOrder(f) }; })
    .sort(function(a, b){ return a.o[0] - b.o[0] || a.o[1] - b.o[1] || a.i - b.i; })
    .map(function(x){ return x.f; });
}
function anOnset(c){
  if (c.onset_age != null && c.onset_age !== "") return "с " + c.onset_age + " лет";
  return c.onset_note || "";
}
function anYears(f){
  if (f.born == null && f.died == null) return "";
  return (f.born != null ? f.born : "?") + (f.died != null ? "–" + f.died : "");
}
function anCondHTML(c, pid, idx){
  var tags = [];
  if (c.kind === "surgery") tags.push("операция");
  if (c.certainty === "hearsay") tags.push("со слов");
  if (c.certainty === "guess") tags.push("предположительно");
  var on = anOnset(c);
  var meta = [c.value || "", on].filter(Boolean).join(" · ");
  return '<div class="ui-row base" style="--cols:minmax(0,1fr) auto;">' +
    '<div><div class="ui-text"><b>' + esc(c.name || "") + '</b>' + (meta ? ' <span class="ui-sub">' + esc(meta) + '</span>' : '') + '</div>' +
      (c.note ? '<div class="ui-note">' + esc(c.note) + '</div>' : '') + '</div>' +
    '<div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center;">' +
      tags.map(function(t){ return '<span class="ui-tag">' + esc(t) + '</span>'; }).join("") +
      (anWritable() ? '<button class="ui-btn plain sm" data-act="an-cedit" data-id="' + esc(pid + "|" + idx) + '" aria-label="Изменить запись" title="Изменить">Изменить</button>' +
        '<button class="ui-btn danger sm" data-act="an-cdel" data-id="' + esc(pid + "|" + idx) + '" aria-label="Удалить запись" title="Удалить">✕</button>' : '') +
    '</div></div>';
}
function anPersonHTML(f){
  var name = anRelTitle(f) + (f.name ? " · " + f.name : "");
  var yrs = anYears(f);
  var body;
  if (f.unknown) body = '<div class="ui-sub" style="padding:8px 0 2px;">Сведений нет</div>';
  else if (!(f.conditions || []).length) body = '<div class="ui-sub" style="padding:8px 0 2px;">Болезней не известно</div>';
  else body = f.conditions.map(function(c, i){ return anCondHTML(c, f.id, i); }).join("");
  var extra = [];
  if (f.died != null || f.death_cause) extra.push("умер(ла)" + (f.death_cause ? ": " + f.death_cause : ""));
  return '<section class="ui-card acc" style="min-width:0;">' +
    '<div style="display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;"><h2 class="ui-h2" style="margin:0;">' + esc(name) + '</h2>' +
      (yrs ? '<span class="ui-sub">' + esc(yrs) + '</span>' : '') + '</div>' +
    (extra.length ? '<div class="ui-sub">' + esc(extra.join(" · ")) + '</div>' : '') +
    (f.note ? '<div class="ui-note" style="margin-top:4px;">' + esc(f.note) + '</div>' : '') +
    '<div style="margin-top:6px;">' + body + '</div>' +
    (anWritable() ? '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;">' +
      (f.unknown ? '' : '<button type="button" class="ui-btn" data-act="an-cadd" data-id="' + esc(f.id) + '">＋ Добавить запись</button>') +
      '<button type="button" class="ui-btn ghost" data-act="an-edit" data-id="' + esc(f.id) + '">Редактировать</button>' +
      '<button type="button" class="ui-btn danger" data-act="an-del" data-id="' + esc(f.id) + '">Удалить</button></div>' : '') +
    '</section>';
}
function anDiseaseHTML(){
  var by = {};
  anSorted().forEach(function(f){
    (f.conditions || []).forEach(function(c){
      var g = by[c.group] ? c.group : (AN_GROUPS.some(function(x){ return x[0] === c.group; }) ? c.group : "other");
      var key = (c.name || "").trim().toLowerCase();
      (by[g] = by[g] || {});
      (by[g][key] = by[g][key] || { name: c.name, who: [] }).who.push({ f: f, c: c });
    });
  });
  var out = "";
  AN_GROUPS.forEach(function(g){
    var d = by[g[0]]; if (!d) return;
    out += '<div class="ui-sechead"><h3>' + esc(g[1]) + '</h3><span class="ui-rule"></span></div>';
    out += Object.keys(d).map(function(k){
      var it = d[k];
      return '<section class="ui-card" style="min-width:0; margin-bottom:10px;"><h2 class="ui-h2" style="margin:0 0 4px;">' + esc(it.name) + '</h2>' +
        it.who.map(function(w){
          var deg = AN_DEGREE[w.f.relation];
          var meta = [deg ? deg + "-я степень" : "", anOnset(w.c), w.c.value || "",
            w.c.kind === "surgery" ? "операция" : "", w.c.certainty === "hearsay" ? "со слов" : w.c.certainty === "guess" ? "предположительно" : ""].filter(Boolean).join(" · ");
          return '<div class="ui-row base" style="--cols:minmax(0,1fr) auto;"><div class="ui-text">' + esc(anRelTitle(w.f)) + (w.f.name ? ' · ' + esc(w.f.name) : '') + '</div>' +
            '<div class="ui-sub" style="text-align:right;">' + esc(meta) + '</div></div>';
        }).join("") + '</section>';
    }).join("");
  });
  return out || '<div class="ui-sub">Болезней в записях нет.</div>';
}
function anamnesisText(){
  var parts = anSorted().map(function(f){
    var t = anRelTitle(f) + (f.name ? " (" + f.name + ")" : "");
    if (f.unknown) return t + ": сведений нет.";
    if (!(f.conditions || []).length) return t + ": болезней не известно.";
    return t + ": " + f.conditions.map(function(c){

/* ── связь исследование ↔ биомаркеры ─────────────────────────────────────
   Ссылка хранится ОДНОЙ стороной: в точке labs.json — series[i].study = id
   исследования из studies.json. Обратное направление («показатели этого
   исследования») страница вычисляет здесь, поэтому рассинхрона двух сторон
   не бывает. У большинства точек ссылки нет — обычные анализы крови не
   привязаны ни к какому исследованию, и это норма, а не пробел в данных. */
function studyById(id){ return S.studies.filter(function(y){ return y.id === id; })[0]; }
function studyMetrics(id){
  var out = [];
  (bioList()).forEach(function(m){
    (m.series || []).forEach(function(p, i){ if (p.study === id) out.push({ m: m, i: i }); });
  });
  return out;
}
// Короткое имя исследования для кнопок-ссылок: «вид · область». У вида

function studyShort(x){

/* Мини-график показателя внутри исследования: вся история по времени,
   точка ЭТОГО исследования выделена. Ось X — дата (см. sparkPath). */
function miniTrend(m, i, from){
  var pts = [];
  m.series.forEach(function(p, k){ if (typeof p.value === "number" && (!from || p.date >= from)) pts.push({ d: p.date, v: p.value, hi: k === i }); });
  if (pts.length < 2) return "";
  var W = 150, H = 34, P = 4;
  var vs = pts.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  if (mx === mn){ mx += 1; mn -= 1; }
  var t0 = tms(pts[0].d), ts = (tms(pts[pts.length - 1].d) - t0) || 1;
  var xy = pts.map(function(p){
    return { x: r1(P + (tms(p.d) - t0) / ts * (W - 2 * P)), y: r1(P + (1 - (p.v - mn) / (mx - mn)) * (H - 2 * P)), hi: p.hi };
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:min(150px,26vw); height:34px; flex:none; display:block;" aria-hidden="true">' +
    '<path d="M' + xy.map(function(q){ return q.x + " " + q.y; }).join(" L") + '" fill="none" stroke="var(--text-faint)" stroke-width="1.5"></path>' +
    xy.map(function(q){
      return '<circle cx="' + q.x + '" cy="' + q.y + '" r="' + (q.hi ? 4.5 : 2.5) + '" fill="' + (q.hi ? "var(--c-3)" : "var(--text-faint)") + '"></circle>';
    }).join("") + '</svg>';
}
// Соседние по времени измерения того же показателя.
function neighbourText(m, i){
  var val = function(p){ return (p.value != null ? trim(p.value) : (p.text || "—")) + (p.unit ? " " + p.unit : ""); };
  var prev = m.series[i - 1], next = m.series[i + 1];
  var parts = [];
  // «раньше/позже», не «до/после»: «до 79» читалось как «вплоть до 79».
  if (prev) parts.push("раньше: " + val(prev) + " · " + uiDateNum(prev.date));
  if (next) parts.push("позже: " + val(next) + " · " + uiDateNum(next.date));
  return parts.length ? parts.join("   ") : "единственное измерение";
}

/* Панель хронической болезни: связанные показатели «с начала болезни → сейчас» (§13). Только факты и разница, без оценки. */
var AN_PCT_IDS = ["vitals_weight", "vitals_bmi", "body_weight", "body_bmi", "body_waist", "body_fat_pct", "body_fat_mass"];
// Модель строки: точка отсчёта, последняя точка, смена «норма ↔ вне нормы»; null — нет замеров после начала болезни.
function anMkModel(id, h){
  var m = anMkCatalog().filter(function(x){ return x.id === id; })[0];
  var pts = m ? (m.series || []).filter(function(p){ return p.date && p.date.length >= 10 && p.value != null; })
    .sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }) : [];
  var s0 = anBound(h.start, false), start = null, i;
  var res = { id: id, m: m, name: m ? m.name : "Показатель не найден", pts: pts };
  if (!pts.length) return res;
  var now = pts[pts.length - 1];
  if (anDayNum(now.date.slice(0, 10)) < s0) return res;
  for (i = 0; i < pts.length; i++) if (anDayNum(pts[i].date.slice(0, 10)) < s0) start = pts[i];
  res.pre = !!start;
  if (!start) start = pts[0];
  res.start = start; res.now = now; res.two = start !== now;
  var out = function(p){ return p.status === "high" || p.status === "low"; };
  // смена статуса — только когда норма известна у обеих точек («без референса» не сравнивается)
  var known = function(p){ return p.status === "norm" || out(p); };
  if (res.two && known(start) && known(now) && out(start) !== out(now)) res.change = out(now) ? (now.status === "high" ? "стал выше нормы" : "стал ниже нормы") : "вернулся в норму";
  return res;
}
function anMkRow(r){
  var m = r.m, u = m.unit || "", start = r.start, now = r.now;
  var row = 'display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; border:0; border-top:1px solid var(--border); padding:11px 2px; font-family:inherit; color:var(--text); cursor:pointer;';
  var val = function(p){ return trim(p.value) + (u ? " " + u : ""); };
  var cap;
  if (r.two){
    var dv = r1(now.value - start.value), sg = dv > 0 ? "+" : dv < 0 ? "−" : "";
    var pct = "";
    if (AN_PCT_IDS.indexOf(r.id) >= 0 && start.value){
      var pv = Math.round(dv / start.value * 100);
      pct = " (" + (pv > 0 ? "+" : pv < 0 ? "−" : "") + Math.abs(pv) + "%)";
    }
    cap = (r.pre ? "с начала болезни: " : "первый замер после начала: ") + val(start) + " · " + uiDateNum(start.date) + " · " +
      sg + trim(Math.abs(dv)) + (u ? " " + u : "") + pct + (r.change ? " · " + r.change : "");
  } else cap = "единственный замер";
  var out = now.status === "high" || now.status === "low";
  var old = (Date.now() - tms(now.date.slice(0, 10))) / 86400000 > 365;
  var gi = m.series.indexOf(now);
  return '<button type="button" data-act="an-mk-open" data-id="' + esc(r.id) + '" data-an-mk-row style="' + row + '">' +
    '<div style="min-width:0; flex:1;">' +
      '<div style="font-size:13px; font-weight:600;">' + esc(m.name) + '</div>' +
      '<div data-an-mk-cap style="font-size:11.5px; color:var(--text-faint); margin-top:3px; font-variant-numeric:tabular-nums;">' + esc(cap) + '</div></div>' +
    '<span style="flex:none; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;">' +
      '<span style="font-size:14px; font-weight:600; color:' + (out ? statusColor(now.status) : "var(--text)") + ';">' + esc(trim(now.value)) + '</span>' +
      (u ? ' <span style="font-size:11px; color:var(--text-faint);">' + esc(u) + '</span>' : '') +
      '<span data-an-mk-date style="display:block; font-size:10.5px; color:var(--text-faint);">' + esc(uiDateNum(now.date)) + (old ? ' · больше года назад' : '') + '</span></span>' +
    (r.two ? miniTrend(m, gi, start.date) : '') +
    '<span style="flex:none; color:var(--c-3); font-size:13px;">→</span></button>';
}
function chronicPane(h, i){

  var dl = [["Даты", anPeriod(h)], ["Статус", AN_STATUS_RU[h.status] || ""], ["Лечение", h.treatment]]
    .filter(function(p){ return p[1]; })
    .map(function(p){ return '<dt style="color:var(--text-muted);">' + p[0] + '</dt><dd style="margin:0;">' + esc(p[1]) + '</dd>'; }).join("");
  var mk = h.markers || [];
  var body =
    '<dl style="display:grid; grid-template-columns:max-content 1fr; gap:10px 18px; font-size:13.5px; margin:0;">' + dl + '</dl>' +
    (h.note ? '<div style="font-size:13.5px; line-height:1.6; color:var(--text-muted); margin-top:12px; white-space:pre-wrap; overflow-wrap:anywhere;">' + esc(h.note) + '</div>' : '') +

    H3 + 'Связанные показатели · ' + mk.length + '</h3>' +
    (function(){
      var ms = mk.map(function(id){ return anMkModel(id, h); });
      var has = ms.filter(function(r){ return r.now; }), none = ms.filter(function(r){ return !r.now; });
      has = has.filter(function(r){ return r.change; }).concat(has.filter(function(r){ return !r.change; }));
      return '<div style="display:flex; flex-direction:column;">' + has.map(anMkRow).join("") + '</div>' +
        (none.length ? '<div data-an-mk-none style="font-size:12px; color:var(--text-faint); border-top:1px solid var(--border); padding:11px 2px;">Нет замеров после начала болезни: ' +

var ST_SLOT = null, ST_QUIET = false, ST_MAX = 20 * 1024 * 1024;
function stSlot(){
  if (!ST_SLOT) ST_SLOT = uiFileSlot({ key: "study", id: "study-file", label: "Файл исследования", need: false,
    accept: ".pdf,.jpg,.jpeg,.png,.heic,.heif,application/pdf,image/*",
    hint: "PDF, JPEG, PNG или HEIC, до 20 МБ. Без файла — только ручное заключение ниже.",
    onChange: function(f){
      if (ST_QUIET || !f || f.size <= ST_MAX) return;
      ST_QUIET = true; try { ST_SLOT.clear(); } finally { ST_QUIET = false; }
      set({ saveNote: "Файл больше 20 МБ — сожмите или разделите." });
    } });
  return ST_SLOT;
}
function stSlotReset(){ if (ST_SLOT){ ST_QUIET = true; try { ST_SLOT.clear(); } finally { ST_QUIET = false; } } }
function stMountSlot(){
  var host = document.getElementById("study-slot-host");
  if (host) host.appendChild(stSlot().node);
}
function fileB64(f){
  return new Promise(function(ok, bad){
    var r = new FileReader();
    r.onload = function(){ ok(String(r.result).split(",")[1] || ""); };
    r.onerror = function(){ bad(new Error("не прочитать файл")); };
    r.readAsDataURL(f);
  });
}
function uploadFail(res){
  if (res.net) return "Нет связи с сервером — файл не загружен, исследование не сохранено.";
  if (res.st === 413) return "Файл больше 20 МБ — исследование не сохранено.";
  if (res.st === 400) return "Файл не принят: " + ((res.j && res.j.detail) || "формат не распознан") + ". Исследование не сохранено.";
  return hdFail(res, "файл");
}

/* ── запись со страницы: отчёт .md и справка маркера (POST /api/hd/report, /api/hd/marker-info) ───────────
   Форму проверяет сервер — теми же модулями скилла health-labs (validate_report.check, validate_labs_info.merge_info);
   страница только показывает его ответ. Доступны при любом режиме «с ИИ / без ИИ». */
function hdPost(path, body){
  return authFetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { st: r.status, j: j }; }); })
    .catch(function(){ return { net: true }; });
}
function hdFail(res, what){
  if (res.net) return "Нет связи с сервером — " + what + " не сохранён.";
  if (res.st === 401 || res.st === 403) return "Нет прав на запись — войдите заново.";
  if (res.st === 503) return "Сервер не видит модуль проверки: обновите контейнер hub-api (docker compose up -d hub-api).";
  if (res.st === 413) return "Слишком большое тело запроса.";
  return "Не удалось сохранить (код " + res.st + ")" + (res.j && res.j.detail ? ": " + res.j.detail : ".");
}
function hdAlert(items, kind){
  return !items || !items.length ? "" : '<div class="ui-alert ' + (kind || "") + ' tight" style="grid-column:1 / -1;"><ul style="margin:0; padding-left:18px;">' +
    items.map(function(t){ return "<li>" + esc(t) + "</li>"; }).join("") + '</ul></div>';
}

    hint: "Или вставьте текст ниже.",
    onChange: function(f){
      if (REP_QUIET || !S.repAdd || !f) return;
      if (f.size > 1048576){ S.repAdd.errs = ["Файл больше 1 МБ — это не отчёт."]; render(); return; }
      f.text().then(function(t){
        if (!S.repAdd) return;
        S.repAdd.text = t; S.repAdd.errs = []; S.repAdd.warns = [];
        var m = /^\d{4}-\d{2}-\d{2}-(.+)\.md$/i.exec(f.name);
        if (m && !S.repAdd.topic) S.repAdd.topic = m[1];
        render();
      });
    } });
  return REP_SLOT;
}

function repSend(overwrite){
  var r = S.repAdd;
  r.busy = true; r.errs = []; r.warns = []; render();
  hdPost("report", { topic: r.topic, content: r.text, overwrite: !!overwrite }).then(function(res){
    if (!S.repAdd) return;
    r.busy = false;
    if (res.st === 200){
      var name = res.j.name;
      REP_QUIET = true; try { if (REP_SLOT) REP_SLOT.clear(); } finally { REP_QUIET = false; }
      S.repAdd = null;
      S.saveNote = null; S.saveInfo = res.j.status === "same" ? "Такой отчёт уже лежит: " + name : "Отчёт сохранён: " + name;
      loadReports().then(function(list){ setReports(list); delete S.repMd[name]; render(); loadReportHeads(); });
      render();
      return;
    }
    if (res.st === 409 && res.j && res.j.error === "exists"){
      render();
      uiConfirm({ title: "Заменить отчёт?", name: res.j.name, text: "Отчёт с таким именем уже есть, а текст другой.\nПрежняя версия останется в .versions/ на сервере.",
                  ok: "Заменить", danger: false }).then(function(ok){ if (ok && S.repAdd) repSend(true); });
      return;
    }
    if (res.st === 400 && res.j && (res.j.errors || res.j.detail)){ r.errs = res.j.errors || [res.j.detail]; r.warns = res.j.warnings || []; }
    else r.errs = [hdFail(res, "отчёт")];
    render();
  });
}

/* Запись labs.json: сервер пересчитывает статусы и производные поля, поэтому после 200 файл читается заново. */
function labsSend(doc, form){
  if (form){ form.busy = true; form.err = ""; render(); }
  else { S.saving = true; S.saveNote = null; S.saveInfo = null; render(); }
  var done = function(msg){
    if (form){ form.busy = false; form.err = msg; } else { S.saveNote = msg; }
    S.saving = false; render();
  };
  postSave("labs", doc, S.hash.labs).then(function(res){
    if (res.net) return done("Нет связи с сервером — точка не сохранена.");
    if (res.st === 200) return apiGet("labs").then(function(fresh){
      S.labs = fresh; S.labEdit = null; S.saving = false; S.saveNote = null; S.saveInfo = "Сохранено."; S.paneGen++; render();
    }, function(){ done("Сохранено, но файл не перечитался — нажмите «Обновить»."); });
    if (res.st === 403 && res.j && res.j.error === "ai_mode on")
      return done("Ручная запись анализов — только при выключенном ИИ (режим «без ИИ»). При включённом их вносит скилл health-labs.");
    if (res.st === 409) return done("Анализы изменились с другого устройства или их правил скилл. Закройте окно и нажмите «Обновить».");
    if (res.st === 400) return done("Не принято: " + ((res.j && res.j.detail) || ""));
    done(hdFail(res, "точка"));
  });
}

/* Уход на вход и страховка от петли — общий uiGoLogin (ui-kit): если мы только

function goLogin(){

      : "Вход выполнен, но данные всё равно не отдаются — значит, дело не в пароле. " +

/* ── набранное в открытой форме переживает перерисовку ──────────────────────
   render() пересобирает весь документ, а поля окон ввода рисуются из состояния
   (S.studyEdit и т.п.), в которое набранное не пишется до «Сохранить». Поздняя
   перерисовка (данные пришли после открытия окна, фон, смена режима) отдавала
   бы полям прежние значения. Перед пересборкой снимаем то, что человек изменил
   (значение ≠ записанному в разметке; скрытые поля — как есть), после — возвращаем в те же поля. Если
   сама разметка поля при этом сменилась (состояние поменяли намеренно, например
   «Заполнить по прежнему») — набранное не трогаем. */
function formKeep(){
  var out = [];
  var els = document.querySelectorAll(".ui-modal input[id], .ui-modal textarea[id]");
  for (var i = 0; i < els.length; i++){
    var e = els[i], t = e.type;
    if (t === "file" || t === "button" || t === "submit" || e.classList.contains("ui-select-q")) continue;
    if (t === "hidden" && e.hasAttribute("data-act")) continue;   // выбор с действием (подстановка): состояние ведёт само действие
    if (t === "checkbox" || t === "radio"){
      if (e.checked !== e.defaultChecked) out.push({ id: e.id, chk: e.checked, dchk: e.defaultChecked });
    } else if (t === "hidden"){
      // скрытые поля (выбор из списка ui-kit, ISO-дата): их value и есть атрибут, «записанное» не отличить — берём как есть
      out.push({ id: e.id, v: e.value, sel: !!e.closest(".ui-select") });
    } else if (e.value !== e.defaultValue){
      out.push({ id: e.id, v: e.value, d: e.defaultValue });
    }
  }
  return out;
}
function formRestore(kept){
  kept.forEach(function(k){
    var e = document.getElementById(k.id);
    if (!e) return;
    if (k.chk !== undefined){ if (e.defaultChecked === k.dchk) e.checked = k.chk; return; }
    if (e.value === k.v || (k.d !== undefined && e.defaultValue !== k.d)) return;
    if (k.sel){
      var o = e.closest(".ui-select").querySelector('.ui-opt[data-value="' + String(k.v).replace(/["\\]/g, "\\$&") + '"]');
      if (o){ uiSelectPick(o); return; }
    }
    e.value = k.v;
  });
}

/* ── сборка страницы ────────────────────────────────────────────────────── */
function render(){
  var app = document.getElementById("app");
  var fk = formKey();
  S.formEnter = !!fk && fk !== S._lastForm;
  var active = document.activeElement;
  var aid = active && active.id, ss = null, se = null;
  try { ss = active.selectionStart; se = active.selectionEnd; } catch(e){}
  // та же форма остаётся открытой — набранное в ней переживёт пересборку (formKeep/formRestore)
  var kept = fk && fk === S._lastForm ? formKeep() : null;

  document.documentElement.setAttribute("data-theme", S.theme === "dark" ? "dark" : "light");
  // Фон-паттерн живёт в CSS-переменной --health-paper (paperBg): значение
  // считается один раз на тему. Кавычки внутри самого data-URI — минное поле
  // (двойные оборвали бы style="…", а сырой апостроф из xmlns='…' порвал бы
  // url('…') и фон молча стал бы none), поэтому экранирование осталось там же,
  // в paperBg, — просто выполняется теперь не на каждую перерисовку.
  var bg = paperBg();

  // topBar() собирается ОТДЕЛЬНО от inner: он липкий и должен лежать вне
  // .hub-wrap (у неё свои поля и max-width, панель обязана идти во всю ширину).
  // Нижняя навигация нужна только когда вкладки осмысленны: на экранах
  // «загружаю», «нужен вход» и ошибки переключать нечего.
  var inner, navOn = false;
  if (S.error === "auth") inner = masthead() + loginRedirectCard();
  else if (S.loading) inner = masthead() + '<div style="padding:60px 8px; text-align:center; color:var(--text-faint); font-size:13.5px;">Загружаю данные…</div>';
  else if (S.error) inner = masthead() + '<div style="margin:40px 0; padding:16px 18px; background:var(--err-bg); border:1px solid var(--err); border-radius:var(--radius); font-size:13.5px;">' + esc(S.error) + '</div>';
  else {
    var tab = S.tab === "markers" ? tabMarkers()
            : S.tab === "vax" ? tabVax()
            : S.tab === "meds" ? tabMeds()
            : S.tab === "studies" ? tabStudies()
            : S.tab === "anamnesis" ? tabAnamnesis()
            : S.tab === "reports" ? tabReports()
            : tabOverview();
    // Рельс и контент — соседи в .shell, заголовок раздела едет ВНУТРИ колонки
    // контента (scHead), а не отдельной шапкой на всю ширину — иначе рельс не
    // стартует от верхней панели, как на games.html/food.html. Нижняя навигация
    // телефона фиксирована, поэтому живёт вне .shell — рядом с панелями и .savebar
    // (см. app.innerHTML).
    inner = apiBanner() +
      '<div class="shell ui-shell">' + navRail() +
        '<div class="sc-content">' + scHead() + '<div class="tabpanel">' + tab + '</div></div>' +
      '</div>';
    navOn = true;
  }

  var footer = uiFootHTML({ page: "health", version: VERSION, src: "Synology · Health-Data" });

  // плашка сохранения — общая ui-kit (над панелью навигации и окнами форм)
  var savebar = S.saving ? uiSaveBarHTML({ text: "Сохраняю…", kind: "busy" })
    : (S.saveNote || S.saveInfo) ? uiSaveBarHTML({ text: S.saveNote || S.saveInfo, kind: S.saveNote ? "err" : "ok", dismiss: "dismiss-note" }) : "";

  // прокрутка панелей: перерисовка (переключатель «принимаю», правка) не сбрасывает её
  var paneScroll = uiStackKeepScroll("pane-b-", S.panes.length);
  app.innerHTML =
    '<div data-tab="' + S.tab + '" style="min-height:100vh; background-color:var(--bg); background-image:' + bg + '; background-size:300px 300px; color:var(--text); transition:background-color .25s, color .25s;">' +
      topBar() +
      // 936px контента + рельс (--ui-rail-w, ui-kit) + зазор 28 + поля 2×32:
      // колонка с данными сохранила ровно ту ширину, под которую свёрстаны
      // таблицы и карточки, рельс добавился сбоку, а не отъел место.
      '<div class="hub-wrap" style="max-width:calc(1028px + var(--ui-rail-w)); margin:0 auto; padding:26px 32px 72px;">' + inner + footer + '</div>' +
    '</div>' + panesHTML() + docModal() + medModal() + studyModal() + vaxModal() + weightModal() + bpModal() + anPersonModal() + anCondModal() + anAlgModal() + anEvModal() + repAddModal() + miModal() + labModal() + savebar;

  if (kept) formRestore(kept);
  // Восстановить фокус/каретку (страница перерисовывается целиком).
  if (aid){
    var el = document.getElementById(aid);
    if (el){ el.focus(); if (ss != null){ try { el.setSelectionRange(ss, se); } catch(e){} } }
  }
  // графики маркеров: под ширину панели (высота блока меняется — до возврата
  // прокрутки панели), прокрутка графика — к последним замерам / где была
  uiTimeChartMount(app);
  paneScroll();
  S.paneFresh = null;
  S._lastForm = fk;
  S.docFresh = false;
  var open = !!(S.panes.length || S.medEdit || S.vaxEdit || S.weightEdit || S.studyEdit || S.bpEdit || S.anPerson || S.anCond || S.anAlg || S.anEv || S.repAdd || S.miEdit || S.labEdit || S.doc);
  try { document.body.style.overflow = open ? "hidden" : ""; } catch(e){}
  // нижняя панель — одна на всю жизнь страницы (ui-kit): не пересоздаётся при
  // перерисовке (iOS дорисовывал пересоздаваемую fixed-панель посреди экрана)
  if (navOn) uiNavMount(navItems(), S.tab, NAV_O); else uiNavHide(true);
  syncStickyTop();
  // Читатель отчёта — слушатели прокрутки/оглавления после каждой перерисовки.
  uiReaderMountAll(app);
  repMountSlot();
  stMountSlot();
}

/* Реальная высота липкой панели раздела → CSS-переменная, от которой липнут
   заголовки блоков назначения (.md-ghead). Панель перерисовывается вместе со
   страницей и на узком экране ниже, чем на широком, поэтому меряем после
   каждого render() и на resize, а не считаем один раз константой. */
function syncStickyTop(){
  var t = document.querySelector(".ui-top");
  if (!t) return;
  document.documentElement.style.setProperty("--h-top-h", Math.round(t.getBoundingClientRect().height) + "px");
}
window.addEventListener("resize", syncStickyTop);

/* ── действия ───────────────────────────────────────────────────────────── */
function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }
function checked(id){ var el = document.getElementById(id); return !!(el && el.checked); }

function step(dir){
  var t = paneTop();
  var all = paneMarkers(t && t.list);
  if (!t || t.k !== "marker" || S.panes.length > 1) return;   // листание — только у панели из каталога
  var i = all.map(function(m){ return m.id; }).indexOf(headId(t.id));
  if (i < 0) return;
  i = Math.max(0, Math.min(all.length - 1, i + dir));
  set({ panes: [{ k: "marker", id: all[i].id, list: t.list }], paneGen: S.paneGen + 1 });
}

var ACTS = {

    set({ panes: [{ k: "marker", id: id, list: mm && mm.markers && mm.markers.length ? mm.markers.slice() : null }], panesOverDoc: true, paneFresh: 0, paneGen: S.paneGen + 1 }); },
  "med-open": function(id){ paneOpen("med", id); },

  "open-from-med": function(id){ panePush("marker", id); },
  /* «Сохранить отчёт» (вкладка «Отчёты») */
  "rep-add": function(){ set({ repAdd: { text: "", topic: "", errs: [], warns: [], busy: false }, panes: [] }); },
  "rep-save": function(){
    if (!S.repAdd || S.repAdd.busy) return;

    if (!S.repAdd.text.trim()){ S.repAdd.errs = ["Вставьте текст отчёта или выберите файл."]; render(); return; }
    if (!S.repAdd.topic){ S.repAdd.errs = ["Укажите тему — она войдёт в имя файла."]; render(); return; }
    repSend(false);
  },
  /* «Править справку» (карточка маркера): свежий файл с хэшем — и в окно */
  "mi-edit": function(id){
    var raw = markerList().filter(function(m){ return m.id === id; })[0];
    authFetch(API + "file?path=" + encodeURIComponent("biomarkers-info.json"), { cache: "no-store" }).then(function(r){
      if (r.status === 404) return { hash: null, doc: { info: {} } };
      if (!r.ok) throw new Error("код " + r.status);
      return r.json().then(function(j){ return { hash: j.hash, doc: JSON.parse(j.content) }; });
    }).then(function(f){
      var e = (f.doc.info || {})[id] || {};
      set({ miEdit: { id: id, name: raw ? raw.name : id, what: (e.what || []).join("\n\n"), up: e.up || "", down: e.down || "",

    if (!what.length || !m.up || !m.down){ m.err = "Заполните все три поля."; render(); return; }

    hdPost("marker-info", { id: m.id, what: what, up: m.up, down: m.down, base_hash: m.hash }).then(function(res){
      if (!S.miEdit) return;

        S.miEdit = null; S.saveNote = null; S.saveInfo = "Справка сохранена."; render(); return;
      }
      m.err = res.st === 409 ? "Справку изменили с другого устройства или скилл. Закройте окно и откройте заново."
        : res.st === 400 ? "Не принято: " + ((res.j && res.j.detail) || "") : hdFail(res, "справка");
      render();
    });
  },
  /* ручная точка анализа (только при ai_mode off; сервер проверяет сам) */
  "lab-add": function(id){
    var m = labsMarkerOf(S.labs, id);
