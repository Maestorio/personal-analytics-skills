key_risks:
- id: developer_leasing_credit_stress
  severity: HIGH
  note: '«Самолёт»: АКРА понизило до BBB(RU) с негативным прогнозом (публикация 08.10),
    НКР 15.10 — A.ru → BBB.ru (на три ступени, негатив): долг/OIBDA 4,1х → 5,9х, OIBDA/проценты
    2,8х → 1,7х, нарушен ковенант по одному кредиту, технические задержки платежей
    по облигациям в НРД, 15.10 одобрены поправки к трём договорам поручительства;
    БО-П20 28.09 оплачен частично и с задержкой (Т—Ж). 13.10 Эксперт РА понизил «Талан»
    (ООО «Созидание») до ruBB+. Параллельно дефолты и иски по ВДО: Оил Ресурс (иск
    10,5 млрд ₽), Открытие Холдинг (дефолт по 19-му купону БО-04, 15.10), Нафтатранс
    плюс; Сбербанк подал заявление о банкротстве «ЕвроТранса» (рассмотрение с 12.11).
    Экспозиция книги: девелоперы А101 + ПИК — 803 709 ₽ (10.4% облигаций; ПИК гасится
    19.11), лизинг (ПР-Лиз 2P2, ИнтЛиз1Р11, ИнтЛиз1Р08) — 330 820 ₽ (4.3%). Сами эмитенты
    книги в лентах за 13–16.10 не упоминались.'
- id: ofz_supply_overhang
  severity: HIGH
  note: '14.10 Минфин разместил 26251 (15,74%, 41,8 млрд ₽) и 26245 (16,77%, 73,5
    млрд ₽) при спросе 298 млрд ₽; премия к вторичке ≈7 б.п. — Минфин начал её давать,
    но минимальную; удовлетворено ≈38–39% спроса, доп. размещения ещё ≈46 млрд ₽.
    План 4К — 2,45 трлн ₽ (выполнено ≈8%), на 2027 — 7,7 трлн ₽ (smart-lab). Ведомости
    14.10: доходность ОФЗ перестала окупать риски; RGBI с начала года −5,8%. Длинные
    ОФЗ в книге: ОФЗ/>10 — 4 393 209 ₽ с ИИС-3 (19,0% облигаций); доходности за неделю
    −15…−20 б.п. (26248: 16,79 → 16,60%). Порог «брать на первичке при ≥17%» не достигнут.
    Давление вернётся, если премия на длинном конце вырастет.'
- id: cbr_rate_path_2310
  severity: MEDIUM
  note: 'Заседание ЦБ 23.10 (13:30 МСК, новый среднесрочный прогноз): консенсус —
    пауза 14% (7 из 8, Известия 15.10); снижений до конца 2026 не ждут, т.е. прежний
    сценарий «−25 б.п. в декабре» (консенсус ВТБ 29.09) устарел. Опрос аналитиков
    ЦБ 14.10: КС 2027 — 12,8% (+0,4 пп), 2028 — 10,8% (+0,8 пп); инфляция 2026 — 7,1%.
    Росстат 14.10: 6–12.10 +0,11% н/н, годовая 7,22%. Риск — жёсткий прогноз в пресс-релизе
    (диапазон средней КС на 2027 может быть поднят). Вероятности rate_cut_capital_gain
    снижены ещё на 0,05 (сумма с 08.10 — −0,10); взвешенная дюрация книги 1079 дн.'
- id: laimzaim_fns_mfo_credit_event
  severity: MEDIUM
  note: 'ФНС приостановила операции по счетам МФК «Лайм-Займ» 07.10 (доначисления
    НДС 1892,7 млн ₽). С 09.10 новых раскрытий не найдено; цена ЛаймЗайм04 восстановилась
    98,02 → 99,03. Погашение 30.10: ≈25,0 тыс ₽ (0,32% облигаций), общий платёж по
    выпуску — 759,9 млн ₽. Безубыточная вероятность дефолта ≈2% против моей 3% — решение
    по триггерам: претензия не урегулирована к 21.10; цена < 96; рейтинговое действие
    (Эксперт РА ruBB+, пересмотр в ноябре) или раскрытие о задержке; доплата ФНС сверх
    630 млн. Первичку (e-disclosure) не открывал. Сигнал для всей корзины КОРП/B+.'
