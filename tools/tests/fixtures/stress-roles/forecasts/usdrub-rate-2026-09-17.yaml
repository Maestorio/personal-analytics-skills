  scenario_id_format: short
  unit: "RUB/USD"
  l2_informative: false

  fact_anchor:
    value: 84.1732
    as_of: 2026-09-17
    source: "Банк России, официальный курс (установлен 2026-09-16 на 2026-09-17)"

  one_sided_cone: true
  cone_side:
    "2026-12-31": two_sided
    "2027-06-30": two_sided
    "2027-12-31": two_sided
    "2028-12-31": down
  counter_world_reason: >-
    На горизонте 2028-12-31 ни один из четырёх сценариев матрицы, включая самый мирный (Sc-D,
    "Большая сделка и разрядка"), не предполагает курс крепче сегодняшнего спота 84.17 — минимум
    диапазона (Sc-B, 84.73) уже выше факта. Все 4 найденных институциональных источника (ЦБ-опрос,
    SberCIB, Т-Инвестиции, Альфа-Банк) без исключения прогнозируют дальнейшее ослабление рубля, а не
    стабилизацию. Встречный мир (рубль крепче 84.17 к 2028) институционально не представлен в
    6-месячном окне поиска; структурные факторы (дефицит бюджета, санкционный навес, инфляционный
    дифференциал ставок) действуют во всех четырёх сценариях одновременно, различается только темп.
    На горизонтах 2026–2027 конус двусторонний — факт пока внутри диапазона сценариев.

  by_scenario:
