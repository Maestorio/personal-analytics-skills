      label: "Затяжная осада (tightening)"
      values:
        "2026-12-31": { central: 90.3, range: [80, 100] }
        "2027-06-30": { central: 95.0, range: [82, 108] }
        "2027-12-31": { central: 99.7, range: [85, 115] }
        "2028-12-31": { central: 101.8, range: [86, 120] }
      provenance: derived_from_marginal
      reasoning_summary: >
        Коэффициент ×1.098 к L1 marginal, унаследован (усреднён по двум горизонтам) из
        usdrub-rate-2026-07-29.yaml — сценарная привязка не пересобиралась заново в этом запуске.
      sources_used: []
      coverage_quality: DERIVED
    B:
      label: "Война на расколотом фронте (fragmentation)"
      values:
        "2026-12-31": { central: 75.2, range: [66, 84] }
        "2027-06-30": { central: 79.1, range: [68, 90] }
        "2027-12-31": { central: 83.0, range: [70, 96] }
        "2028-12-31": { central: 84.7, range: [70, 100] }
      provenance: derived_from_marginal
      reasoning_summary: >
        Коэффициент ×0.914, унаследован из 07-29. Non-monotone: несмотря на продолжение войны, эта
        ветка даёт САМЫЙ крепкий рубль из всех четырёх сценариев (ниже, чем даже Sc-D) — унаследованная
        форма из предыдущего снапшота, не пересчитана; см. предупреждение о non-monotone responder.
      sources_used: []
      coverage_quality: DERIVED
    C:
      label: "Замороженный конфликт под давлением (holding → relief)"
      values:
        "2026-12-31": { central: 83.0, range: [72, 94] }
        "2027-06-30": { central: 87.3, range: [75, 100] }
        "2027-12-31": { central: 91.6, range: [78, 106] }
        "2028-12-31": { central: 93.5, range: [79, 110] }
      provenance: derived_from_marginal
      reasoning_summary: "Коэффициент ×1.009, унаследован из 07-29 — близко к marginal."
      sources_used: []
      coverage_quality: DERIVED
    D:
      label: "Большая сделка и разрядка (relief)"
      values:
        "2026-12-31": { central: 80.7, range: [70, 92] }
        "2027-06-30": { central: 84.9, range: [73, 98] }
        "2027-12-31": { central: 89.1, range: [76, 104] }
        "2028-12-31": { central: 90.9, range: [77, 108] }
      provenance: derived_from_marginal
      reasoning_summary: >
        Коэффициент ×0.981, унаследован из 07-29. Non-monotone: снятие санкций не даёт самого крепкого
        рубля из четырёх сценариев (это Sc-B) — согласуется с явным bimodal-предупреждением матрицы
        (разморозка активов + отток может частично компенсировать приток капитала).
      sources_used: []
      coverage_quality: DERIVED

