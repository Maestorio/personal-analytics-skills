reclassification_note: >-
  GS/MS/JPM не имеют оценённого субдомена commodities-non-oil; взвешены через nearest-domain
  ny-rates (реальные ставки — главный драйвер золота). GS=HIGH (ny-rates), MS/JPM=MEDIUM.
  Прямой субдомен commodities-non-oil есть только у Westpac (MEDIUM, аудит покрывает именно
  золото) и World Bank CMO (MEDIUM, кросс-доменное включение по правилу смешанных доменов).
  HSBC/UBS/Citi/BofA/Wells Fargo/Commerzbank/ING/Deutsche Bank/Macquarie — не аудированы,
  вес 0 в консенсусе, показаны отдельно.

methodology_notes: >-
  Снимок методологически идентичен 07-29-v2: тот же вырожденный n=2-паттерн (равные веса)
  на mid/YE-2027, тот же fallback (equal-weight median по расширенному пулу), тот же DERIVED-
  композит на дальний горизонт. Изменения относительно 07-29-v2: (1) горизонт 2028-06-30
  заменён на 2028-12-31 и добавлен отдельный горизонт 2027-12-31 (запрос пользователя,
  4 горизонта вместо 3); (2) DERIVED-композит на 2028-12-31 теперь включает свежий прямой
  якорь HSBC (2028-2029, 09.07.2026) как недисконтированную точку, а не только экстраполяции
  из 2030-таргетов; (3) в пул добавлены 3 новых участника (ING, Deutsche Bank, Macquarie).
  Ключевое макрособытие после составления снапшота-предшественника: ФРС повысила ставку на
  25 б.п. до 3.75-4.00% 16.09.2026 (первый хайк с июля 2023, под новым председателем Кевином
  Уоршем; 16/18 членов FOMC сигнализируют продолжение цикла) — прямая реализация риска,
  который сам Goldman Sachs закладывал как downside-сценарий $4,400. US 10Y TIPS реальная
  доходность выросла до ~2.55% (10.09), уже выше заявленного GS порога "критическая
  чувствительность >2.5% устойчиво = минус $300-500". Ни один источник в пуле не пересмотрен
  после 16.09 — весь filtered consensus построен на до-хайковых данных (см. монитор
  bank-post-hike-revision и раздел "Свежее событие" в .md). Частичный структурный противовес:
  central bank net purchases Q2 2026 = 289т (+62% г/г, рекорд за 4 года, НБК 20-й месяц
  подряд) — опровергает майский стресс-тест-сценарий "Китай приостанавливает покупки".

