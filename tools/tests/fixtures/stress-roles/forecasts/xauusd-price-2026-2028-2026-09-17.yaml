vintage_adjustment:
  rule: "k = текущий таргет источника / его же предыдущий таргет на общем горизонте (YE/Q4-2026). Только наблюдаемые пересмотры; при отсутствии наблюдённого пересмотра k = 1.000"
  coefficients:
    goldman:   { k: 0.907, evidence: "YE-2026: $5,400 -> $4,900 (19.06.2026) — тот же наблюдённый коэффициент, что применён в снапшоте 07-29-v2; собственный пересмотр GS не менялся" }
    westpac:   { k: 0.946, evidence: "Q3-2026 avg: $4,560 (июль) -> $4,350 (20.08, -4.6%)" }
    jpmorgan:  { k: 0.750, evidence: "Q4-2026: $6,000 (09.06) -> $4,500 (03.07) — таблица 2027 JPM не обновлялась, коэффициент перенесён без изменений" }
    hsbc:      { k: 1.000, evidence: "не пересматривался с 09.07.2026 — текущий винтаж" }
    ubs:       { k: 1.000, evidence: "12M/YE-2027 таргет от 13.09.2026 — текущий винтаж, самая свежая публикация пула" }
    world_bank: { k: 1.000, evidence: "CMO не обновлялся с 28.04.2026; следующий выпуск — октябрь" }
    commerzbank: { k: 1.000, evidence: "собственного пересмотра не наблюдалось; цитирование низкого качества (вторичный агрегатор)" }

