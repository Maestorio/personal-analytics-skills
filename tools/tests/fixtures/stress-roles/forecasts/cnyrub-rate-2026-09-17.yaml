conditional_on_scenarios:
  method: nonlinear
  no_modal: true
  source_matrix: "scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml"
  scenario_id_format: short
  unit: "RUB/CNY"
  l2_informative: false
  derivation_formula: "CNY/RUB[sid] = USD/RUB[sid] / USD/CNY_base(horizon) × (1 + MOEX_premium[sid])"

  fact_anchor:
    value: 12.5457
    as_of: 2026-09-17
    source: "Официальный курс Банка России на 17.09.2026, cbr.ru/currency_base/daily"

  one_sided_cone: true
  cone_side:
    "2026-12-31": two_sided
    "2027-06-30": two_sided
    "2027-12-31": up
    "2028-12-31": up
  counter_world_reason: >-
    Конус двусторонний на первых двух горизонтах (Sc-B ниже спота), но становится
    односторонним вверх с 2027-12-31: все 4 сценария, включая Sc-B (крепчайший рубль
    набора), дают CNY/RUB выше сегодняшних 12.5457. Причина — структурный carry:
    дифференциал номинальных ставок РФ (14%→10%) и КНР (~2%) механически толкает
    кросс вверх при любом геополитическом исходе на горизонте >18 мес; это тот же
    механизм, что даёт usdrub-rate-2026-09-17 односторонний конус на 2028-12-31, но
    здесь он проявляется годом раньше из-за дополнительного (более слабого) канала
    укрепления юаня. Контр-мир существует, но требует стека трёх экстремальных
    допущений одновременно: (1) Sc-B, (2) USD/CNY у нижней границы диапазона
    чувствительности (6.40), (3) MOEX-премия глубже -5% (не -1.5% текущей шкалы D) —
    залповая конвертация экспортной выручки в юань сверх текущего наблюдаемого
    режима. Ни один источник не закладывает эту комбинацию как центральный сценарий.
    Off-axis downside отражён в нижних границах range у Sc-B/Sc-D и в monitoring.

  by_scenario:
    A:
      label: "Затяжная осада (война + ужесточение санкций)"
      values:
        "2026-12-31": { central: 14.33, range: [12.6, 16.0] }
        "2027-06-30": { central: 15.21, range: [13.3, 17.1] }
        "2027-12-31": { central: 16.06, range: [14.0, 18.1] }
        "2028-12-31": { central: 16.60, range: [14.4, 18.8] }
      provenance: derived_from_marginal
      sources_used: []
      coverage_quality: DERIVED
      methodology: { usd_rub: "90.3/95.0/99.7/101.8", usd_cny: "6.68/6.62/6.58/6.50 (base, единый по сценариям)", moex_premium_pct: 6.0 }
      reasoning_summary: >
        Максимум CNY/RUB — наследует слабейший рубль upstream (одностороннее ослабление
        USD/RUB во всех точках) и наибольшую премию юаня на MOEX (correspondent-давление
        на CN-банки при ужесточении санкций). Премия +6% перенесена из 07-29 без
        переоценки — механизм её раскрытия (санкции на банки-корреспонденты) не
        наблюдался ни в июле, ни сейчас (holding остаётся модальным на оси санкций).
      upstream_used:
        - { factor: usdrub_scenario_a, value: 90.3, unit: RUB/USD }
        - { factor: usdcny_base, value: 6.68, unit: CNY/USD }
        - { factor: moex_cny_premium_a, value: 6.0, unit: pct }
    B:
      label: "Война на расколотом фронте (война + фрагментация/снятие санкций)"
      values:
        "2026-12-31": { central: 11.31, range: [9.9, 12.7] }
        "2027-06-30": { central: 12.01, range: [10.5, 13.5] }
        "2027-12-31": { central: 12.68, range: [11.1, 14.3] }
        "2028-12-31": { central: 13.10, range: [11.4, 14.8] }
      provenance: derived_from_marginal
      sources_used: []
      coverage_quality: DERIVED
      methodology: { usd_rub: "75.2/79.1/83.0/84.7", usd_cny: "6.68/6.62/6.58/6.50 (base)", moex_premium_pct: 0.5 }
      reasoning_summary: >
        Минимум набора — крепчайший рубль (US снимает нефтяной cap → максимальный поток
        конвертируемой FX) при почти нулевой премии (фрагментация санкций слегка облегчает
        расчёты). Единственный сценарий, где на первых двух горизонтах кросс ниже спота;
        к 2027-12-31 даже этот мир пробивает спот вверх — carry-эффект берёт своё.
      upstream_used:
        - { factor: usdrub_scenario_b, value: 75.2, unit: RUB/USD }
        - { factor: usdcny_base, value: 6.68, unit: CNY/USD }
        - { factor: moex_cny_premium_b, value: 0.5, unit: pct }
    C:
      label: "Замороженный конфликт под давлением (перемирие + holding санкций)"
      values:
        "2026-12-31": { central: 12.43, range: [10.9, 13.9] }
        "2027-06-30": { central: 13.19, range: [11.5, 14.8] }
        "2027-12-31": { central: 13.92, range: [12.2, 15.6] }
        "2028-12-31": { central: 14.38, range: [12.5, 16.2] }
      provenance: derived_from_marginal
      sources_used: []
      coverage_quality: DERIVED
      methodology: { usd_rub: "83.0/87.3/91.6/93.5", usd_cny: "6.68/6.62/6.58/6.50 (base)", moex_premium_pct: 0.0 }
      reasoning_summary: >
        Продолжение текущего режима — премия ровно 0%, это калибровочный якорь всей шкалы
        (наблюдаемая сегодня премия -0.05% почти точно совпадает). Sc-C ближе всего к
        marginal на всех горизонтах — самый "средний" мир набора.
      upstream_used:
        - { factor: usdrub_scenario_c, value: 83.0, unit: RUB/USD }
        - { factor: usdcny_base, value: 6.68, unit: CNY/USD }
        - { factor: moex_cny_premium_c, value: 0.0, unit: pct }
    D:
      label: "Большая сделка и разрядка (перемирие + снятие санкций + разморозка активов)"
      values:
        "2026-12-31": { central: 11.90, range: [10.4, 13.4] }
        "2027-06-30": { central: 12.63, range: [11.0, 14.2] }
        "2027-12-31": { central: 13.33, range: [11.6, 15.0] }
        "2028-12-31": { central: 13.78, range: [12.0, 15.5] }
      provenance: derived_from_marginal
      sources_used: []
      coverage_quality: DERIVED
      methodology: { usd_rub: "80.7/84.9/89.1/90.9", usd_cny: "6.68/6.62/6.58/6.50 (base)", moex_premium_pct: -1.5 }
      reasoning_summary: >
        Снятие санкций уводит премию в дисконт (-1.5%) — юань теряет монополию расчётов,
        но рубль в этом мире не самый крепкий из четырёх (это Sc-B) — согласуется с
        non-monotone предупреждением матрицы для usdrub, унаследованным сюда.
      upstream_used:
        - { factor: usdrub_scenario_d, value: 80.7, unit: RUB/USD }
        - { factor: usdcny_base, value: 6.68, unit: CNY/USD }
        - { factor: moex_cny_premium_d, value: -1.5, unit: pct }

