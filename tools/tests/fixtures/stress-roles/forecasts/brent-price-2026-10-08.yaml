    - "Режим карты позиций 1.5A: Full-auto (тема в триггерах Hormuz/Иран perspective-maps §1.1, но карта по исходу цены Brent там отсутствует) — 3 лагеря по предпосылке о длительности сбоя в Заливе: prolonged / gradual / fast; без опоры на perspective-maps.md и аудиты; доля крупнейшего лагеря 0.56 < 0.70 → asymmetry_warning false"
    - "Смешение доменов commodity-agencies + global-banks(oil-forecast): IEA/OPEC не публикуют ценовых целей; World Bank (апрельский CMO, годовая средняя 2026) несопоставим; добавлены JPMorgan/Goldman/Morgan Stanley/Westpac"
    - "JPMorgan (HIGH oil-forecast) 17.09: 'впервые с начала конфликта у нас нет базового прогноза'; в консенсус 2026-12-31 включена только его оценка Dec-26 при текущих потоках (~$86, выведена из заметки: $7-8 выше прежних маркеров $80/$78); без неё weighted median 2026-12-31 = $100, confidence 0.40"
