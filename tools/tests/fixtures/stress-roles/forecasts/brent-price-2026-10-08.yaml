  scenario_id_format: short
  unit: "USD/bbl"
  l2_informative: false   # §18: весь by_scenario DERIVED — L2 не несёт независимой информации

  fact_anchor:
    value: 102.88
    as_of: 2026-10-08
    source: "TradingEconomics Brent (CFD), 2026-10-08; ICE Dec-26 фронт ~102.4 (oilprice.com, 07.10)"

  one_sided_cone: true
  cone_side:
    "2026-12-31": down
    "2027-06-30": down
    "2027-12-31": down
  counter_world_reason: >-
    Встречный мир (Brent выше текущего спота $102.88) существует и источниками подтверждён, но его
    драйвер лежит ВНЕ оси матрицы: Ормуз/Залив, а не Russia-West. EIA (06.10) даёт Q4-26 $104.69
    (выше спота), TradingEconomics-модель $106.6, Goldman — >$120 при дефиците Залива 4 млн б/с
    в 2027, BofA — $120-150 при новых повреждениях инфраструктуры; Dated Brent 02.10 торговался
    выше $120 при ICE ~$101. Отдельным ключом by_scenario он нереализуем: схема требует строго
    {A,B,C,D}. Поэтому off-axis upside внесён в верхнюю границу range всех четырёх сценариев
    ($120, не масштабируется дельтами — драйвер ортогонален оси) и в monitoring с side: up.
    Односторонность центров вниз — содержательный вывод: trust-взвешенная медиана ($90) держится
    на оценках 25.08-17.09, а единственный свежий источник (EIA) стоит у спота.

