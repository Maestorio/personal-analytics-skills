    - "2028-12-31: 0 свежих источников; единственный найденный 2028-ориентир Goldman '$80 к концу 2028' датирован 27.11.2025 (до войны в Заливе, >6 мес.) и не включён; WEO-2026 выходит 18.11.2026 — перезапуск после неё"
