conditional_on_scenarios:
  method: linear
  no_modal: true
  modal_flag: D1_no_modal_horizon_weighted
  source_matrix: "scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml"
  scenario_id_format: short
  translation_channel: cpi_floor_plus_buffer_linear
  translation_k: 1.0
  unit: percent_annual
  l2_informative: true
  l2_informative_note: >-
    Буфер измерен относительно Sc-C и переносит в L2 всю независимую геометрию upstream
    inflation_ru.by_scenario (не тавтология собственного L1) — тот же осознанный паттерн, что
    в 07-29 и в inflation-ru-2026-09-17.

  fact_anchor:
    value: 14.00
    as_of: 2026-09-11
    source: "Банк России, пресс-релиз 11.09.2026: ставка сохранена на 14,00% годовых https://www.cbr.ru/press/keypr/"

  one_sided_cone: true
  cone_side:
    "2026-12-31": two_sided
    "2027-06-30": two_sided
    "2027-12-31": down
    "2028-12-31": down
  counter_world_reason: >-
    На 2026-12-31 и 2027-06-30 конус двусторонний: верх диапазона Sc-A (15.325 и 15.3875) выше
    факта 14.00, низ Sc-D (12.425 и 12.0875) ниже — встречный мир (ставка выше факта) представлен
    внутри Sc-A range. На 2027-12-31 и 2028-12-31 конус односторонне вниз: даже верх Sc-A
    (14.75 и 11.85) остаётся ниже текущих 14.00 — многолетний цикл смягчения к нейтрали
    (собственный ориентир ЦБ на 2028: 8.0-9.0%) доминирует над сценарным разбросом на этих
    горизонтах. Встречный мир «ставка выше 14% через 15+ мес.» потребовал бы срыва функции
    реакции (фискальное доминирование) — отдельный falsifier, не сценарий матрицы.

  by_scenario:
    A:
      label: "Затяжная осада (война + единый/ужесточённый санкционный режим)"
      values:
        "2026-12-31": { central: 14.73, range: [14.13, 15.33] }
        "2027-06-30": { central: 14.69, range: [13.89, 15.39] }
        "2027-12-31": { central: 13.95, range: [13.15, 14.75] }
        "2028-12-31": { central: 10.85, range: [9.85, 11.85] }
      provenance: derived_from_upstream
      sources_used: []
      coverage_quality: DERIVED
      reasoning_summary: >
        floor(CPI_A+5.00) + буфер(h). Наследует худший инфляционный мир upstream (7.6/5.8/5.2/5.6).
        Единственный сценарий, где цикл смягчения фактически паузится и частично разворачивается
        на ближних горизонтах (14.73/14.69 — выше текущих 14.00), прежде чем на 2028 всё равно
        конвергировать к нейтрали.
      upstream_used:
        - { factor: inflation_ru, value: 7.6, unit: pct_yoy, horizon: "2026-12-31" }
        - { factor: inflation_ru, value: 5.8, unit: pct_yoy, horizon: "2027-06-30" }
        - { factor: inflation_ru, value: 5.2, unit: pct_yoy, horizon: "2027-12-31" }
        - { factor: inflation_ru, value: 5.6, unit: pct_yoy, horizon: "2028-12-31" }
    B:
      label: "Война на расколотом фронте (война + фрагментация/снятие санкций)"
      values:
        "2026-12-31": { central: 13.83, range: [13.23, 14.43] }
        "2027-06-30": { central: 13.49, range: [12.79, 14.19] }
        "2027-12-31": { central: 12.85, range: [12.25, 13.55] }
        "2028-12-31": { central: 9.45, range: [8.75, 10.25] }
      provenance: derived_from_upstream
      sources_used: []
      coverage_quality: DERIVED
      reasoning_summary: >
        Снятие нефтяного cap при продолжающейся войне — курсовой канал дезинфляционен относительно
        Sc-A, фискальный канал (ВПК-дефицит) остаётся проинфляционным. Второй сверху по ставке
        на всех горизонтах.
      upstream_used:
        - { factor: inflation_ru, value: 6.7, unit: pct_yoy, horizon: "2026-12-31" }
        - { factor: inflation_ru, value: 4.6, unit: pct_yoy, horizon: "2027-06-30" }
        - { factor: inflation_ru, value: 4.1, unit: pct_yoy, horizon: "2027-12-31" }
        - { factor: inflation_ru, value: 4.2, unit: pct_yoy, horizon: "2028-12-31" }
    C:
      label: "Замороженный конфликт под давлением (перемирие + holding санкций)"
      values:
        "2026-12-31": { central: 13.63, range: [13.13, 14.13] }
        "2027-06-30": { central: 13.19, range: [12.59, 13.79] }
        "2027-12-31": { central: 12.75, range: [12.25, 13.25] }
        "2028-12-31": { central: 9.25, range: [8.65, 9.85] }
      provenance: derived_from_upstream
      sources_used: []
      coverage_quality: DERIVED
      reasoning_summary: >
        By construction совпадает с L1 marginal на всех 4 горизонтах (буфер калиброван
        относительно C) — облако взвешенных источников (ЦБ/SberCIB/БКС) публикует в мире, де-факто
        близком к статус-кво Sc-C (модальный сценарий на h6, вес 0.42). Dominant implicit world.
      upstream_used:
        - { factor: inflation_ru, value: 6.5, unit: pct_yoy, horizon: "2026-12-31" }
        - { factor: inflation_ru, value: 4.3, unit: pct_yoy, horizon: "2027-06-30" }
        - { factor: inflation_ru, value: 4.0, unit: pct_yoy, horizon: "2027-12-31" }
        - { factor: inflation_ru, value: 4.0, unit: pct_yoy, horizon: "2028-12-31" }
    D:
      label: "Большая сделка и разрядка (мир + снятие санкций)"
      values:
        "2026-12-31": { central: 13.03, range: [12.43, 13.63] }
        "2027-06-30": { central: 12.79, range: [12.09, 13.49] }
        "2027-12-31": { central: 12.35, range: [11.75, 12.95] }
        "2028-12-31": { central: 8.85, range: [8.25, 9.45] }
      provenance: derived_from_upstream
      sources_used: []
      coverage_quality: DERIVED
      reasoning_summary: >
        Минимум на всех горизонтах — структурный канал (возврат конкуренции/поставок) плюс
        фискальный (сокращение военных расходов) дезинфляционны сильнее курсового эффекта
        разморозки активов.
      upstream_used:
        - { factor: inflation_ru, value: 5.9, unit: pct_yoy, horizon: "2026-12-31" }
        - { factor: inflation_ru, value: 3.9, unit: pct_yoy, horizon: "2027-06-30" }
        - { factor: inflation_ru, value: 3.6, unit: pct_yoy, horizon: "2027-12-31" }
        - { factor: inflation_ru, value: 3.6, unit: pct_yoy, horizon: "2028-12-31" }

