    direction: upward
    applicable_to: "все сценарии"
  cpi_minus_150bp:
    trigger: "CPI -1.5 п.п. от сценарного базиса"
    rate_shift: "-150 б.п. на всех горизонтах, ограничено нижней границей ориентира ЦБ на 2028 (8.0%)"
    direction: downward
    applicable_to: "все сценарии"
  pause_extension:
    trigger: "ЦБ держит паузу ещё 2+ заседания подряд (23.10 и 18.12 без снижения)"
