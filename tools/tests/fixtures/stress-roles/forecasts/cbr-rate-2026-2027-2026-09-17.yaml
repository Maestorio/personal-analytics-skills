forecast:
  date: 2026-09-17
  horizon: 2028-12-31
  horizons: ["2026-12-31", "2027-06-30", "2027-12-31", "2028-12-31"]
  domain: ru-macro
  topic: cbr-rate-2026-2027
  method: fca
  unit: percent_annual
  basis: "Ключевая ставка Банка России, % годовых, значение на дату"
  central_estimate: >
    Ключевая ставка ЦБ РФ, Layer 1 marginal: 13.625% к 2026-12-31 (weighted median, P10 13.50/P90
    13.75, n=3 взвешенных); ~13.19% к 2027-06-30 (линейная интерполяция между якорями, НЕ нативная
    FCA-точка); 12.75% к 2027-12-31 (вырожден, n=1 взвешенный, БКС); 9.25% к 2028-12-31 (DERIVED,
    0 взвешенных источников, midpoint официального коридора ЦБ 8.0-9.0% и медианы макроопроса
    10.0%). Факт: 14.00% подтверждены 11.09.2026 (пауза, попадание в модальный прогноз прошлого
    снапшота p=0.65). Следующее заседание — опорное 23.10.2026.
    L2 by_scenario (derived_from_upstream через inflation_ru, канал cpi_floor_plus_buffer):
    A 14.73/14.69/13.95/10.85 · B 13.83/13.49/12.85/9.45 · C 13.63/13.19/12.75/9.25 ·
    D 13.03/12.79/12.35/8.85. L2 EV (D1 no_modal, p_by_horizon-взвешенный): 13.85/13.32/12.88/9.57.
  confidence: 0.30
  source_coverage_score: 0.30
  confidence_note: >
    Итоговый скаляр — консервативная оценка по полному горизонту до 2028 (не механический вывод
    скрипта на одном горизонте). weighted_consensus.py на 2026-12-31 даёт 0.33 (share_HIGH=1/3,
    asymmetry_warning=true — камп-дистрибуция 100% монетаристская, только SberCIB+ЦБ). На
    2027-12-31 — 0.12 (anchor_share=1.00 капает confidence_by_horizon, единственный взвешенный
    источник БКС). 2027-06-30 и 2028-12-31 не гоняются через скрипт напрямую (интерполяция/DERIVED)
    — их confidence_by_horizon оценены вручную с явной пометкой ниже.
  confidence_by_horizon:
    "2026-12-31": 0.33
    "2027-06-30": 0.22
    "2027-12-31": 0.12
    "2028-12-31": 0.10
  anchor_share_by_horizon:
    "2026-12-31": 0.50
    "2027-06-30": null
    "2027-12-31": 1.00
    "2028-12-31": null
  upstream_snapshot:
    - factor: inflation_ru
      central_estimate: "L1 6.5/4.2/4.0/4.0 по горизонтам; by_scenario A 7.6/5.8/5.2/5.6 · B 6.7/4.6/4.1/4.2 · C 6.5/4.3/4.0/4.0 · D 5.9/3.9/3.6/3.6"
      confidence: 0.40
      forecast_date: 2026-09-17
      source_file: "forecasts/inflation-ru-2026-09-17.yaml"
    - factor: geopolitics_ru_west
      central_estimate: "D1 с весами по горизонту (не pure shell): h6 .28/.12/.42/.18, h12 .15/.15/.35/.35, h24=h30 .24/.16/.36/.24. Матрица 07-01, горизонт расширен 2026-09-17 до 2028-12-31"
      confidence: null
      forecast_date: 2026-07-01
      source_file: "scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml"
    - factor: cbr_reaction_function
      central_estimate: "CPI+500bp floor + буфер; буфер измерен относительно Sc-C (dominant implicit world): 2.125 / 3.8875 / 3.75 / 0.25 п.п. по горизонтам — немонотонен (пауза цикла на 2027, конвергенция к нейтрали на 2028)"
      confidence: 0.80
      forecast_date: 2026-04-27
      source_file: "domains/ru-macro/cbr-rf-2024-2025.md"
  notes:
    - "СОБЫТИЕ 11.09.2026: ЦБ сохранил ставку 14.00% (пауза). Совпадает с модальным прогнозом прошлого снапшота (predicted_p 0.65) — hit. Сигнал нейтральный: 'решения будут приняты в зависимости от динамики инфляции и инфляционных ожиданий', явного направления нет. ЦБ отмечает преобладание проинфляционных рисков."
    - "ЗАМЕДЛЕНИЕ ЦИКЛА СМЯГЧЕНИЯ: темп снижения L1 с 2026-12-31 к 2027-12-31 существенно медленнее, чем закладывал прошлый снапшот (07-29: 13.75→12.125 за 6 мес; сейчас 13.625→12.75 за 12 мес). Главный драйвер — БКС (Илья Фёдоров, 16.09.2026) явно пересмотрел прогноз-2027 ВВЕРХ с 11.5% до 12.5-13% при условии продолжения паузы 3-6 мес."
    - "ЕДИНСТВЕННЫЙ ВЗВЕШЕННЫЙ ИСТОЧНИК НА 2027-12-31 (anchor_share=1.00): та же структурная слабость, что и в 07-29 (там — на 2027-06-30). Проблема не устранена третий снапшот подряд — БКС остаётся единственным ру-sellside источником с MEDIUM+ trust на ru-rates-forecast, дающим точку на дальний горизонт."
    - "Т-ИНВЕСТИЦИИ И BLOOMBERG ECONOMICS НЕ АУДИРОВАНЫ: оба дают содержательные, разумные прогнозы (Т-Инв 13.5/11.5, Bloomberg 13.0/10.0), но 0 вес в consensus. Т-Инвестиции особенно приоритетен для аудита — крупный ру-sellside игрок, регулярно публикует по теме."
    - "КАРТА ЛАГЕРЕЙ §2.1: покрыт только Монетаристы (SberCIB + ЦБ как embodying институт). Структуралисты (ЦМАКП/ИНП РАН) — целевой поиск дал только методологическую статью ИНП РАН о координации ЦБ-Минфин без числовой позиции по ставке (Ведомости, 21.05.2026) — НЕ включено как источник. ВПК-реалисты (Промсвязьбанк/РСМД) — целевой поиск не дал прямой позиции по ставке. Оба Significant-лагеря помечены как gap. Радикальные критики (Делягин и др., Minority) — не включались, не обязательны."
    - "ПЕРЕВОД avg→point для ЦБ на 2026-12-31 (13.75) унаследован без изменений из 07-29 — официальный коридор средней ставки 2026 (14.5-14.6%) не пересматривался ни 11.09, ни после. Для 2027 (10.5-12.5% avg) и 2028 (8.0-9.0% avg) также без изменений с июля."
    - "L2 by_scenario derived_from_upstream (НЕ native_fca) — ни один из 3 взвешенных источников (ЦБ/SberCIB/БКС) не даёт явной привязки к geopolitics-осям. Буфер над floor_C калиброван per-horizon напрямую как L1(h)-floor_C(h), а НЕ интерполяцией самого буфера между 07-29 и текущим — это даёт точное совпадение Sc-C с L1 marginal на всех 4 горизонтах by construction."
    - "2027-06-30 — интерполированный (не нативный FCA) горизонт: линейная интерполяция L1 между 2026-12-31 (13.625) и 2027-12-31 (12.75) по времени (50%). Аналогично weighted_consensus.py конвенции в inflation-ru-09-17 для сценарных весов на непокрытых нативно горизонтах (интерполяция самих p_by_horizon весов между h12 и h24)."

