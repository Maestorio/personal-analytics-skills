    robustness: LOW
    sensitivity: high
    auto_checkable: false
  - id: mer-fallback-beyond-12mo
    text: "МЭР пригоден как единственный fallback-источник для горизонтов 2027-2028 несмотря на audit-запрет (06.07.2026) опоры на него ≥12 мес."
    robustness: LOW
