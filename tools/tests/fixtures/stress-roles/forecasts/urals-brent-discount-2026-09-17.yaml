    description: "Выход БКС/SberCIB со свежей числовой позицией по Urals-дисконту (открыт с 07-28, не закрыт 2.5 мес.)"
    source: "https://bcs-express.ru/"
    threshold: "публикация с явной числовой оценкой дисконта на 2026-2027"
    check_date: 2026-12-17
    impact: mixed
    severity: high
    auto_checkable: false
    side: both
  - id: urals-discount-narrow-below-10
    description: "Дисконт Urals к Brent сужается ниже $10/bbl (leading indicator сценария B из scenario-geopolitics-ru-west)"
    source: "scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml"
    threshold: "spread < $10/bbl (FOB basis)"
    check_date: 2027-06-30
    impact: supports
    severity: high
    auto_checkable: true
    side: down
  - id: graham-act-enforcement
    description: "Реальное применение дискреционных вторичных тарифов Graham Act (не только подпись закона)"
    source: "https://www.atlanticcouncil.org/dispatches/the-graham-sanctions-act-is-a-chance-to-punish-putin-heres-what-the-white-house-should-do-next/"
    threshold: ">=25% тарифа на топ-импортёров Urals -> сдвиг к Sc-A"
    check_date: 2027-06-30
    impact: invalidates
    severity: high
    auto_checkable: true
    side: up
  - id: fob-dap-basis-divergence
    description: "Сохраняется ли разрыв FOB-дисконт / DAP-Азия-премия (Ормузская военная премия за фрахт) или закрывается"
    source: "https://energyandcleanair.org/"
    threshold: "DAP-Китай возвращается к дисконту (не премии) в течение 2 мес. подряд"
    check_date: 2026-12-31
    impact: mixed
    severity: medium
    auto_checkable: true
    side: both
  - id: shadow-fleet-attrition
    description: "Выбытие теневого флота из-за санкций на дозаправку/страхование"
    source: "https://www.iea.org/reports/oil-market-report"
    threshold: ">=3 конфискации/квартал или падение морского экспорта >10% м/м"
    check_date: 2027-06-30
    impact: mixed
    severity: medium
    auto_checkable: false
    side: up

