    unit: "percent_gdp_annualized"
    as_of: 2026-09-09
    source: "Минфин РФ (YTD янв-авг 2026, линейная аннуализация 5.795 трлн / 8 мес. x 12)"
  one_sided_cone: true
  cone_side:
    "2026-12-31": two_sided
    "2027-12-31": down
    "2028-12-31": down
  counter_world_reason: "Ни один институциональный источник (включая наиболее пессимистичный World Bank и оппозиционный RE:Russia) не формулирует количественный сценарий ухудшения темпа сверх уровня 2026 года на 2027-2028; консолидация ожидается всеми лагерями, расходится только её скорость."

