forecast:
  date: 2026-09-17
  horizon: 2028-12-31
  horizons:
    - 2026-12-31
    - 2027-06-30
    - 2027-12-31
    - 2028-12-31
  domain: ru-macro
  topic: budget-deficit-ru
  method: fca
  unit: "mixed: trln_rub_annual (2026) | percent_gdp_annual (2027-2028) — см. методологическое предупреждение о разнородности метрик в .md"
  central_estimate: "Дефицит федерального бюджета РФ: 8.2 трлн руб (~3.6% ВВП) к 2026-12-31; первичный структурный 1.0% ВВП к 2027-12-31 (P10-P90: 1.0-2.6%); 0.5% ВВП к 2028-12-31"
  confidence: 0.40
  source_coverage_score: 0.40
  confidence_by_horizon:
    "2026-12-31": 0.30
    "2027-06-30": 0.30
    "2027-12-31": 0.33
    "2028-12-31": 0.23
  upstream_snapshot:
    - factor: brent
      central_estimate: "$85/bbl к 2026-12-31; $77/bbl к 2027-06-30; нет консенсуса на 2027-12-31/2028-12-31"
      confidence: 0.40
      forecast_date: 2026-09-17
      source_file: "forecasts/brent-price-2026-09-17.yaml"
    - factor: urals_discount
      central_estimate: "$22/bbl к 2026-12-31; $15 к 2027-06-30; $14 к 2027-12-31; $12 к 2028-12-31 (L1, единственный весовой якорь — МЭР fallback)"
      confidence: 0.40
      forecast_date: 2026-09-17
      source_file: "forecasts/urals-brent-discount-2026-09-17.yaml"
    - factor: sanctions_intensity
      central_estimate: "holding модальна на всех горизонтах (h6 52%/h12 46%/h24 40%/h30 37%), дрейф к relief/lift замедляется"
      confidence: 0.60
      forecast_date: 2026-09-17
      source_file: "forecasts/sanctions-russia-2026-28-2026-09-17.yaml"
  notes:
    - "Три несовместимые метрики под словом «дефицит»: головной федеральный (Минфин/ЦБ/ЦМАКП), первичный структурный (ЦБ, уже головного), консолидированный (МЭР/World Bank, шире федерального). См. методологическое предупреждение в .md — цифры НЕ усреднены напрямую между определениями"
    - "2026-12-31 L1 держится на единственном взвешенном якоре (ЦБ, fallback MEDIUM); 2027-06-30 нет ни одного источника с точкой на середину года — использована индикативная интерполяция, отмеченная отдельно от FCA-консенсуса"
    - "One-sided cone пробит на 2027-2028 (все институциональные позиции, включая World Bank и Layer 2, ниже текущего годового темпа факта 3.82% ВВП) — counter_world_reason заполнен, встречный мир в discourse не найден"
    - "Layer 2 построен как двухосевой derived_from_upstream (расходы ~ conflict_intensity, доходы ~ sanctions_intensity через net Urals), а не через прямую атрибуцию источников — ни один из 10 проверенных источников не даёт сценарной привязки"

geopolitics_translation:
  method: axis_dependent
  source_scenario_matrix: "scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml"
  axis: "joint: conflict_intensity (расходы) + sanctions_intensity (доходы)"
  note: "Бюджетный дефицит — джойнт-респондер на обе оси матрицы, не одна ось (в отличие от urals_discount/brent)"

isolated: false
isolated_reason: null

conditional_on_scenarios:
