    text: "Sc-A на 2026 требует CPI 7.75% для сетки 15.00 — ВЫШЕ полосы прогноза ЦБ 6.0-7.0%. Внутри полосы ЦБ весь диапазон исходов = 13.25-14.25. Ярлык «Затяжная осада» мягче числовой начинки: Sc-A по ставке — инфляционный результат, а не сценарный; геополитика работает только через инфляционный канал"
