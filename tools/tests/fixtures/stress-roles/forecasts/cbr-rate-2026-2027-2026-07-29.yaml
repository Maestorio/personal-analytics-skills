conditional_on_scenarios:
  method: linear
  no_modal: true
  modal_flag: D1_pure_shell
  source_matrix: "scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml"
  scenario_id_format: short
  translation_channel: cpi_floor_plus_buffer_linear
  translation_k: 1.0
  unit: percent_annual
  l2_informative: true
  l2_informative_note: >-
    Осознанное отклонение от конвенции «весь by_scenario DERIVED -> l2_informative: false».
    Конвенция мотивирована случаем, когда by_scenario выведен из СОБСТВЕННОГО L1 и coherence
    выходит тавтологические 0.0%. Здесь это условие не выполняется: coherence 0.91 / 2.10 / 2.97%
    ненулевая, потому что сценарный разброс приходит из ВНЕШНЕЙ переменной
    (inflation_ru.by_scenario из upstream inflation-ru-2026-07-29, у которой собственная
    сценарная геометрия), а не из L1 этого прогноза. validate-forecast-events выдаёт по этому
    поводу 2 warning (l2_informative + coherence_diagnostic.severity) — приняты сознательно,
    та же схема, что у upstream inflation-ru-2026-07-29.

  fact_anchor:
    value: 14.00
    as_of: 2026-07-24
    source: "Банк России, пресс-релиз 24.07.2026: снижение на 25 б.п. до 14,00% годовых https://www.cbr.ru/press/keypr/"

  one_sided_cone: true
  cone_side:
    "2026-12-31": two_sided
    "2027-06-30": down
    "2028-06-30": down
  counter_world_reason: >-
    На 2026-12-31 конус ДВУСТОРОННИЙ: Sc-A = 14.95 лежит выше якоря 14.00 (война + ужесточение
    санкций -> CPI 7.7% -> ЦБ разворачивает цикл), Sc-B/D = 13.35 ниже. Встречный мир представлен
    явно и именно там, где указывает спека: не в ветке разрядки, а на оси девальвация -> pass-through
    -> CPI. На 2027-06-30 и 2028-06-30 конус односторонне вниз: даже Sc-A (13.73 и 11.15) ниже
    текущих 14.00, потому что многолетний цикл смягчения к нейтрали (собственный прогноз ЦБ на
    2028: 8.0-9.0%) доминирует над сценарным разбросом. Up-риск на дальних горизонтах не отсутствует,
    а концентрирован в P90: верх range Sc-A = 14.73 (2027) и 12.45 (2028), то есть встречный мир
    жив внутри интервалов. Мир «ставка выше 14% через год» требовал бы не просто Sc-A, а срыва
    самой функции реакции (фискальное доминирование) — это отдельный falsifier
    rate-above-anchor-2027, а не сценарий матрицы.

  by_scenario:
    A:
      label: "Затяжная осада (война + единый/ужесточённый санкционный режим)"
      values:
        "2026-12-31": { central: 14.95, range: [14.35, 15.55] }
        "2027-06-30": { central: 13.73, range: [12.73, 14.73] }
        "2028-06-30": { central: 11.15, range: [9.85, 12.45] }
      provenance: derived_from_marginal
      sources_used: []
      coverage_quality: DERIVED
      grid_25bp:
        "2026-12-31": { attainable: 15.00, steps_from_anchor: 4, note: "4 повышения по 25 или 2 по 50" }
      range_requires_fast_step: "верх 15.55 = 52 б.п./заседание — достижим только при шаге 50 б.п."
      band_check_2026: >
        CPI-A 7.7% ВЫШЕ полосы прогноза ЦБ по инфляции-2026 (6.0-7.0%). Внутри полосы ЦБ весь
        диапазон исходов = 13.25-14.25 (от 3 снижений до 1 повышения); разворот на +100 б.п.
        появляется только при пробое верхней границы прогноза самого ЦБ. Ярлык сценария мягче
        его числовой начинки: это не «текущий мир продолжается», а «текущий мир продолжается
        И инфляция уходит за worst case ЦБ».
      reasoning_summary: >
        Максимум ставки и единственный мир выше якоря 14.00 на 2026. Наследует худший
        инфляционный мир upstream (7.7/6.7/6.1) — слабейший рубль набора (93/103/113),
        максимальный дефицит (3.1% ВВП), дисконт Urals $28 при 21-м пакете ЕС. Цикл
        смягчения паузится, затем разворачивается: 14.00 -> ~15.0 требует 3 шагов по ~42 б.п.,
        что механически проходит по оставшимся заседаниям 11.09/23.10/18.12. Единственный
        мир, где к 2028 ставка не возвращается в однозначный диапазон.
      upstream_used:
        - { factor: inflation_ru, value: 7.7, unit: pct_yoy, horizon: "2026-12-31" }
    B:
      label: "Война на расколотом фронте (война + фрагментация/снятие санкций)"
      values:
        "2026-12-31": { central: 13.35, range: [12.75, 13.95] }
        "2027-06-30": { central: 11.83, range: [10.83, 12.83] }
        "2028-06-30": { central: 8.95, range: [7.65, 10.25] }
      provenance: derived_from_marginal
      sources_used: []
      coverage_quality: DERIVED
      grid_25bp:
        "2026-12-31": { attainable: 13.25, steps_from_anchor: -3, note: "3 снижения по 25 — ПОЛ режима 25 б.п. (14.00 - 3x25)" }
      range_requires_fast_step: "низ 12.75 = 42 б.п./заседание — достижим только при возврате к шагу 50 б.п."
      grid_collapse_note: >
        На 2026-12-31 B и D садятся на один и тот же уровень сетки (13.25) — это артефакт
        механического пола режима 25 б.п., а не отсутствие разницы между мирами. На 2027-2028
        стенки нет и сценарии расходятся (11.83 vs 11.73; 8.95 vs 8.75).
      reasoning_summary: >
        Снятие нефтяного cap даёт лучший рубль набора (78/85/92) и дисконт Urals $17->$13 при
        продолжающейся войне — курсовой канал дезинфляционен, фискальный слабо проинфляционен
        (ВПК-дефицит 3.0% ВВП). На 2026 совпадает с D (13.35): год уже на три четверти
        зафиксирован данными, расхождение начинается с 2027.
      upstream_used:
        - { factor: inflation_ru, value: 6.1, unit: pct_yoy, horizon: "2026-12-31" }
    C:
      label: "Замороженный конфликт под давлением (перемирие + holding санкций)"
      values:
        "2026-12-31": { central: 13.85, range: [13.25, 14.45] }
        "2027-06-30": { central: 12.23, range: [11.23, 13.23] }
        "2028-06-30": { central: 9.25, range: [7.95, 10.55] }
      provenance: derived_from_marginal
      sources_used: []
      coverage_quality: DERIVED
      grid_25bp:
        "2026-12-31": { attainable: 13.75, steps_from_anchor: -1, note: "1 снижение по 25 — совпадает с L1" }
      reasoning_summary: >
        Выше Sc-B несмотря на прекращение огня — парадокс наследуется от upstream по курсу:
        перемирие без снятия санкций (86/94/101) даёт рубль слабее, чем война со снятием
        (78/85/92). Дезинфляционен только фискальный канал (демобилизация, дефицит 2.7->1.4%).
        Ближайший к L1 сценарий: расхождение всего 10 б.п. на 2026 и 0 б.п. на 2028 — именно
        поэтому C помечен как dominant implicit world облака источников.
      upstream_used:
        - { factor: inflation_ru, value: 6.6, unit: pct_yoy, horizon: "2026-12-31" }
    D:
      label: "Большая сделка и разрядка (мир + снятие санкций)"
      values:
        "2026-12-31": { central: 13.35, range: [12.75, 13.95] }
        "2027-06-30": { central: 11.73, range: [10.73, 12.73] }
        "2028-06-30": { central: 8.75, range: [7.45, 10.05] }
      provenance: derived_from_marginal
      sources_used: []
      coverage_quality: DERIVED
      two_sided_risk: true
      grid_25bp:
        "2026-12-31": { attainable: 13.25, steps_from_anchor: -3, note: "3 снижения по 25 — ПОЛ режима, совпадает с Sc-B (см. grid_collapse_note у B)" }
      range_requires_fast_step: "низ 12.75 = 42 б.п./заседание — достижим только при возврате к шагу 50 б.п."
      reasoning_summary: >
        Минимум на всех горизонтах, но на 2026 совпадает с Sc-B: сделка в H2 уже не двигает
        почти закрытый год. Драйвер не курс (84/91/97 — близко к L1, разморозка активов даёт
        встречный отток), а структурный канал (возврат поставок и конкуренции, дисконт Urals
        $8.5->$6.5) плюс фискальный (дефицит 2.4->1.1% ВВП). Bimodal риск: разморозка
        ~300 млрд EUR способна временно развернуть курсовой канал.
      upstream_used:
        - { factor: inflation_ru, value: 6.1, unit: pct_yoy, horizon: "2026-12-31" }

  marginal:
    method: linear
    modal_scenario_id: none
    values:
      "2026-12-31": { central: 13.875, range: [12.75, 15.55] }
      "2027-06-30": { central: 12.38, range: [10.73, 14.73] }
      "2028-06-30": { central: 9.525, range: [7.45, 12.45] }
    aggregation_formula: "weighted_mean"

  coverage_diagnostic:
    per_scenario:
      A: { sources_used: 0, confidence_level: DERIVED }
      B: { sources_used: 0, confidence_level: DERIVED }
      C: { sources_used: 0, confidence_level: DERIVED }
      D: { sources_used: 0, confidence_level: DERIVED }
    asymmetry_warning: "все 4 сценария DERIVED — публичная аналитика по ставке ЦБ привязана к календарному году, а не к геополитическому режиму"
    dominant_implicit_world: "C (граница A/C, ближе к C); наблюдаемый мир = A, разрыв L1 vs Sc-A -120/-160/-190 б.п."

coherence_diagnostic:
  layer1_marginal: 13.75
  layer2_marginal: 13.875
  divergence_pct: 0.91
  severity: LOW
  warning: null
  by_horizon:
    "2026-12-31": { layer1_marginal: 13.75,  layer2_marginal: 13.875, divergence_pct: 0.91, severity: LOW }
    "2027-06-30": { layer1_marginal: 12.125, layer2_marginal: 12.38, divergence_pct: 2.10, severity: LOW }
    "2028-06-30": { layer1_marginal: 9.25,   layer2_marginal: 9.525,  divergence_pct: 2.97, severity: LOW }
  explanation: >-
    Расхождение везде LOW и однонаправленное (L2 > L1) — наследуется от upstream: облако по
    инфляции (L1 CPI 6.5) сидит ниже среднего по сценариям (L2 EV CPI 6.62). Через k=1.0 гэп
    транслируется в ставку один к одному. Растёт с горизонтом (0.91 -> 2.10 -> 2.97%), потому
    что база L1 падает быстрее абсолютного гэпа. Порог MEDIUM (5%) не достигнут ни на одном
    горизонте, ручное ревью не требуется.

sensitivity:
  cpi_plus_150bp:
    trigger: "CPI +1.5 п.п. от сценарного базиса"
    rate_shift: "+150 б.п. на всех трёх горизонтах (1:1 via CPI+500bp floor)"
    direction: upward
    binding_constraint: none
    detail: "2026-12-31: 13.75 -> 15.25; механически = 3 шага по ~42 б.п. по заседаниям 11.09/23.10/18.12, проходит. 2027-06-30: 12.125 -> 13.63. 2028-06-30: 9.25 -> 10.75"
    applicable_to: "все сценарии"
  cpi_minus_150bp:
    trigger: "CPI -1.5 п.п. от сценарного базиса"
    rate_shift: "-50…-150 б.п. (2026, зависит от режима шага) · -150 б.п. (2027) · -125 б.п. (2028)"
    direction: downward
    binding_constraint: "режим шага 25 б.п. (2026) + нейтральная ставка ~8.0% (2028)"
    detail: >
      2026-12-31: полный пасс-через даёт 12.25, но три шага по 25 б.п. от якоря 14.00 упираются
      в 13.25 = всего -50 б.п. от L1. -150 б.п. требует возврата к шагу 50 б.п. вопреки сигналу
      24.07 «требуется более плавное снижение». 2027-06-30: 12.125 -> 10.63, ограничений нет
      (floor CPI+500 = 8.60, не достигается). 2028-06-30: полный пасс-через даёт 7.75, floor
      CPI+500 = 7.70 почти не биндит, но нижняя граница собственного прогноза ЦБ на 2028 (8.0%)
      как прокси нейтрали останавливает на 8.00 = -125 б.п.
    applicable_to: "все сценарии"
  asymmetry_note: >
    На 2026-12-31 реакция асимметрична втрое: +150 б.п. вверх против -50 б.п. вниз при
    сохранении текущего режима шага. Прямое следствие нейтрального сигнала 24.07 и того, что
    год на три четверти зафиксирован данными.
  regime_shift_to_50bp_step:
    trigger: "ЦБ возвращается к шагу 50 б.п. (два заседания подряд)"
    rate_shift: "открывает нижнюю ветку 2026 с -50 до -150 б.п.; L1-2026 пересмотр к 12.75-13.25"
    direction: downward
    applicable_to: "все, остро в B/D"
  fiscal_dominance:
    trigger: "Стимулирующий бюджет-2027 + кредит физлицам >12% г/г при CPI >7%"
    rate_shift: "+25…+75 б.п. сверх пасс-через через расширение буфера; смещение к Sc-A"
    direction: upward
    applicable_to: "все, остро в Sc-A/B"

