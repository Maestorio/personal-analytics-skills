    text: "by_scenario.central — непрерывный выход канала k=1.0, НЕ достижимая ставка. Сетка 25 б.п. в grid_25bp: A 15.00 (+4 шага) · B 13.25 (-3, пол режима) · C 13.75 (-1) · D 13.25 (-3). Непрерывные значения оставлены как SSOT ради точного равенства L2 EV = sum(0.25 x by_scenario)"
