  horizon: 2028-06-30
  horizons: ["2026-09-11", "2026-10-23", "2026-12-18", "2026-12-31", "2027-06-30", "2028-06-30"]
  domain: ru-macro
  topic: cbr-rate-2026-2027
  method: fca
  unit: percent_annual
  basis: "Ключевая ставка Банка России, % годовых, значение на дату"
  central_estimate: >
    Ключевая ставка ЦБ РФ, Layer 1 marginal: 13.75% к 2026-12-31 (P10 13.75 / P90 14.00);
    12.125% к 2027-06-30 (вырожден, n=1); 9.25% к 2028-06-30 (DERIVED, 0 взвешенных источников).
    Отправная точка 14.00% (факт 24.07.2026, -25 б.п., десятое снижение подряд). Модальная
    траектория: 14.00 -> пауза 11.09 -> 13.75 (23.10, опорное) -> hold 13.75 (18.12).
    L2 by_scenario 2026/2027/2028: A 14.95/13.73/11.15 · B 13.35/11.83/8.95 ·
    C 13.85/12.23/9.25 · D 13.35/11.73/8.75. L2 EV (D1 no_modal, linear): 13.875/12.38/9.525.
  confidence: 0.40
  source_coverage_score: 0.40
  confidence_note: >
    weighted_consensus.py: на 2026-12-31 отдельный прогон даёт 0.50 (ЦБ HIGH ru-rates-late-cycle,
    share_HIGH=0.25). Прогоны на 2027-06-30 и 2028-06-30 дают 0.40 (share_HIGH=0). Forecast-уровень
    0.40 — по биндящему полному горизонту до 2028. Legacy-скаляр не подменялся (спека F3).
    Настоящий сигнал — в confidence_by_horizon и в anchor_share: L1-2027 держится на одном
    источнике (1.00), L1-2028 не имеет взвешенных источников вовсе.
  confidence_by_horizon:
    "2026-12-31": 0.50
    "2027-06-30": 0.30
    "2028-06-30": 0.26
  anchor_share_by_horizon:
    "2026-12-31": 0.40
    "2027-06-30": 1.00
    "2028-06-30": null
  upstream_snapshot:
    - factor: inflation_ru
      central_estimate: "L1 6.5/5.1/4.2; by_scenario A 7.7/6.7/6.1 · B 6.1/4.8/3.9 · C 6.6/5.2/4.2 · D 6.1/4.7/3.7"
      confidence: 0.40
      forecast_date: 2026-07-29
      source_file: "forecasts/inflation-ru-2026-07-29.yaml"
    - factor: geopolitics_ru_west
      central_estimate: "Pure Shell D1 no_modal: A=B=C=D=0.25. Матрица 07-01"
      confidence: null
      forecast_date: 2026-07-01
      source_file: "scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml"
    - factor: cbr_reaction_function
      central_estimate: "CPI+500bp floor + буфер; буфер L1 сжимается 225 -> 203 -> 5 б.п."
      confidence: 0.80
      forecast_date: 2026-04-27
      source_file: "domains/ru-macro/cbr-rf-2024-2025.md"
  notes:
    - "РЕЖИМНЫЙ СДВИГ 24.07.2026: ЦБ поднял коридор средней ставки 2026 с 14.0-14.5 до 14.5-14.6%, 2027 с 8-10 до 10.5-12.5%, 2028 с 7.5-8.5 до 8.0-9.0%; инфляция-2026 с 4.5-5.5 до 6.0-7.0%; ВВП-2026 с 0.5-1.5 до 0.0-1.0%. Сигнал сменён на нейтральный. Сдвиг L1 vs 07-05: +75 / +113 / +75 б.п."
    - "Узел cbr-rate-jul24-2026-2026-07-06 разрешён 24.07 (hit, error 0.0%). Прошедшее заседание не переигрывается, траектория строится от 11.09.2026"
    - "UPSTREAM-РАСХОЖДЕНИЕ: промпт указал forecasts/inflation-ru-2026-07-28.yaml — такого файла нет. Использован inflation-ru-2026-07-29.yaml (подтверждено пользователем)"
    - "ПЕРЕВОД 'средняя за год' -> значение на дату: по фактической траектории 2026 (16.00 -> 15.50 13.02 -> 15.00 20.03 -> 14.50 24.04 -> 14.25 19.06 -> 14.00 24.07) средняя Jan1-Jul23 = 15.031% за 204 дня. Коридор ЦБ 14.5-14.6% допускает конец-2026 в 13.50-14.00, центр 13.75. Траектория с концом 13.25 даёт ср. 14.44% — ВНЕ коридора ЦБ. Для 2027/2028 при монотонно убывающем пути значение на середину года ~ средняя за год"
    - "ПОПРАВКА PROVENANCE к 07-05: там Sc-A помечен native_fca с sources_used [cbr,sbercib,bks,finam]. Неверно — ни один источник не обусловливает прогноз осью Russia-West. Здесь все 4 сценария derived_from_marginal, имплицитный мир вынесен в coverage_diagnostic"
    - "ПРАВИЛО L1-2028 (сознательное отклонение от конвенции inflation-ru-07-29): взято НЕ среднее(unweighted_median; интерполяция макроопроса), т.к. при n=2 макроопрос вошёл бы дважды. Взята середина двух независимых якорей ЦБ 8.50 / макроопрос 10.00 = 9.25. Независимая проверка: floor CPI+500бп при CPI 4.2 даёт 9.20 — совпадение 5 б.п."
    - "ГЛАВНАЯ НАХОДКА: dominant implicit world облака = C (граница A/C), наблюдаемый мир = A. Разрыв L1 vs Sc-A: -120 / -160 / -190 б.п. Риск направлен ВВЕРХ и растёт с горизонтом. Наследуется из upstream inflation-ru-07-29"
    - "l2_informative: true — сценарный разброс приходит из ВНЕШНЕЙ переменной (inflation_ru.by_scenario с собственной геометрией), а не из собственного L1. Coherence 0.91/2.10/2.97% ненулевая и не тавтологична"
    - "Карта лагерей: числовой consensus целиком внутри монетаристского лагеря. Структуралисты (ЦМАКП) дают нормативную позицию 7-8.5% и инфляцию-2026 4.5-5% — альтернативный базис, не outlier внутри consensus. ВПК-реалисты не покрыты"

