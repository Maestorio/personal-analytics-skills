    - "2027-12-31: 0 источников с trust ≥ MEDIUM (EIA → LOW brent-24m, Goldman Sachs → LOW oil-forecast) — l1_weighted null, приведена только unweighted median LOW-trust/неаудированных источников для справки"
    - "2028-12-31: 0 источников любого trust-уровня — ни EIA STEO, ни банки не публикуют настолько далёкий point forecast в этом цикле; рекомендован повторный запуск после EIA AEO2026 (январь) или IEA WEO2026 (октябрь)"
    - "one_sided_cone true на всех трёх покрытых горизонтах при fact_anchor $104.18 (Brent front-month, 2026-09-17) — закрыт counter_world_reason (встречный мир off-axis: Иран/Ормуз, GS extreme >$120, BofA $120-150, WB alt-сценарий $115)"

