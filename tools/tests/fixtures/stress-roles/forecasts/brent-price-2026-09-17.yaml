conditional_on_scenarios:
  source_matrix: "scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml"
  scenario_id_format: short
  unit: "USD/bbl"
  l2_informative: false   # §18: весь by_scenario DERIVED — L2 не несёт независимой информации

  fact_anchor:
    value: 104.18
    as_of: 2026-09-17
    source: "Brent front-month (Nov-26 contract), TradingEconomics"

  one_sided_cone: true
  cone_side:
    "2026-12-31": down
    "2027-06-30": down
    "2027-12-31": down
  counter_world_reason: >-
    Встречный мир (Brent выше текущего спота) существует и подтверждён источниками, но лежит
    ВНЕ оси данной матрицы: его драйвер — Иран/Ормуз/Персидский залив, а не Russia-West.
    Goldman Sachs даёт extreme-сценарий >$120 при сохранении ограничений Залива, Bank of
    America — $120-150 при доп. повреждении инфраструктуры, World Bank (апрель) — alt-сценарий
    $115. Отдельным ключом by_scenario он нереализуем: схема требует строго {A,B,C,D}, а
    compute_cone перебирает только эти четыре. Поэтому off-axis upside внесён (1) в верхние
    границы range у Sc-A ($130/$115/$110) и Sc-B ($115/$100/$96), (2) в monitoring с side: up.
    Односторонность конуса вниз при этом — содержательный вывод: ни один из 11 проверенных
    источников не прогнозирует Brent выше текущего спота $104.18 ни на одном горизонте
    (максимум набора — Morgan Stanley $100 на Q4-26); консенсус трактует текущий уровень как
    распадающуюся ормузскую премию. Идентичная логика и вывод были в снапшоте 2026-07-28.

  by_scenario:
    A:
