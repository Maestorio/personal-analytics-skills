consistency_check:
  method: coverage_report.check_consistency_pair над 4 сценариями x 4 горизонта = 16 комбинаций (2028-12-31 без
    brent-члена — форекаст brent не покрывает эту точку, brent_pct_change=0 => нефтяные правила там не действуют)
  raw_counts:
    critical: 1
    medium: 10
    low: 0
  compatible: false
  items:
  - where: B@2026-12-31
    rule: oil_drop_rub_strength
    severity: medium
    message: Нефть↓ + рубль↑ — нетипично
    resolution: benign
    resolution_note: Многолетний дезинфляционный/rate-cut цикл к нейтрали ЦБ (~9%), не одногоризонтный шок — пороги
      правил откалиброваны под шок, не под glide path. Подтверждено пользователем 2026-09-17 (Checkpoint 2).
  - where: B@2026-12-31
    rule: geopol_without_sanctions
    severity: medium
    message: Геополитическая эскалация без ужесточения санкций — исторически редко
    resolution: by_construction
    resolution_note: 'Sc-B = война на расколотом фронте: эскалация ПРИ фрагментации/снятии санкций — сама конструкция
      оси Y, не аномалия. Подтверждено пользователем 2026-07-29, перенесено без изменений.'
  - where: B@2027-06-30
    rule: oil_drop_rub_strength
    severity: medium
    message: Нефть↓ + рубль↑ — нетипично
