    - if_text: EBITDA 3К не ниже ≈215 млрд ₽ (уровень 1П), дивидендная база не урезана,
        подтверждённых санкционных ограничений по Аляске и «Арктик СПГ-2» нет
      then:
        action: set_verdict
        verdict: HOLD
        text: держать 82 акции, порог продажи — разбор у 1 300 ₽ — 1 300 ₽ — цель
          Т-Инвестиций; новый порог ставится отдельным условием
    - if_text: EBITDA 3К ниже ≈200 млрд ₽, либо дивидендная база урезана, либо подтверждены
        санкционные ограничения по Аляске или «Арктик СПГ-2»
      then:
        action: set_target_pct
        verdict: TRIM
        target_pct: 1.4
        text: срез 30% позиции (24 акции) — Исходный размер среза из условия от 29.06;
          долю после среза считает вьюер
    otherwise:
      action: set_verdict
      verdict: HOLD
      text: держать, EBITDA 3К между 200 и 215 млрд ₽ — решение владельца
