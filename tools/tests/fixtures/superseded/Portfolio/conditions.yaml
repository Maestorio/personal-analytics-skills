    verdict: HOLD
    text: '27.10.2026: ценовой порог 1200 пройден (live 1204, снапшот 1207), срез
      отложен до отчёта. Исходная логика хеджа эскалации утратила силу (стресс 04.10:
      сценарий A −18%), план 2,0% KEEP, фундамент нейтральный. Дата отчёта 9М не объявлена
      — срок 30.11 с запасом.'
  on_trigger:
    action: run_analysis
    verdict: HOLD
    text: 'Разбор Mode 4 после МСФО 9М2026: EBITDA 3К, дивидендная база, санкции по
      Аляске/Арктик СПГ-2 → держать или срез 30%'
