scenario_matrix:
  ref: 'Claude-Memory/macro-chain/macro-scenarios-2026-09-17.yaml (источник: scenarios/scenario-geopolitics-ru-west-2026-07-01.yaml)'
  status: AGING (оси не пересматривались после закона Грэма 19.09 и бюджета 2027 от 30.09; на 16.10 новых
    данных для пересмотра весов нет — стрим IE 15.10 даёт неявно D 0,6 / B 0,4, но по [lib] профилю IE
    геополитика и курс — LOW/IGNORE)
  labels:
    A: Затяжная осада (война + единый санкционный режим; stress pole)
    B: Война на расколотом фронте (война + фрагментация санкций)
    C: Замороженный конфликт под давлением (перемирие, санкции сохраняются)
    D: Большая сделка и разрядка (перемирие + снятие санкций; detente pole)
  p_h12:
    A: 0.195
    B: 0.155
    C: 0.355
    D: 0.295
  binding_logic: 'Привязка сохранена с обзора 27.08 без изменений: rate_cut_capital_gain и mf_auction_resumption
    привязаны к D (разрядка → приток капитала, крепкий рубль, ускоренное снижение КС); fx_overweight_unwind,
    credit_event, floater_coupon_reset и rating_downgrade — к A (затяжная осада держит ставку высокой
    дольше: это и премия флоатера, и кредитный стресс в лизинге, девелопменте и вагонном операторстве).
    redemption_reinvestment, offer_exit, offer_tender_2909, rating_review_cycle, supply_overhang, cny_leg_replacement
    и taxonomy_mismatch_review оставлены null осознанно — календарные, процедурные и эмитент-специфичные
    события, не зависящие от состояния мира. Новые: cny_curve_reprice → D (как rate_cut_capital_gain);
    supply_overhang_q4 — null (фискальный, не зависит от состояния мира). Новые на 08.10: windfall_tax_cash_hit
    → A (затяжная осада — фискальное давление на сырьевых эмитентов); credit_event у ЛаймЗайм04 → A (как
    прочие credit_event).'
  p_h12_basis: Линейная интерполяция весов 2027-06-30 и 2027-12-31 из macro-scenarios-2026-09-17 на h12
    = 2027-09-30.
