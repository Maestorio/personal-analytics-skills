<html lang="ru">
<head>
<meta charset="utf-8">

<title>Деньги · Личный кабинет</title>
<!-- иконка кабинета (вкладка и экран «Домой»): шесть ромбов — цвета разделов --c-1…--c-6 -->

     (правило кабинета 2026-07-13) — тёмная только при явном hub-theme==="dark". -->

<!-- Своего <style> у страницы НЕТ: шапка, карточки, плитки, графики и
     выпадающий список — общие компоненты ui-kit.css (раздел «Страница
     раздела», v1.11.0). Макет — tools/design-reference/Деньги.dc.html. -->

</head>
<body style="--sec-acc:var(--c-6);"><!-- акцент раздела и для общих компонентов вне .ui-page (нижняя панель в body) -->
<div id="app"></div>

<script src="assets/ui-kit.js?v=1.72.0"></script>
<script>
(function(){
"use strict";

/* ── Деньги: итоги месяцев и поездок из ZenMoney ─────────────────────────────
   Только чтение. Данные готовит скилл zenmoney-analyst (scripts/audit_history.py
   — единственный писатель ZenMoney/audit/): history.json (аудит учёта),
   spending.json (итоги месяцев), trips.json (поездки), facts.json (факты «на что
   взглянуть» — страница их НЕ считает, только показывает: формулы и пороги живут
   в scripts/history_query.py, чтобы не разойтись), site-audit.json (проверки сайта
   при загрузке выгрузки — только агрегаты; необязателен, пишет hub-notify). Контракты —
   docs/zenmoney/money-page-brief.md. Отдельных операций и счетов здесь нет и
   быть не должно: исправления делаются в приложении ZenMoney.
   ZenMoney/* под паролем: запросы несут Authorization из localStorage
   ["hub-auth"] (его пишет login.html), без него — тихий 403 → login.html. */
var VERSION = "money v2.6.2";
var DATA = "../ZenMoney/audit/";
var FILES = { H: "history.json", S: "spending.json", T: "trips.json", F: "facts.json", SA: "site-audit.json" };

var NOM = UI_MONTHS_NOM, GEN = UI_MONTHS_GEN, SH = UI_MONTHS_SHORT;   // месяцы — общие, ui-kit
// Подписи типов замечаний — только русские, кодов на странице нет (бриф §1).
var LBL = { A1: "Переводы, записанные расходом и доходом", A2: "Корректировки", A3: "Без категории",
            A4: "Поездка основной категорией вместо тега", A5: "Одинаковые операции (вопрос)" };
var EXCL = { corrections: "корректировки", investments: "инвестиции", cashback: "кешбэк",
             partner: "расчёты с партнёром", refund_category: "возвраты", loans: "долги" };
var CUR = { VND: ["донги","₫"], USD: ["доллары","$"], EUR: ["евро","€"], CNY: ["юани","¥"], TRY: ["лиры","₺"],
            GEL: ["лари","₾"], KZT: ["тенге","₸"], RUB: ["рубли","₽"] };
var BUCKETS = ["до месяца","1–3 месяца","3–6 месяцев","больше 6 месяцев"];
var BUCKET_SHORT = { "до месяца": "до 1 мес", "1–3 месяца": "1–3 мес", "3–6 месяцев": "3–6 мес", "больше 6 месяцев": "> 6 мес" };
// Сравнение поездок: группы типов и их насыщенность (классы .lv1–.lv5).
var GROUPS = [["Билеты", ["Билеты"], 1], ["Жильё", ["Жильё"], 2], ["Еда", ["Еда"], 3],
              ["Развлечения", ["Экскурсии и развлечения"], 4], ["Прочее", null, 5]];
var TABS = [["overview", "Обзор", "Обзор"], ["quality", "Качество учёта", "Качество"], ["spend", "Траты", "Траты"], ["trips", "Поездки", "Поездки"], ["csv", "Загрузка", "Загрузка"]];
var ICONS = {
  overview: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>',
  quality: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  spend:   '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  trips:   '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V4h6v3M4 12h16"/></svg>',
  csv:     '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
};

/* ── форматирование ── */
function ym(s){ var p = s.split("-").map(Number); return [p[0], p[1] - 1]; }
var cap = uiCap;
function mTitle(s){ var a = ym(s); return cap(NOM[a[1]]) + " " + a[0]; }
function dGen(s){ var p = s.split("-").map(Number); return p[2] + " " + GEN[p[1] - 1]; }
function num(v, d){ return v.toFixed(d == null ? 1 : d).replace(".", ","); }
// колонки «тыс. ₽»: ненулевая сумма меньше 50 ₽ — «<0,1», а не «0,0» (покупка на 30 ₽ — не ноль)
function k1(v){ var a = Math.abs(v); return a > 0 && a < 50 ? (v < 0 ? "−" : "") + "<0,1" : (v < 0 ? "−" : "") + num(a / 1000); }
// меньше тысячи — в рублях («3,80 ₽», «476 ₽»): в тысячах 3,80 ₽ превращались в «0,0 тыс. ₽»
function K(v){
  var a = Math.abs(v);
  if (a < 999.5) return (v < 0 && a >= 0.005 ? "−" : "") + (a > 0 && a < 10 ? num(a, 2) : String(Math.round(a))) + " ₽";
  return k1(v) + " тыс. ₽";
}
function pct(v){ var s = (v * 100).toFixed(1); if (s.slice(-2) === ".0") s = s.slice(0, -2); return s.replace(".", ",") + "%"; }
function pl(n, f){ var a = Math.abs(n) % 100, b = a % 10; return n + " " + (a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]); }
function days(n){ return pl(n, ["день", "дня", "дней"]); }
function shortCat(s){ return s === "Одежда, обувь, аксессуары" ? "Одежда" : s; }
function range(list){
  if (!list.length) return "";
  var a = ym(list[0].month), b = ym(list[list.length - 1].month);
  return list.length === 1 ? NOM[a[1]] : NOM[a[1]] + "–" + NOM[b[1]];
}
function dRange(s, e){
  var a = s.split("-").map(Number), b = e.split("-").map(Number);
  if (a[0] === b[0] && a[1] === b[1]) return a[2] + "–" + b[2] + " " + GEN[a[1] - 1] + " " + a[0];
  if (a[0] === b[0]) return a[2] + " " + GEN[a[1] - 1] + " – " + b[2] + " " + GEN[b[1] - 1] + " " + a[0];
  return dGen(s) + " " + a[0] + " – " + dGen(e) + " " + b[0];
}
function w(p){ return ' style="width:' + Math.max(0, Math.min(100, p)).toFixed(1) + '%"'; }
function cols(c){ return ' style="--cols:' + c + '"'; }

/* ── состояние ── */
var S = { theme: "light", tab: "overview", month: null, period: "month", tripId: null,
          merchAll: false, cmpAll: false, chart: "spend", catOpen: {}, catFresh: null, yoy: [], H: null, Sp: null, T: null, F: null,
          loading: true, error: null, missing: [], dynScrolled: false };
try { if (localStorage.getItem("hub-theme") === "dark") S.theme = "dark"; } catch(e){}
try { var savedTab = localStorage.getItem("money-tab"); if (savedTab === "stmt") savedTab = "csv"; if (TABS.some(function(t){ return t[0] === savedTab; })) S.tab = savedTab; } catch(e){}
function set(p){ for (var k in p) S[k] = p[k]; render(); }

/* ── данные ── */
/* authFetch() — общий, из ui-kit.js (там же credentials:"omit" и метка
   отвергнутого пароля). */

function load(name){
  return authFetch(uiBust("money", DATA + name),   // метка «Обновить» — ui-kit
                   { headers: { "Accept": "application/json" }, cache: "no-store" }).then(function(r){
    if (r.status === 401 || r.status === 403) { var e = new Error("auth"); e.auth = true; throw e; }
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(name + " → " + r.status);
    return r.json();
  });
}
function months(){
  var set_ = {};
  ((S.H && S.H.records) || []).forEach(function(r){ set_[r.month] = 1; });
  ((S.Sp && S.Sp.months) || []).forEach(function(m){ set_[m.month] = 1; });
  return Object.keys(set_).sort();
}
function start(){
  if (!authToken()) { S.loading = false; S.error = "auth"; render(); goLogin(); return; }
  uiDataReset();
  function tally(p){ return p.then(function(v){ uiDataDone(true); return v; }, function(e){ uiDataDone(false); throw e; }); }   // подвал: источник прочитан или нет
  Promise.all([tally(load(FILES.H)), tally(load(FILES.S)), tally(load(FILES.T)), tally(load(FILES.F)),
               tally(load(FILES.SA)).catch(function(e){ if (e.auth) throw e; return null; })]).then(function(r){
    uiLoginOk("money");
    S.H = r[0]; S.Sp = r[1]; S.T = r[2]; S.F = r[3]; S.SA = r[4];   // facts.json и site-audit.json необязательны — в «Нет файла» не пишем
    S.missing = [[r[0], FILES.H], [r[1], FILES.S], [r[2], FILES.T]].filter(function(x){ return !x[0]; }).map(function(x){ return x[1]; });
    var ms = months();
    S.month = ms.length ? ms[ms.length - 1] : null;
    S.loading = false;
    render();
  }).catch(function(e){
    S.loading = false;
    if (e.auth) { S.error = "auth"; render(); goLogin(); return; }
    S.error = "Не удалось загрузить данные: " + e.message;
    render();
  });
}

/* ── вход ── форму не рисуем: единая точка входа кабинета — login.html.
   Уход и страховка от петли — общий uiGoLogin (ui-kit): только что уводили, а
   данные опять не отдаются — второй раз не уводим, объясняем здесь. */
function goLogin(){
  uiGoLogin("money", function(hasTok){
    S.error = !hasTok ? "auth"
      : "Вход выполнен, но файлы ZenMoney/audit/ не отдаются — дело не в пароле. " +
        "Проверь, что в Caddyfile путь /ZenMoney/* не попал в публичные исключения и что файлы лежат на NAS.";
    render();
  });
}

/* Прошлый месяц закрыт? null — да; иначе — что сказать человеку. Общая для
   «Обзора»; хаб повторяет ту же проверку (moneyMeta). */
/* Открытые замечания по месяцам — из `issues` истории (статус меняет «закрой месяц»:
   принято/исправлено). Снимок аудита месяца (`by_check`) остаётся «что нашлось тогда». */
function openByMonth(H){
  var o = {};
  Object.keys((H && H.issues) || {}).forEach(function(k){ var i = H.issues[k]; if (i.status === "open") o[i.month] = (o[i.month] || 0) + 1; });
  return Object.keys(o).sort().map(function(m){ return { month: m, n: o[m] }; });
}
/* Сколько открыто сейчас и как давно — по статусам `issues` (их меняет любое «закрой месяц»,
   в том числе повторное закрытие старого месяца). `open_total` записи — снимок на момент её
   записи: перезакрытый январь не обновляет число в октябрьской записи. Возраст — как в
   audit_month.age_bucket (от first_seen до сегодня: <31 дня, ≤92, дольше). Нет `issues`
   (старый файл) — число из последней записи. */
function openStats(H){
  var iss = (H && H.issues) || {}, recs = (H && H.records) || [], ks = Object.keys(iss);
  if (!ks.length){ var l = recs[recs.length - 1] || {}, a = l.open_by_age || {};
    return { total: l.open_total || 0, lt_1m: a.lt_1m || 0, "1_3m": a["1_3m"] || 0, gt_3m: a.gt_3m || 0 }; }
  var o = { total: 0, lt_1m: 0, "1_3m": 0, gt_3m: 0 }, now = Date.now();
  ks.forEach(function(k){
    var i = iss[k]; if (i.status !== "open") return;
    var days = Math.floor((now - Date.parse((i.first_seen || "") + "T00:00:00")) / 864e5);
    o.total++; o[!(days >= 31) ? "lt_1m" : days <= 92 ? "1_3m" : "gt_3m"]++;
  });
  return o;
}
function openMonthsHTML(H){
  return openByMonth(H).map(function(x){
    return '<button type="button" class="ui-link" data-act="quality-month" data-v="' + x.month + '">' + esc(mTitle(x.month)) + ' — ' + x.n + '</button>';
  }).join(" · ");
}

/* Аудит сайта (site-audit.json): проверки, которые сайт прогнал при загрузке выгрузки; только агрегаты.
   Аудит скилла (history.json) главнее и при появлении заменяет его. */
var SITE_HINT = "проверки сайта при загрузке выгрузки; аудит скилла полнее и при появлении заменит этот";
function siteAuditOf(m){ var x = S.SA && S.SA.months && S.SA.months[m]; return x && Array.isArray(x.checks) ? x : null; }
function siteTag(){ return '<span class="ui-tag" title="' + esc(SITE_HINT) + '">аудит сайта</span>'; }
function siteN(sa){ return (sa.checks || []).reduce(function(n, c){ return n + (c.count || 0); }, 0); }
function unclosed(m){
  var sp = ((S.Sp && S.Sp.months) || []).some(function(x){ return x.month === m; });
  var au = ((S.H && S.H.records) || []).some(function(x){ return x.month === m; });
  var nm = NOM[ym(m)[1]];
  if (sp && au) return null;
  if (sp && siteAuditOf(m)) return null;       // закрыт «по сайту»: итоги трат и проверки сайта
  if (!sp && !au) return uiAiMode() === "off" ? cap(nm) + " ещё не закрыт." : cap(nm) + " ещё не закрыт — скажи Claude «закрой " + nm + "».";
  return cap(nm) + " закрыт не полностью: нет " + (sp ? "аудита учёта" : "итогов трат") + '<span class="noai-hide"> — ' + (sp ? "«проверь учёт за " + nm + "»" : "«закрой " + nm + "»") + "</span>.";
}

/* ── факты «на что взглянуть» ── facts.json пишет скилл (audit_history.py) на
   последний закрытый месяц. Страница ничего не считает: только подписи. Факты
   старше последнего месяца итогов (файл не пересчитан) — не показываем. */
function facts(){
  var all = (S.Sp && S.Sp.months) || [];
  if (!S.F || !S.F.facts || !all.length || S.F.month !== all[all.length - 1].month) return null;
  return S.F;
}
function flagOf(cat){ var f = facts(); return f && f.flagged_categories ? f.flagged_categories[cat] || null : null; }
// со знаком; от 10% — целыми процентами («+171%», а не «+171,3%»)
function sgn(v){ var a = Math.abs(v); return (v > 0 ? "+" : v < 0 ? "−" : "") + (a >= 0.1 ? Math.round(a * 100) + "%" : pct(a)); }
var FLAG_WHY = { jump: "последние 3 месяца выше обычного", growth: "растёт быстрее остальных обычных трат" };
function flagMark(cat){
  var k = flagOf(cat); if (!k) return "";
  var t = "заметно: " + k.map(function(x){ return FLAG_WHY[x] || x; }).join("; ");
  return ' <b class="ui-up" title="' + esc(t) + '" aria-label="' + esc(t) + '">●</b>';
}
/* Пояснение к факту по категории: чаще или дороже, за счёт каких подкатегорий.
   Новая подкатегория — «новая статья с <месяц>», без процента (часто это
   перестановка учёта, а не новые траты). */
function explainTxt(e){
  if (!e) return "";
  var out = [];
  if (e.count_change != null && Math.abs(e.count_change) >= 0.1)
    out.push("покупок " + num(e.count_per_month[0]) + " → " + num(e.count_per_month[1]) + " в месяц");
  if (e.avg_check_change != null && Math.abs(e.avg_check_change) >= 0.05) out.push("средний чек " + sgn(e.avg_check_change));
  (e.sub || []).filter(function(x){ return x.new_since; }).slice(0, 2).forEach(function(x){
    out.push("новая статья «" + x.name + "» с " + GEN[ym(x.new_since)[1]]);
  });
  var up = (e.sub || []).filter(function(x){ return !x.new_since && x.change != null && x.change > 0.1 && x.per_month - x.per_month_base >= 1000; })
                        .sort(function(a, b){ return (b.per_month - b.per_month_base) - (a.per_month - a.per_month_base); })[0];
  if (up) out.push("«" + up.name + "» " + sgn(up.change));
  return out.join(" · ");
}
function monRange(w){ return SH[ym(w[0])[1]] + " ’" + w[0].slice(2, 4) + " – " + SH[ym(w[1])[1]] + " ’" + w[1].slice(2, 4); }
/* Подпись факта: { t — что, s — подробности, act/v — куда перейти }. */
function factText(f){
  if (f.kind === "unrecorded_rising")
    return { t: "Незаписанные траты растут " + pl(f.series.length, ["месяц", "месяца", "месяцев"]) + " подряд",
             s: f.series.map(function(x){ return pct(x.share); }).join(" → ") + " от трат · " + f.series.map(function(x){ return NOM[ym(x.month)[1]]; }).join(", "),
             act: "tab", v: "quality", link: "Качество учёта →" };
  if (f.kind === "minus_months")
    return { t: pl(f.count, ["месяц", "месяца", "месяцев"]) + " из 12 с минусом — год назад " + f.count_prev,
             s: f.months.map(function(x){ return NOM[ym(x.month)[1]] + (x.with.length ? " (" + x.with.map(function(k){ return k === "trips" ? "поездка" : "разовая"; }).join(", ") + ")" : ""); }).join(", "),
             act: "go-net", v: "", link: "Остаток →" };
  if (f.kind === "acceleration")
    return { t: "Обычные траты растут быстрее, чем год назад",
             s: "за 12 мес. (" + monRange(f.window) + ") " + sgn(f.growth) + ", годом ранее " + sgn(f.growth_prev) + " · в месяц " + K(f.per_month_prev) + " → " + K(f.per_month),
             act: "yoy-fact", v: "", link: "Сравнить с прошлым годом →" };
  var ex = explainTxt(f.explain);
  if (f.kind === "growth")
    return { t: f.category + ": " + sgn(f.growth) + " к тем же месяцам год назад",
             s: "остальные обычные траты " + sgn(f.others_growth) + " · в месяц " + K(f.per_month_base) + " → " + K(f.per_month) + (ex ? " · " + ex : ""),
             act: "yoy-fact", v: "", link: "Сравнить с прошлым годом →" };
  return { t: f.category + ": последние 3 месяца выше обычного",
           s: K(f.recent_avg_rub) + " в месяц при обычных " + K(f.median_rub) + " (×" + num(f.ratio) + ")" + (ex ? " · " + ex : ""),
           act: "yoy-fact", v: "", link: "Сравнить с прошлым годом →" };
}
function factsCard(){
  var f = facts(); if (!f || !f.facts.length || S.month !== f.month) return "";
  return '<div class="ui-card ui-mt-m"><div class="ui-kicker">На что взглянуть</div>' +
    f.facts.slice(0, 3).map(function(x, i){
      // факты о тратах открывают окно «к прошлому году» поверх Обзора (номер факта)
      var q = factText(x); if (q.act === "yoy-fact") q.v = String(i);
      // вся строка — кнопка (без ссылки справа: на телефоне она сжимала текст,
      // на компьютере в неё приходилось целиться); куда ведёт — в подсказке
      return '<div class="ui-row pick"' + cols("auto minmax(0,1fr) auto") + ' data-act="' + q.act + '" data-v="' + esc(q.v) + '" role="button" tabindex="0" title="' + esc(q.link.replace(" →", "")) + '">' +
        '<span class="ui-dot warn"></span><span class="ui-two"><span>' + esc(q.t) + '</span><span class="ui-note">' + esc(q.s) + '</span></span><span class="ui-chev">›</span></div>';

          return '<div class="ui-kv"><span class="ui-dot' + (x[2] ? " warn" : "") + '"></span><span class="ui-grow">' + esc(x[0]) + '</span><span class="ui-muted ui-r">' + esc(x[1]) + '</span></div>';
        }).join("") + placesNote +
      '</div>' +
      '<details class="ui-card ui-fold"><summary><span class="ui-grow"><span class="ui-kicker">Структура категорий</span>' +
        '<span class="ui-sub ui-faint ui-block">' + (cc ? "квартальная проверка · " + mTitle(month) : "проверка раз в квартал, ещё не проводилась") + '</span></span>' +
        '<span class="ui-chev">▾</span></summary>' +
        '<div class="ui-mt-s">' + qtr.map(function(x){
          return '<div class="ui-kv first"><span>' + x[0] + '</span><span class="ui-muted ui-num">' + (cc ? String(cc[x[1]] == null ? 0 : cc[x[1]]) : "—") + '</span></div>';
        }).join("") + '</div>' +
      '</details>' +
    '</div>';

  return tiles + sechead("По месяцам") + charts + sechead("Замечания по типам") + table + lower +
    (siteA ? '<p class="ui-note ui-mt-m" id="site-audit-line">сайт при загрузке отметил: ' + siteN(siteA) + '</p>' : '') +
    '<p class="ui-note ui-mt-l">Замечания исправляются в приложении ZenMoney; при следующем аудите они закроются здесь сами.</p>';
}

function tile(k, big, rest){ return '<div class="ui-card ui-tile"><div class="ui-kicker">' + k + '</div>' + big + rest + '</div>'; }
function sechead(t, aside){ return '<div class="ui-sechead"><h3>' + t + '</h3><span class="ui-rule"></span>' + (aside ? '<span class="ui-note">' + aside + '</span>' : '') + '</div>'; }
function empty(t, s, cls){ return '<div class="ui-empty"><div class="ui-empty-t">' + esc(t) + '</div><div class="ui-sub ui-mt-s' + (cls ? " " + cls : "") + '">' + esc(s) + '</div></div>'; }

/* мини-график: точки — кнопки (клик выбирает месяц), подсказка — title */
function spark(series, month, title, val, ymax, top, text){
  // ось — календарь: пропущенный месяц (аудита не было) оставляет место
  var cal = calRange(series[0].month, series[series.length - 1].month), n = series.length, nc = cal.length;
  var pts = series.map(function(x){
    var ci = cal.indexOf(x.month);
    var xx = nc === 1 ? 50 : 6 + ci * (88 / (nc - 1));
    var yy = 100 - Math.min(1, val(x) / ymax) * 100;
    return [xx, yy];
  });
  var hi = Math.max(0, series.map(function(x){ return x.month; }).indexOf(month));
  var sel = series[hi];
  return '<div class="ui-card acc"><div class="ui-sub ui-strong">' + title + '</div>' +
    '<div class="ui-spark">' +
      '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts.map(function(q){ return q[0] + "," + q[1]; }).join(" ") + '"/></svg>' +
      '<span class="ui-spark-top">' + top + '</span>' +
      series.map(function(x, i){
        return '<button type="button" class="ui-spark-pt' + (i === hi ? " on" : "") + '" data-act="month" data-v="' + x.month + '" style="left:' + pts[i][0] + '%; top:' + pts[i][1] + '%" title="' + esc(mTitle(x.month) + ": " + text(x)) + '" aria-label="' + esc(mTitle(x.month) + ": " + text(x)) + '"></button>';
      }).join("") +
      (n === 1 ? '<span class="ui-spark-empty">одна точка — тренда пока нет</span>' : '') +
    '</div>' +
    '<div class="ui-spark-x">' + cal.map(function(m){ var has = series.some(function(x){ return x.month === m; }); return '<span' + (has ? '' : ' class="ui-faint"') + '>' + SH[ym(m)[1]] + '</span>'; }).join("") + '</div>' +
    '<div class="ui-sep-top ui-text ui-num"><span><b class="ui-strong">' + mTitle(sel.month) + ':</b> <span class="ui-muted">' + esc(text(sel)) + '</span></span></div>' +
  '</div>';
}

/* ═══ вкладка «Траты» ══════════════════════════════════════════════════ */
/* id строки и графика категории — по названию, не по месту в списке: список
   сортируется по сумме выбранного месяца, и после клика по столбику «cat-3»
   оказывался другой категорией — якорь терялся, страница прыгала. */
function catKey(name){ return encodeURIComponent(name).replace(/%/g, "_"); }
function agg(list){
  var t = {}, cats = {}, subs = {}, trips = {}, mer = {}, rest = {}, ex = {}, ms = 0, me = 0, oneOff = [], kinds = true;
  list.forEach(function(m){
    Object.keys(m.totals).forEach(function(k){ t[k] = (t[k] || 0) + m.totals[k]; });
    (m.categories_regular || []).forEach(function(c){ cats[c.name] = (cats[c.name] || 0) + c.rub; });
    // подкатегории обычных трат (с 2026-10-06; в старых записях нет — блока не будет)
    (m.subcategories_regular || []).forEach(function(c){ var o = subs[c.parent] || (subs[c.parent] = {}); o[c.name] = (o[c.name] || 0) + c.rub; });
    (m.trips || []).forEach(function(c){ trips[c.name] = (trips[c.name] || 0) + c.rub; });
    /* С 2026-10 у места есть kind: обычное и разовое — разные строки, места
       поездок не пишутся. В старых записях kind нет — места общие. */
    if (!m.one_off) kinds = false;
    (m.merchants || []).forEach(function(c){
      if (c.kind === "one_off") return;
      /* «прочие» категории (с 2026-10-06): остальные места и траты без места —
         чтобы места категории в сумме давали её итог */
      if (c.rest){ var q = rest[c.category] || (rest[c.category] = { rub: 0, count: 0 }); q.rub += c.rub; q.count += c.count; return; }
      var key = c.name.toLowerCase().replace(/ё/g, "е") + "|" + c.category;
      var o = mer[key] || (mer[key] = { name: c.name, category: c.category, rub: 0, count: 0 });
      o.rub += c.rub; o.count += c.count;
    });
    var exm = m.excluded || {};
    Object.keys(exm).forEach(function(k){ var o = ex[k] || (ex[k] = { e: 0, i: 0 }); o.e += exm[k].expense_rub || 0; o.i += exm[k].income_rub || 0; });
    ms += (m.merchant_share_of_expense || 0) * m.totals.expense_rub; me += m.totals.expense_rub;
    // Разовые поштучно — из записи; в старых записях угадываем: одна покупка,
    // её место платежа совпадает с суммой.
    var oo = m.totals.expense_one_off_rub;
    if (m.one_off) m.one_off.forEach(function(c){ if (oneOff.indexOf(c.name) < 0) oneOff.push(c.name); });
    else if (oo > 0) (m.merchants || []).forEach(function(c){ if (Math.abs(c.rub - oo) < 1) oneOff.push(c.name); });
  });
  var merList = Object.keys(mer).map(function(k){ return mer[k]; }).sort(function(a, b){ return b.rub - a.rub; });
  return { t: t, cats: cats, subs: subs, trips: trips, mer: merList, ex: ex, mshare: me ? ms / me : 0, oneOff: oneOff, kinds: kinds, rest: rest };
}

/* Подпись отрезка месяцев: «Сентябрь 2026», «Июль–сентябрь 2026»,
   «Ноябрь 2025 – январь 2026». */
function span(list){
  var a = ym(list[0].month), b = ym(list[list.length - 1].month);
  if (list.length === 1) return mTitle(list[0].month);
  if (a[0] === b[0]) return cap(NOM[a[1]]) + "–" + NOM[b[1]] + " " + a[0];
  return cap(NOM[a[1]]) + " " + a[0] + " – " + NOM[b[1]] + " " + b[0];
}
/* Окно периода, который кончается месяцем all[i]: что показываем (sel), с чем
   сравниваем (prior) и как называем. Месяц — к среднему за 3 прошлых; 3 месяца —
   к трём перед ними; год — календарный, к прошлому году (в среднем за месяц). */
var FULL = { month: 1, "3m": 3, year: 12 };
/* Месяцы считаются ПО КАЛЕНДАРЮ, а не по записям: история бывает с пропусками
   (не закрыт март — в spending.json его нет). «3 месяца до» = три календарных
   месяца до, из них — те, что закрыты; соседние записи «февраль, апрель» —
   не соседние месяцы. */
function addM(m, k){ var a = ym(m), d = a[0] * 12 + a[1] + k; return Math.floor(d / 12) + "-" + String(d % 12 + 1).padStart(2, "0"); }
function inCal(all, from, to){ return all.filter(function(x){ return x.month >= from && x.month <= to; }); }
function calRange(from, to){ var out = []; for (var m = from; m <= to; m = addM(m, 1)) out.push(m); return out; }
function calLabel(from, to){
  var a = ym(from), b = ym(to);
  if (from === to) return mTitle(from);
  if (a[0] === b[0]) return cap(NOM[a[1]]) + "–" + NOM[b[1]] + " " + a[0];
  return cap(NOM[a[1]]) + " " + a[0] + " – " + NOM[b[1]] + " " + b[0];
}
function spendWindow(all, i, period){
  var m = all[i].month;
  if (period === "3m"){
    return { sel: inCal(all, addM(m, -2), m), prior: inCal(all, addM(m, -5), addM(m, -3)), label: calLabel(addM(m, -2), m), full: 3 };
  }
  if (period === "year"){
    var y = ym(all[i].month)[0];
    return { sel: all.filter(function(m){ return ym(m.month)[0] === y; }),
             prior: all.filter(function(m){ return ym(m.month)[0] === y - 1; }), label: y + " год", year: y };
  }
  return { sel: [all[i]], prior: inCal(all, addM(m, -3), addM(m, -1)), label: mTitle(m) };
}
function regSum(list){ return list.reduce(function(s, m){ return s + (m.totals.expense_regular_rub || 0); }, 0); }

function tabSpend(){
  var all = (S.Sp && S.Sp.months) || [];
  if (!all.length) return empty("Статистики трат пока нет", "Скажи Claude «закрой месяц» — итоги месяца появятся здесь.");
  if (S.period === "years") return tabYears(all);
  var si = all.map(function(m){ return m.month; }).indexOf(S.month);
  if (si < 0) return head(mTitle(S.month)) + empty("Итогов за " + NOM[ym(S.month)[1]] + " нет", "Есть только аудит учёта. Скажи Claude «закрой " + NOM[ym(S.month)[1]] + "».");
  var multi = S.period !== "month";
  var win = spendWindow(all, si, S.period), sel = win.sel, prior = win.prior;
  var a = agg(sel), t = a.t, nm = sel.length;
  var reg = t.expense_regular_rub || 0;
  var avgPrior = prior.length ? regSum(prior) / prior.length : 0;
  var d = avgPrior ? (reg / nm) / avgPrior - 1 : 0;
  var hasTrip = sel.some(function(m){ return (m.trips || []).some(function(x){ return x.rub > 0; }); });
  var vs = S.period === "3m" ? "в месяц к трём месяцам до"
         : S.period === "year" ? "в месяц к " + (win.year - 1) + " году"
         : "к среднему за " + range(prior);
  var perMonth = multi ? (nm < FULL[S.period] ? "данных за " + pl(nm, ["месяц", "месяца", "месяцев"]) + " · " : "") + "в среднем " + K(reg / nm) + " в месяц" : "";

  // ── 3 плитки: обычные · все расходы · доходы и остаток ──
  var cmpNote = hasTrip && d < 0 ? "часть времени в поездке — еда и транспорт шли в поездку"
              : (!hasTrip && t.expense_one_off_rub > 0 ? "разовые покупки в сравнение не входят" : "");
  var left = t.income_rub - t.expense_rub;
  var tiles = '<div class="ui-grid kpi">' +
    '<div class="ui-card ui-tile acc"><div class="ui-kicker">Обычные траты</div>' +
      '<div class="ui-big">' + K(reg) + '</div>' +
      (perMonth ? '<div class="ui-sub">' + perMonth + '</div>' : '<div class="ui-sub">без поездок и разовых покупок</div>') +
      (prior.length ? '<div class="ui-sub"><b class="ui-strong' + (d > 0.05 ? " ui-up" : d < -0.05 ? " ui-down" : "") + '">' + (d > 0 ? "+" : d < 0 ? "−" : "") + Math.round(Math.abs(d) * 100) + '%</b> ' + vs + ' (' + K(avgPrior) + ')</div>'
                    : '<div class="ui-sub">сравнивать пока не с чем</div>') +
      (cmpNote ? '<div class="ui-note">' + cmpNote + '</div>' : '') + '</div>' +
    '<div class="ui-card ui-tile"><div class="ui-kicker">Все расходы</div>' +
      '<div class="ui-big">' + K(t.expense_rub) + '</div>' +
      '<div class="ui-sub">поездки ' + K(t.expense_trips_rub || 0) + ' · разовые ' + K(t.expense_one_off_rub || 0) + '</div>' +
      '<div class="ui-note">как в приложении (только счета в балансе) — ' + K(t.expense_in_balance_rub || 0) + '</div></div>' +
    '<div class="ui-card ui-tile"><div class="ui-kicker">Доходы и остаток</div>' +
      '<div class="ui-big">' + K(t.income_rub) + '</div>' +
      '<div class="ui-sub">осталось <b class="ui-strong' + (left < 0 ? " ui-up" : "") + '">' + K(left) + '</b>' + (t.income_rub ? ' · ' + Math.round(left / t.income_rub * 100) + '% дохода' : '') + '</div>' +
      '<div class="ui-note">расходы без инвестиций, кешбэка, корректировок и расчётов с партнёром</div></div>' +
  '</div>';

  // ── один график месяцев: «Траты | Остаток» ──
  // строка выбранного периода: разбивка, которую в столбик не вписать (и на
  // телефоне — единственный способ увидеть части без наведения)
  // числа — жирным того же размера, подписи — приглушённые
  function bv(x){ return '<b class="ui-strong">' + x + '</b>'; }
  var read = S.chart === "net"
    ? '<b class="ui-strong">' + win.label + ':</b> <span class="ui-muted">осталось</span> ' + bv(K(left)) + (t.income_rub ? ' <span class="ui-muted">·</span> ' + bv(Math.round(left / t.income_rub * 100) + '%') + ' <span class="ui-muted">дохода</span>' : '') +
      ' <span class="ui-muted">· доходы</span> ' + bv(K(t.income_rub)) + ' <span class="ui-muted">· расходы</span> ' + bv(K(t.expense_rub))
    : '<b class="ui-strong">' + win.label + ':</b> <span class="ui-muted">всего</span> ' + bv(K(t.expense_rub)) + ' <span class="ui-muted">· обычные</span> ' + bv(K(reg)) +
      ' <span class="ui-muted">· поездки</span> ' + bv(K(t.expense_trips_rub || 0)) + ' <span class="ui-muted">· разовые</span> ' + bv(K(t.expense_one_off_rub || 0)) +
      (!multi && prior.length ? ' <span class="ui-muted">· среднее обычных</span> ' + bv(K(avgPrior)) : '');
  var chart = '<div class="ui-card">' +
    '<div class="ui-head split flat"><span class="ui-text">' + (S.chart === "net"
        ? '<b class="ui-strong">Осталось от дохода по месяцам</b>'
        : '<b class="ui-strong">Траты по месяцам</b>') + '</span>' +
      segHTML("chart", [["spend", "Траты"], ["net", "Остаток"]], S.chart, true) + '</div>' +
    '<div class="ui-text ui-num ui-mt-s">' + read + '</div>' +
    colChart({ all: all, sel: sel, id: "dyn", mode: S.chart === "net" ? "net" : "spend" }) +
    (S.chart === "net" ? "" : '<div class="ui-r ui-mt-s"><button type="button" class="ui-link" data-act="yoy" data-v="" data-end="' + sel[sel.length - 1].month + '" data-sel="' + sel.map(function(m){ return m.month; }).join(",") + '">Обычные траты к прошлому году →</button></div>') + '</div>';

  // ── категории: ₽, доля, мини-тренд, отклонение; клик — история и места ──
  var cr = catRows(a.cats, prior, nm), cmax = cr.length ? cr[0][1] : 1;
  var devShow = prior.length >= 3;
  var trend = calRange(addM(sel[sel.length - 1].month, -5), sel[sel.length - 1].month);
  var byM = {}; all.forEach(function(m){ byM[m.month] = m; });
  // метки фактов — когда период доходит до месяца, на который они посчитаны
  var F_ = facts(), showFlags = !!F_ && sel.some(function(m){ return m.month === F_.month; });
  var cats = '<div class="ui-card flush">' +
    '<div class="ui-row ui-catrow head"><span>Категория</span><span class="c-bar"></span><span class="ui-r">тыс. ₽</span><span class="ui-r c-share">доля</span><span class="c-trend">6 мес.</span><span class="ui-r">' + (devShow ? "к среднему" : "") + '</span>' +
      // стрелка «все»: раскрыта хоть одна — свернуть все, иначе раскрыть все
      (function(){ var any = cr.some(function(c){ return S.catOpen[c[0]]; });
        return '<button type="button" class="ui-chev ui-chev-all" id="cat-all" data-act="cat-all" data-v="' + (any ? "close" : "open") + '" aria-label="' + (any ? "Свернуть все категории" : "Раскрыть все категории") + '" title="' + (any ? "Свернуть все" : "Раскрыть все") + '">' + (any ? "▴" : "▾") + '</button>'; })() + '</div>' +
    cr.map(function(c, ci){
      var open = !!S.catOpen[c[0]];   // раскрытых может быть несколько — соседние не схлопываются
      var tr = trend.map(function(mm){
        var m = byM[mm]; if (!m) return { gap: true };
        var x = (m.categories_regular || []).filter(function(q){ return q.name === c[0]; })[0];
        return { v: x ? x.rub : 0, on: mm === sel[sel.length - 1].month || sel.some(function(q){ return q.month === mm; }) };
      });
      var tmax = Math.max.apply(null, tr.map(function(q){ return q.gap ? 0 : q.v; })) || 1;
      var devTxt = c[4] != null && c[2] !== "≈" ? (c[4] > 0 ? "+" : "−") + k1(Math.abs(c[4])) + ' тыс. <span class="ui-faint">' + c[2].replace(/[↑↓] /, c[4] > 0 ? "+" : "−") + '</span>' : c[2];
      var row = '<div class="ui-row ui-catrow pick' + (open ? " on" : "") + '" id="cr-' + catKey(c[0]) + '" data-act="cat" data-v="' + esc(c[0]) + '" role="button" tabindex="0" aria-expanded="' + open + '">' +
        '<span class="ui-ell" title="' + esc(c[0]) + '">' + esc(shortCat(c[0])) + (showFlags ? flagMark(c[0]) : "") + '</span>' +
        '<span class="ui-bar c-bar"><i' + w(c[1] / cmax * 100) + '></i></span>' +
        '<span class="ui-r ui-strong">' + k1(c[1]) + '</span>' +
        '<span class="ui-r ui-note c-share">' + Math.round(c[1] / (reg || 1) * 100) + '%</span>' +
        '<span class="ui-minibars c-trend">' + tr.map(function(q){ return q.gap ? '<i class="gap"></i>' : '<i class="' + (q.on ? "on" : "") + '" style="height:' + (q.v / tmax * 100).toFixed(1) + '%"></i>'; }).join("") + '</span>' +
        '<span class="ui-r ui-note ' + c[3] + '">' + devTxt + '</span>' +
        '<span class="ui-chev">' + (open ? "▴" : "▾") + '</span></div>';
      if (!open) return row;
      var mer = a.mer.filter(function(m){ return m.category === c[0]; });
      // за период: 6 крупнейших, остальное — одной строкой «прочие» вместе с тратами без места
      var oth = { rub: 0, count: 0 }, rc = a.rest[c[0]];
      if (rc){ oth.rub += rc.rub; oth.count += rc.count; }
      mer.slice(6).forEach(function(m){ oth.rub += m.rub; oth.count += m.count; });
      var merRow = function(name, m, cls){ return '<div class="ui-kv' + (cls || "") + '"><span class="ui-ell">' + esc(name) + '</span><span class="ui-r"><span class="ui-sub">' + pl(m.count, ["покупка", "покупки", "покупок"]) + '</span> <b class="ui-strong">' + k1(m.rub) + '</b></span></div>'; };
      return '<div class="ui-catopen' + (S.catFresh && S.catFresh[c[0]] ? " fresh" : "") + '">' + row + '<div class="ui-catdetail">' + (showFlags ? catFacts(c[0]) : "") + '<div class="ui-grid">' +
        '<div><div class="ui-head split flat"><span class="ui-kicker">' + esc(shortCat(c[0])) + ' по месяцам</span>' +
          '<button type="button" class="ui-link" data-act="yoy" data-v="' + esc(c[0]) + '" data-end="' + sel[sel.length - 1].month + '" data-sel="' + sel.map(function(m){ return m.month; }).join(",") + '">к прошлому году →</button></div>' + colChart({ all: all, sel: sel, id: "cat-" + catKey(c[0]), mode: "cat", cat: c[0], compact: true }) +
          subList(a.subs[c[0]], c[1]) + '</div>' +
        '<div><div class="ui-kicker">Где платил</div>' +
          (mer.length ? mer.slice(0, 6).map(function(m){ return merRow(m.name, m); }).join("")

/* ═══ «Траты» → «Все годы» ═══════════════════════════════════════════════
   Годы рядом: в среднем в месяц по закрытым месяцам года (неполный год так
   сравним с полными), итог года — в подписи. Столбик года — обычные + поездки +
   разовые, линия — доход в месяц. Клик по году — режим «Год» на этом годе.
   Ниже — крупные категории по годам маленькими графиками (метка — факт). */
function yearRows(all){

  return Object.keys(by).sort().map(function(y){

    return { y: y, ms: ms, n: n, a: a, reg: (t.expense_regular_rub || 0) / n, trips: Math.max(0, t.expense_trips_rub || 0) / n,

  });
}

             '<path class="alt" d="' + smoothPath(rows.map(function(r, i){ return [(i + 0.5) / n * 100, +yPct(Math.max(0, r.inc - r.exp))]; })) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>' : '') + '</svg>';

  return out;

function mf(v){
  if (v == null || v === "") return "—";
  return String(v).replace(/-?\d+(?:\.\d+)?/g, function(t){
    var neg = t.charAt(0) === "-", p = (neg ? t.slice(1) : t).split(".");
    return (neg ? "−" : "") + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (p[1] ? "," + p[1] : "");

function stmtDate(d){ return /^\d{4}-\d\d-\d\d$/.test(d || "") ? d.slice(8) + "." + d.slice(5, 7) + "." + d.slice(0, 4) : (d || "без даты"); }
function stmtUpload(file){
  S.stmt.err = null; S.stmt.report = null;
  if (file.size > STMT_MAX){ S.stmt.err = "Файл больше 8 МБ — выписка банка обычно в разы меньше. Проверь, тот ли файл выбран."; render(); return; }
  S.stmt.busy = "Читаю файл…"; render();
  csvB64(file).then(function(b64){
    S.stmt.busy = "Загружаю " + file.name + "…"; render();
    return zmPost("stmt", { name: file.name, b64: b64 });
  }).then(function(x){
    if (!x) return;
    if (x.status !== 200 || !x.j || !x.j.id){
      S.stmt.busy = null; S.stmt.err = "Выписка не принята: " + (x.status === 413 ? "файл слишком большой" : zmErr(x)); render(); return;
    }
    S.stmt.busy = "Разбираю выписку…"; render();

      S.stmt.busy = null;

  // с «Трат» окно открывается на месяцах выбранного периода (месяц / 3 месяца / год)
  yoy: function(v, el){
    var o = {}; (el.getAttribute("data-sel") || "").split(",").forEach(function(m){ if (m) o[m] = 1; });
    set({ yoy: [{ cat: v || null, end: el.getAttribute("data-end"), sel: o, subOpen: {}, fi: null }], yoyFresh: 0 }); },
  // в окне: месяц выбрать / снять (пусто — все 12), подкатегория — её места, категория — её окно поверх
  "yoy-m": function(v, el){ var Y = S.yoy[+el.getAttribute("data-i")], o = {}, k; for (k in Y.sel) o[k] = 1;
    if (!v) o = {}; else if (o[v]) delete o[v]; else o[v] = 1; Y.sel = o; render(); },
  "yoy-sub": function(v, el){ var Y = S.yoy[+el.getAttribute("data-i")], o = {}, k; for (k in Y.subOpen) o[k] = 1;
    if (o[v]) delete o[v]; else o[v] = 1; Y.subOpen = o; render(); },
  // окно категории поверх — со своим выбором месяцев (нижнее окно не трогает)
  "yoy-cat": function(v, el){ var i = +el.getAttribute("data-i"), Y = S.yoy[i];
    set({ yoy: S.yoy.slice(0, i + 1).concat([{ cat: v, end: Y.end, sel: {}, subOpen: {}, fi: null }]), yoyFresh: i + 1 }); },
  // плитка категории в «Все годы»: окно категории; есть факт о ней — с его месяцами
  "yoy-tile": function(v){
    var F = facts(), fi = F ? F.facts.map(function(f){ return f.category; }).indexOf(v) : -1, all = (S.Sp && S.Sp.months) || [];
    if (fi >= 0) return ACTS["yoy-fact"](String(fi));
    if (all.length) set({ yoy: [{ cat: v, end: all[all.length - 1].month, sel: {}, subOpen: {}, fi: null }], yoyFresh: 0 });
  },
  // факт → окно поверх Обзора; у факта о категории выбраны его месяцы (если они в окне 12 месяцев)
  "yoy-fact": function(v){
    var F = facts(), f = F && F.facts[+v]; if (!f) return;
    var o = {};
    if (f.category && f.window) calRange(f.window[0], f.window[1]).forEach(function(m){ if (m > addM(F.month, -12)) o[m] = 1; });
    set({ yoy: [{ cat: f.category || null, end: F.month, sel: o, subOpen: {}, fi: +v }], yoyFresh: 0 });
  },
  // закрыть окно этого слоя (и всё, что поверх него)
  "yoy-close": function(v, el){ yoyPop(+el.getAttribute("data-i")); },
  cmp: function(){ set({ cmpAll: !S.cmpAll }); },
  // переходы с Обзора и из «Всех лет»: на «Траты» последнего месяца
  "go-net": function(){ goSpend({ period: "month", chart: "net" }); },
  "go-cat": function(v){ var o = {}; for (var k in S.catOpen) o[k] = 1; o[v] = 1; goSpend({ period: "month", catOpen: o }); },
  "year-open": function(v){ set({ period: "year", month: v }); uiScrollTop(); }
};
/* Закрыть окна от слоя i и выше: верхнее плавно уходит, окно под ним плавно
   возвращается на место (ui-kit 1.36.0 uiStackPop), потом — перерисовка. */
function yoyPop(i){
  uiStackPop(document.querySelectorAll(".ui-modal"), i, function(){ set({ yoy: S.yoy.slice(0, i) }); });
}
function goSpend(p){
  var all = (S.Sp && S.Sp.months) || [];
  try { localStorage.setItem("money-tab", "spend"); } catch(e){}
  p.tab = "spend"; if (all.length) p.month = all[all.length - 1].month;
  S.dynScrolled = false; set(p); uiScrollTop();
}
/* Кнопку темы ведёт ui-kit (uiSetTheme: атрибут, hub-theme, подписи); здесь —
   перерисовка: узор фона берёт цвет из токена новой темы. */
document.addEventListener("ui-theme", function(ev){ set({ theme: ev.detail }); });
document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el || !ACTS[el.getAttribute("data-act")]) return;
  ev.preventDefault();
  ACTS[el.getAttribute("data-act")](el.getAttribute("data-v"), el);
});
// Слой страницы (ui-kit uiLayerBind): Escape и меню при открытых окнах «к прошлому году»
uiLayerBind({
  depth: function(){ return S.yoy.length; },
  closeTop: function(){ if (!S.yoy.length) return false; yoyPop(S.yoy.length - 1); },
  closeAll: function(){ set({ yoy: [] }); }
});
document.addEventListener("keydown", function(ev){
  if (ev.key !== "Enter" && ev.key !== " ") return;
  var el = ev.target;
  if (!el.matches || !el.matches('[role="button"][data-act]')) return;
  ev.preventDefault();
  ACTS[el.getAttribute("data-act")](el.getAttribute("data-v"), el);
});
document.addEventListener("ui-select", function(ev){
  if (ev.detail.name === "month") set({ month: ev.detail.value });
  else if (ev.detail.name === "trip") set({ tripId: ev.detail.value });
});

render();
start();
})();
</script>
</body>
</html>
