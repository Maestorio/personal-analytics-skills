function productsResults() {
  var q = S.productQuery.toLowerCase().replace(/ё/g, "е").trim();
  var list = S.products.filter(function (p) {
    if (S.deptFilter !== "all" && deptKey(p.category) !== S.deptFilter) return false;
    if (!q) return true;
    var hay = ((p.name || "") + " " + (p.aliases || []).join(" ")).toLowerCase().replace(/ё/g, "е");
    return hay.indexOf(q) >= 0;
  }).slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ru"); });

  var rows = list.map(function (p) {
    /* Фасовка + КБЖУ одной строкой: обе цифры отвечают на один вопрос —
       «что я беру с полки и чем оно обернётся». Разносить их по строкам
       значит заставлять сканировать карточку глазами. packOf, а не прямое
       поле: он же читает легаси-формы (stores[] / плоская пара). */
    var pk = packOf(p);
    var packTxt = pk != null ? "фасовка " + fmtQty(pk, p.unit) : "";
    var kcalTxt = deptKey(p.category) === "nonfood"
      /* У «не еды» КБЖУ нет по определению — «не задано» тут врало бы намёком
         «надо заполнить». Пусто → строка КБЖУ просто не рисуется. */
      ? ""
      /* КБЖУ ВСЕГДА на 100 г — так на этикетке и так задаётся у продукта, а
         объём (мл) в вес переводит плотность g_per_100ml. Раньше строка брала
         единицу продукта и у масла писала «898 ккал/100 мл» — вдвойне неверно:
         и базис не тот (число-то на 100 г), и единица. */
      : (p.nutrition_100g && p.nutrition_100g.kcal != null)
        ? p.nutrition_100g.kcal + " ккал/100 г"
        /* Пусто — часто осознанно: у кефира и фарша КБЖУ задаёт производитель.
           Говорим об этом, а не оставляем немую строку. */
        : "КБЖУ не задано";
    var pack = '<div class="num" style="font-size:12px; color:var(--text-faint); margin-top:5px;">' +
      esc([packTxt, kcalTxt].filter(Boolean).join(" · ")) +
      (p.cooked_ratio ? esc(" · из 1 г сухого " + trimNum(p.cooked_ratio) + " г готового") : "") +
      (p.piece_g ? esc(" · 1 шт ≈ " + trimNum(p.piece_g) + " г") : "") + '</div>';
    /* КБЖУ прямо в строке: иначе, чтобы понять, чем набирается блюдо, надо
       открыть карточку — а решение «брать или не брать» принимается здесь. */
    var shelf = (p.shelf_note || p.last_bought)
      ? '<div class="num" style="font-size:12px; color:var(--text-faint); margin-top:3px;">' +
        (p.shelf_note ? 'хранение ' + esc(p.shelf_note) : '') +
        (p.shelf_note && p.last_bought ? ' · ' : '') +
        (p.last_bought ? esc(agoLabel(p.last_bought)) : '') + '</div>'
      : '';
    var aliases = (p.aliases && p.aliases.length)
      ? '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:9px;">' +
        '<span style="font-size:10px; color:var(--text-faint); align-self:center;">ещё зовём:</span>' +
        p.aliases.map(function (a) {
          return '<span style="font-size:11px; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:999px; padding:2px 9px;">' + esc(a) + '</span>';
        }).join("") + '</div>'
      : '';
    /* «Используется в рецептах» — теми же чипами, что «ещё зовём». Отвечает на
       вопрос «можно ли удалить этот продукт»: сразу видно, что осиротеет.
       Чип — ссылка на рецепт. */
    var uses = recipesUsing(p.id);
    var usedIn = uses.length
      ? '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; align-items:center;">' +
        '<span style="font-size:10px; color:var(--text-faint);">в рецептах:</span>' +
        uses.map(function (r) {
          return '<span data-act="open-recipe" data-arg="' + attr(r.id) + '" style="font-size:11px; color:var(--c-2); background:var(--c2-bg); border-radius:999px; padding:2px 9px; cursor:pointer;">' + esc(r.title) + '</span>';
        }).join("") + '</div>'
      : '';
    /* Тап по телу строки открывает КАРТОЧКУ товара (просмотр), а не редактор:
       смотреть КБЖУ и характеристики нужно чаще, чем править, и без прав на
       запись карточка — единственный способ увидеть всё разом. Вложенные
       чипы рецептов сохраняют свой data-act — делегирование берёт ближайший. */
    return '<div class="row-hover" style="display:flex; align-items:flex-start; gap:14px; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;">' +
      '<div data-act="prod-card" data-arg="' + attr(p.id) + '" title="карточка товара" style="flex:1; min-width:0; cursor:pointer;">' +
        '<div style="display:flex; align-items:center; gap:9px; flex-wrap:wrap;">' +
          '<span style="font-family:var(--font-serif); font-size:17px; font-weight:600;">' + esc(p.name) + '</span>' +
          '<span class="num" style="font-size:11px; color:var(--text-muted); background:var(--bg-alt); border-radius:999px; padding:2px 9px;">' + esc(deptLabel(p.category)) + '</span>' +
          (p.staple ? '<span style="font-size:10.5px; font-weight:600; color:var(--success); background:var(--success-bg); border-radius:999px; padding:2px 9px;">всегда есть дома</span>' : '') +
        '</div>' + pack + shelf + aliases + usedIn +
      '</div>' +
      (S.writable ? '<button class="fchip" data-act="prod-edit" data-arg="' + attr(p.id) + '" style="flex:none; min-height:32px; padding:6px 13px; font-size:11.5px;">править</button>' : '') +
    '</div>';
  }).join("");

  return '<div style="display:flex; flex-direction:column; gap:10px;">' + rows + '</div>' +
    (list.length ? "" : '<div style="text-align:center; color:var(--text-faint); font-size:13px; padding:40px 0;">Ничего не нашлось в этом отделе.</div>');
}

/* ═══════════════════════ модалка правки продукта ═════════════════════════ */
/* поле формы — общее ui-kit (uiFieldHTML): подсказка после названия */
function fld(label, name, value, ph, span, hint) {
  return uiFieldHTML({ label: label, id: "f-" + name, value: value, ph: ph, span: span || 1, hint: hint });
}
function modal(title, sub, inner, saveAct, extraFoot) {
  /* окно формы — общее ui-kit (uiModalHTML): шапка и кнопки закреплены,
     прокручиваются только поля, на телефоне — во весь экран */
  return uiModalHTML({ title: title, sub: sub, body: inner, close: "close-modal",
                       save: saveAct, footLeft: extraFoot || "" });
}
function prodModal() {
  var p = S.prodEdit;
  /* «Бытовое» (пакеты, батарейки, зубочистки) — не продукт: КБЖУ, разваривание,
     грамм-в-штуке и срок хранения к нему неприменимы (хозтовар не портится).
     Прячем эти поля целиком, чтобы форма не просила заполнить то, чего у товара
     нет (карточка списка их уже не рисует). Скрытие живое: тап по чипу отдела
     ре-рендерит модалку. Отсутствие полей в DOM readProdForm читает как null —
     при переводе продукта в «не еду» старые значения сами обнулятся при
     сохранении. */
  var isNonfood = deptKey(p.category) === "nonfood";
  /* Отдел — чипами, а не <select>: вариантов десять, они короткие, и выбор
     одним тапом важнее экономии места. Плюс на телефоне нативный селект
     открывает колесо на пол-экрана. Текущее значение хранится в скрытом
     поле — форма снимается одним и тем же способом (см. readProdForm). */
  var depts = DEPTS.slice(1).map(function (d) {
    var on = (p.category || "") === d[1];
    return '<button class="fchip" data-act="prod-dept" data-arg="' + attr(d[1]) + '" style="min-height:32px; padding:6px 13px; font-size:12px;' +
      (on ? " color:var(--c-2); border-color:var(--c-2); background:var(--c2-bg); font-weight:600;" : "") + '">' + esc(d[1]) + '</button>';
  }).join("");

  /* Единица фасовки — та же, что у продукта. Без неё поле «180» не читается:
     180 граммов или 180 штук? Показываем суффиксом прямо в поле и обновляем
     живьём при правке «Единицы» выше. packOf, а не прямое поле — редактор
     обязан показать и легаси-формы (stores[] до 2026-08-01). */
  var pu = (p.unit || "").trim();
  var pkVal = packOf(p);
  var packField = uiFieldHTML({ label: "В упаковке", id: "f-pack", value: pkVal, ph: "—", inputmode: "decimal",
    suffix: pu, suffixCls: "pack-unit", hint: "сколько в одной пачке; пусто — на вес. Даёт «уп.» в списке покупок" });

  var nu = p.nutrition_100g || {};
  function nuFld(label, key) {
    return '<label style="display:block;"><span style="font-size:10px; color:var(--text-faint); display:block; margin-bottom:3px;">' + esc(label) + '</span>' +
      '<input class="fld" style="padding:8px 10px;" id="f-nu-' + key + '" value="' + attr(nu[key] == null ? "" : nu[key]) + '"></label>';
  }

  var inner =
    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">' +
      fld("Название", "name", p.name, "Говяжий фарш", 2) +
      '<div style="grid-column:span 2;"><span class="fld-lbl">Отдел</span>' +
        '<input type="hidden" id="f-category" value="' + attr(p.category || "") + '">' +
        '<div style="display:flex; gap:7px; flex-wrap:wrap;">' + depts + '</div></div>' +
      fld("Единица", "unit", p.unit, "г / мл / шт", 1,
          "в чём считаем: г, мл или шт") +
      packField +
      (isNonfood ? "" :
        '<div style="grid-column:span 2;"><span class="fld-lbl">КБЖУ на 100 г продукта <span class="fld-hint">· как на этикетке — на 100 г, не на упаковку. Из этих чисел считается КБЖУ блюда</span></span>' +
        '<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">' +
          nuFld("ккал", "kcal") + nuFld("Б, г", "protein_g") +
          nuFld("Ж, г", "fat_g") + nuFld("У, г", "carb_g") +
        '</div>' +
        /* Именно на 100 г, а не на упаковку и не на порцию: так пишут на
           этикетке, и только так значения складываются между продуктами.
           КБЖУ одно на продукт — от магазина оно не зависит. */
      '</div>') +
      (isNonfood ? "" : fld("Хранение", "shelf_note", p.shelf_note, "3–4 дня", 1, "справка, без расчётов")) +
      (isNonfood ? "" : fld("Разваривание", "cooked_ratio", p.cooked_ratio, "2,5", 1, "из 1 г сухого — N г готового")) +
      /* Поле перевода в граммы — по семье единицы (см. unitFamily). Штучные:
         «г в 1 шт». Жидкости: «г в 100 мл» (плотность). Весовые (г/кг): поля нет,
         перевод не нужен. Подпись меняется живьём при смене «Единицы». */
      (isNonfood || convKind(p.unit) === "" ? "" :
        convKind(p.unit) === "volume"
          ? fld("Граммов в 100 мл", "conv", p.g_per_100ml, "103", 1, "плотность: молоко ~103, масло ~92 · чтобы КБЖУ жидкостей считалось без «мл ≈ г»")
          : fld("Граммов в 1 шт", "conv", p.piece_g, "60", 1, "1 шт ≈ N г · чтобы «2 яйца» попали в КБЖУ, а продукт можно было класть в список штуками")) +
      fld("Другие названия", "aliases", (p.aliases || []).join(", "), "жёлтый лук, лук", 2,
          "через запятую; по ним рецепт найдёт этот продукт") +
      fld("Заметка", "note", p.note, "", 2) +
      '<label style="grid-column:span 2; display:flex; align-items:center; gap:10px; font-size:13.5px; cursor:pointer;">' +
        '<input type="checkbox" id="f-staple"' + (p.staple ? " checked" : "") + ' style="width:18px; height:18px;">' +
        '<span>Всегда есть дома <span style="color:var(--text-faint);">— при планировании галочка «купить» снята по умолчанию</span></span>' +
      '</label>' +
    '</div>';
  return modal(p.id ? "Продукт" : "Новый продукт", p.name || "", inner, "prod-save",
               p.id ? '<button class="ui-btn danger" data-act="prod-del" style="margin-right:auto;">Удалить</button>' : "");
}

/* Форма → запись. Object.assign поверх существующей, а НЕ сборка с нуля: у
   продукта есть ключи, которых нет в форме (last_bought, from-связи), и
   правка рукой не должна их терять. */
function readProdForm() {
  var v = function (n) { var e = document.getElementById("f-" + n); return e ? e.value.trim() : ""; };
  var num = function (n) { var t = v(n).replace(",", "."); return t === "" ? null : (isNaN(parseFloat(t)) ? null : parseFloat(t)); };
  var nu = {}, any = false;
  ["kcal", "protein_g", "fat_g", "carb_g"].forEach(function (k) {
    var x = num("nu-" + k);
    if (x != null) { nu[k] = x; any = true; }
  });
  var chk = document.getElementById("f-staple");
  /* Единое поле перевода f-conv раскладывается по семье единицы: шт → piece_g,
     мл/л → g_per_100ml. Весовая/пустая единица поле не рендерит — тогда оба
     ключа НЕ трогаем (Object.assign сохранит прежние), чтобы правка не стёрла
     их. У штучного продукта g_per_100ml обнуляем и наоборот — одна единица =
     один перевод. */
  var uf = convKind(v("unit")), conv = num("conv"), convFields = {};
  if (uf === "piece") { convFields.piece_g = conv; convFields.g_per_100ml = null; }
  else if (uf === "volume") { convFields.g_per_100ml = conv; convFields.piece_g = null; }
  var out = Object.assign({}, S.prodEdit, {
    name: v("name"), category: v("category"), unit: v("unit"),
    shelf_note: v("shelf_note"), cooked_ratio: num("cooked_ratio"),
    note: v("note"), staple: !!(chk && chk.checked), pack_size: num("pack"),
    nutrition_100g: any ? nu : null,
    aliases: v("aliases").split(",").map(function (t) { return t.trim().toLowerCase(); })
               .filter(function (t) { return t; })
  }, convFields);
  /* Легаси-формы (stores[] и плоский store) уезжают при сохранении:
     pack_size на продукте — единственный источник. Оставить их значило бы
     держать два места правды, которые разъедутся. */
  delete out.store; delete out.stores;
  return out;
}

/* ═══════════════════════ карточка товара (просмотр) ══════════════════════ */
/* Тап по продукту в каталоге открывает ПРОСМОТР, а не редактор: смотреть
   КБЖУ и характеристики нужно чаще, чем править, а без прав на запись
   карточка — единственный способ увидеть всё разом. Та же модальная рамка,
   что у правки, но без формы — глазам не приходится переучиваться. */
function prodCardModal() {
  var p = productById(S.prodCard);
  if (!p) return "";
  var nonfood = deptKey(p.category) === "nonfood";
  var nu = !nonfood && p.nutrition_100g ? p.nutrition_100g : null;
  var pk = packOf(p);

  function tile(lbl, val) {
    return '<div style="background:var(--bg-alt); border:1px solid var(--border); border-radius:8px; padding:10px 8px; text-align:center;">' +
      '<div class="num" style="font-size:18px; font-weight:600;">' + esc(val) + '</div>' +
      '<div style="font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-top:3px;">' + esc(lbl) + '</div>' +
    '</div>';
  }
  var nuBlock = "";
  if (nu && nu.kcal != null) {
    /* Производные от КБЖУ — в подписи, не отдельными строками: «вся пачка =
       N ккал» отвечает на бытовой вопрос («съесть упаковку творога — это
       сколько?») из уже известных чисел, ничего нового не храня. */
    var derived = [];
    if (pk != null && (normUnit(p.unit) || "г") === "г") derived.push("упаковка " + fmtQty(pk, p.unit) + " ≈ " + trimNum(Math.round(nu.kcal * pk / 100)) + " ккал");
    if (p.piece_g) derived.push("1 шт ≈ " + trimNum(Math.round(nu.kcal * p.piece_g / 100)) + " ккал");
    nuBlock =
      '<div style="margin-bottom:16px;">' +
        '<div style="font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); font-weight:700; margin-bottom:8px;">КБЖУ на 100 г</div>' +
        '<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">' +
          tile("ккал", trimNum(nu.kcal)) +
          tile("белки", nu.protein_g != null ? trimNum(nu.protein_g) : "—") +
          tile("жиры", nu.fat_g != null ? trimNum(nu.fat_g) : "—") +
          tile("углев.", nu.carb_g != null ? trimNum(nu.carb_g) : "—") +
        '</div>' +
        (derived.length ? '<div class="num" style="font-size:11.5px; color:var(--text-faint); margin-top:7px;">' + esc(derived.join(" · ")) + '</div>' : "") +
        (nu.source ? '<div style="font-size:11px; color:var(--text-faint); margin-top:5px;">источник: ' + esc(nu.source) + '</div>' : "") +
      '</div>';
  } else if (!nonfood) {
    nuBlock = '<div style="margin-bottom:16px; font-size:12.5px; color:var(--text-faint);">КБЖУ не задано' + (S.writable ? " — допишите через «Править»" : "") + '.</div>';
  }

  function row(lbl, val) {
    if (!val) return "";
    return '<div style="display:flex; justify-content:space-between; gap:14px; padding:7px 0; border-top:1px solid var(--border); font-size:13px;">' +
      '<span style="color:var(--text-muted); flex:none;">' + esc(lbl) + '</span>' +
      '<span class="num" style="text-align:right; min-width:0;">' + esc(val) + '</span>' +
    '</div>';
  }
  var rows =
    row("Единица", p.unit || "") +
    row("В упаковке", pk != null ? fmtQty(pk, p.unit) : "") +
    row("Вес штуки", p.piece_g ? trimNum(p.piece_g) + " г" : "") +
    row("Плотность", p.g_per_100ml ? trimNum(p.g_per_100ml) + " г в 100 мл" : "") +
    row("Разваривание", p.cooked_ratio ? "из 1 г сухого " + trimNum(p.cooked_ratio) + " г готового" : "") +
    row("Хранение", p.shelf_note || "") +
    row("Покупали", p.last_bought ? agoLabel(p.last_bought) : "") +
    row("Заметка", p.note || "");

  var aliases = (p.aliases && p.aliases.length)
    ? '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; align-items:center;">' +
        '<span style="font-size:10px; color:var(--text-faint);">ещё зовём:</span>' +
        p.aliases.map(function (a) {
          return '<span style="font-size:11px; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:999px; padding:2px 9px;">' + esc(a) + '</span>';
        }).join("") + '</div>'
    : "";
  var uses = recipesUsing(p.id);
  var usedIn = uses.length
    ? '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center;">' +
        '<span style="font-size:10px; color:var(--text-faint);">в рецептах:</span>' +
        uses.map(function (r) {
          return '<span data-act="open-recipe" data-arg="' + attr(r.id) + '" style="font-size:11px; color:var(--c-2); background:var(--c2-bg); border-radius:999px; padding:2px 9px; cursor:pointer;">' + esc(r.title) + '</span>';
        }).join("") + '</div>'
    : "";

  return uiModalHTML({ title: p.name, close: "close-modal",
    subHTML: esc(deptLabel(p.category)) + (p.staple ? ' · <span style="color:var(--success); font-weight:600;">всегда есть дома</span>' : ''),
    body: nuBlock + (rows ? '<div style="border-bottom:1px solid var(--border);">' + rows + '</div>' : "") + aliases + usedIn,
    foot: '<span class="ui-modal-sp"></span>' +
      (S.writable ? '<button class="ui-btn ghost" data-act="prod-card-edit" data-arg="' + attr(p.id) + '">Править</button>' : "") +
      '<button class="ui-btn plain" data-act="close-modal">Закрыть</button>' });
}

/* ═══════════════════════ пересчёт порций ═════════════════════════════════ */
/* Округление обязательно: «1.67 шт» выглядит как баг и подрывает доверие ко
   всему пересчёту. Штуки — к половинкам, вес и объём — к 5 ниже сотни и к 10
   выше: точность там всё равно кухонная. */
function roundQty(v, unit) {
  if (v == null) return null;
  var u = (normUnit(unit) || "").toLowerCase();
  if (u === "шт" || u === "зубчик" || u === "зуб.") {
    return v < 1 ? Math.round(v * 2) / 2 : Math.round(v);
  }
  if (v < 10) return Math.round(v * 10) / 10;
  if (v < 100) return Math.round(v / 5) * 5;
  return Math.round(v / 10) * 10;
}
function recipeFactor(r) {
  var target = S.portions[r.id];
  if (!target || !r.servings) return 1;
  return target / r.servings;
}
function scaledQty(g, factor) {
  if (g.qty == null) return null;          // «по вкусу» не масштабируется
  return roundQty(g.qty * factor, g.unit);
}

/* Показ количества в строке ингредиента (готовый HTML). Если задана «мера»
   («1 стакан» — как в рецепте пишут для человека) И порции НЕ пересчитаны —
   показываем меру, а STD-величину бледнее в скобках. При пересчёте мера не
   масштабируется (стакан не делится на 1,7), поэтому там показываем только STD:
   он верен всегда. КБЖУ и список покупок берут STD в любом случае. */
function amountText(g, v, factor, faint) {
  if (v == null) return "по вкусу";
  var std = fmtQty(v, g.unit);
  var atBase = Math.abs((factor == null ? 1 : factor) - 1) < 0.001;
  if (g.measure && atBase) {
    return esc(g.measure) + ' <span style="color:' + (faint || "var(--text-faint)") +
      '; font-weight:500; font-size:.85em;">(' + esc(std) + ')</span>';
  }
  return esc(std);
}

/* Единицы, которые реально бывают количеством ингредиента. Время («мин», «ч»),
   температура и размеры («мм») сюда НЕ входят — именно поэтому подстановка
   в тексте шага безопасна: «2 ч 10 мин» и «180 °C» ни с чем не совпадут. */
var _QTY_UNITS = "г|кг|мл|л|шт";
/* Один проход по тексту шага ловит ДВА вида токенов:
   1. `#слово` — ссылка на ингредиент, которую автор пометил явно. Русское
      склонение («морковь» → «морковку») делает автоопознание по списку
      ненадёжным, поэтому пометка явная и однословная (для «томатная паста»
      помечай ключевое слово: `#паста`).
   2. число + единица количества («150 мл», «12–15 г») — количество, которое
      пересчитывается под порции и всегда выделяется жирным.
   Время («2 ч 10 мин»), температура («180 °C») и размеры («3 мм») под единицы
   количества не подпадают и остаются нетронутыми. */
var _STEP_TOKEN = new RegExp(
  "#([а-яёa-z0-9-]+)" +                                        // 1: #ингредиент
  "|(\\d+(?:[.,]\\d+)?)(?:\\s*[–—-]\\s*(\\d+(?:[.,]\\d+)?))?\\s*(" + _QTY_UNITS + ")(?![а-яa-z])",  // 2 низ, 3 верх, 4 единица
  "gi");

/* Подстановка пересчитанных количеств прямо в текст шага.
   Приём безопасен по построению: ВСЕ ингредиенты множатся на один коэффициент,
   поэтому вопроса «а какой из них» не возникает в принципе.

   Пересчитываем ЛЮБОЕ число с единицей количества, а не только точно
   совпавшее с таблицей. Причина: в шаге часто расходуется ЧАСТЬ ингредиента
   («разогреть 15 мл масла» при 30 мл в таблице) — правило «только точные
   совпадения» такие числа молча пропускало, и человек наливал исходное
   количество на удвоенную порцию.
   Чем оплачено: теоретически может попасться число с единицей веса, которое
   количеством не является. На практике размеры посуды живут в «Инвентаре»
   (его не трогаем), а время («2 ч 10 мин»), температура («180 °C») и размеры
   («кубиками ~3 мм») под единицы количества не подпадают. Плюс рядом всегда
   печатается «(было N)» — подмена не тихая и проверяема глазом.

   Цвет пометки «(было N)» — параметром: печатный лист рисуется белым в ЛЮБОЙ
   теме, и токен --text-faint тёмной темы на нём был бы невидим. */
function scaleStepText(text, ings, factor, muted) {
  if (!text) return "";
  muted = muted || "var(--text-faint)";
  var scaled = factor !== 1;
  var out = "", last = 0, m;
  _STEP_TOKEN.lastIndex = 0;
  while ((m = _STEP_TOKEN.exec(text)) !== null) {
    out += esc(text.slice(last, m.index));
    if (m[1] != null) {
      /* #ингредиент → жирным, решётка снята. */
      out += '<b style="font-weight:700;">' + esc(m[1]) + '</b>';
    } else {
      /* Количество: жирным всегда; при смене порций пересчитано и с «(было N)». */
      var unit = m[4].toLowerCase();
      var lo = scaled ? roundQty(parseFloat(m[2].replace(",", ".")) * factor, unit) : parseFloat(m[2].replace(",", "."));
      var hi = m[3] == null ? null : (scaled ? roundQty(parseFloat(m[3].replace(",", ".")) * factor, unit) : parseFloat(m[3].replace(",", ".")));
      out += '<b style="font-weight:700;">' +
        esc(trimNum(lo) + (hi == null ? "" : "–" + trimNum(hi)) + " " + unit) + '</b>' +
        (scaled ? '<span style="font-size:.82em; color:' + muted + ';"> (было ' + esc(m[0]) + ')</span>' : "");
    }
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

/* «На 100 г» из УЖЕ ИЗВЕСТНОГО КБЖУ порции. Пищевая ценность продуктов для
   этого не нужна вовсе: итог блюда = порция × число порций, дальше делим на
   измеренную массу.

   Масса берётся только измеренная. Вывести её нельзя: сколько выпарится воды,
   зависит от посуды, крышки, огня и времени — у одного рецепта на разных плитах
   разница бывает двукратной. При этом на ПОРЦИЮ испарение не влияет вообще
   (уходит вода, а не макросы) — меняется только концентрация на 100 г. Отсюда
   и правило: порция считается всегда, «на 100 г» — только после взвешивания. */
function per100g(r) {
  var fin = r.finished_g;
  if (typeof fin !== "number" || !(fin > 0)) return null;
  var nu = r.nutrition;
  if (nu && nu.kcal != null) {
    // Авторское КБЖУ на порцию → на 100 г через массу готового блюда.
    var k = (r.servings || 1) * 100 / fin;
    var out = { est: false };
    ["kcal", "protein_g", "fat_g", "carb_g"].forEach(function (f) {
      if (typeof nu[f] === "number") out[f] = Math.round(nu[f] * k * 10) / 10;
    });
    out.kcal = Math.round((nu.kcal || 0) * k);
    out.portion_g = Math.round(fin / (r.servings || 1));
    return out;
  }
  /* Нет авторского КБЖУ → оценка по продуктам: dishNutritionEstimate уже даёт
     per100 при заданном весе. Помечаем est, чтобы weightBlock подписал «≈». Так
     кнопка «взвесить» и КБЖУ на 100 г работают и у оценочных рецептов. */
  var e = dishNutritionEstimate(r);
  if (e && e.per100) {
    return { kcal: e.per100.kcal, protein_g: e.per100.protein_g,
             fat_g: e.per100.fat_g, carb_g: e.per100.carb_g,
             portion_g: Math.round(fin / (r.servings || 1)), est: true };
  }
  return null;
}

/* Вес порции считаем по сумме граммов и миллилитров — честно и без плотностей.
   Штуки и «по вкусу» в сумму не идут, поэтому это ОЦЕНКА, и подписана так. */
function portionWeight(r) {
  var total = 0, skipped = 0;
  (r.ingredients || []).forEach(function (g) {
    if (g.qty == null) { skipped++; return; }
    var u = (normUnit(g.unit) || "").toLowerCase();
    if (u === "г" || u === "мл") total += g.qty;
    else if (u === "кг" || u === "л") total += g.qty * 1000;
    else skipped++;
  });
  if (!total || !r.servings) return null;
  return { per: Math.round(total / r.servings), skipped: skipped };
}

/* Масса сырых продуктов, которую УДАЛОСЬ посчитать (через ту же gramsOf, что и
   КБЖУ: штуки по piece_g, объём по плотности), плюс имена того, что посчитать не
   вышло. Нужна одному потребителю — сторожу массы готового блюда ниже. */
function rawMassKnown(r) {
  var mass = 0, unknown = [];
  (r.ingredients || []).forEach(function (g) {
    var p = g.product_id ? productById(g.product_id) : null;
    var grams = gramsOf(g.qty, g.unit, p);
    if (grams == null) unknown.push(g.name || "без названия");
    else mass += grams;
  });
  return { mass: mass, unknown: unknown };
}

/* ── ссылки в тексте секций ──────────────────────────────────────────────────
   Источники пишутся как есть: «…выход рассчитан по коэффициентам USDA
   (ars.usda.gov/ARSUserFiles/80400535/Data/retn/USDA_CookingYields_MeatPoultry02.pdf)».
   Такой адрес не читается и не нажимается, а до правки ещё и растягивал страницу.
   Показываем домен + хвост пути, полный адрес — в href и в title (long-press на
   телефоне показывает его целиком). Печатная ветка адрес НЕ сокращает: на бумаге
   ссылку не нажмёшь, её набирают руками, и обрезанная бесполезна. */
var _URL_RE = new RegExp(
  "(?:https?://|www\\.)[^\\s<>\"']+" +                    // с протоколом или www
  "|[a-z0-9][a-z0-9.-]*\\.(?:ru|com|org|net|gov|edu|io|info|me|pro|su|by|kz)" +
  "(?:/[^\\s<>\"']*)?", "gi");                            // голый домен (+путь)

function shortUrl(u) {
  var s = String(u).replace(/^https?:\/\//i, "").replace(/^www\./i, "");
  var slash = s.indexOf("/");
  if (slash < 0) return s;
  var host = s.slice(0, slash);
  var segs = s.slice(slash).split("/").filter(Boolean);
  if (!segs.length) return host;
  var tail = segs[segs.length - 1];
  try { tail = decodeURIComponent(tail); } catch (e) { /* битый %-escape — как есть */ }
  /* Середину съедаем, а не хвост: расширение файла и номер документа как раз в
     конце («USDA_CookingYields_MeatPoultry02.pdf» → «USDA_Cooking…try02.pdf»). */
  if (tail.length > 22) tail = tail.slice(0, 12) + "…" + tail.slice(-9);
  return host + (segs.length > 1 ? "/…/" : "/") + tail;
}

/* Экранирует текст и превращает найденные адреса в ссылки. Экранирование внутри —
   не забыть его снаружи невозможно: функция принимает СЫРОЙ текст. */
function linkifyEsc(text) {
  var s = String(text == null ? "" : text), out = "", last = 0, m;
  _URL_RE.lastIndex = 0;
  while ((m = _URL_RE.exec(s)) !== null) {
    var raw = m[0], trail = "";
    /* Хвостовая пунктуация в адрес не входит: «(ссылка).» — точка и скобка
       принадлежат предложению. */
    var t = raw.match(/[.,;:!?)»"']+$/);
    if (t) { trail = t[0]; raw = raw.slice(0, raw.length - trail.length); }
    if (!raw) continue;
    out += esc(s.slice(last, m.index));
    var href = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
    out += '<a href="' + attr(href) + '" target="_blank" rel="noopener" title="' + attr(raw) +
      '" style="color:var(--c-2); text-decoration:underline; text-underline-offset:2px;">' +
      esc(shortUrl(raw)) + '</a>' + esc(trail);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

/* ккал/100 г продукта: этикетка приоритетнее, Этуотер (4/9/4) — запасной путь.
   Зеркало nutrition.product_kcal_100g, и это не косметика: раньше страница
   суммировала этикетку, а скрипт пересчитывал 4/9/4, и на реальных рецептах
   числа расходились до 21% («Гуляш из говядины с картофелем» — 361 против 436
   ккал на порцию). Этикетка ближе к правде — 4/9/4 считает усвояемой всю
   клетчатку (шпинат 23 против 30, лавровый лист 313 против 402) и не видит
   спирта (вино 66 против 3). Продукт с макросами, но без строки ккал теперь
   не выпадает молча, а считается по Этуотеру. */
function productKcal100(n1) {
  if (!n1) return null;
  if (typeof n1.kcal === "number") return n1.kcal;
  var s = 0;
  if (typeof n1.protein_g === "number") s += 4 * n1.protein_g;
  if (typeof n1.fat_g === "number") s += 9 * n1.fat_g;
  if (typeof n1.carb_g === "number") s += 4 * n1.carb_g;
  return s > 0 ? s : null;
}

/* Оценка КБЖУ на порцию из ингредиентов, когда источник его не дал. Зеркало
   tools/food/nutrition.py: макросы СЫРЫХ продуктов на 100 г × масса, делим на
   порции. Штуки → через piece_g, варёный вес → в сухой через cooked_ratio.

   Это ОЦЕНКА ПО СЫРЫМ ПРОДУКТАМ, а НЕ настоящее КБЖУ готового блюда: при
   готовке жир сливается, масло впитывается, вода уходит. Поэтому подписываем
   честно, а покрытие (доля продуктов с известным КБЖУ) считаем — без него
   непокрытый ингредиент молча занижал бы итог. */
function dishNutritionEstimate(r) {
  if (!r.servings) return null;
  var tot = { kcal: 0, protein_g: 0, fat_g: 0, carb_g: 0 };
  var massKnown = 0, massAll = 0, covered = 0;
  (r.ingredients || []).forEach(function (g) {
    var p = g.product_id ? productById(g.product_id) : null;
    var grams = gramsOf(g.qty, g.unit, p);
    if (grams == null) return;                 // «по вкусу» / штуки без piece_g
    massAll += grams;
    var n1 = p && p.nutrition_100g;
    var kc = productKcal100(n1);
    if (kc == null) return;                    // продукт без КБЖУ — не занижаем тихо
    var raw = grams;
    if (g.state === "cooked" && p.cooked_ratio) raw = grams / p.cooked_ratio;
    var k = raw / 100;
    ["protein_g", "fat_g", "carb_g"].forEach(function (f) {
      if (typeof n1[f] === "number") tot[f] += n1[f] * k;
    });
    tot.kcal += kc * k;
    massKnown += grams; covered++;
  });
  if (!covered) return null;
  var per = {};
  Object.keys(tot).forEach(function (f) { per[f] = Math.round(tot[f] / r.servings * 10) / 10; });
  per.kcal = Math.round(per.kcal);
  /* «На 100 г» — только когда введён вес готового блюда (как и у авторского КБЖУ
     через weightBlock): концентрация зависит от того, сколько выпарилось воды,
     а это из ингредиентов не вывести. Нет веса — нет строки на 100 г. */
  var p100 = null, fin = r.finished_g;
  if (typeof fin === "number" && fin > 0) {
    var k = 100 / fin;
    p100 = {};
    ["protein_g", "fat_g", "carb_g"].forEach(function (f) { p100[f] = Math.round(tot[f] * k * 10) / 10; });
    p100.kcal = Math.round(tot.kcal * k);
  }
  return { per: per, per100: p100, coverage: massAll ? massKnown / massAll : 0 };
}

/* ── Техника, которую придётся включить ────────────────────────────────────
   Значок на карточке отвечает на вопрос «а что для этого нужно включить» —
   тот самый, из-за которого два плова (на плите и в мультиварке) в списке
   неразличимы.

   ВЫВОДИТСЯ ИЗ ТЕКСТА, а не хранится полем. Рецепты приезжают из проекта
   Claude.ai и из интернета — новое обязательное поле там просто не заполнят,
   и половина библиотеки осталась бы без пометки. Ровно так вышло с названием:
   «в мультиварке» стоит у 5 названий из 14 рецептов, где она нужна.

   Ищем и в «Инвентаре», и в шагах: у девяти простых рецептов equipment пустой
   вовсе, а техника видна только в глаголах — «отварить», «запечь», «обжарка».

   Бейдж — УТВЕРЖДЕНИЕ, поэтому список слов узкий и консервативный, а
   отсутствие бейджей читается как «не определили», НЕ как «ничего не нужно».
   По той же причине нет бейджа «без нагрева»: первая же промашка соврала бы
   на «Варёных яйцах» (там плита есть, но только в глаголе «сварить»).

   Микроволновки в списке нет намеренно: во всех четырёх упоминаниях по
   библиотеке она — альтернатива ПОБОЧНОГО шага («растопить масло на водяной
   бане или в микроволновке»), а основной способ уже помечен, так что бейдж
   добавил бы шум, а не различение. Альтернатива ОСНОВНОГО способа — другое
   дело: «обжарить на гриль-сковороде или запечь при 200 °C» честно даёт оба
   бейджа, и подпись у них поэтому «техника рецепта», а не «нужна техника».

   Гриля тоже нет: дома его нет, «на гриле» здесь всегда гриль-сковорода. */
var TECH = [
  /* ◎ — чаша мультиварки сверху. Блендера в списке нет намеренно: он дома
     всегда и ничего не различает — бейдж, который стоял бы у всего, это не
     информация, а шум. */
  /* Цвет — СТРОГО из категориальной палитры токенов (--c-1…--c-6 в
     ui-kit.css), а не подобранный на глаз: она уже сбалансирована между собой
     и в обеих темах, поэтому значки видны и на светлой бумаге, и на тёмной,
     не превращая карточку в светофор. Красится ТОЛЬКО глиф — заливать плашки
     цветом дизайн-система запрещает («акцент дозированно»). */
  /* Глифы выбраны ПЛОТНЫЕ. Первый заход дал «◎» и «▤» — тонкие контурные
     штрихи, которые на 13 px читаются блёкло независимо от цвета: дело было
     не в палитре, а в весе знака. */
  { key: "multi", icon: "◉", color: "--c-1", label: "мультиварка", rx: /мультивар/ },
  { key: "oven", icon: "▦", color: "--c-4", label: "духовка",
    rx: /духовк|запеч|запека|против(ень|ня|не|нем)/ },
  /* У плиты правило из ДВУХ частей, и это не перестраховка.
     rx — прямая улика: названа посуда или сама плита. Работает всегда.
     soft — косвенная: глаголы «обжарить/тушить/варить». Они означают плиту
     только там, где мультиварки нет: в её рецептах ровно этими словами
     называются ПРОГРАММЫ («Жарка», «Тушение»), и плитный значок вставал у
     блюда, которое целиком готовится в чаше (жалоба владельца 2026-08-09 про
     плов в мультиварке). Но выбросить глаголы совсем нельзя: «отварить гречку»,
     «сварить яйца», «тушить гуляш» — это плита, и посуда там не названа. */
  { key: "stove", icon: "♨", color: "--c-2", label: "плита",
    rx: /сковород|кастрюл|сотейник|казан|ковш|плит[аеуы]|конфорк|на огне/,
    soft: /довести до кипения|отварит|сварит|варит|обжар|тушен|тушит|жарит/ }
];
function recipeTech(r) {
  var hay = normSearch((r.equipment || "") + " " +
    (r.steps || []).map(function (s) {
      return (s.title || "") + " " + (s.text || "");
    }).join(" "));
  // Косвенная улика засчитывается, только если мультиварки в рецепте нет:
  // иначе её же программы («Жарка», «Тушение») читаются как плита.
  var multi = /мультивар/.test(hay);
  return TECH.filter(function (t) {
    return t.rx.test(hay) || (!!t.soft && !multi && t.soft.test(hay));
  });
}

/* ── «с вечера»: ожидание ДО готовки, а не сама готовка ───────────────────
   Отвечает на вопрос, который дороже техники: можно ли это приготовить
   СЕГОДНЯ на ужин.

   Одной длительности мало, и это главный подвох (замечание владельца
   2026-08-09). Четыре часа в мультиварке и четыре часа маринования — разные
   вещи: в первом случае ожидание И ЕСТЬ готовка, заложил и получил готовое;
   во втором надо поработать, ждать полдня и только ПОТОМ готовить. Бейдж —
   про второй случай, поэтому кроме порога требуется словарь подготовительного
   ожидания: холодильник, маринад, «на ночь», настаивание, замачивание,
   расстойка.

   Словарь — БЕЛЫЙ список, а не чёрный: бейдж утверждает «начинать заранее»,
   и лучше промолчать на незнакомой формулировке, чем повесить его на долгое
   томление. Порог 4 часа выбран по живым данным: тушение гуляша (2 ч) и
   болоньезе (2 ч 10) в вечер укладываются, маринование су-вида (2–4 ч),
   чиа-пудинг и ленивая овсянка (по 8 ч) — нет.

   Цена белого списка — молчание на словах, которых в нём нет, и она уже
   выстрелила (2026-08-10): чиабатта с бигой на 16 часов бейджа не получила,
   потому что брожение теста не описывают ни холодильником, ни маринадом, ни
   расстойкой (расстойка у неё есть, но она 45 минут — ниже порога). То же
   с домашним йогуртом: «Заквашивание, 8 ч». Обе — ровно тот случай, ради
   которого бейдж заведён: сегодня на ужин их не приготовить. Поэтому в
   словарь добавлена лексика брожения. Ловушка тут в том, что слово должно
   стоять В ТОМ ЖЕ шаге, что и длительность: это намеренно (иначе «расстойка
   45 мин» где-то внизу узаконила бы любое долгое томление выше), но значит,
   что каждая новая формулировка ожидания требует явного пополнения списка.

   Ожидание берём то же, что и время рецепта: явный `passive` главный, порог
   в час — запаска для файлов без флага (у старых рецептов его нет вовсе). */
var AHEAD_MIN = 240;
/* Стебли брожения намеренно узкие: «бига» (не «бигус» — другое блюдо),
   «опар» (опара), «пулиш», «заква» (заквашивание И закваска — общий кусок у них
   короче, чем кажется: «заквас» ловит только вторую),  «брожен»,
   «ферментац». Слово «подход» («тесто подойдёт») в список НЕ берём: оно же
   значит «подходит к рыбе», и на нём словарь перестал бы быть белым. */
var AHEAD_RX = /холодильник|маринов|маринад|на ночь|ночь в|настаива|настоят|замочи|замачива|расстой|расстаива|бига|опар|пулиш|заква|брожен|ферментац/;
function recipeAhead(r) {
  var max = 0;
  (r.steps || []).forEach(function (s) {
    var d = stepMinutes(s.title);
    if (!d || d.min < AHEAD_MIN) return;
    var wait = s.passive === true || (s.passive == null && d.min >= LONG_STEP_MIN);
    if (!wait) return;
    if (!AHEAD_RX.test(normSearch((s.title || "") + " " + (s.text || "")))) return;
    if (d.min > max) max = d.min;
  });
  return max;
}

/* Бейджи карточки одним списком: и рисуются, и ищутся по одному правилу —
   поэтому «показано» и «нашлось» разойтись не могут. «С вечера» идёт первым:
   техника решает «чем готовить», а этот — «получится ли вообще сегодня». */
function recipeBadges(r) {
  var out = [];
  var ahead = recipeAhead(r);
  if (ahead) {
    /* Холодный синий среди тёплой палитры карточки — единственный бейдж,
       который должен цеплять взгляд первым: техника отвечает «чем готовить»,
       а этот — «получится ли вообще сегодня». */
    out.push({ key: "ahead", icon: "⏳", color: "--c-6", label: "с вечера",
               rx: /вечер|заран/,
               hint: "самое долгое ожидание — " + fmtMinutes(ahead) +
                     "; начинать надо заранее" });
  }
  return out.concat(recipeTech(r).map(function (t) {
    return { key: t.key, icon: t.icon, color: t.color, label: t.label, rx: t.rx,
             hint: "техника рецепта: " + t.label };
  }));
}

/* ── Оценка «понравилось» — 1..3 звезды ────────────────────────────────────
   Шкала намеренно короткая: «нормально · понравилось · восторг». На пяти
   делениях выбор превращается в гадание («это 3 или 4?»), а решение по факту
   бинарное — готовим ещё или нет; трёх ступеней хватает, чтобы отличить
   «съедобно» от «повторить обязательно».

   Оценка живёт в файле рецепта (`rating`), а не в сеансе: это свойство блюда,
   и оно должно пережить перезагрузку и приехать на телефон. */
var RATING_MAX = 3;
var RATING_WORDS = ["не оценено", "не понравилось", "нормально", "понравилось"];
/* rid — рецепт, у которого оценку можно поставить ПРЯМО ОТСЮДА. Без него
   звёзды просто показываются (карточка списка, режим только для чтения).

   Смысл живых звёзд: оценку ставят сразу после еды, а не садясь править
   рецепт. Ради одного числа открывать редактор, снимать форму, сохранять и
   возвращаться — столько шагов, что оценка не проставится никогда. */
function ratingStars(n, size, rid) {
  var live = rid && S.writable;
  var out = "";
  for (var i = 1; i <= RATING_MAX; i++) {
    var on = i <= n;
    var tip = RATING_WORDS[i] + (on && i === n ? " · нажмите ещё раз, чтобы снять" : "");
    out += '<span' +
      (live ? ' data-act="set-rating" data-arg="' + attr(rid + "|" + i) + '" title="' + attr(tip) + '"' : '') +
      ' style="color:var(' + (on ? "--c-2" : "--border") + ');' +
      (live ? " cursor:pointer;" : "") + '">' + (on ? "★" : "☆") + '</span>';
  }
  return '<span style="display:inline-flex; gap:2px; font-size:' + (size || 13) + 'px; line-height:1;"' +
    (live ? '' : ' title="' + attr(RATING_WORDS[n] || "") + '"') + '>' + out + '</span>';
}

/* Содержимое строки оценки на экране рецепта — отдельно от разметки строки:
   при тапе по звезде переписывается ТОЛЬКО оно (patchHTML), а не весь экран. */
function ratingRowHTML(r) {
  return '<span style="font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:700;">Оценка</span>' +
    ratingStars(r.rating || 0, 20, r.id) +
    '<span style="font-size:12px; color:var(--text-muted);">' + esc(RATING_WORDS[r.rating || 0]) + '</span>';
}

/* Один рендерер на оба места, где бейджи показываются (карточка списка и
   шапка экрана чтения): разъехавшиеся копии выглядели бы как разные сущности,
   хотя это одно и то же утверждение о рецепте. */
function badgeRow(badges, margin) {
  if (!badges.length) return "";
  return '<div style="display:flex; gap:6px; flex-wrap:wrap; margin:' + margin + ';">' +
    badges.map(function (b) {
      /* Цвет несут глиф и РАМКА, заливка остаётся нейтральной. Это ровно тот
         приём, которым на этой же странице рисуется активный чип-фильтр
         (`.fchip.on`: цветной текст + цветная рамка), поэтому бейджи не
         выглядят чужеродно. Заливать плашку цветом нельзя: шесть карточек в
         ряд превратятся в мозаику, а дизайн-система требует акцент дозированно.
         Подпись — обычным --text, а не приглушённым: первый заход красил весь
         чип в --text-muted, и на бумажном фоне он читался как выключенный. */
      return '<span title="' + attr(b.hint) + '" style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--text); background:var(--bg-alt); border:1px solid var(' + b.color + '); border-radius:999px; padding:2px 10px; white-space:nowrap;">' +
        '<span aria-hidden="true" style="color:var(' + b.color + '); font-size:14px; line-height:1;">' + b.icon + '</span>' +
        esc(b.label) + '</span>';
    }).join("") + '</div>';
}

/* ═══════════════════════ экран: рецепты ══════════════════════════════════ */
function recipesScreen() {
  var cf = S.recipeCatFilter || "all";
  /* Чип «Прочее» — только если хоть один рецепт в него попал: рецептов
     немного, пустой чип-заглушка — лишний шум, а незнакомая category не
     должна прятать рецепт. Считается по ВСЕЙ библиотеке, а не по результатам
     поиска, — иначе чип мигал бы, появляясь и исчезая по мере ввода. */
  var hasOther = S.recipes.some(function (r) { return recCatKey(r.category) === "other"; });
  var catDefs = hasOther ? RECIPE_CATS.concat([["other", "Прочее"]]) : RECIPE_CATS;
  var catChips = catDefs.map(function (d) {
    return '<button class="fchip dp-chip' + (cf === d[0] ? " on" : "") + '" data-act="rec-cat" data-arg="' + d[0] + '">' + esc(d[1]) + '</button>';
  }).join("");

  return '<section class="screen sc-recipes">' +
    '<header style="margin:2px 0 6px;">' +
      '<span style="font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--c-2); font-weight:700;">Кухня</span>' +
      '<h1 style="font-family:var(--font-serif); font-weight:600; font-size:clamp(32px,5vw,48px); line-height:1; letter-spacing:-.02em; margin:11px 0 0;">Рецепты</h1>' +
    '</header>' +
    '<div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:20px 0 22px;">' +
      '<div style="position:relative; flex:1; min-width:220px;">' +
        '<span style="position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:14px; pointer-events:none;">⌕</span>' +
        '<input class="srch" id="f-rec-q" value="' + attr(S.recipeQuery) + '" placeholder="название, продукт, техника: плита · духовка · мультиварка">' + uiSearchX("f-rec-q") +
      '</div>' +
      (S.writable ? '<button class="ui-btn" data-act="new-recipe"><span style="font-size:16px; line-height:1;">+</span> Новый рецепт</button>' : '') +
      (S.writable ? '<button class="ui-btn ghost" data-act="import-open"><span style="font-size:15px;">↧</span> Импорт</button>' : '') +
    '</div>' +
    '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;">' + catChips + '</div>' +
    /* См. productsScreen: всё, что зависит от строки поиска, — в одном узле. */
    '<div id="rec-results">' + recipesResults() + '</div>' +
  '</section>';
}

function recipesResults() {
  var q = normSearch(S.recipeQuery);
  var cf = S.recipeCatFilter || "all";
  var list = S.recipes.filter(function (r) {
    if (cf !== "all" && recCatKey(r.category) !== cf) return false;
    if (!q) return true;
    if (normSearch(r.title).indexOf(q) >= 0) return true;
    if (normSearch(r.category).indexOf(q) >= 0) return true;
    if ((r.tags || []).some(function (t) { return normSearch(t).indexOf(q) >= 0; })) return true;
    /* «Инвентарь» ищется наравне с названием: техника — такой же вход в
       библиотеку, как продукт («что приготовить в мультиварке?»). Кодировать
       технику в НАЗВАНИЕ блюда было бы хуже: «Су-вид форель в мультиварке» —
       масло масляное, а половина библиотеки осталась бы без пометки. */
    if (normSearch(r.equipment).indexOf(q) >= 0) return true;
    // поиск по ингредиенту — то, ради чего он вообще нужен
    if ((r.ingredients || []).some(function (g) { return normSearch(g.name).indexOf(q) >= 0; })) return true;
    /* Техника — теми же значками, что на карточке: ищется ровно то, что видно.
       Свободный текст шагов из поиска убран намеренно (замечание владельца
       2026-08-09: «шаги — это слишком») — оттуда сыпались случайные совпадения
       по словам вроде «нарезать». Узкий словарь TECH оставлен: он и рисует
       бейдж, и отвечает на запрос, поэтому «нашлось» и «показано» не разойдутся.
       rx проверяется И по запросу: «в мультиварке», «на плите», «в духовке» —
       живые формы, а сравнение с меткой их бы не поймало. */
    return recipeBadges(r).some(function (b) {
      return b.rx.test(q) || b.label.indexOf(q) >= 0;
    });
  }).slice().sort(function (a, b) { return (a.title || "").localeCompare(b.title || "", "ru"); });

  var cards = list.map(function (r) {
    var nu = r.nutrition || {};
    /* Время на карточке — тоже по сумме шагов: два разных числа для одного
       рецепта в списке и внутри выглядели бы как баг данных. */
    var crt = recipeTime(r);
    var meta = [r.cuisine, crt ? shortTime(crt) : r.time]
      .filter(Boolean).join(" · ");
    /* Значок + слово, а не значок один: «◎» без подписи требует легенды,
       а карточка должна читаться с первого взгляда и мокрыми руками.
       Слово заодно называет то, что можно набрать в поиске.
       Подпись техники — «техника рецепта», а не «нужна»: у части блюд способ
       альтернативный («обжарить на гриль-сковороде ИЛИ запечь при 200 °C»),
       и обещать «без духовки не выйдет» было бы враньём (см. recipeBadges). */
    var techChips = badgeRow(recipeBadges(r), "10px 0 0");
    var pips = "";
    for (var i = 1; i <= 5; i++) {
      pips += '<span style="width:8px; height:8px; border-radius:2px; background:' +
        (r.difficulty && i <= r.difficulty ? "var(--c-2)" : "var(--border)") + ';"></span>';
    }
    return '<div class="rcard" data-act="open-recipe" data-arg="' + attr(r.id) + '" role="link" tabindex="0" style="display:flex; flex-direction:column; background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--c-2); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; cursor:pointer;">' +
      '<div style="padding:16px 17px 14px; flex:1; display:flex; flex-direction:column;">' +
        '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">' +
          '<span style="font-family:var(--font-serif); font-size:19px; font-weight:600; line-height:1.14;">' + esc(r.title) + '</span>' +
          '<span class="num" style="flex:none; font-size:11px; font-weight:600; color:var(--text-muted); background:var(--bg-alt); border-radius:999px; padding:3px 9px;">' + esc(r.servings) + ' порц.</span>' +
        '</div>' +
        (meta ? '<div class="num" style="font-size:12px; color:var(--text-muted); margin:9px 0 0;">' + esc(meta) + '</div>' : "") +
        techChips +
        (nu.kcal != null
          ? '<div class="num" style="font-size:13px; color:var(--text); font-weight:600; margin:11px 0 1px;">' + esc(nu.kcal) + ' ккал на порцию</div>' +
            '<div class="num" style="font-size:11.5px; color:var(--text-faint);">Б ' + esc(nu.protein_g) + ' · Ж ' + esc(nu.fat_g) + ' · У ' + esc(nu.carb_g) + '</div>'
          : (function () {
              /* Источник КБЖУ не дал — показываем оценку по продуктам, помечая. */
              var e = dishNutritionEstimate(r);
              return e
                ? '<div class="num" style="font-size:13px; color:var(--text); font-weight:600; margin:11px 0 1px;">≈ ' + esc(e.per.kcal) + ' ккал на порцию</div>' +
                  '<div class="num" style="font-size:11.5px; color:var(--text-faint);">Б ' + esc(trimNum(e.per.protein_g)) + ' · Ж ' + esc(trimNum(e.per.fat_g)) + ' · У ' + esc(trimNum(e.per.carb_g)) + ' · оценка</div>'
                : '<div class="num" style="font-size:11.5px; color:var(--text-faint); margin:11px 0 1px;">КБЖУ не указано</div>';
            })()) +
        (r.difficulty ? '<div style="display:flex; align-items:center; gap:9px; margin:12px 0 0;">' +
          '<span style="font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:700;">Сложность</span>' +
          '<span style="display:inline-flex; gap:3px;">' + pips + '</span></div>' : "") +
        /* Оценка — только у оценённых. Пустая шкала «☆☆☆» у каждого второго
           рецепта читалась бы как «не понравилось», хотя значит «не пробовали»;
           отсутствие строки не врёт. */
        (r.rating ? '<div style="display:flex; align-items:center; gap:9px; margin:7px 0 0;">' +
          '<span style="font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:700;">Оценка</span>' +
          ratingStars(r.rating) + '</div>' : "") +
      '</div>' +
      '<div style="display:flex; border-top:1px solid var(--border);">' +
        '<button data-act="cook" data-arg="' + attr(r.id) + '" style="flex:1; border:none; background:transparent; padding:12px; font-size:13px; font-weight:600; color:var(--text); cursor:pointer; font-family:inherit;">▶ Готовить</button>' +
        '<span style="width:1px; background:var(--border);"></span>' +
        '<button data-act="plan-open" data-arg="' + attr(r.id) + '" style="flex:1; border:none; background:transparent; padding:12px; font-size:13px; font-weight:600; color:var(--c-2); cursor:pointer; font-family:inherit;">Запланировать</button>' +
      '</div>' +
    '</div>';
  }).join("");

  return '<div class="recipe-grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;">' + cards + '</div>' +
    (list.length ? "" : '<div style="text-align:center; color:var(--text-faint); font-size:13px; padding:40px 0;">Ничего не нашлось.</div>');
}

/* Сторож массы: готовое блюдо не может весить больше сырых продуктов — при
   готовке вода только уходит. Если весит, строка «на 100 г» врёт, и молчать
   нельзя: знаменатель больше того, из чего посчитан числитель.
   Два разных случая, и они требуют разных действий:
     • всё посчитано, а блюдо тяжелее → ошибка в числе (лишний ноль, вес с
       кастрюлей);
     • есть ингредиенты без количества → скорее всего лишний вес именно их, а
       их КБЖУ в числитель не попало → «на 100 г» занижено.
   Реальный случай: творожник, блюдо 1598 г при 1425 г продуктов (2026-08-02). */
function heavierThanRaw(r) {
  var raw = rawMassKnown(r);
  if (!raw.mass || !(r.finished_g > raw.mass * 1.02)) return "";
  var diff = Math.round(r.finished_g - raw.mass);
  var tip = raw.unknown.length
    ? "Продукты весят " + Math.round(raw.mass) + " г, блюдо — " + r.finished_g +
      " г. Лишнее, вероятно, от ингредиентов без количества (" +
      raw.unknown.join(", ") + "): их масса в блюде есть, а КБЖУ не посчитано, " +
      "поэтому «на 100 г» занижено."
    : "Продукты весят " + Math.round(raw.mass) + " г, блюдо — " + r.finished_g +
      " г. При готовке вода только уходит — проверьте число (вес с посудой? лишний ноль?).";
  return '<span title="' + attr(tip) + '" style="font-size:11px; font-weight:600; color:var(--warn); ' +
    'border:1px dashed var(--warn); border-radius:999px; padding:2px 9px; cursor:help;">' +
    '⚠ тяжелее продуктов на ' + esc(diff) + ' г</span>';
}

/* Блок «взвесили готовое блюдо». Появляется под КБЖУ порции: приготовили —
   поставили кастрюлю на весы — ввели число — получили значения на 100 г.
   До взвешивания никаких «на 100 г» не показываем и не оцениваем. */
function weightBlock(r) {
  var h = per100g(r);
  if (S.weighEdit === r.id) {
    return '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 2px 0;">' +
      '<span style="font-size:12px; color:var(--text-muted);">Масса готового блюда, г</span>' +
      '<input id="f-weigh" value="' + attr(r.finished_g || "") + '" placeholder="700" ' +
        'style="width:110px; box-sizing:border-box; border:1px solid var(--c-2); border-radius:6px; background:var(--bg); color:var(--text); font-family:inherit; font-size:13px; padding:6px 9px;">' +
      '<button class="fchip" data-act="weigh-save" data-arg="' + attr(r.id) + '" style="min-height:30px; padding:5px 12px; font-size:12px; color:var(--c-2); border-color:var(--c-2);">Сохранить</button>' +
      '<button class="fchip" data-act="weigh-cancel" style="min-height:30px; padding:5px 12px; font-size:12px;">Отмена</button>' +
      '</div>';
  }
  if (!h) {
    return S.writable
      ? '<div class="no-print" style="margin:12px 2px 0;">' +
        '<button class="fchip fchip-wrap" data-act="weigh-open" data-arg="' + attr(r.id) + '" style="min-height:30px; padding:7px 13px; font-size:12px;">⚖ Взвесили готовое? Введите массу — покажу КБЖУ на 100 г</button>' +
        '</div>'
      : "";
  }
  var pre = h.est ? "≈ " : "";
  return '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:12px 2px 0; padding:10px 13px; background:var(--bg-elev); border:1px solid var(--border); border-radius:8px;">' +
    '<span style="font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); font-weight:700;">На 100 г' +
      (h.est ? ' · оценка' : '') + '</span>' +
    '<div class="num" style="display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--text-muted);">' +
      '<span><b style="color:var(--text); font-weight:600;">' + pre + esc(h.kcal) + '</b> ккал</span>' +
      '<span>Б <b style="color:var(--text); font-weight:600;">' + esc(h.protein_g) + '</b></span>' +
      '<span>Ж <b style="color:var(--text); font-weight:600;">' + esc(h.fat_g) + '</b></span>' +
      '<span>У <b style="color:var(--text); font-weight:600;">' + esc(h.carb_g) + '</b></span>' +
    '</div>' +
    '<span class="num" style="font-size:11.5px; color:var(--text-faint);">блюдо ' + esc(r.finished_g) + ' г · порция ' + esc(h.portion_g) + ' г</span>' +
    heavierThanRaw(r) +
    (S.writable ? '<button class="fchip no-print" data-act="weigh-open" data-arg="' + attr(r.id) + '" style="min-height:26px; padding:3px 10px; font-size:11px;">изменить</button>' : "") +
  '</div>';
}

/* ═══════════════════════ время рецепта по сумме шагов ════════════════════ */
/* Длительность живёт в заголовке шага — «Шаг 3. Обжарка фарша (8 мин)». Это же
   формат, который эмитит проект Claude.ai, и он же разбирается валидатором,
   поэтому отдельного поля не заводим: одно место правды, ноль миграции. */
var _DUR = new RegExp(
  "(~)?\\s*(\\d+(?:[.,]\\d+)?)" +                 // 1: приблизительность, 2: низ
  "(?:\\s*[–—-]\\s*(\\d+(?:[.,]\\d+)?))?" +       // 3: верх диапазона
  /* Единицы принимаем так, как их реально пишут рукой: «2 м», «2м», «~3ч»,
     «4-10 мин», «20 сек», «1,5 часа». Порядок в альтернативе важен —
     длинные формы раньше коротких, иначе «мин» съелось бы как «м» и
     остаток «ин» сломал бы разбор. */
  "\\s*(минут\\w*|мин\\.?|час\\w*|сек\\w*|ч\\.?|м\\.?|с\\.?)(?![а-яё])", "gi");  // 4: единица

/* → {min, approx} минут по заголовку шага, либо null. Из диапазона берём ВЕРХ:
   план, который занижает, бесполезен — по нему нельзя решить, влезает ли
   готовка в вечер. «12–15 мин» человек закладывает как 15, а не как 13,5.

   Составную запись «2 ч 10 мин» складываем, а однородную «12–15 мин» — нет.
   Различаем по единицам: разные — это части одной величины, одинаковые —
   диапазон. Без этого «2 ч 10 мин» читалось как 2 часа и теряло десять минут
   молча (поймано на реальном шаге тушения в Болоньезе). */
function stepMinutes(title) {
  var m = String(title || "").match(/\(([^)]*)\)\s*$/);
  if (!m) return null;
  var parts = [], approx = false, d;
  _DUR.lastIndex = 0;
  while ((d = _DUR.exec(m[1])) !== null) {
    var lo = parseFloat(d[2].replace(",", "."));
    var hi = d[3] == null ? lo : parseFloat(d[3].replace(",", "."));
    if (d[1] || hi !== lo) approx = true;
    var u = d[4].toLowerCase();
    /* Секунды в минуты — дробью, а не нулём: шаг «20 сек» существует, и в
       сумме он должен весить своё, а не выпадать. */
    var k = u.charAt(0) === "ч" ? 60 : (u.charAt(0) === "с" ? 1 / 60 : 1);
    parts.push({ unit: u.charAt(0), val: hi * k });
  }
  if (!parts.length) return null;
  var units = {};
  parts.forEach(function (p) { units[p.unit] = 1; });
  var mins = parts.map(function (p) { return p.val; });
  var total = Object.keys(units).length > 1
    ? mins.reduce(function (a, b) { return a + b; }, 0)   // «2 ч 10 мин»
    : Math.max.apply(null, mins);                         // «12–15 мин»
  /* Округляем до десятых, а не до целых: «20 сек» иначе стало бы нулём и
     выпало из суммы, хотя шаг существует. В итог рецепта это всё равно
     приходит округлённым до пяти минут. */
  return { min: Math.round(total * 10) / 10, approx: approx };
}

/* Единицу времени в строке длительности приводим к канону ПРИ СОХРАНЕНИИ:
   «1 м»/«1 минут» → «1 мин», «1 час»/«1 часы» → «1 ч», «20 секунд» → «20 сек».
   Показ и подсчёт понимают любое написание (stepMinutes), но в файле держим
   одно — чтобы данные не пестрили. */
function normDur(s) {
  return String(s == null ? "" : s).replace(
    /(\d[\d.,]*(?:\s*[–—-]\s*\d[\d.,]*)?)\s*(минут\w*|мин\.?|час\w*|сек\w*|ч\.?|м\.?|с\.?)(?![а-яё])/gi,
    function (_, num, unit) {
      var u = unit.toLowerCase().charAt(0);
      var canon = u === "ч" ? "ч" : (u === "с" ? "сек" : "мин");
      return num.replace(/\s+/g, "") + " " + canon;
    });
}

/* Сырой текст длительности из заголовка ДЛЯ БЕЙДЖА — или null. Раньше бейдж
   тянул своё, более узкое, регулярное («мин|ч|час»), и «(1 м)»/«(20 сек)» не
   показывались, хотя в сумму времени попадали (stepMinutes их понимает). Один
   источник правды: показываем скобки, если stepMinutes сумел их разобрать. */
function stepDurLabel(title) {
  var m = String(title || "").match(/\(([^)]*)\)\s*$/);
  if (!m) return null;
  return stepMinutes(title) != null ? m[1].trim() : null;
}

/* Накладные: мытьё, доставание посуды, уборка между шагами. В шагах этого нет
   никогда, а времени отнимает заметно. 10% — грубая, но честная надбавка. */
var TIME_OVERHEAD = 0.10;

/* Шаг длиной от часа — это ожидание, а не работа: тушение, настаивание,
   ночь в холодильнике. Разделять их обязательно, и вот почему.

   Считать всё одной суммой давало «Ленивая овсянка — 8 ч 55 мин», хотя руками
   там пять минут. Хуже того, надбавка на мытьё бралась и от ожидания:
   +10% от восьми часов сна — это 53 минуты мытья посуды. Абсурд, который
   выглядит как аккуратное число.

   Раньше «ожидание vs работа» решал ТОЛЬКО порог в час, и это врало на
   коротком пассиве: «30 мин в холодильнике» (< 60) уезжало в «у плиты». Теперь
   у шага есть явный флаг `passive` (галочка «без участия»), и он ГЛАВНЫЙ. Порог
   в час остаётся запаской — для рецептов, где флаг не проставлен (старые файлы,
   импорт): сорокаминутное запекание без галочки всё ещё попадёт в «у плиты»,
   но это уже угол, а не общий случай. */
var LONG_STEP_MIN = 60;

function recipeTime(r) {
  var steps = r.steps || [];
  if (!steps.length) return null;
  var active = 0, waiting = 0, known = 0, approx = false;
  steps.forEach(function (s) {
    var d = stepMinutes(s.title);
    if (!d) return;
    known++;
    /* Явный флаг побеждает; порог 60 мин — только когда флаг не задан. */
    var isWait = s.passive === true || (s.passive == null && d.min >= LONG_STEP_MIN);
    if (isWait) waiting += d.min; else active += d.min;
    if (d.approx) approx = true;
  });
  if (!known) return null;
  /* Округление до 5 минут — но не в ноль: у чиа-пудинга активных две минуты, и
     «0 мин у плиты» читается как «готовится само», хотя миску всё же достать
     надо. Ненулевая работа показывается минимум пятью минутами. */
  var hands = active ? Math.max(5, Math.round(active * (1 + TIME_OVERHEAD) / 5) * 5) : 0;
  return { active: active, hands: hands, waiting: waiting,
           total: hands + waiting, known: known, of: steps.length, approx: approx };
}

/* Короткая форма для карточки и печати: «≈ 40 мин у плиты + 2 ч 10 мин ожидания».
   Ожидание не прячем даже в тесной карточке — именно оно решает, влезет ли
   блюдо в будний вечер. */
function shortTime(rt) {
  return "≈ " + fmtMinutes(rt.hands) + " у плиты" +
    (rt.waiting ? " + " + fmtMinutes(rt.waiting) + " ожидания" : "");
}

function fmtMinutes(n) {
  if (n < 60) return n + " мин";
  var h = Math.floor(n / 60), m = n - h * 60;
  return h + " ч" + (m ? " " + m + " мин" : "");
}

/* Строка времени под заголовком. Всё, что могло бы соврать, подписано:
   — «≈», потому что диапазоны взяты по верху и добавлены накладные;
   — «по N из M шагов», если время проставлено не везде (иначе итог выглядит
     полным, а на деле недосчитывает);
   — сумма шагов отдельно от итога, чтобы надбавку было видно, а не угадывать;
   — строка автора рядом, если она есть и заметно расходится: она учитывает
     параллельность, которой в сумме шагов нет по построению. */
function timeLine(r, rt) {
  var parts = ["Σ шагов " + fmtMinutes(rt.active) + " + 10% на мытьё и сборку"];
  if (rt.known < rt.of) parts.push("время у " + rt.known + " из " + rt.of + " шагов");
  return '<div style="display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-top:8px;">' +
    '<span class="num" style="font-size:15px; font-weight:600; color:var(--c-2);">⏱ ≈ ' + esc(fmtMinutes(rt.hands)) + ' у плиты</span>' +
    (rt.waiting ? '<span class="num" style="font-size:13px; font-weight:600; color:var(--text-muted);">+ ' +
      esc(fmtMinutes(rt.waiting)) + ' ожидания</span>' : "") +
    '<span class="num" style="font-size:11.5px; color:var(--text-faint);">' + esc(parts.join(" · ")) + '</span>' +
    (r.time ? '<span class="num" style="font-size:11.5px; color:var(--text-faint);">· в источнике: ' + esc(r.time) + '</span>' : "") +
  '</div>';
}

/* Плашка над таблицей ингредиентов: сколько строк не связано с каталогом и
   чем это грозит. Считаем отдельно те, у которых есть количество — именно они
   тихо выпадают из списка покупок и из КБЖУ. «По вкусу» без продукта тоже
   помечается в строке, но в счётчик последствий не идёт: соль и перец в
   список не попадают и по правилам. */
function unlinkedNote(r) {
  var bad = unlinkedIngs(r);
  if (!bad.length) return "";
  var withQty = bad.filter(function (g) { return g.qty != null; }).length;
  var one = bad.length === 1;
  var msg = bad.length + " " + plural(bad.length, "ингредиент", "ингредиента", "ингредиентов") +
    (one ? " не связан" : " не связаны") + " с каталогом продуктов";
  var tail;
  if (!withQty) {
    tail = one ? " (он «по вкусу» — на список покупок и КБЖУ это не влияет)."
               : " (все «по вкусу» — на список покупок и КБЖУ это не влияет).";
  } else if (withQty === bad.length) {
    tail = one ? " — он не попадёт в список покупок и не считается в КБЖУ блюда."
               : " — они не попадут в список покупок и не считаются в КБЖУ блюда.";
  } else {
    tail = " — " + withQty + " из них с количеством: " +
      (withQty === 1 ? "он не попадёт" : "они не попадут") +
      " в список покупок и " + (withQty === 1 ? "не считается" : "не считаются") + " в КБЖУ блюда.";
  }
  return '<div class="no-print" style="display:flex; align-items:flex-start; gap:10px; font-size:12.5px; line-height:1.45; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:10px 13px; margin:0 0 12px;">' +
    '<span style="font-weight:700; font-size:15px; line-height:1.1;">⚠</span>' +
    '<span>' + esc(msg + tail) +
      (S.writable ? ' Нажмите «связать» в строке — подберу продукт или заведу новый.' : "") +
    '</span></div>';
}

/* ═══════════════════════ экран: рецепт (чтение) ══════════════════════════ */
function readScreen() {
  var r = recipeById(S.openRecipe);
  if (!r) return '<section class="screen sc-read" style="display:block;"><div style="padding:60px 0; text-align:center; color:var(--text-faint);">Рецепт не найден.</div></section>';

  var factor = recipeFactor(r), target = S.portions[r.id] || r.servings;
  var scaled = Math.abs(factor - 1) > 0.001;
  var nu = r.nutrition || {};
  var pw = portionWeight(r);
  var estNut = nu.kcal == null ? dishNutritionEstimate(r) : null;

  var rows = ingOrder(r.ingredients).map(function (x) {
    var g = x.g;
    var v = scaledQty(g, factor);
    var mute = g.qty == null ? "color:var(--text-faint);" : "";
    var p = g.product_id ? productById(g.product_id) : null;
    /* Ховер строки ингредиента: КБЖУ продукта + фасовка. Раньше тут было
       «когда брали» — но при готовке полезнее знать пищевую ценность
       (замечание владельца 2026-07-21). */
    var pn = p && p.nutrition_100g;
    var kcalTxt = (pn && pn.kcal != null)
      ? pn.kcal + " ккал/100 " + ((normUnit(p && p.unit) || "г") === "мл" ? "мл" : "г") : "";
    var pkH = packOf(p);
    var cat = [kcalTxt, pkH != null ? "фасовка " + fmtQty(pkH, p.unit) : ""].filter(Boolean).join(" · ");
    /* Ингредиент без продукта в каталоге помечаем прямо в строке, а не только
       счётчиком сверху: иначе в списке из пятнадцати строк непонятно, какую
       именно чинить. Кнопка ведёт в подбор — связать с существующим продуктом
       или завести новый. Без прав на запись остаётся только пометка. */
    var link = g.product_id ? "" :
      (S.writable
        ? '<span class="no-print" data-act="ing-link" data-arg="' + attr(x.i) + '" title="связать с продуктом каталога" ' +
          'style="font-size:10.5px; font-weight:600; color:var(--warn); border:1px dashed var(--warn); border-radius:999px; padding:2px 9px; margin-left:8px; cursor:pointer; white-space:nowrap;">нет в каталоге · связать</span>'
        : '<span class="no-print" style="font-size:10.5px; font-weight:600; color:var(--warn); border:1px dashed var(--warn); border-radius:999px; padding:2px 9px; margin-left:8px; white-space:nowrap;">нет в каталоге</span>');
    return '<div class="ing-tr" tabindex="0" style="padding:0 16px;">' +
      '<div style="display:grid; grid-template-columns:1fr auto; gap:12px; align-items:baseline; padding:10px 0;">' +
        '<span style="font-size:14px;' + mute + '">' + esc(curName(g)) +
          (g.state === "cooked" ? ' <span style="font-size:11px; color:var(--c-2);">готовый вес</span>' : "") + link + '</span>' +
        '<span class="num" style="font-size:14px; font-weight:600; white-space:nowrap;' + mute + '">' +
          /* qty=null — это «по вкусу». raw брать НЕЛЬЗЯ: у части записей там
             лежит вся исходная строка целиком, и в колонке количества
             дублировалось бы название ингредиента. */
          amountText(g, v, factor) + '</span>' +
      '</div>' +
      (cat ? '<div class="ing-cat num" style="font-size:11.5px; color:var(--c-2); padding-bottom:9px;">' + esc(cat) + '</div>' : "") +
    '</div>';
  }).join("");

  var steps = (r.steps || []).map(function (s, i) {
    var head = String(s.title || ("Шаг " + (i + 1)));
    var dm = stepDurLabel(head);
    var name = head.replace(/\([^)]*\)\s*$/, "").trim();
    var passive = s.passive === true;
    /* Правка длительности — там же, где она показана. Итог рецепта пересчи-
       тывается сразу, потому что считается из этих же заголовков. */
    var badge;
    if (S.durEdit && S.durEdit.id === r.id && S.durEdit.i === i) {
      badge = '<span style="display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;">' +
        '<input id="f-dur" value="' + attr(dm || "") + '" placeholder="8 мин" ' +
          'style="width:96px; box-sizing:border-box; border:1px solid var(--c-2); border-radius:6px; background:var(--bg); color:var(--text); font-family:inherit; font-size:12px; padding:4px 8px;">' +
        '<label style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-muted); cursor:pointer;" title="духовка, холодильник, настаивание — время идёт само, руки свободны">' +
          '<input type="checkbox" id="f-dur-passive"' + (passive ? " checked" : "") + ' style="width:15px; height:15px;">⏸ без участия</label>' +
        '<button class="fchip" data-act="dur-save" data-arg="' + attr(i) + '" style="min-height:26px; padding:3px 10px; font-size:11px; color:var(--c-2); border-color:var(--c-2);">ОК</button>' +
        '<button class="fchip" data-act="dur-cancel" style="min-height:26px; padding:3px 10px; font-size:11px;">Отмена</button>' +
      '</span>';
    } else if (dm) {
      badge = '<span class="num' + (S.writable ? " dur-chip" : "") + '"' +
        (S.writable ? ' data-act="dur-open" data-arg="' + attr(i) + '" title="изменить длительность"' : "") +
        ' style="font-size:11.5px; font-weight:600; color:var(--text-muted); background:var(--bg-alt); border-radius:999px; padding:3px 10px;' +
        (S.writable ? " cursor:pointer;" : "") + '">' + (passive ? "⏸" : "⏱") + ' ' + esc(dm) +
        (passive ? ' <span style="color:var(--text-faint); font-weight:500;">без участия</span>' : "") + '</span>';
    } else {
      badge = S.writable
        ? '<span class="dur-chip no-print" data-act="dur-open" data-arg="' + attr(i) + '" style="font-size:11.5px; color:var(--text-faint); border:1px dashed var(--border-strong); border-radius:999px; padding:3px 10px; cursor:pointer;">+ время</span>'
        : "";
    }
    return '<div class="stepblk">' +
      '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;">' +
        '<span style="font-family:var(--font-serif); font-size:16px; font-weight:600;">' + esc(name) + '</span>' +
        badge +

      '<div style="font-size:14px; line-height:1.6; color:var(--text);">' +
        scaleStepText(s.text, r.ingredients || [], factor) + '</div>' +
    '</div>';
  }).join("");

  function block(title, raw) {
    if (!raw) return "";
    var items = String(raw).split("\n").map(function (x) { return x.replace(/^[-•*]\s*/, "").trim(); })
      .filter(Boolean);
    if (!items.length) return "";
    /* linkifyEsc, а не esc: адреса в «Источниках» становятся ссылками и коротким
       текстом. Экранирование внутри — сырой текст в разметку не попадает. */
    return '<div class="rsec">' + esc(title) + '</div>' +
      (items.length > 1
        ? '<ul style="font-size:14px; line-height:1.7; color:var(--text); margin:0; padding-left:20px;">' +
          items.map(function (x) { return "<li>" + linkifyEsc(x) + "</li>"; }).join("") + '</ul>'
        : '<p style="font-size:14px; line-height:1.7; color:var(--text); margin:0;">' + linkifyEsc(items[0]) + '</p>');
  }

  /* Время считаем по шагам, а не берём строкой из источника: правишь шаг —
     итог меняется сразу. Строку источника оставляем рядом мелким шрифтом,
     когда она есть: её писал автор рецепта, и она знает про параллельность
     (курица печётся, пока варится гречка), а сумма шагов — нет. */
  var rt = recipeTime(r);
  var meta = [r.cuisine, rt ? null : r.time,
              r.difficulty ? "сложность " + r.difficulty + " из 5" : ""]

  return '<section class="screen sc-read" style="max-width:760px;">' +
    '<a class="no-print" data-act="nav" data-arg="recipes" style="display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-weight:600; font-size:12.5px; cursor:pointer; margin-bottom:14px;"><span>←</span> Все рецепты</a>' +
    '<header style="margin:0 0 4px;">' +
      '<h1 style="font-family:var(--font-serif); font-weight:600; font-size:clamp(30px,5vw,46px); line-height:1.02; letter-spacing:-.02em; margin:0;">' + esc(r.title) + '</h1>' +
