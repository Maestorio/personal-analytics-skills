<!-- Светлая тема по умолчанию: системную prefers-color-scheme НЕ подхватываем
     (правило кабинета 2026-07-13) — тёмная только при явном hub-theme==="dark". -->
<script>(function(){try{if(localStorage.getItem("hub-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/ui-kit.css?v=1.72.0">
<style>
:root{
  --c2-bg:#efe4cd;
  --paper:radial-gradient(1100px 620px at 90% -10%, rgba(179,147,79,.10), rgba(179,147,79,0) 60%), radial-gradient(820px 520px at -8% 108%, rgba(125,149,96,.08), rgba(125,149,96,0) 55%), repeating-linear-gradient(135deg, rgba(120,110,90,.030) 0 1px, transparent 1px 14px);
}
[data-theme="dark"]{
  --c2-bg:#352b16;
  --paper:radial-gradient(1100px 620px at 90% -10%, rgba(203,163,95,.10), rgba(203,163,95,0) 60%), radial-gradient(820px 520px at -8% 108%, rgba(155,179,126,.07), rgba(155,179,126,0) 55%), repeating-linear-gradient(135deg, rgba(255,246,224,.022) 0 1px, transparent 1px 14px);
}
/* База (сброс, шрифт, цвет и фон body) — в assets/ui-kit.css; здесь только своё. */
/* акцент раздела для общих компонентов ui-kit (выпадающий список и др.) */
body{ --sec-acc:var(--c-2); }
.num{ font-variant-numeric:tabular-nums lining-nums; }
a{ color:var(--c-2); text-decoration:none; }
@media (hover:hover){ a:hover{ filter:brightness(.92); } }
@keyframes food-fade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@keyframes sheet-up{ from{ transform:translateY(100%); } to{ transform:none; } }

:focus-visible{ outline:2px solid var(--c-2); outline-offset:3px; }

/* шапка раздела (.ui-top) — общая, ui-kit uiTopHTML; своих стилей шапки нет */
.paper-bg{ position:fixed; inset:0; z-index:0; pointer-events:none;
           background-image:var(--paper); }
.shell{ display:grid; gap:34px; align-items:start; max-width:1180px; margin:0 auto; padding:24px clamp(16px,4vw,42px) 100px; position:relative; z-index:1; }   /* колонки и порог — ui-kit .ui-shell */
/* рельс и нижняя панель — общие ui-kit (.ui-rail, .ui-mnav; ширина, слои, порог — там) */
/* Активное состояние — классом .on, а НЕ перечислением пар
   [data-screen=X] .item[data-arg=X]. Перечисление молча рассыпается при
   добавлении элемента: отдел «бытовое» приехал в DEPTS коммитом 88fd591, а
   строку в CSS дописать забыли — фильтр работал, чип не подсвечивался
   (баг 2026-07-27). Источник истины теперь один — JS, который и так знает,
   что активно. Соответствие «ключ списка ↔ правило подсветки» закреплено
   тестом в tools/tests/test_pages_contracts.py. */

.screen{ display:none; }
[data-screen="shopping"] .sc-shopping,
[data-screen="recipes"] .sc-recipes,
[data-screen="products"] .sc-products,
[data-screen="read"] .sc-read,
[data-screen="edit"] .sc-edit,
[data-screen="cook"] .sc-cook,
[data-screen="print"] .sc-print{ display:block; animation:food-fade .24s ease; }
@media (hover:hover){ .dur-chip:hover{ border-color:var(--c-2); color:var(--c-2); } }
@media (hover:hover){ .sug-row:hover{ background:var(--bg-alt); } }
/* отступы прокрутки: закреплённая шапка (≈72px) не должна закрывать карточку/поле при scrollIntoView */
.row-hover, #f-prod-q{ scroll-margin-top:100px; scroll-margin-bottom:24px; }
.row-hover.kb-sel{ background:var(--c2-bg); border-color:var(--c-2); box-shadow:0 0 0 1px var(--c-2); }
.sug-row:active{ background:var(--c2-bg); }
.dur-chip{ transition:border-color .15s,color .15s; }
/* white-space:nowrap держит КОРОТКИЕ чипы (фильтры, «изменить») одной строкой —
   ради этого он и стоит. Но один чип длинный («⚖ Взвесили готовое? Введите
   массу — покажу КБЖУ на 100 г», 420 px), и на телефоне он в одну строку не
   влезал НИКОГДА: документ становился шире экрана на всех ширинах до 430 px, а
   iOS сжимал страницу целиком. Поэтому nowrap остаётся правилом, а длинному
   чипу разрешаем перенос точечно — класс .fchip-wrap (2026-08-02). */
.fchip{ background:var(--bg-elev); border:1px solid var(--border); border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; min-height:34px; font-family:inherit; transition:background .15s,border-color .15s,color .15s; white-space:nowrap; max-width:100%; box-sizing:border-box; }
.fchip-wrap{ white-space:normal; text-align:left; border-radius:12px; line-height:1.35; }
@media (hover:hover){ .fchip:hover{ border-color:var(--border-strong); color:var(--text); } }
.fchip.on{ background:var(--c2-bg); border-color:var(--c-2); color:var(--c-2); }

.gseg-wrap{ display:inline-flex; background:var(--bg-sunk); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
.gseg{ border:none; background:transparent; border-radius:999px; padding:7px 15px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; font-family:inherit; min-height:34px; white-space:nowrap; }
@media (hover:hover){ .gseg:hover{ color:var(--text); } }
.gseg.on{ background:var(--bg-elev); color:var(--c-2); box-shadow:0 1px 2px rgba(60,52,38,.14); }

.srch{ width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:9px; background:var(--bg-elev); color:var(--text); font-family:inherit; font-size:14px; padding:11px 40px 11px 40px; }  /* справа — место под крестик ui-search-x */
.srch:focus{ outline:2px solid var(--c-2); outline-offset:1px; }

/* iOS Safari приближает страницу при фокусе в поле мельче 16px — и обратно НЕ
   отдаляет: масштаб приходится сводить пальцами, а раздел — одностраничное
   приложение, поэтому увеличение живёт до конца сессии. 16px на сенсорных
   экранах убирает триггер целиком (вариант «maximum-scale=1 в viewport» отвергнут:
   он чинит это, выключая пинч-зум вообще). !important — потому что у части полей
   размер стоит инлайном, а инлайн бьёт любой селектор. Чекбоксы не трогаем:
   у них размер задан width/height. */
@media (hover: none) and (pointer: coarse) {
  .srch, .fld, textarea, select,
  input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]) { font-size:16px !important; }
}

/* Длинный URL — единственный токен, который не переносится сам и потому
   растягивает ВЕСЬ документ: страница становится шире экрана, iOS сжимает её
   целиком (белая полоса справа), и это состояние держится до пинча. Ловим на
   уровне текстовых контейнеров — дешевле, чем чинить каждый источник руками.
   Замер 2026-08-02: «Плов» давал 610 px при экране 390. */
.screen p, .screen li, .screen td, .stepblk, .rsec { overflow-wrap:anywhere; }

.rcard{ transition:border-color .16s,box-shadow .16s,transform .16s; }
@media (hover:hover){ .rcard:hover{ border-color:var(--border-strong); box-shadow:0 2px 4px rgba(60,52,38,.10),0 12px 30px rgba(60,52,38,.08); transform:translateY(-2px); } }
.row-hover{ transition:background .13s; }
@media (hover:hover){ .row-hover:hover{ background:var(--bg-alt); } }
.co-box{ transition:background .12s,border-color .12s; }
@media (hover:hover){ .sh-row:hover{ background:var(--bg-alt); } }
.ing-tr .ing-cat{ opacity:0; max-height:0; overflow:hidden; transition:opacity .16s,max-height .16s; }
.ing-tr:focus-within .ing-cat{ opacity:1; max-height:60px; }@media (hover:hover){ .ing-tr:hover .ing-cat{ opacity:1; max-height:60px; } }
.rsec{ background:var(--warn-bg); color:var(--c-2); font-family:var(--font-serif); font-weight:600; font-size:15px; padding:9px 16px; border-radius:8px; letter-spacing:.02em; margin:30px 0 14px; }
.stepblk{ border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; background:var(--bg); }
.pbtn{ width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text); font-size:18px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; line-height:1; }
@media (hover:hover){ .pbtn:hover{ background:var(--bg-alt); border-color:var(--border-strong); } }

.ov{ position:fixed; inset:0; background:rgba(28,24,18,.5); backdrop-filter:blur(2px); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; }
.modal{ background:var(--bg-elev); border:1px solid var(--border); border-radius:12px; max-width:640px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow); }
.modal-h{ padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; position:sticky; top:0; background:var(--bg-elev); z-index:1; }
.sheet-ov{ position:fixed; inset:0; background:rgba(28,24,18,.45); z-index:210; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ background:var(--bg-elev); border-top-left-radius:16px; border-top-right-radius:16px; width:100%; max-width:520px; max-height:82vh; overflow-y:auto; box-shadow:0 -8px 40px rgba(0,0,0,.28); animation:sheet-up .22s ease; }

.cook-step-text{ font-size:19.5px; line-height:1.5; color:var(--text); max-width:36ch; }


@media (max-width:860px){
  .recipe-grid{ grid-template-columns:1fr !important; }
  .cook-2col{ grid-template-columns:1fr !important; }
  .cook-ing-rail{ display:none !important; }
  .cook-2col-ing{ display:inline-flex !important; }
  .cook-top{ flex-wrap:wrap !important; }
  .cook-top-right{ flex:1 1 100% !important; justify-content:center; }
  .cook-top-right .cook-2col-ing{ flex:1; justify-content:center; }
  .cook-step-text{ font-size:23px !important; }
  .shop-wrap{ max-width:none !important; }
}
@page{ size:A4; margin:14mm; }
@media print{
  /* Анимации в печати гасим — и это не про красоту. Экран появляется через
     food-fade (`from{opacity:0}`), а печать снимает страницу в первом кадре
     анимации: на бумагу уходил ПУСТОЙ лист. Поймано headless-печатью:
     hub.html давал 383 КБ, food.html — 1,6 КБ, то есть чистую страницу. */
  *,*::before,*::after{ animation:none !important; transition:none !important; }
  .ui-top,.ui-rail,.ui-mnav,.no-print{ display:none !important; }
  .shell{ display:block; padding:0; max-width:none; }
  body{ background:#fff; }
  /* Лист печатается как есть: рамка, тень и скруглённые углы нужны только на
     экране, чтобы он читался листом бумаги. Поля даёт @page, не padding. */
  .print-sheet{ box-shadow:none !important; border:0 !important; border-radius:0 !important;
                padding:0 !important; max-width:none !important; margin:0 !important; }
  /* Разрыв страницы посреди шага или строки таблицы — то, из-за чего печатный
     рецепт перестают печатать. Заголовок раздела в конце листа — тоже. */
  .print-step,.print-blk,.print-table tr{ page-break-inside:avoid; break-inside:avoid; }
  .print-h{ page-break-after:avoid; break-after:avoid; }
  .print-table{ page-break-inside:auto; }
  /* На бумаге тема всегда светлая. Лист печати белый и от токенов не зависит,
     но Cmd+P можно нажать с ЛЮБОГО экрана — а в тёмной теме это дало бы
     светлый текст на белой бумаге, то есть пустой лист. Возвращаем светлые
     значения токенов; фактура бумаги в печати не нужна вовсе. */
  [data-theme="dark"]{
    --bg:#f4f1ea; --bg-elev:#fbf9f4; --bg-alt:#ece7dd; --bg-sunk:#e6e0d4;
    --text:#2b2823; --text-muted:#766f63; --text-faint:#7e7666;
    --border:#ddd6c8; --border-strong:#c8bfad;
    --warn:#a8843f; --warn-bg:#f0e6cf; --err:#a85a48; --err-bg:#f0dcd4;
    --success:#5f7a4f; --success-bg:#e6ead9;
    --c-2:#b3934f; --c2-bg:#efe4cd;
  }
  [data-theme]{ background:#fff !important; background-image:none !important; }
}
</style>

<body>
<div id="app"></div>
<script src="assets/ui-kit.js?v=1.72.0"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Еда · Личный кабинет — раздел продуктов, рецептов и планирования покупок.

   Происхождение вёрстки: макет «Еда.dc.html», Claude Design, проект
   553ebbf1-cf71-453d-9d71-39b0427aee77. Блок стилей выше перенесён ВЕРБАТИМ
   (вырезан только <link> на Google Fonts — шрифты self-host, кабинет офлайн).
   При обновлении макета переносить блок целиком, а не править по месту.

   Архитектура — как в health.html: состояние в S, любое изменение через
   set(), полная перерисовка render(), события делегированием на document.
   Причина та же: дискретное состояние восстанавливается точно, а
   скролл-зависимый UI при полной перерисовке разъезжается.

   ── Доступ ────────────────────────────────────────────────────────────────
   ЧТЕНИЕ публичное: список покупок открывают в магазине вдвоём и с мобильного
   интернета, пароль там только мешал бы. ЗАПИСЬ — через /api/fd/*: свободно
   с домашнего IP, извне по токену hub-auth. Без прав страница остаётся
   витриной: S.writable=false, кнопки правки не рендерятся.

   Порядок загрузки поэтому такой: сперва apiGet (даёт content + hash, то есть
   право на запись), при неудаче — обычный fetch из ../Food/ (только просмотр).
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
"use strict";

/* ── ../ ОБЯЗАТЕЛЕН: страница живёт в /tools/, данные и API — в корне сайта.
   Без него fetch уходит в /tools/Food/… и получает 404. Закреплено тестом. ── */
/* Версия страницы. Нужна ровно для одного: понять по скриншоту, ту ли
   сборку человек видит. Без неё «у меня не работает» неотличимо от
   «у меня старая версия из кеша». Поднимать при каждой выкладке. */
var VERSION = "food v1.50";   // v1.49: кнопки и подвал по единым правилам (ui-kit 1.70.0). v1.48: запись без ответа дольше SAVE_WAIT_MS (8 с) — в очередь, а не вечное «Сохраняю…»
var DATA = "../Food/";
var API  = "../api/fd/";
var NEED_FILES = ["products", "recipes", "shopping"];

/* Отделы: ключ в разметке макета ↔ значение в данных. В данных лежит русская
   строка (category — свободный текст, не enum: новый отдел не должен ронять
   сохранение). Незнакомое падает в «прочее», а НЕ прячется. «бытовое» —
   пакеты, зубочистки, батарейки и прочий хозтовар: не продукт (КБЖУ у него
   нет), но в списке покупок нужен, поэтому это отдельный отдел, а не «прочее»
   (там мелочь съедобная — соль, специи). */
var DEPTS = [
  ["all", "Все"], ["meat", "мясо"], ["fish", "рыба"], ["dairy", "молочка"],
  ["veg", "овощи-фрукты"], ["grocery", "бакалея"], ["frozen", "заморозка"],
  ["bakery", "выпечка"], ["drinks", "напитки"], ["other", "прочее"],
  ["nonfood", "бытовое"]
];
function deptKey(cat) {
  var c = (cat || "").toLowerCase().trim();
  for (var i = 1; i < DEPTS.length; i++) if (DEPTS[i][1] === c) return DEPTS[i][0];
  return "other";
}
function deptLabel(cat) {
  var c = (cat || "").toLowerCase().trim();
  for (var i = 1; i < DEPTS.length; i++) if (DEPTS[i][1] === c) return c;
  return c || "прочее";
}
/* Тип блюда — тот же принцип, что у DEPTS: свободная строка в данных
   (category), незнакомое падает в «прочее», а не прячет рецепт. «Прочее» в
   RECIPE_CATS нет — чип для него дорисовывается в recipesScreen(), и только
   если в него реально что-то попало (рецептов немного, пустой чип — шум). */
/* Порядок чипов — по ходу еды, а не по алфавиту: завтрак, суп, горячее, гарнир,
   холодное, десерт. «Супы» и «Крупы и гарниры» добавлены 2026-08-09: четыре
   рецепта уезжали в «Прочее», хотя суп — самая обычная категория домашнего
   обеда. Ключи английские, ярлык русский — по ярлыку и сопоставляется свободная
   category из файла рецепта (recCatKey), поэтому менять текст ярлыка нельзя, не
   переименовав category в самих рецептах. */
var RECIPE_CATS = [
  ["all", "Все"], ["breakfast", "Завтрак"], ["soups", "Супы"], ["meat", "Мясо"],
  ["poultry", "Птица"], ["fish", "Рыба"], ["grains", "Крупы и гарниры"],
  ["salads", "Салаты и холодное"], ["baking", "Выпечка и десерты"]
];
function recCatKey(cat) {
  var c = (cat || "").toLowerCase().trim();
  for (var i = 1; i < RECIPE_CATS.length; i++) if (RECIPE_CATS[i][1].toLowerCase() === c) return RECIPE_CATS[i][0];
  return "other";
}
/* ═══════════════════════ состояние ═══════════════════════════════════════ */
var S = {
  theme: "light",
  screen: "shopping",
  loading: true,
  error: null,
  writable: false,
  apiState: null,        // null | "down" | "old" | "ok"
  apiSkew: [],           // какие файлы этот сайдкар не знает
  saving: false,
  saveNote: null,   // ошибка
  saveInfo: null,   // нейтральное уведомление
  refreshing: false,
  canDelete: false, // сайдкар умеет /api/fd/delete (иначе кнопки удаления нет)

  products: [], recipes: [], shopping: [],
  hash: {},
  server: {},       // последнее состояние файлов с сервера — база для слияния очереди (офлайн, v1.38)

  // фильтры экранов
  deptFilter: "all",
  groupMode: "dept",
  productQuery: "",

  recipeQuery: "",
  recipeCatFilter: "all",
  openRecipe: null,
  /* Выбранное число порций живёт ТОЛЬКО в сеансе: это «сколько готовлю
     сегодня», а не свойство рецепта. Писать его в файл значило бы менять
     рецепт под разовую готовку. */
  portions: {},

  // правка и раскрытия
  prodEdit: null,
  prodCard: null,      // id продукта, чья карточка-просмотр открыта
  addItem: null,
  prodSel: -1,         // выбранная стрелками строка в поиске продуктов (-1 — ничего)
  addSugIdx: -1,       // выбранная стрелками подсказка в окне добавления (-1 — ничего)
  qtyEdit: null,       // id строки, у которой открыто поле количества
  weighEdit: null,     // id рецепта, у которого вводят массу готового блюда
  durEdit: null,       // {id, i} — шаг, у которого правят длительность
  edit: null,          // рабочая копия рецепта в редакторе
  prodReturn: null,    // куда вернуться после «Новый продукт» (edit | {link:{id,i}} | null)
  ingLink: null,       // {id, i, q} — подбор продукта для несвязанного ингредиента
  _toTop: false,       // следующая перерисовка — к верху (смена фильтра/группировки)
  edCatQuery: "",      // фильтр каталога в редакторе рецепта

/* Удаление рецепта = удаление ЕГО ФАЙЛА. Хэш берём прямо перед удалением тем же
   apiGet, что и при сохранении: сервер откажет (409), если файл на диске уже не
   тот, который человек видел на экране. Слепого «сотри, что там лежит» нет.

   Сервер перед удалением кладёт копию в .versions/ — то есть «удалено» здесь
   значит «убрано из библиотеки», а не «стёрто навсегда». Именно так и написано
   в окне подтверждения: обещать невосстановимость, когда бэкап есть, — врать. */
function deleteRecipe(id, after) {
  var key = "recipes/" + id;
  S.saving = true; S.saveNote = null; S.saveInfo = null; render();
  apiGet(key).then(function () {
    return authFetch(API + "delete", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: key + ".json", base_hash: S.hash[key] })
    });
  }).then(function (r) {
    if (r.status === 200) return;
    if (r.status === 409) throw new Error("Рецепт изменился с другого устройства. Нажмите «Обновить» и решите заново.");
    if (r.status === 404) throw new Error("Этот сайдкар не умеет удалять рецепты (или файла уже нет). Обновите hub-api на NAS.");
    if (r.status === 401 || r.status === 403) throw new Error("Нет прав на удаление. Войдите на странице входа.");
    throw new Error("Не удалось удалить (код " + r.status + ").");
  }).then(function () {
    /* Из памяти убираем сами, а не перезагружаем каталог: перезагрузка стоит
       столько же, сколько первый старт страницы, и на телефоне это заметно. */
    S.recipes = S.recipes.filter(function (r) { return r.id !== id; });
    delete S.hash[key];
    S.saving = false;
    if (after) after();
    render();
  }).catch(function (e) {
    S.saving = false; S.saveNote = e.message; render();
  });
}

/* Загрузка: apiGet даёт право на запись, публичный fetch — только просмотр.
   Ошибку одного файла НЕ превращаем в ошибку страницы: список покупок должен
   открыться, даже если каталог продуктов почему-то не читается. */
function loadOne(name) {
  return apiGet(name)
    .then(function (doc) { return { doc: doc, writable: true }; })
    .catch(function () {
      return getJSON(DATA + name + ".json")
        .then(function (doc) { return { doc: doc, writable: false }; })
        .catch(function (e) { return { doc: null, writable: false, err: e }; });
    });
}
/* Рецепты — по файлу на рецепт (2026-07-20). Читаем листингом каталога:
   положил файл — рецепт появился, без импорта и слияния. Листинг отдаёт сам
   Caddy (file_server browse) при Accept: application/json — тем же способом
   хаб читает каталоги отчётов. */
function loadRecipes() {
  return fetch(bust(DATA + "recipes/"), {
    headers: { Accept: "application/json" }, cache: "no-store"
  }).then(function (r) {
    if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r.json();
  }).then(function (entries) {
    var names = (entries || []).map(function (e) { return e.name; })
      .filter(function (n) { return /\.json$/i.test(n) && n.charAt(0) !== "."; });
    return Promise.all(names.map(function (n) {
      return getJSON(DATA + "recipes/" + encodeURIComponent(n))
        /* Один битый файл не должен обрушить всю библиотеку: пропускаем его и
           говорим об этом, а остальные рецепты открываются. */
        .then(function (doc) { return { name: n, doc: doc }; })
        .catch(function () { return null; });
    })).then(function (list) {
      var good = [], mismatched = 0;
      list.filter(Boolean).forEach(function (o) {
        var fileId = o.name.replace(/\.json$/i, "");
        /* Имя файла — АВТОРИТЕТ. Внутренний id может разойтись (скопировали
           файл, поменяли title, а id забыли — реальный случай 2026-07-21:
           два рецепта с id «ragu-iz-kuritsy», курица и говядина путались).
           Файл на диске уникален по построению, поэтому id берём из него —
           коллизии по id физически невозможны. Расхождением считаем ТОЛЬКО
           реально заданный чужой id: по новому формату поля id в файле нет
           вовсе (см. delete doc.id при сохранении), и его отсутствие — норма,
           а не расхождение. Без охраны != null undefined !== fileId всегда
           истинно, и все правильные файлы без id ложно шли в счётчик (баг
           2026-07-23: 26 файлов без id → «26 рецептов с чужим id»). */
        if (o.doc && o.doc.id != null && o.doc.id !== fileId) mismatched++;
        o.doc.id = fileId;
        good.push(o.doc);
      });
      return { recipes: good, broken: names.length - good.length, mismatched: mismatched };
    });
  });
}

function loadAll() {
  S.loading = true; S.error = null; uiDataReset(); render();
  return Promise.all([
    loadOne("products"),
    loadRecipes().then(function (x) { return { doc: x, writable: true }; })
                 .catch(function (e) { return { doc: null, writable: false, err: e }; }),
    loadOne("shopping"),
    authFetch(bust("../api/health"), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (res) {
    var p = res[0], r = res[1], sh = res[2], cap = res[3];
    S.products = (p.doc && p.doc.products) || [];
    S.recipes  = (r.doc && r.doc.recipes) || [];
    S.brokenRecipes = (r.doc && r.doc.broken) || 0;
    S.mismatchedRecipes = (r.doc && r.doc.mismatched) || 0;
    S.shopping = (sh.doc && sh.doc.items) || [];
    /* Права на запись определяют products/shopping: каталог рецептов читается
       публично, и по нему судить о правах нельзя. */
    S.writable = !!(p.writable && sh.writable);

    /* Проба возможностей сайдкара различает «сайдкар лежит», «сайдкар старый и
       не знает про еду» и «всё в порядке». Без такого признака рассинхрон
       версий снаружи неотличим от «нет прав»: и то и другое — 403. */
    if (!cap) S.apiState = "down";
    else if (!cap.food_files) { S.apiState = "old"; S.apiSkew = NEED_FILES.slice(); }
    else {
      S.apiState = "ok";
      S.apiSkew = NEED_FILES.filter(function (f) { return cap.food_files.indexOf(f) < 0; });
    }
    /* Удаление рецепта — отдельная возможность сайдкара, а не следствие
       S.writable: старый сайдкар пишет файлы, но на /api/fd/delete отвечает 404,
       и кнопка вела бы в тупик с невнятной ошибкой. Нет признака — нет кнопки. */
    S.canDelete = !!(cap && cap.food_delete);

    [p, r, sh].forEach(function (x) { uiDataDone(!!x.doc); });
    var dead = [p, r, sh].filter(function (x) { return !x.doc; });
    if (dead.length === 3) S.error = describeError(dead[0].err);
    /* Диплинк — до первой отрисовки, иначе мигнёт список покупок. И только на
       первой загрузке: «Обновить» посреди работы не должно швырять обратно. */
    if (!_deepLinkDone) { _deepLinkDone = true; applyDeepLink(); }
    /* офлайн (v1.38): неотправленное — поверх загруженного, затем попытка отправить */
    if (outboxCount()) { outboxApply(); S.saveInfo = outboxNote(); }
    S.loading = false; render();
    flushOutbox();
  });
}
function describeError(e) {
  if (!e) return "Не удалось загрузить данные.";
  if (e.status === 404) return "Файлы раздела не найдены. Каталог Food/ ещё не создан на сервере — запустите deploy.zsh.";
  if (e.status === 401 || e.status === 403) return "Нет доступа к данным.";
  if (e.status === 502 || e.status === 503) return "Сервер не отвечает.";
  return "Не удалось загрузить данные: " + e.message;
}

/* ═══════════════════════ производные данные ══════════════════════════════ */
function productById(id) {
  for (var i = 0; i < S.products.length; i++) if (S.products[i].id === id) return S.products[i];
  return null;
}
/* Рецепты, где продукт используется как ингредиент. Один список правды и
   для строки каталога, и для предупреждения при удалении. */
function recipesUsing(productId) {
  if (!productId) return [];
  return S.recipes.filter(function (r) {
    return (r.ingredients || []).some(function (g) { return g.product_id === productId; });
  });
}
/* Граммы в штуке — единственное, что связывает «3 шт» с весом. Без него
   штучный продукт нельзя ни просуммировать по весу, ни посчитать в КБЖУ. */
function gramsOf(qty, unit, prod) {
  if (qty == null) return null;
  var u = (normUnit(unit) || "").toLowerCase();
  if (u === "г") return qty;
  if (u === "кг") return qty * 1000;
  /* Объём → вес по плотности продукта (г в 100 мл). Нет плотности → мл ≈ г
     (плотность 1): для воды/молока верно, для масла ~8% — в пределах разброса
     этикеток. Это прежнее поведение как безопасный откат, а не тихая таблица. */
  var d = prod && prod.g_per_100ml;
  if (u === "мл") return d ? qty * d / 100 : qty;
  if (u === "л") return d ? qty * 10 * d : qty * 1000;
  if (u === "шт" && prod && prod.piece_g) return qty * prod.piece_g;
  return null;
}
function recipeById(id) {
  for (var i = 0; i < S.recipes.length; i++) if (S.recipes[i].id === id) return S.recipes[i];
  return null;
}
/* Вес ингредиента в граммах — общая шкала для сортировки. Штуки переводятся
   через piece_g продукта, объём — через плотность; чего перевести нельзя,
   возвращает null (а не ноль: «неизвестно» и «ничего» — разные вещи). */
function ingWeight(g) {
  return gramsOf(g.qty, g.unit, g.product_id ? productById(g.product_id) : null);
}
/* Порядок ингредиентов ВЕЗДЕ один: по весу от большего к меньшему, при равном
   весе — по алфавиту. Порядок из файла рецепта не несёт смысла: рецепты
   приходят от разных генераторов, и в «Окрошке» 3 л кваса стояли между укропом
   и солью. Вес — единственная шкала, одинаково осмысленная и в магазине
   («что тут тяжёлое»), и на кухне («с чего начинать отмерять»).

   Три ступени, внутри каждой — алфавит:
     0 — вес известен;
     1 — количество есть, но в граммы не переводится (шт без piece_g, ложки);
     2 — «по вкусу» (qty=null) — всегда в конце, это не количество.
   Возвращает пары {g, i} с ИСХОДНЫМ индексом: в режиме готовки галочки
   ингредиентов хранятся по индексу, и порядок показа их сбить не должен. */
function ingOrder(list) {
  function tier(g) { return g.qty == null ? 2 : (ingWeight(g) == null ? 1 : 0); }
  return (list || []).map(function (g, i) { return { g: g, i: i }; })
    .sort(function (a, b) {
      var ta = tier(a.g), tb = tier(b.g);
      if (ta !== tb) return ta - tb;
      if (ta === 0) {
        var wa = ingWeight(a.g), wb = ingWeight(b.g);
        if (wa !== wb) return wb - wa;
      }
      return String(curName(a.g)).localeCompare(String(curName(b.g)), "ru");
    });
}
/* Ингредиенты, не связанные с каталогом. Такой ингредиент — не мелочь: он не
   попадает ни в список покупок, ни в КБЖУ блюда, и молчать об этом нельзя
   (вся «Окрошка», собранная во внешнем проекте, пришла именно такой). */
function unlinkedIngs(r) {
  return (r && r.ingredients || []).filter(function (g) { return !g.product_id; });
}
/* Имя для показа. Привязан к продукту (product_id) → берём ТЕКУЩЕЕ имя продукта,
   иначе своё замороженное. Так переименование в каталоге доходит и до строк
   рецепта, и до списка покупок (раньше показывалось замороженное имя, и правка
   не долетала). Мердж списка идёт по product_id — в корзину и так едет верный
   продукт, это правит именно ПОДПИСЬ. Годится и для ингредиента g, и для
   позиции списка it, и для строки плана x — у всех есть product_id и name. */
function curName(o) {
  var p = o && o.product_id ? productById(o.product_id) : null;
  return (p && p.name) || (o && o.name) || "";
}
/* Упаковки — ВСЕГДА производное, никогда не хранимое: хранимое производное
   число неизбежно разъезжается с исходным количеством. */
function packsFor(item) {
  var p = item.product_id ? productById(item.product_id) : null;
  var pk = packOf(p);
  if (!p || !pk || !item.qty) return null;
  if (p.unit && item.unit && p.unit !== item.unit) return null;
  return Math.ceil(item.qty / pk);
}
function itemQty(it) { return (it.qty || 0) + (it.extra || 0); }
/* Количество в ячейке списка. Целое число упаковок показываем как «2 уп.» —
   у полки считают пачки, а не «2000 мл». Дробное («1500 мл» при пачке 1 л) и
   продукт без фасовки остаются в своей единице: «1,5 уп.» читалось бы как
   обещание, что пачка делится. В хранилище по-прежнему база (г/мл) — суммы с
   рецептами не меняются; правка количества (✎) тоже в базе. */
function qtyShown(it) {
  var q = itemQty(it), p = it.product_id ? productById(it.product_id) : null;
  var pk = packOf(p);
  if (pk && q > 0 && (!p.unit || !it.unit || p.unit === it.unit)) {
    var n = Math.round(q / pk * 1000) / 1000;
    if (n >= 1 && n === Math.round(n)) return n + " уп.";
  }
  return fmtQty(q, it.unit);
}

/* ── Степпер количества ──────────────────────────────────────────────────
   Мелкий шаг зависит от единицы: штуки — 1, вес/объём — 50 (та же кухонная
   точность, что в roundQty). Крупный шаг — ОДНА УПАКОВКА (pack_size
   продукта): у полки реальный вопрос не «плюс 50 г», а «взять ещё пачку?».
   Ввод разбирается тем же способом, что qty-save («1,5 кг» → 1500 г) — шаг
   всегда в базовых единицах, показ обратно через fmtQty. */
function parseQtyInput(text, fallbackUnit) {
  var m = String(text || "").trim().replace(",", ".").match(/^([\d.]*)\s*(\S+)?$/);
  var v = m && m[1] !== "" ? parseFloat(m[1]) : 0;
  if (isNaN(v)) v = 0;
  var u = ((m && m[2]) || fallbackUnit || "").toLowerCase();
  if (u === "кг") { v *= 1000; u = "г"; }
  else if (u === "л") { v *= 1000; u = "мл"; }
  return { v: v, u: u };
}
function stepQtyValue(text, fallbackUnit, packSize, kind, dir) {
  var q = parseQtyInput(text, fallbackUnit);
  var step = kind === "pack"
    ? (packSize || 0)
    : ((normUnit(q.u) || "").toLowerCase() === "шт" ? 1 : 50);
  if (!step) return null;
  return { v: Math.max(0, q.v + dir * step), u: q.u };
}
/* Кнопка шага. Одна и та же в строке списка и в модалке добавления — чтобы
   рука привыкала к одному месту и виду. */
function stepBtn(act, arg, label, title) {
  return '<button data-act="' + act + '" data-arg="' + attr(arg) + '"' +
    (title ? ' title="' + attr(title) + '"' : '') +
    ' style="border:1px solid var(--border-strong); background:var(--bg-elev); color:var(--text); border-radius:6px; font-size:12.5px; font-weight:700; min-width:30px; min-height:30px; padding:4px 8px; cursor:pointer; white-space:nowrap;">' + label + '</button>';
}

/* ═══════════════════════ рендер: общее ═══════════════════════════════════ */
var H2 = "font-family:var(--font-sans); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.14em; color:var(--text-muted); margin:0;";

function topBar() {
  /* шапка — общая для кабинета (ui-kit); справки у «Еды» нет (нет строки в
     UI_HELP); «Обновить» своё (ACTS.refresh — полная перезагрузка) */
  return uiTopHTML({ page: "food", name: "Еда", tag: "Личный кабинет", help: false, refresh: "spa", refreshing: S.refreshing });
}

/* Один источник правды на обе формы навигации — рельс и нижнюю панель.
   Рассинхрон невозможен по построению (в health.html такой рассинхрон был
   реальным багом: подсветка вкладки отставала от жизни). */
function navList() {
  var toBuy = S.shopping.filter(function (i) { return !i.bought; }).length;
  return [
    { k: "shopping", label: "Список покупок", sub: toBuy ? toBuy + " " + plural(toBuy, "позиция", "позиции", "позиций") : "всё куплено",
      icon: '<circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2.5 3h2.2l2 12.2a1.5 1.5 0 0 0 1.5 1.3h9.1a1.5 1.5 0 0 0 1.5-1.2L21.5 7H6"></path>' },
    { k: "recipes", label: "Рецепты", sub: S.recipes.length + " " + plural(S.recipes.length, "рецепт", "рецепта", "рецептов"),
      icon: '<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19a1 1 0 0 1 1 1v15.5"></path><path d="M4 4.5v14A1.5 1.5 0 0 0 5.5 20H20"></path><path d="M8 8h8M8 11.5h6"></path>' },
    { k: "products", label: "Продукты", sub: "каталог",
      icon: '<path d="M3 8.5 12 4l9 4.5-9 4.5z"></path><path d="M3 8.5V16l9 4.5 9-4.5V8.5"></path><path d="M12 13v7.5"></path>' }
  ];
}
function svgIc(path) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">' + path + '</svg>';
}
/* Какой раздел считается активным на текущем экране. Экраны рецепта (чтение,
   готовка, печать, правка) — это всё «Рецепты»: человек из них не «ушёл».
   Раньше это соответствие было записано парами CSS-селекторов и «edit» в них
   потеряли — при правке рецепта не подсвечивалось ничего. */
function navActive(k) {
  if (k === "recipes") {
    return S.screen === "recipes" || S.screen === "read" || S.screen === "cook" ||
           S.screen === "print" || S.screen === "edit";
  }
  return S.screen === k;
}
var NAV_O = { act: "nav", key: "data-arg" };
function navItems() {
  return navList().map(function (n) {
    return { k: n.k, label: n.label, sub: n.sub, short: n.k === "shopping" ? "Список" : n.label, icon: svgIc(n.icon) };
  });
}
/* активный пункт — тот, что navActive признаёт для текущего экрана */
function navCur() {
  var hit = navList().filter(function (n) { return navActive(n.k); })[0];
  return hit ? hit.k : null;
}
/* рельс — общий ui-kit (uiRailHTML) */
function navRail() { return uiRailHTML(navItems(), navCur(), NAV_O); }
/* Подвал — общий ui-kit: «раздел vX · состояние данных»; состояние ведут uiDataReset/uiDataDone в loadAll. */
function pageFooter() {
  return uiFootHTML({ page: "food", version: VERSION, src: "Synology · Claude-Memory / Food" });
}

/* Панель разделов внизу экрана — общая ui-kit (uiNavMount): строится ОДИН
   раз в <body>, дальше меняется только подсветка. Пересоздание fixed-элемента
   на каждое действие ловило сбой перерисовки iOS Safari (панель висела посреди
   экрана) — лечение теперь в ui-kit для всех страниц. */
function mountMobileNav() {
  if (S.loading || S.error) { uiNavHide(true); return; }
  uiNavMount(navItems(), navCur(), NAV_O);
}

/* Плашка про сайдкар: «пусто» и «не загрузилось» — разные вещи, и человек
   должен видеть, какая именно. */
function apiBanner() {
  if (S.apiState === "ok" && !S.apiSkew.length) return "";
  var msg;
  if (S.apiState === "down") msg = "Сервис записи не отвечает — страница работает в режиме просмотра.";
  else if (S.apiState === "old") msg = "Сайдкар на сервере старее страницы и не знает про раздел «Еда». Обновите api/server.py и пересоберите контейнер hub-api.";
  else msg = "Сайдкар не умеет файлы: " + S.apiSkew.join(", ") + ". Обновите api/server.py.";

}
/* Файл рецепта, который не разобрался, обязан быть ВИДЕН. Иначе положил
   кривой файл — а он просто не появился, и понять почему неоткуда. */

      "У " + m + " " + plural(m, "рецепта поле", "рецептов поле", "рецептов поле") +

function readOnlyNote() {

  return '<div class="no-print" style="margin:0 0 18px; padding:11px 14px; background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius); font-size:12.5px; color:var(--text-muted);">' +

/* ═══════════════════════ экран: список покупок ═══════════════════════════ */
function prodOf(it) { return it.product_id ? productById(it.product_id) : null; }
/* Фасовка — свойство ПРОДУКТА (pack_size, в единицах продукта). Понятие
   «магазин» убрано 2026-08-01: покупаем там, где решили, а не там, где
   записано, — и хранить «где купить» значило врать самим себе. Легаси-формы
   читаются без миграции: stores[] (2026-07-20..08-01, фасовка жила внутри
   магазинов — берём первую заполненную) и совсем старая плоская пара
   store+pack_size (pack_size и так на месте). */
function packOf(p) {
  if (!p) return null;
  if (p.pack_size != null) return p.pack_size;
  if (Array.isArray(p.stores)) {
    for (var i = 0; i < p.stores.length; i++) {
      if (p.stores[i] && p.stores[i].pack_size != null) return p.stores[i].pack_size;
    }
  }
  return null;
}
function itemCat(it) { var p = prodOf(it); return (p && p.category) || ""; }

/* Строка под названием: сколько упаковок брать. Именно она делает список
   пригодным у полки — «150 г панчетты» там бесполезно, нужно «1 упаковка». */
function itemMeta(it) {
  var bits = [];
  var n = packsFor(it), p = prodOf(it);
  var pk = packOf(p);
  if (n) bits.push(n + " " + plural(n, "упаковка", "упаковки", "упаковок") +
                   (pk ? " по " + fmtQty(pk, p.unit) : ""));
  // штучная позиция с известным весом → показываем, сколько это граммов
  var g = (it.unit || "").toLowerCase() === "шт" ? gramsOf(it.qty, it.unit, p) : null;
  if (g != null) bits.push("≈ " + trimNum(Math.round(g)) + " г");
  if (it.note) bits.push(it.note);
  return bits.join(" · ");
}

/* Группировка. Алфавит — единственный режим без заголовков: там группа одна.
   Основной режим — по отделам: так ходят по залу, а не по алфавиту. */
function groupItems(items, mode) {
  if (mode === "alpha") {
    var sorted = items.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ru"); });
    return sorted.length ? [{ title: null, left: "", depts: [{ dept: null, items: sorted }] }] : [];
  }
  var buckets = {}, order = [];
  items.forEach(function (it) {
    var k = itemCat(it) || "прочее";
    if (!buckets[k]) { buckets[k] = []; order.push(k); }
    buckets[k].push(it);
  });
  /* «Прочее» — всегда вниз: это не отдел, а пробел в каталоге, и он не
     должен возглавлять список. */
  order.sort(function (a, b) {
    if (a === "прочее") return 1;
    if (b === "прочее") return -1;
    return a.localeCompare(b, "ru");
  });
  return order.map(function (k) {
    var arr = buckets[k];
    return {
      title: k,
      left: arr.length + " " + plural(arr.length, "позиция", "позиции", "позиций"),
      depts: [{ dept: null, items: arr.sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ru"); }) }]
    };
  });
}

/* Точечная правка DOM вместо render(): гасим строку и обновляем счётчики.
   Разметку трогаем ровно в трёх местах — больше и не надо. */
function paintBought(id, done) {
  var box = document.querySelector('[data-act="bought"][data-arg="' + id + '"]');
  if (!box) { render(); return; }
  box.innerHTML = done ? '<span style="color:#fff; font-size:15px; font-weight:700; line-height:1;">✓</span>' : "";
  box.style.background = done ? "var(--c-2)" : "transparent";
  box.style.borderColor = done ? "var(--c-2)" : "var(--border-strong)";
  var row = box.closest(".sh-row");
  if (row) { row.style.opacity = done ? ".45" : ""; row.style.textDecoration = done ? "line-through" : ""; }
  var left = S.shopping.filter(function (i) { return !i.bought; }).length;
  var el = document.getElementById("sh-count");
  if (el) el.textContent = S.shopping.length - left;
  var rail = document.querySelector('.ui-rail-item[data-arg="shopping"] .ui-rail-sub');
  if (rail) rail.textContent = left ? left + " " + plural(left, "позиция", "позиции", "позиций") : "всё куплено";
  /* Кнопка «Убрать купленное» нужна ровно тогда, когда есть что убирать.
     Полной перерисовки ради неё не делаем — она и была источником рывка. */
  var clear = document.getElementById("sh-clear");
  var anyBought = S.shopping.some(function (i) { return i.bought; });
  if (clear && !anyBought) clear.remove();
  if (!clear && anyBought) {
    var add = document.querySelector('[data-act="add-open"]');
    if (add && add.parentNode) {
      var b = document.createElement("button");
      b.className = "ui-btn plain sm"; b.id = "sh-clear";
      b.setAttribute("data-act", "clear-bought");
      b.textContent = "Убрать купленное";
      add.parentNode.insertBefore(b, add);
    }
  }
}

    '</header>' +
    '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:16px 0 14px;">' +

      '<div style="flex:1;"></div>' +
      (S.writable && bought.length
        ? '<button class="ui-btn danger sm" id="sh-clear" data-act="clear-bought">Убрать купленное</button>' : '') +
      (S.writable ? '<button class="ui-btn sm" data-act="add-open"><span style="font-size:16px; line-height:1;">+</span> Добавить</button>' : '') +
    '</div>' +
    '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px;"><div class="gseg-wrap">' + segs + '</div></div>' +
    /* Сам список — отдельным узлом: раскрытие «откуда набежало» меняет одну
       строку, и пересобирать ради этого документ незачем (см. «expand»). */

/* Содержимое списка покупок для точечной перерисовки. Строится тем же кодом,

function shopListHTML() {

function shopGroupHTML(g) {

function itemRow(it) {
  var meta = itemMeta(it);
  var editing = S.qtyEdit === it.id;
  /* Кнопки-упаковки — только когда фасовка известна И единицы согласуются
     (то же условие, что у packsFor): шагать «+750 г» у позиции в штуках
     значило бы смешать метрики. */
  var pEd = prodOf(it);
  var pkEd = packOf(pEd);
  var pkOk = pkEd && (!pEd.unit || !it.unit || pEd.unit === it.unit);
  var qtyCell = editing
    ? '<span data-act="noop" style="display:inline-flex; align-items:center; gap:5px; flex-wrap:wrap; justify-content:flex-end;">' +
        stepBtn("qty-step", it.id + "|step|-1", "−", "меньше") +
        '<input id="f-qty" value="' + attr(fmtQty(itemQty(it), it.unit)) + '" placeholder="кол-во" style="width:76px; box-sizing:border-box; border:1px solid var(--c-2); border-radius:6px; background:var(--bg); color:var(--text); font-family:inherit; font-size:12.5px; padding:5px 8px; text-align:center;">' +
        stepBtn("qty-step", it.id + "|step|1", "+", "больше") +
        (pkOk
          ? stepBtn("qty-step", it.id + "|pack|-1", "−уп", "минус упаковка (" + fmtQty(pkEd, pEd.unit) + ")") +
            stepBtn("qty-step", it.id + "|pack|1", "+уп", "плюс упаковка (" + fmtQty(pkEd, pEd.unit) + ")")
          : "") +
        '<button class="ui-btn sm" data-act="qty-save" data-arg="' + attr(it.id) + '">OK</button>' +
      '</span>'
    : '<span' + (S.writable ? ' data-act="qty-edit" data-arg="' + attr(it.id) + '"' : '') + ' title="изменить количество" style="display:inline-flex; align-items:center; gap:4px; white-space:nowrap;' + (S.writable ? " cursor:pointer;" : "") + '">' +
        '<span class="num" style="font-size:13px; color:var(--text-muted);">' + esc(qtyShown(it) || "—") + '</span>' +
        (S.writable ? '<span style="color:var(--text-faint); font-size:12px; line-height:1;">✎</span>' : '') +
      '</span>';

  var from = it.from || [];
  var expanded = S.expanded === it.id;
  /* Купленная строка выглядит так же, как её делает paintBought() при клике —
     иначе после перезагрузки вид поехал бы относительно того, что человек
     видел секунду назад. */
  var done = !!it.bought;
  return '<div class="sh-row" style="border-radius:9px; margin:0 -8px;' +
    (done ? "opacity:.45; text-decoration:line-through;" : "") + '">' +
    '<div style="display:flex; align-items:flex-start; gap:12px; padding:10px 8px;">' +
      '<span class="co-box"' + (S.writable ? ' data-act="bought" data-arg="' + attr(it.id) + '"' : '') + ' title="отметить купленным" style="flex:none; width:26px; height:26px; margin-top:1px; border-radius:7px; border:2px solid ' + (done ? "var(--c-2)" : "var(--border-strong)") + '; background:' + (done ? "var(--c-2)" : "transparent") + '; display:flex; align-items:center; justify-content:center;' + (S.writable ? " cursor:pointer;" : "") + '">' +
        (done ? '<span style="color:#fff; font-size:15px; font-weight:700; line-height:1;">✓</span>' : "") + '</span>' +
      '<div style="flex:1; min-width:0;">' +
        '<div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">' +
          '<span style="font-weight:600; font-size:14.5px;">' + esc(curName(it)) + '</span>' + qtyCell +
        '</div>' +
        (meta ? '<div class="num" style="font-size:11.5px; color:var(--text-faint); margin-top:2px;">' + esc(meta) + '</div>' : "") +
      '</div>' +
      (from.length ? '<button data-act="expand" data-arg="' + attr(it.id) + '" style="flex:none; align-self:center; border:1px solid var(--border); background:var(--bg-elev); color:var(--text-muted); border-radius:999px; font-size:10.5px; font-weight:600; padding:3px 9px; cursor:pointer;">' +
        /* «Откуда» после удаления магазинов читалось как «где купить» — а речь
           про рецепты, из которых сложилось количество. Формулируем прямо;
           «из 1 рецепта» / «из 3 рецептов» — plural() из ui-kit. */
        "из " + from.length + " " + plural(from.length, "рецепта", "рецептов", "рецептов") +
        '</button>' : "") +
      /* Удаление позиции. Именно кнопка, а не свайп: свайп на этой странице

    '</div>' +
    (expanded && from.length ? '<div style="margin:0 8px 8px 46px; padding:9px 12px; background:var(--bg-alt); border-radius:8px; font-size:12px; color:var(--text-muted);">' +
      '<div style="margin-bottom:6px;">откуда набежало:</div>' +
      from.map(function (f) {
        return '<div style="display:flex; align-items:center; gap:8px; padding:3px 0;">' +
          '<span style="flex:1;">' + esc(f.title) + ' — ' + esc(fmtQty(f.qty, it.unit)) + '</span>' +
          (S.writable ? '<button class="ui-btn danger sm" data-act="unplan" data-arg="' + attr(it.id + "|" + f.recipe_id) + '" title="убрать вклад этого рецепта">снять с плана</button>' : "") +
        '</div>';
      }).join("") +
      (it.extra ? '<div style="padding:3px 0; color:var(--text-faint);">добавлено руками — ' + esc(fmtQty(it.extra, it.unit)) + '</div>' : "") +
      '</div>' : "") +
  '</div>';
}

/* ═══════════════════════ экран: продукты ═════════════════════════════════ */
function productsScreen() {
