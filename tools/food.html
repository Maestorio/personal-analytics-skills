      /* Те же бейджи, что в списке, и ВЫШЕ сгиба: «Инвентарь» на этом экране
         есть, но лежит под шагами — а «с вечера» надо увидеть до того, как
         начнёшь читать рецепт, иначе узнаёшь про восемь часов маринада уже
         с продуктами в руках. */
      badgeRow(recipeBadges(r), "12px 0 0") +
      /* Оценка ставится здесь одним тапом — не заходя в редактор. Показываем
         строку, если есть право правки ИЛИ оценка уже стоит: мёртвые звёзды
         в режиме просмотра — обманка. */
      ((S.writable || r.rating)
        ? '<div class="no-print" id="rating-row" style="display:flex; align-items:center; gap:10px; margin:12px 0 0;">' +
          ratingRowHTML(r) + '</div>'
        : "") +
      (rt ? timeLine(r, rt) : "") +
    '</header>' +

    '<div style="background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--c-2); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin:20px 0 0;">' +
      '<div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">' +
        '<span style="font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Порций</span>' +
        '<div style="display:inline-flex; align-items:center; gap:12px;">' +
          '<button class="pbtn no-print" data-act="portion-dec" data-arg="' + attr(r.id) + '" aria-label="меньше">−</button>' +
          '<span class="num" style="font-family:var(--font-serif); font-size:30px; font-weight:600; min-width:40px; text-align:center;">' + esc(target) + '</span>' +
          '<button class="pbtn no-print" data-act="portion-inc" data-arg="' + attr(r.id) + '" aria-label="больше">+</button>' +
        '</div>' +
        (scaled ? '<span class="num" style="font-size:13px; font-weight:700; color:var(--c-2); background:var(--c2-bg); border-radius:999px; padding:4px 11px;">×' + trimNum(Math.round(factor * 100) / 100) + '</span>' : "") +
        '<span class="num" style="font-size:12px; color:var(--text-faint);">в рецепте ' +
          esc(r.servings) + ' ' + plural(r.servings, "порция", "порции", "порций") + '</span>' +
      '</div>' +
      (scaled ? '<div style="display:flex; align-items:flex-start; gap:9px; font-size:12.5px; line-height:1.45; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:9px 13px; margin-top:13px;"><span style="font-weight:700;">⚠</span><span>Количества пересчитаны линейно. Соль, специи и время готовки не масштабируются — проверьте по вкусу.</span></div>' : "") +
    '</div>' +

    (nu.kcal != null ? '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:16px 2px 0;">' +
      '<div class="num" style="display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--text-muted);">' +
        '<span><b style="color:var(--text); font-weight:600;">' + esc(nu.kcal) + '</b> ккал</span>' +
        '<span>Б <b style="color:var(--text); font-weight:600;">' + esc(nu.protein_g) + ' г</b></span>' +
        '<span>Ж <b style="color:var(--text); font-weight:600;">' + esc(nu.fat_g) + ' г</b></span>' +
        '<span>У <b style="color:var(--text); font-weight:600;">' + esc(nu.carb_g) + ' г</b></span>' +
      '</div>' +
      (pw ? '<span class="num" style="font-size:12px; color:var(--text-faint);">на порцию ≈ ' + pw.per + ' г' +
        (pw.skipped ? " (без «по вкусу» и штучного)" : "") + '</span>' : "") +
    '</div>' +
    /* Честная подпись: КБЖУ пришло из источника рецепта, а НЕ посчитано нами.
       В макете тут стояло «рассчитано автоматически по каталогу» — у продуктов
       нет пищевой ценности, такая подпись была бы неправдой. */
    '<div style="font-size:11.5px; color:var(--text-faint); margin:6px 2px 0;">КБЖУ на порцию — из источника рецепта; при смене числа порций не меняется</div>' +
    weightBlock(r)
    : estNut
      ? (function () {
          var capa = 'font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); font-weight:700;';
          var numa = 'display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--text-muted);';
          function macros(o, approx) {
            var p = approx ? "≈ " : "";
            return '<span><b style="color:var(--text); font-weight:600;">' + p + esc(o.kcal) + '</b> ккал</span>' +
              '<span>Б <b style="color:var(--text); font-weight:600;">' + esc(trimNum(o.protein_g)) + ' г</b></span>' +
              '<span>Ж <b style="color:var(--text); font-weight:600;">' + esc(trimNum(o.fat_g)) + ' г</b></span>' +
              '<span>У <b style="color:var(--text); font-weight:600;">' + esc(trimNum(o.carb_g)) + ' г</b></span>';
          }
          /* «На порцию» — всегда; «на 100 г» и кнопка «взвесить» — через
             weightBlock (он теперь понимает оценку: per100g падает на расчёт по
             продуктам). Так у оценочных рецептов есть и ⚖, и КБЖУ на 100 г. */
          return '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:16px 2px 0;">' +
              '<span style="' + capa + '">На порцию</span>' +
              '<div class="num" style="' + numa + '">' + macros(estNut.per, true) + '</div>' +
            '</div>' +
            /* Честно: это оценка по СЫРЫМ продуктам, не настоящее КБЖУ готового. */
            '<div style="font-size:11.5px; color:var(--text-faint); margin:6px 2px 0;">оценка по продуктам (сырым), не из источника — при готовке жир и вода меняют итог' +
              (estNut.coverage < 0.999 ? '. Часть продуктов без КБЖУ — итог занижен (' + Math.round(estNut.coverage * 100) + '% по массе)' : '') + '</div>' +
            weightBlock(r);
        })()
      : '<div style="font-size:12px; color:var(--text-faint); margin:16px 2px 0;">КБЖУ в источнике не указано</div>') +

    '<div class="read-head-actions no-print" style="display:flex; gap:10px; flex-wrap:wrap; margin:20px 0 6px;">' +
      '<button class="ui-btn" data-act="cook" data-arg="' + attr(r.id) + '"><span style="font-size:15px;">▶</span> Готовить</button>' +
      (S.writable ? '<button class="ui-btn ghost" data-act="plan-open" data-arg="' + attr(r.id) + '">Запланировать</button>' : "") +
      (S.writable ? '<button class="ui-btn ghost" data-act="edit-recipe" data-arg="' + attr(r.id) + '"><span style="font-size:14px;">✎</span> Править</button>' : "") +
      '<button class="ui-btn plain" data-act="print"><span style="font-size:14px;">⎙</span> Печать</button>' +
    '</div>' +

    '<div class="rsec">ИНГРЕДИЕНТЫ</div>' + unlinkedNote(r) +
    '<div style="border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;">' +
      '<div style="display:grid; grid-template-columns:1fr auto; gap:0; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); font-weight:700; padding:9px 16px; border-bottom:1px solid var(--border-strong); background:var(--bg-elev);">' +
        '<span>Ингредиент</span><span>На ' + esc(target) + ' порц.</span></div>' + rows +
    '</div>' +

    '<div class="rsec">ПРИГОТОВЛЕНИЕ</div>' + steps +
    block("ИНВЕНТАРЬ", r.equipment) + block("ХРАНЕНИЕ", r.storage) +
    block("СОВЕТЫ ПО ПОДАЧЕ", r.serving) + block("ИСТОЧНИКИ", r.sources) +
  '</section>';
}

/* ═══════════════════════ редактор рецепта ════════════════════════════════ */
/* Рабочая копия S.edit держит рецепт в ФОРМЕ, удобной для правки (шаг = имя +
   длительность + текст раздельно, разделы = списки строк), а не в формате
   хранения. Сериализация в food-recipe@1 — при сохранении, одним местом. */

/* «600 г» / «1,5 кг» / «2 шт» / «по вкусу» → {qty, unit}. Обратное к fmtQty. */
function parseAmount(str) {
  var t = String(str == null ? "" : str).trim();
  if (t === "" || /по вкусу|по желани|щепот/i.test(t)) return { qty: null, unit: null };
  var m = t.match(/^([\d.,]+)\s*(.*)$/);
  if (!m) return { qty: null, unit: t || null };
  var qty = parseFloat(m[1].replace(",", "."));
  if (isNaN(qty)) return { qty: null, unit: t || null };
  var u = normUnit((m[2] || "").trim().toLowerCase());
  if (u === "кг") { qty *= 1000; u = "г"; }
  else if (u === "л") { qty *= 1000; u = "мл"; }
  return { qty: qty, unit: u || null };
}

/* Рецепт хранения → рабочая копия редактора. */
function editFromRecipe(r) {
  return {
    id: r ? r.id : null,
    name: r ? (r.title || "") : "",
    cuisine: r ? (r.cuisine || "") : "",
    category: r ? (r.category || "") : "",
    difficulty: r && r.difficulty ? r.difficulty : 2,
    /* 0 = не оценено. Именно 0, а не null: редактор ходит по шкале кнопками
       «−/+», и «не оценено» должно быть её нижней ступенью, а не отдельным
       состоянием, из которого не выбраться. В файл 0 не попадает (см.
       editToRecipe): там оценки просто нет. */
    rating: r && r.rating ? r.rating : 0,
    time: r ? (r.time || "") : "",
    portions: r && r.servings ? r.servings : 4,
    nutrition: r ? (r.nutrition || null) : null,
    finished_g: r ? r.finished_g : null,
    source_kind: r ? (r.source_kind || "manual") : "manual",
    added: r ? r.added : todayISO(),
    ings: (r && r.ingredients || []).map(function (g) {
      return { name: g.name || "", product_id: g.product_id || null,
               amount: g.qty == null ? "по вкусу" : fmtQty(g.qty, g.unit),
               measure: g.measure || "", state: g.state || null };
    }),
    steps: (r && r.steps || []).map(function (s) {
      var head = String(s.title || "");
      var dm = head.match(/\(([^)]*)\)\s*$/);
      return { name: head.replace(/^Шаг\s*\d+\s*[.．]?\s*/, "").replace(/\s*\([^)]*\)\s*$/, "").trim(),
               dur: dm ? dm[1] : "", text: s.text || "", passive: s.passive === true };
    }),
    groups: {
      equipment: splitLines(r && r.equipment),
      storage: splitLines(r && r.storage),
      serving: splitLines(r && r.serving),
      sources: splitLines(r && r.sources)
    }
  };
}
function splitLines(raw) {
  if (!raw) return [];
  return String(raw).split("\n").map(function (x) { return x.replace(/^[-•*]\s*/, "").trim(); })
    .filter(Boolean);
}

/* Рабочая копия → food-recipe@1. */
function editToRecipe(e) {
  var joined = function (arr) { return (arr || []).map(function (x) { return x.trim(); }).filter(Boolean).join("\n"); };
  var ings = e.ings.map(function (g) {
    var a = parseAmount(g.amount);
    return { name: g.name, raw: g.amount, product_id: g.product_id || null,
             qty: a.qty, unit: a.unit, measure: (g.measure || "").trim() || undefined,
             state: g.state || undefined };
  });
  var steps = e.steps.map(function (s, i) {
    var nm = (s.name || "").trim() || ("Шаг " + (i + 1));
    var dur = normDur((s.dur || "").trim());
    return { title: "Шаг " + (i + 1) + ". " + nm + (dur ? " (" + dur + ")" : ""),
             text: (s.text || "").trim(), passive: s.passive ? true : undefined };
  });
  return {
    id: e.id, title: (e.name || "").trim(), cuisine: (e.cuisine || "").trim() || undefined,
    category: (e.category || "").trim() || undefined,
    servings: e.portions, difficulty: e.difficulty,
    /* Неоценённое блюдо — ОТСУТСТВИЕ поля, а не «rating: 0». Ноль пришлось бы
       трактовать («совсем не понравилось»?), и карточка не смогла бы отличить
       «не пробовали» от «не понравилось». */
    rating: e.rating ? e.rating : undefined,
    time: (e.time || "").trim() || undefined,
    /* КБЖУ сохраняем, только если введён хотя бы ккал (гейт показа — nu.kcal):
       галочка «известен» с пустыми полями не должна плодить {все null} в файле. */
    nutrition: (e.nutrition && e.nutrition.kcal != null) ? e.nutrition : null,
    finished_g: e.finished_g,
    ingredients: ings, steps: steps,
    equipment: joined(e.groups.equipment) || undefined,
    storage: joined(e.groups.storage) || undefined,
    serving: joined(e.groups.serving) || undefined,
    sources: joined(e.groups.sources) || undefined,
    source_kind: e.source_kind, added: e.added
  };
}

/* Снимок формы редактора в S.edit. Зовётся перед КАЖДОЙ перерисовкой из
   действий редактора: экран пересобирается целиком, и без снимка ввод,
   ещё не «зафиксированный» кнопкой, потерялся бы. Числовые поля (сложность,
   порции) живут прямо в состоянии — их правят кнопки, не input. */
function edCollect() {
  var e = S.edit; if (!e) return;
  var v = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
  var nm = v("f-ed-name"); if (nm != null) e.name = nm;
  var cu = v("f-ed-cuisine"); if (cu != null) e.cuisine = cu;
  var ct = v("f-ed-category"); if (ct != null) e.category = ct;
  var tm = v("f-ed-time"); if (tm != null) e.time = tm;
  e.ings.forEach(function (g, i) {
    var x = v("f-ed-ing-" + i); if (x != null) g.amount = x;
    var mx = v("f-ed-ing-meas-" + i); if (mx != null) g.measure = mx;
  });
  e.steps.forEach(function (s, i) {
    var n = v("f-ed-step-name-" + i); if (n != null) s.name = n;
    var d = v("f-ed-step-dur-" + i); if (d != null) s.dur = d;
    var t = v("f-ed-step-text-" + i); if (t != null) s.text = t;
    var pv = document.getElementById("f-ed-step-pass-" + i); if (pv) s.passive = pv.checked;
  });
  Object.keys(e.groups).forEach(function (key) {
    e.groups[key].forEach(function (_, i) { var x = v("f-ed-g-" + key + "-" + i); if (x != null) e.groups[key][i] = x; });
  });
  var numOrNull = function (s) { s = String(s).trim().replace(",", "."); return s === "" ? null : (isNaN(parseFloat(s)) ? null : parseFloat(s)); };
  var fg = v("f-ed-finished"); if (fg != null) e.finished_g = numOrNull(fg);
  if (e.nutrition) {
    ["kcal", "protein_g", "fat_g", "carb_g"].forEach(function (k) {
      var x = v("f-ed-nu-" + k); if (x != null) e.nutrition[k] = numOrNull(x);
    });
  }
}

var EDIT_GROUPS = [
  { key: "equipment", title: "ИНВЕНТАРЬ", ph: "напр. кастрюля 5 л, большая сковорода" },
  { key: "storage", title: "ХРАНЕНИЕ", ph: "напр. в холодильнике 3–4 дня" },
  { key: "serving", title: "СОВЕТЫ ПО ПОДАЧЕ", ph: "напр. с тальятелле" },
  { key: "sources", title: "ИСТОЧНИКИ", ph: "откуда рецепт" }
];

/* ── Куски редактора отдельными функциями ─────────────────────────────────
   Каждая кнопка «−/+» и «добавить строку» пересобирала ВЕСЬ документ (замер
   2026-08-09: 585 снятых узлов, кадр 33–39 мс на телефоне) — при том что от
   нажатия меняется один кусок формы. Разметка этих кусков вынесена сюда,
   чтобы обработчик мог переписать только свой узел (см. patchHTML).
   edCollect() перед правкой обязателен и остаётся: недописанные поля живут
   только в DOM, и пересборка куска их потеряет. */
function edPipsHTML() {
  var e = S.edit, out = "";
  for (var i = 1; i <= 5; i++) {
    out += '<span style="width:9px; height:9px; border-radius:2px; background:' +
      (i <= e.difficulty ? "var(--c-2)" : "var(--border)") + ';"></span>';
  }
  return out;
}

function edRatingHTML() {
  var e = S.edit;
  // Кнопки внутри узла: он переписывается целиком, а «−/+» статичны и от
  // пересборки не страдают. Иначе слово-подпись пришлось бы патчить отдельно
  // и она уехала бы между звёздами и плюсом.
  return '<button class="pbtn" data-act="ed-rating-dec">−</button>' +
    ratingStars(e.rating, 18) +
    '<button class="pbtn" data-act="ed-rating-inc">+</button>' +
    '<span style="font-size:12px; color:var(--text-faint);">' + esc(RATING_WORDS[e.rating || 0]) + '</span>';
}

function edCatChipsHTML() {
  var e = S.edit;
  return RECIPE_CATS.slice(1).map(function (d) {
    var on = (e.category || "").trim().toLowerCase() === d[1].toLowerCase();
    return '<button class="fchip" data-act="ed-cat" data-arg="' + attr(d[1]) + '" style="min-height:32px; padding:6px 13px; font-size:12px;' +
      (on ? " color:var(--c-2); border-color:var(--c-2); background:var(--c2-bg); font-weight:600;" : "") + '">' + esc(d[1]) + '</button>';
  }).join("");
}

function edNuHTML() {
  var e = S.edit;
  if (!e.nutrition) return "";
  var nuEd = function (label, key) {
    var val = e.nutrition[key] != null ? e.nutrition[key] : "";
    return '<label style="display:block;"><span style="font-size:10px; color:var(--text-faint); display:block; margin-bottom:3px;">' + esc(label) + '</span>' +
      '<input class="fld num" style="padding:8px 10px;" id="f-ed-nu-' + key + '" value="' + attr(val) + '"></label>';
  };
  return '<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px;">' +
    nuEd("ккал", "kcal") + nuEd("Б, г", "protein_g") + nuEd("Ж, г", "fat_g") + nuEd("У, г", "carb_g") + '</div>' +
    '<div style="font-size:11px; color:var(--text-faint); margin-top:6px;">на порцию, как в источнике</div>';
}

function edIngsHTML() {
  var e = S.edit;
  var ingRows = e.ings.map(function (g, i) {
    var p = g.product_id ? productById(g.product_id) : null;
    var cat = p ? deptLabel(p.category) : "";
    return '<div style="display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--border); flex-wrap:wrap;">' +
      '<span style="flex:1; min-width:120px; font-size:14px; font-weight:600;">' + esc(curName(g)) +
        (cat ? ' <span class="num" style="font-weight:500; color:var(--c-2); font-size:11px; margin-left:6px;">' + esc(cat) + '</span>' : "") + '</span>' +
      '<input class="fld" id="f-ed-ing-meas-' + i + '" value="' + attr(g.measure || "") + '" placeholder="мера (1 стакан)" title="как в рецепте для человека: «1 стакан», «2 ст. л.». Необязательно. В КБЖУ и список идёт «кол-во» справа — его вводите в г/мл/шт." style="width:120px; padding:7px 10px; font-size:13px;">' +
      '<input class="fld num" id="f-ed-ing-' + i + '" value="' + attr(g.amount) + '" placeholder="кол-во г/мл/шт" title="STD-количество: граммы, мл или штуки. По нему считается КБЖУ и список покупок." style="width:120px; padding:7px 10px; font-size:13px;">' +
      '<button class="ui-btn danger sm" data-act="ed-ing-del" data-arg="' + i + '" title="убрать" aria-label="Убрать строку" style="flex:none; width:30px; height:30px; padding:0;">×</button>' +
    '</div>';
  }).join("");
  return ingRows + (e.ings.length ? ""
    : '<div style="padding:14px 16px; font-size:13px; color:var(--text-faint);">Пока пусто — добавьте продукты из каталога ниже.</div>');
}

function edStepsHTML() {

      '<span style="font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--c-2); font-weight:700;">' + (e.id ? "Правка рецепта" : "Новый рецепт") + '</span>' +

    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;">' +
      '<label><span class="fld-lbl">Кухня</span><input class="fld" id="f-ed-cuisine" value="' + attr(e.cuisine) + '" placeholder="напр. итальянская"></label>' +
      '<div><span class="fld-lbl">Сложность (1–5)</span>' +
        '<div style="display:inline-flex; align-items:center; gap:10px; height:41px;">' +

      '</div>' +
    '</div>' +
    /* Тип блюда — чип ИЛИ свободный ввод в одно и то же поле: чипы под
       телефон (не искать буквы), но category в данных свободная строка, а
       не enum — новый тип не должен требовать правки кода. */
    '<div style="margin-top:12px;"><span class="fld-lbl">Тип блюда</span>' +
      '<input class="fld" id="f-ed-category" value="' + attr(e.category) + '" placeholder="выберите чипом ниже или впишите своё" style="margin-bottom:8px;">' +
      '<div id="ed-cat-chips" style="display:flex; gap:7px; flex-wrap:wrap;">' + edCatChipsHTML() + '</div>' +

    /* Оценка ставится ЗДЕСЬ, а не только показывается на карточке: поле,
       которое некуда ввести, — мёртвое. Ноль подписан словами, потому что три

      '<label><span class="fld-lbl">Время (из источника, необязательно)</span><input class="fld" id="f-ed-time" value="' + attr(e.time) + '" placeholder="15 мин / 2 ч 30 мин"></label>' +

    '<div style="margin-top:12px;">' +

      '<div style="position:relative; margin-bottom:10px;">' +
        '<span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:13px; pointer-events:none;">⌕</span>' +

      '</div>' +

    '<div style="border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;">' +
      '<label style="display:flex; align-items:flex-start; gap:10px; font-size:13.5px; cursor:pointer;">' +
        '<input type="checkbox" id="f-ed-nu-known" data-act="ed-nu-toggle"' + (e.nutrition ? " checked" : "") + ' style="width:18px; height:18px; margin-top:1px; flex:none;">' +
        '<span>КБЖУ известен <span style="color:var(--text-faint);">— из источника рецепта. Обычно нет: интернет- и домашние рецепты его не дают — тогда посчитаем по продуктам сами.</span></span>' +
      '</label>' +
      '<div id="ed-nu">' + edNuHTML() + '</div>' +
      '<label style="display:block; margin-top:15px;"><span class="fld-lbl">Вес готового блюда, г</span>' +
        '<input class="fld num" id="f-ed-finished" value="' + attr(e.finished_g == null ? "" : e.finished_g) + '" placeholder="700" style="max-width:170px;"></label>' +
      '<div style="font-size:11px; color:var(--text-faint); margin-top:6px; line-height:1.5;">Взвесьте готовое блюдо (кастрюля с едой минус пустая кастрюля) — тогда покажем КБЖУ на 100 г. Можно оставить пустым.</div>' +
    '</div>' +

    '<div class="rsec">ПРИГОТОВЛЕНИЕ</div>' +
    '<div id="ed-steps">' + edStepsHTML() + '</div>' +
    '<button class="ui-btn ghost" data-act="ed-step-add" style="width:100%;"><span style="font-size:16px;">+</span> Добавить шаг</button>' +

/* Каталог продуктов в редакторе: зависит от строки поиска (`f-ed-cat-q`) и от
   того, что уже лежит в рецепте. Отдельной функцией — по той же причине, что и
   списки результатов: при вводе перерисовывается только он.

   Побочная выгода крупнее самой перерисовки: раньше фильтр каталога дёргал
   ПОЛНЫЙ render() редактора, и ради этого приходилось на каждой букве снимать
   форму edCollect() — иначе недописанные шаги и количества обнулялись. Теперь
   форма не пересоздаётся вовсе, и снимать её незачем. */
function edCatalogHTML() {
  var e = S.edit;
  if (!e) return "";
  var have = {};
  e.ings.forEach(function (g) { if (g.product_id) have[g.product_id] = 1; });
  var cq = normName(S.edCatQuery);
  var catalog = S.products.filter(function (p) {
    if (have[p.id]) return false;
    if (!cq) return true;
    if (normName(p.name).indexOf(cq) >= 0) return true;
    return (p.aliases || []).some(function (al) { return normName(al).indexOf(cq) >= 0; });
  }).slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ru"); });
  return catalog.map(function (p) {
    return '<button class="fchip" data-act="ed-ing-add" data-arg="' + attr(p.id) + '" style="min-height:32px; padding:6px 12px;"><span style="color:var(--c-2); font-weight:700; margin-right:4px;">+</span>' + esc(p.name) + '</button>';
  }).join("") +
    (catalog.length ? "" : '<span style="font-size:12px; color:var(--text-faint);">' +
      (cq ? "ничего не нашлось — попробуйте иначе или «завести продукт»" : "все продукты каталога уже в рецепте") + '</span>');
}

/* ═══════════════ подтверждение удаления рецепта ══════════════════════════ */
/* Своё окно, а не нативный confirm(): тот на iOS блокирует страницу целиком и
   не показывает того единственного, ради чего подтверждение нужно, — ЧТО
   удаляется и что при этом потянется следом. С ui-kit 1.25.0 окно общее
   (uiConfirm) — им же подтверждаются удаления позиции списка и продукта. */
function confirmRecipeDelete(d) {
  var planned = S.shopping.filter(function (it) {
    return (it.from || []).some(function (f) { return f.recipe_id === d.id; });
  }).length;
  return uiConfirm({
    title: "Удалить рецепт?", name: d.title || d.id,
    /* Не пишем «безвозвратно»: сервер кладёт копию в .versions/ перед
       удалением. Пугать невосстановимостью, когда бэкап есть, — врать; но и
       «легко вернуть» неправда — возврат руками на NAS. */
    text: "Рецепт исчезнет из библиотеки. Файл сервер сохранит в резервную копию — вернуть можно, но только руками на NAS.",
    warn: planned ? "Он запланирован: " + planned + " " + plural(planned, "строка", "строки", "строк") +
      " в списке покупок " + plural(planned, "останется", "останутся", "останутся") +
      ". Снимите их с плана, если продукты больше не нужны." : ""
  });
}
/* стирает только «Удалить» в подтверждении */
function recipeDeleteConfirmed(d) {
  deleteRecipe(d.id, function () {
    S.edit = null;
    S.openRecipe = null;
    S.screen = "recipes";
    S.saveInfo = "Рецепт «" + (d.title || d.id) + "» удалён. Копия файла осталась на сервере.";
  });
}

/* ═══════════════════════ экран: печать ═══════════════════════════════════ */
/* Отдельный экран, а не «@media print поверх чтения». Три причины:
   1. ТЁМНАЯ ТЕМА. Печать всегда идёт на белую бумагу, а экран чтения красится
      токенами: в тёмной теме получился бы светлый текст на белом листе —
      пустая страница и потраченная бумага. Лист рисуется #fff/#222 жёстко и
      от темы не зависит вовсе.
   2. ВИДНО ЗАРАНЕЕ. Лист на экране — это ровно то, что выйдет из принтера,
      включая выбранное число порций. Проверять вёрстку в диалоге печати
      (или, хуже, на бумаге) не нужно.
   3. ДЕШЕВЛЕ. Иначе пришлось бы гасить в печати карточки, тени, рамки, сетки
      и рельс экрана чтения — набор правил, который ломается при каждой правке
      разметки и который никто не заметит сломанным.
   «Источники» на лист не идут: это происхождение рецепта, а не инструкция —
   на кухне бесполезно, а место занимает. */
function printScreen() {
  var r = recipeById(S.openRecipe);
  if (!r) return '<section class="screen sc-print" style="display:block;"><div style="padding:60px 0; text-align:center; color:var(--text-faint);">Рецепт не найден.</div></section>';

  var factor = recipeFactor(r), target = S.portions[r.id] || r.servings;
  var scaled = Math.abs(factor - 1) > 0.001;
  var nu = r.nutrition || {};
  var pw = portionWeight(r);
  var INK = "#222", INK_MUTED = "#666", INK_FAINT = "#8b8578", RULE = "#e6e0d4";
  var OCHRE = "#b3934f";   /* --c-2 светлой темы: на бумаге тема всегда светлая */

  function head(t) {
    return '<div class="print-h" style="font-family:var(--font-sans); font-size:11px; ' +
      'font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:' + OCHRE +
      '; margin:22px 0 9px;">' + esc(t) + '</div>';
  }

  var rows = ingOrder(r.ingredients).map(function (x) {
    var g = x.g;
    var v = scaledQty(g, factor);
    var mute = g.qty == null ? "color:" + INK_MUTED + ";" : "";
    return '<tr style="border-bottom:1px solid ' + RULE + ';">' +
      '<td style="padding:6px 0;' + mute + '">' + esc(curName(g)) +
        (g.state === "cooked" ? ' <span style="font-size:11px; color:' + INK_MUTED + ';">готовый вес</span>' : "") + '</td>' +
      '<td class="num" style="padding:6px 0; text-align:right; font-weight:600; white-space:nowrap;' + mute + '">' +
        amountText(g, v, factor, INK_FAINT) + '</td></tr>';
  }).join("");

  var steps = (r.steps || []).map(function (s, i) {
    var h = String(s.title || ("Шаг " + (i + 1)));
    var dm = stepDurLabel(h);
    var name = h.replace(/\([^)]*\)\s*$/, "").trim();
    return '<div class="print-step" style="margin-bottom:13px;">' +
      '<div style="font-weight:600; font-size:13.5px;">' + esc(name) +
        (dm ? ' <span class="num" style="font-weight:500; color:' + INK_MUTED + ';">· ' + esc(dm) + '</span>' : "") + '</div>' +
      '<div style="font-size:13px; line-height:1.55; margin-top:3px;">' +
        scaleStepText(s.text, r.ingredients || [], factor, INK_FAINT) + '</div>' +
    '</div>';
  }).join("");

  function block(title, raw) {
    if (!raw) return "";
    var items = String(raw).split("\n").map(function (x) { return x.replace(/^[-•*]\s*/, "").trim(); })
      .filter(Boolean);
    if (!items.length) return "";
    /* Здесь именно esc, а не linkifyEsc с экрана чтения: на бумаге адрес
       набирают руками, сокращённый бесполезен. Перенос длинного адреса на
       печати обеспечивает overflow-wrap на .screen p/li. */
    return '<div class="print-blk">' + head(title) +
      (items.length > 1
        ? '<ul style="font-size:13px; line-height:1.65; margin:0; padding-left:18px;">' +
          items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul>'
        : '<p style="font-size:13px; line-height:1.65; margin:0;">' + esc(items[0]) + '</p>') +
    '</div>';
  }

  var prt = recipeTime(r);
  var meta = [r.cuisine, prt ? shortTime(prt) : r.time,
              r.difficulty ? "сложность " + r.difficulty + " из 5" : ""]
    .filter(Boolean).join(" · ");
  var nuLine = nu.kcal != null
    ? esc(nu.kcal) + " ккал · Б " + esc(nu.protein_g) + " г · Ж " + esc(nu.fat_g) +
      " г · У " + esc(nu.carb_g) + " г — на порцию" + (pw ? " (≈ " + pw.per + " г)" : "")
    : "";

  return '<section class="screen sc-print" style="display:block;">' +
    '<div class="no-print" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;">' +
      '<a data-act="back-read" style="display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-weight:600; font-size:12.5px; cursor:pointer;"><span>←</span> Назад к рецепту</a>' +
      '<button class="ui-btn" data-act="do-print"><span style="font-size:14px;">⎙</span> Печать</button>' +
    '</div>' +
    '<div class="print-sheet" style="background:#fff; color:' + INK + '; max-width:720px; margin:0 auto; ' +
      'box-shadow:var(--shadow); border:1px solid var(--border); border-radius:4px; padding:clamp(24px,5vw,52px);">' +
      '<div class="print-h" style="border-bottom:2px solid ' + INK + '; padding-bottom:14px; margin-bottom:6px;">' +
        '<div style="font-family:var(--font-serif); font-size:30px; font-weight:600; letter-spacing:-.01em; line-height:1.1;">' + esc(r.title) + '</div>' +
        '<div class="num" style="font-size:12px; color:' + INK_MUTED + '; margin-top:8px;">' +
          (meta ? esc(meta) + " · " : "") +
          /* Число порций — на бумаге единственный способ понять, под какой
             пересчёт напечатан лист: коэффициент нигде больше не виден. */
          '<b style="color:' + INK + ';">напечатано на ' + esc(target) + ' порц.</b>' +
          (scaled ? ' <span style="color:' + INK_MUTED + ';">(в рецепте ' + esc(r.servings) + ', ×' +
            trimNum(Math.round(factor * 100) / 100) + ')</span>' : "") + '</div>' +
        (nuLine ? '<div class="num" style="font-size:12px; color:' + INK_MUTED + '; margin-top:4px;">' + nuLine + '</div>' : "") +
      '</div>' +
      (scaled ? '<div style="font-size:11.5px; line-height:1.45; color:' + INK_MUTED + '; margin:10px 0 0;">' +
        '⚠ Количества пересчитаны линейно. Соль, специи и время готовки не масштабируются — проверьте по вкусу.</div>' : "") +
      head("Ингредиенты") +
      '<table class="print-table" style="width:100%; border-collapse:collapse; font-size:13px;">' + rows + '</table>' +
      head("Приготовление") + steps +
      block("Инвентарь", r.equipment) + block("Хранение", r.storage) +
      block("Советы по подаче", r.serving) +
    '</div>' +
  '</section>';
}

/* ═══════════════════════ импорт рецепта ══════════════════════════════════ */
/* ЗЕРКАЛО tools/food/validate_recipe.py. Один и тот же файл обязан разбираться
   одинаково здесь и в проверке — иначе валидатор скажет «всё хорошо», а
   страница разберёт иначе, и разойдётся это молча.

   Два пути, как в спеке: ```json-блок в конце файла (точный, его пишет проект
   Claude.ai) и разбор markdown-таблицы (запасной — Perplexity, старые файлы). */

var STOP_WORDS = {
  "креветк": "морепродукты", "кальмар": "морепродукты", "осьминог": "морепродукты",
  "мидии": "морепродукты", "мидий": "морепродукты", "гребешк": "морепродукты",
  "печень": "печень", "печёнк": "печень", "печенк": "печень",
  "гриб": "грибы", "шампиньон": "грибы", "вешенк": "грибы", "трюфел": "грибы"
};
var _NO_QTY = /по\s+вкусу|по\s+желанию|щепотк|на\s+глаз/i;
/* Пассивный шаг в .md-источнике: «(30 мин, без участия)». Ключевое слово
   ловим и ВЫРЕЗАЕМ из подписи — длительность остаётся чистой, а флаг едет в
   step.passive (зеркалит tools/food/validate_recipe.py). */
var _PASSIVE_MD = /без\s+участия|пассивн\w*|ожидание/i;

function parseQtyStr(raw) {
  if (!raw) return { qty: null, unit: null };
  var s = String(raw).trim();
  if (!s || _NO_QTY.test(s)) return { qty: null, unit: null };
  var m = s.match(/^\s*(\d+(?:[.,]\d+)?)\s*(?:[–—-]\s*\d+(?:[.,]\d+)?\s*)?([А-Яа-яA-Za-z.]+)?/);
  if (!m) return { qty: null, unit: null };
  return {
    qty: parseFloat(m[1].replace(",", ".")),
    unit: (m[2] || "").replace(/[.\s]+$/, "") || null
  };
}

function parseRecipeMd(text) {
  var out = { title: null, cuisine: null, servings: null, servings_note: null,
              time: null, difficulty: null, nutrition: null, ingredients: [],
              steps: [], equipment: null, storage: null, serving: null,
              sources: null, warnings: [] };
  if (!text || !text.trim()) { out.warnings.push("Пусто — вставьте текст рецепта."); return out; }

  var tm = text.match(/^#\s+(.+?)\s*$/m);
  out.title = tm ? tm[1].trim() : null;
  if (!out.title) out.warnings.push("Не нашёл заголовок «# Название блюда».");

  // шапка «**Ключ:** значение» до первого ##
  var head = text.split(/^##\s/m)[0];
  var meta = {}, mm, metaRe = /^\*\*(.+?):\*\*\s*(.*?)\s*$/gm;
  while ((mm = metaRe.exec(head)) !== null) meta[mm[1].trim()] = mm[2].trim();
  out.cuisine = meta["Кухня"] || null;
  out.time = meta["Время"] || null;
  out.servings_note = meta["Порции"] || null;
  if (meta["Сложность"]) {
    var dm = meta["Сложность"].match(/\d+/);
    out.difficulty = dm ? parseInt(dm[0], 10) : null;
  }

  // секции ## …
  var sections = {}, marks = [], re = /^##\s+(.+?)\s*$/gm, m2;
  while ((m2 = re.exec(text)) !== null) marks.push({ name: m2[1].trim().toLowerCase(), end: re.lastIndex });
  marks.forEach(function (mk, i) {
    var stop = i + 1 < marks.length ? text.lastIndexOf("\n##", marks[i + 1].end) : text.length;
    sections[mk.name] = text.slice(mk.end, stop).trim();
  });

  // ```json-блок — основной путь
  var blocks = text.match(/```json\s*\n([\s\S]*?)\n```/g), block = null;
  if (blocks && blocks.length) {
    try {
      block = JSON.parse(blocks[blocks.length - 1].replace(/```json\s*\n/, "").replace(/\n```$/, ""));
    } catch (e) { out.warnings.push("```json-блок в конце файла не разбирается — читаю таблицу."); }
  }

  if (block) {
    if (typeof block.servings === "number" && block.servings > 0) out.servings = block.servings;
    if (block.nutrition && typeof block.nutrition === "object") out.nutrition = block.nutrition;
    if (Array.isArray(block.ingredients)) {
      out.ingredients = block.ingredients.map(function (g) {
        var q = g.qty;
        if (typeof q === "string") { out.warnings.push("«" + g.name + "»: количество строкой — привёл к числу."); q = parseFloat(q.replace(",", ".")); }
        if (typeof q !== "number" || isNaN(q)) q = null;
        return { name: (g.name || "").trim(), raw: (g.name || "").trim(), qty: q,
                 unit: g.unit || null, state: g.state === "cooked" ? "cooked" : null,
                 product_id: null };
      });
    }
  }

  // запасной путь: таблица/список в «## Ингредиенты»
  if (!out.ingredients.length && sections["ингредиенты"]) {
    if (block) out.warnings.push("В json-блоке нет ingredients — читаю таблицу.");
    else out.warnings.push("Нет ```json-блока — разбираю таблицу эвристикой.");
    sections["ингредиенты"].split("\n").forEach(function (ln) {
      ln = ln.trim();
      if (!ln) return;
      var name = null, qty = null;
      if (ln[0] === "|") {
        var cells = ln.replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        if (cells.length < 2) return;
        if (/^[-: ]+$/.test(cells[0]) || /^ингредиент/i.test(cells[0])) return;
        name = cells[0]; qty = cells[1];
      } else if (/^[-*•]/.test(ln)) {
        var parts = ln.replace(/^[-*•]\s*/, "").split(/\s+[—–]\s+|\s*:\s*/);
        if (parts.length < 2) return;
        name = parts[0]; qty = parts.slice(1).join(" ");
      }
      if (!name) return;
      var p = parseQtyStr(qty);
      out.ingredients.push({
        name: name.replace(/\s*\([^)]*\)\s*/g, " ").trim().replace(/[,;]+$/, ""),
        raw: name, qty: p.qty, unit: p.unit,
        state: /варён|варен|отварн/i.test(name) ? "cooked" : null, product_id: null
      });
    });
  }

  // порции из шапки, если блока нет
  if (out.servings == null && out.servings_note) {
    var sm = out.servings_note.match(/=\s*(\d+)/) || out.servings_note.match(/(\d+)\s*порци/);
    if (sm) out.servings = parseInt(sm[1], 10);
  }
  if (!out.servings) out.warnings.push("Не удалось определить число порций — укажите вручную.");

  // шаги
  if (sections["приготовление"]) {
    var body = sections["приготовление"], sm2, sre = /^###\s+(.+?)\s*$/gm, hits = [];
    while ((sm2 = sre.exec(body)) !== null) hits.push({ title: sm2[1].trim(), at: sre.lastIndex, start: sm2.index });
    hits.forEach(function (h, i) {
      var end = i + 1 < hits.length ? hits[i + 1].start : body.length;
      var ttl = h.title, pass = _PASSIVE_MD.test(ttl);
      if (pass) ttl = ttl.replace(/\s*,?\s*(?:без\s+участия|пассивн\w*|ожидание)/i, "").replace(/\(\s*\)\s*$/, "").trim();
      out.steps.push({ title: ttl, text: body.slice(h.at, end).trim(), passive: pass || undefined });
    });
    if (!out.steps.length) {
      // нумерованный список без ### — тоже принимаем
      body.split("\n").forEach(function (ln) {
        var nm = ln.trim().match(/^(\d+)[.)]\s+(.+)$/);
        if (nm) out.steps.push({ title: "Шаг " + nm[1], text: nm[2].trim() });
      });
    }
  }
  if (!out.steps.length) out.warnings.push("Не нашёл шагов приготовления.");

  out.equipment = sections["инвентарь"] || null;
  out.storage = sections["хранение"] || null;
  out.serving = sections["советы по подаче"] || null;
  out.sources = sections["источники"] || null;
  if (!out.nutrition) out.warnings.push("Нет КБЖУ — карточка будет без чисел.");

  // стоп-лист: предупреждение, а не блокировка. Это ВКУС, а не структура.
  var low = text.toLowerCase(), hitsStop = {};
  Object.keys(STOP_WORDS).forEach(function (w) { if (low.indexOf(w) >= 0) hitsStop[STOP_WORDS[w]] = 1; });
  var labels = Object.keys(hitsStop);
  if (labels.length) out.stop = labels;

  return out;
}

/* Сопоставление ингредиента с каталогом. Три состояния, и они различимы
   визуально: найден точно / похоже (ПОДСКАЗКА, не автоприменение) / новый.
   Тихо неверное сопоставление портит список незаметно и выясняется у плиты —
   поэтому фаззи никогда не применяется само. */
function importMatch(name) {
  var key = normName(name);
  for (var i = 0; i < S.products.length; i++) {
    var p = S.products[i];
    if (normName(p.name) === key) return { id: p.id, how: "exact" };
    var al = p.aliases || [];
    for (var j = 0; j < al.length; j++) if (normName(al[j]) === key) return { id: p.id, how: "alias" };
  }
  // подсказка по общим словам
  var want = key.split(" ").filter(Boolean), best = null, bestScore = 0;
  S.products.forEach(function (p) {
    var have = normName(p.name).split(" ").filter(Boolean);
    (p.aliases || []).forEach(function (a) { have = have.concat(normName(a).split(" ").filter(Boolean)); });
    var inter = want.filter(function (w) { return have.indexOf(w) >= 0; }).length;
    if (!inter) return;
    var sc = inter / Math.min(want.length, have.length);
    if (sc > bestScore) { bestScore = sc; best = p.id; }
  });
  return best ? { id: best, how: "guess" } : { id: null, how: "new" };
}

function importModal() {
  var im = S.import_;
  var parsed = im.parsed;
  var body;

  if (!parsed) {
    body = '<label class="fld-lbl">Вставьте рецепт</label>' +
      '<textarea id="f-import" placeholder="текст из Claude или Perplexity" style="width:100%; box-sizing:border-box; min-height:180px; border:1px solid var(--border); border-radius:9px; background:var(--bg); color:var(--text); font-family:inherit; font-size:13.5px; line-height:1.5; padding:12px 14px; resize:vertical;">' + esc(im.text || "") + '</textarea>' +
      '<div style="font-size:11.5px; color:var(--text-faint); margin-top:8px;">Формат — из инструкции проекта: заголовок, шапка, «## Ингредиенты», «## Приготовление». Если внизу есть ```json-блок, разберу по нему точно.</div>';
  } else {
    var cards = [["Название", parsed.title], ["Кухня", parsed.cuisine], ["Порций", parsed.servings],
                 ["Время", parsed.time], ["Шагов", parsed.steps.length],
                 ["КБЖУ", parsed.nutrition && parsed.nutrition.kcal != null ? parsed.nutrition.kcal + " ккал" : "нет"]]
      .filter(function (c) { return c[1] != null && c[1] !== ""; })
      .map(function (c) {
        return '<div style="background:var(--bg-alt); border:1px solid var(--border); border-radius:8px; padding:9px 12px;">' +
          '<div style="font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);">' + esc(c[0]) + '</div>' +
          '<div class="num" style="font-size:13.5px; font-weight:600; margin-top:2px;">' + esc(c[1]) + '</div></div>';
      }).join("");

    var rows = parsed.ingredients.map(function (g, i) {
      var mt = im.match[i] || { id: null, how: "new" };
      var p = mt.id ? productById(mt.id) : null;
      var accent = mt.how === "new" ? "var(--warn)" : (mt.how === "guess" ? "var(--info)" : "var(--success)");
      var note = mt.how === "new" ? "нового нет в каталоге"
        : mt.how === "guess" ? "похоже — проверьте"
        : (mt.how === "alias" ? "нашёлся по алиасу" : "найден");
      var opts = [{ value: "", t: "— не связывать —", selected: !mt.id }].concat(S.products.slice()
        .sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ru"); })
        .map(function (pp) { return { value: pp.id, t: pp.name, selected: pp.id === mt.id }; }));
      return '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--bg); border:1px solid var(--border); border-left:3px solid ' + accent + '; border-radius:8px; padding:11px 13px;">' +
        '<span style="flex:1; min-width:120px; font-size:13.5px; font-weight:600;">' + esc(g.raw || g.name) +
          (g.qty != null ? ' <span class="num" style="color:var(--text-muted); font-weight:400;">' + esc(fmtQty(g.qty, g.unit)) + '</span>' : ' <span style="color:var(--text-faint); font-weight:400;">по вкусу</span>') + '</span>' +
        '<span style="color:var(--text-faint);">→</span>' +
        // общий список ui-kit с поиском (продуктов сотни); значение — в скрытом
        // #f-map-i, его читает сохранение рецепта
        uiSelectHTML({ id: "f-map-" + i, size: "md", label: "Продукт для «" + (g.name || "") + "»",
          placeholder: "Начните вводить продукт…", style: "flex:0 1 240px; max-width:240px;",
          attrs: { "data-map": i }, options: opts }) +
        '<span style="font-size:12px; font-weight:600; color:' + accent + ';">' + esc(note) + '</span>' +
      '</div>';
    }).join("");

    var warn = (parsed.warnings || []).map(function (w) {
      return '<div style="font-size:12.5px; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:8px 12px; margin-bottom:8px;">' + esc(w) + '</div>';
    }).join("");
    var stop = parsed.stop
      ? '<div style="display:flex; align-items:flex-start; gap:10px; font-size:12.5px; line-height:1.45; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:10px 13px; margin-bottom:12px;"><span style="font-weight:700; font-size:15px;">⚠</span><span><b>В рецепте есть ингредиент из стоп-листа: ' + esc(parsed.stop.join(", ")) + '.</b> Это предупреждение, не блокировка — сохранить всё равно можно.</span></div>'
      : "";

    body = stop + warn +
      '<div style="font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">Разобрано</div>' +
      '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:9px; margin-bottom:18px;">' + cards + '</div>' +
      '<div style="font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">Сопоставление с каталогом</div>' +
      '<div style="display:flex; flex-direction:column; gap:8px;">' + rows + '</div>' +
      '<div style="font-size:11.5px; color:var(--text-faint); margin-top:10px;">Подтверждённое сопоставление уходит в алиасы продукта — в следующий раз тот же ингредиент найдётся сразу.</div>';
  }

  return uiModalHTML({ title: "Импорт рецепта", sub: "вставьте текст — разберём и сопоставим с каталогом",
    close: "close-modal", width: 720, body: body,
    foot: '<span class="ui-modal-sp"></span><button class="ui-btn plain" data-act="close-modal">Отмена</button>' +
      (parsed
        ? '<button class="ui-btn ghost" data-act="import-back">Назад к тексту</button>' +
          '<button class="ui-btn" data-act="import-save">Сохранить рецепт</button>'
        : '<button class="ui-btn" data-act="import-parse">Разобрать</button>') });
}

/* ═══════════════════════ режим готовки ═══════════════════════════════════ */
/* Один шаг на экран, а не простыня со скроллом. К этому независимо пришли все
   зрелые кулинарные приложения и смарт-дисплеи, где готовка была основным
   сценарием. Плюс довод от нашей архитектуры: полная перерисовка убивает
   позицию скролла, но точно восстанавливает дискретный индекс шага.

   Прыгать между шагами МОЖНО в обе стороны. Правило NN/g «не давать выбрать
   шаг до завершения предыдущих» сюда не переносится: в визарде следующий шаг
   зависит от введённых данных, в рецепте — нет, а вопрос «сколько там было
   соли?» возникает постоянно. */

var COOK_KEY = "food-cook:";
/* Через столько часов простоя предлагаем начать заново: почти наверняка это
   новая готовка того же блюда, а не продолжение вчерашней. */
var COOK_STALE_H = 8;

function cookLoad(id) {
  try { return JSON.parse(localStorage.getItem(COOK_KEY + id) || "null"); } catch (e) { return null; }
}
function cookSave() {
  if (!S.cook) return;
  try {
    localStorage.setItem(COOK_KEY + S.cook.recipeId, JSON.stringify({
      step: S.cook.step, checked: S.cook.checked, at: Date.now()
    }));
  } catch (e) {}
}
function cookClear(id) { try { localStorage.removeItem(COOK_KEY + id); } catch (e) {} }

/* Шаг «Шаг 3. Обжарка фарша (8 мин)» → имя и длительность отдельно.
   Оба поля уже есть в данных — размечать ничего не нужно. */
function stepParts(s, i) {
  var head = String((s && s.title) || ("Шаг " + (i + 1)));
  var dm = stepDurLabel(head);
  var name = head.replace(/\([^)]*\)\s*$/, "").replace(/^Шаг\s*\d+\s*[.．]?\s*/i, "").trim();
  return { name: name || head, dur: dm };
}

/* Wake Lock требует secure context — по http:// в локальной сети не работает
   вовсе, обходов нет. Поэтому: молчать нельзя, иначе человек решит, что
   сломано у нас; показываем честную строку с объяснением. */
function wakeSupported() {
  return typeof navigator !== "undefined" && "wakeLock" in navigator;
}
function wakeRequest() {
  if (!wakeSupported()) return;
  navigator.wakeLock.request("screen").then(function (s) {
    S.wakeLock = s;
    /* Блокировка снимается сама при сворачивании вкладки, и старый sentinel
       переиспользовать нельзя — нужен новый запрос. Сценарий не редкий: без
       таймеров в странице человек уходит ставить таймер на телефоне. */
    s.addEventListener("release", function () { S.wakeLock = null; render(); });
    render();
  }).catch(function () { S.wakeLock = null; S.wakeErr = true; render(); });
}
function wakeRelease() {
  if (S.wakeLock) { try { S.wakeLock.release(); } catch (e) {} }
  S.wakeLock = null; render();
}

function cookScreen() {
  var c = S.cook, r = c && recipeById(c.recipeId);
  if (!r) return '<section class="screen sc-cook" style="display:block;"><div style="padding:60px 0; text-align:center; color:var(--text-faint);">Рецепт не найден.</div></section>';
  return '<section class="screen sc-cook">' +
    '<div class="cook-2col" id="cook-body" style="display:grid; grid-template-columns:1fr 300px; gap:22px; align-items:start; max-width:960px; margin:0 auto;">' +
      cookBodyHTML() +
    '</div>' +
  '</section>';
}

/* Тело режима готовки отдельно от оболочки: листание шагов и галочки на
   ингредиентах меняют ТОЛЬКО его, и перерисовывается тоже только оно
   (patchCook). Это самый чувствительный к миганию экран — кухня, телефон,
   мокрые руки, — и каждый тап по «вперёд» пересобирал весь документ. */
function cookBodyHTML() {
  var c = S.cook, r = c && recipeById(c.recipeId);
  if (!r) return "";
  var steps = r.steps || [];
  var n = Math.min(c.step, steps.length - 1);
  var sp = stepParts(steps[n], n);
  var factor = recipeFactor(r), target = S.portions[r.id] || r.servings;
  var awakeOn = !!S.wakeLock;

  var ings = ingOrder(r.ingredients).map(function (x) {
    var g = x.g, i = x.i;
    var v = scaledQty(g, factor);
    var done = !!c.checked[i];
    return '<div data-act="cook-check" data-arg="' + i + '" style="display:flex; align-items:center; gap:11px; padding:8px 0; cursor:pointer; border-bottom:1px solid var(--border);">' +
      '<span style="flex:none; width:22px; height:22px; border-radius:6px; border:2px solid ' +
        (done ? "var(--c-2)" : "var(--border-strong)") + '; background:' + (done ? "var(--c-2)" : "transparent") +
        '; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;">' + (done ? "✓" : "") + '</span>' +
      '<span style="flex:1; font-size:13.5px;' + (done ? " color:var(--text-faint); text-decoration:line-through;" : "") + '">' + esc(curName(g)) + '</span>' +
      '<span class="num" style="font-size:13px; font-weight:600; color:var(--text-muted);">' + amountText(g, v, factor) + '</span>' +
    '</div>';
  }).join("");

  return '' +
      '<div style="display:flex; flex-direction:column; min-height:520px; background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; overflow:hidden;">' +
        '<div class="cook-top" style="position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--bg-elev); border-bottom:1px solid var(--border);">' +
          '<a data-act="back-read" style="flex:1 1 auto; min-width:0; display:inline-flex; align-items:center; gap:7px; color:var(--text-muted); font-weight:600; font-size:14px; cursor:pointer;"><span style="font-size:16px;">←</span><span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + esc(r.title) + '</span></a>' +
          '<div class="cook-top-right" style="display:flex; align-items:center; gap:9px; flex:none;">' +
            '<button class="fchip cook-2col-ing" data-act="cook-sheet" data-arg="ingredients" style="min-height:38px; display:none;">Ингредиенты</button>' +
            (wakeSupported()
              ? '<button data-act="cook-awake" title="Не гасить экран" style="display:inline-flex; align-items:center; gap:7px; border:1px solid ' +
                (awakeOn ? "var(--c-2)" : "var(--border)") + '; background:' + (awakeOn ? "var(--c2-bg)" : "var(--bg-elev)") +
                '; color:' + (awakeOn ? "var(--c-2)" : "var(--text-muted)") + '; border-radius:999px; padding:8px 13px; font-size:12px; font-weight:600; cursor:pointer; min-height:38px; white-space:nowrap;">' +
                '<span style="width:8px; height:8px; border-radius:50%; background:' + (awakeOn ? "var(--c-2)" : "var(--border-strong)") + '; flex:none;"></span>' +
                (awakeOn ? "Экран не гаснет" : "Не гасить экран") + '</button>'
              : "") +
          '</div>' +
        '</div>' +
        (wakeSupported() ? "" :
          '<div style="margin:12px 16px 0; font-size:12px; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:8px 12px; line-height:1.4;">Экран может гаснуть — откройте страницу по https-адресу, чтобы разблокировать «Не гасить экран».</div>') +
        '<div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:clamp(22px,4vw,44px);">' +
          '<div style="display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;">' +
            (sp.dur ? '<span class="num" style="font-size:14px; font-weight:700; color:var(--c-2); background:var(--c2-bg); border-radius:999px; padding:6px 14px;">⏱ ' + esc(sp.dur) + '</span>' : "") +
            '<span class="num" style="font-size:12.5px; color:var(--text-faint);">на ' + esc(target) + ' ' + plural(target, "порцию", "порции", "порций") + '</span>' +
          '</div>' +
          '<div style="font-family:var(--font-serif); font-size:clamp(20px,3.2vw,26px); font-weight:600; letter-spacing:-.01em; line-height:1.12; margin-bottom:16px;">Шаг ' + (n + 1) + '. ' + esc(sp.name) + '</div>' +
          '<div class="cook-step-text">' + scaleStepText((steps[n] || {}).text, r.ingredients || [], factor) + '</div>' +
        '</div>' +
        '<div style="position:sticky; bottom:0; z-index:6; display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--bg-elev); border-top:1px solid var(--border);">' +
          '<button data-act="cook-step-rel" data-arg="-1" aria-label="назад" style="flex:none; width:60px; height:60px; border-radius:14px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:26px; font-weight:600; cursor:pointer;' + (n <= 0 ? " opacity:.35;" : "") + '">‹</button>' +
          '<button data-act="cook-sheet" data-arg="steps" style="flex:1; height:60px; border:1px solid var(--border); background:var(--bg); border-radius:14px; font-family:inherit; font-size:15px; font-weight:600; color:var(--text); cursor:pointer;">Шаг ' + (n + 1) + ' из ' + steps.length + '</button>' +
          '<button data-act="cook-step-rel" data-arg="1" aria-label="вперёд" style="flex:none; width:60px; height:60px; border-radius:14px; border:1px solid var(--btn-acc); background:var(--btn-acc); color:var(--bg-elev); font-size:26px; font-weight:600; cursor:pointer;' + (n >= steps.length - 1 ? " opacity:.35;" : "") + '">›</button>' +
        '</div>' +
      '</div>' +
      '<aside class="cook-ing-rail" style="background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; padding:16px 18px;">' +
        '<div style="font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:10px;">Ингредиенты · ' + esc(target) + ' порц.</div>' + ings +
      '</aside>';
}

/* Перерисовать «мясо» режима готовки, не трогая шапку, рельс, фон-бумагу и
   нижнюю панель. Если открыта шторка (оглавление шагов или ингредиенты) —
   и её тоже: галочку ставят как раз оттуда, и она обязана сойтись с рельсом.
   false → узла нет, вызывающий откатывается на полный render(). */
function patchCook() {
  var ok = patchHTML("cook-body", cookBodyHTML());
  if (S.sheet) ok = patchHTML("sheet-body", cookSheetBodyHTML()) && ok;
  return ok;
}

/* Шторки. Список шагов — ответ на «оглавление»: имена шагов уже лежат в
   данных, отдельной разметки не потребовалось. */
function cookSheet() {
  if (!S.cook || !recipeById(S.cook.recipeId) || !S.sheet) return "";
  return '<div class="sheet-ov" data-act="cook-close-sheet"><div class="sheet" data-act="noop" id="sheet-body">' +
    cookSheetBodyHTML() + '</div></div>';
}
/* Содержимое шторки отдельно от неё самой — по той же причине, что и тело
   режима готовки: галочка на ингредиенте перерисовывает список, а не экран. */
function cookSheetBodyHTML() {
  var c = S.cook, r = c && recipeById(c.recipeId);
  if (!r || !S.sheet) return "";
  var head = function (t) {
    return '<div style="position:sticky; top:0; background:var(--bg-elev); display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);">' +
      '<span style="font-family:var(--font-serif); font-size:18px; font-weight:600;">' + esc(t) + '</span>' +
      '<button class="ui-btn plain sm" data-act="cook-close-sheet" aria-label="Закрыть">×</button></div>';
  };
  var body;
  if (S.sheet === "steps") {
    body = head("Все шаги") + '<div style="padding:8px 12px 20px;">' +
      (r.steps || []).map(function (s, i) {
        var sp = stepParts(s, i), cur = i === c.step;
        return '<div data-act="cook-step-abs" data-arg="' + i + '" style="display:flex; align-items:center; gap:13px; padding:13px 12px; border-radius:10px; cursor:pointer;' +
            (cur ? " background:var(--c2-bg);" : "") + '">' +
          '<span class="num" style="flex:none; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;' +
            (cur ? " background:var(--c-2); color:#fff;" : " background:var(--bg-alt); color:var(--text-muted);") + '">' + (i + 1) + '</span>' +
          '<span style="flex:1; font-size:15px; font-weight:600;' + (cur ? " color:var(--c-2);" : "") + '">' + esc(sp.name) + '</span>' +
          (sp.dur ? '<span class="num" style="font-size:12px; color:var(--text-muted);">⏱ ' + esc(sp.dur) + '</span>' : "") +
        '</div>';
      }).join("") + '</div>';
  } else {
    var factor = recipeFactor(r), target = S.portions[r.id] || r.servings;
    body = head("Ингредиенты · " + target + " порц.") + '<div style="padding:6px 16px 22px;">' +
      ingOrder(r.ingredients).map(function (x) {
        var g = x.g, i = x.i;
        var v = scaledQty(g, factor), done = !!c.checked[i];
        return '<div data-act="cook-check" data-arg="' + i + '" style="display:flex; align-items:center; gap:13px; padding:12px 4px; cursor:pointer; border-bottom:1px solid var(--border);">' +
          '<span style="flex:none; width:26px; height:26px; border-radius:7px; border:2px solid ' + (done ? "var(--c-2)" : "var(--border-strong)") +
            '; background:' + (done ? "var(--c-2)" : "transparent") + '; color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;">' + (done ? "✓" : "") + '</span>' +
          '<span style="flex:1; font-size:15px;' + (done ? " color:var(--text-faint); text-decoration:line-through;" : "") + '">' + esc(curName(g)) + '</span>' +
          '<span class="num" style="font-size:14px; font-weight:600; color:var(--text-muted);">' + amountText(g, v, factor) + '</span>' +
        '</div>';
      }).join("") + '</div>';
  }
  return body;
}

/* Возврат к недоготовленному: НЕ продолжаем молча. Человек мог отвлечься на
   пять минут, а мог вернуться назавтра — и во втором случае «шаг 4» без
   спроса дезориентирует. */
function resumeOverlay() {
  var r = S.resume && recipeById(S.resume.recipeId);
  if (!r) return "";
  var sp = stepParts((r.steps || [])[S.resume.step], S.resume.step);
  var stale = (Date.now() - (S.resume.at || 0)) > COOK_STALE_H * 3600e3;
  var cont = '<button class="ui-btn' + (stale ? " ghost" : "") + '" data-act="resume-cont">Продолжить с шага ' + (S.resume.step + 1) + '</button>';
  var again = '<button class="ui-btn' + (stale ? "" : " ghost") + '" data-act="resume-restart">Начать заново</button>';
  return '<div class="ov"><div class="modal" style="max-width:400px;">' +
    '<div style="padding:26px 24px 22px; text-align:center;">' +
      '<div style="width:52px; height:52px; border-radius:14px; background:var(--c2-bg); color:var(--c-2); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 16px;">▶</div>' +
      '<div style="font-family:var(--font-serif); font-size:22px; font-weight:600; margin-bottom:6px;">Продолжим готовить?</div>' +
      '<div style="font-size:13.5px; color:var(--text-muted); line-height:1.5;">Вы остановились на <b style="color:var(--text);">шаге ' + (S.resume.step + 1) + ' — ' + esc(sp.name) + '</b>.' +
        (stale ? ' Это было давно — скорее всего, вы готовите заново.' : "") + '</div>' +
      /* Порядок кнопок меняется по давности: после долгого перерыва первым
         предлагаем начало, а не продолжение. */
      '<div style="display:flex; flex-direction:column; gap:10px; margin-top:22px;">' + (stale ? again + cont : cont + again) + '</div>' +
    '</div></div></div>';
}

/* ═══════════════════════ модалка «Запланировать» ═════════════════════════ */
/* Строки готовятся один раз при открытии и живут в состоянии: человек снимает
   галочки и правит количества, и эти правки не должны затираться перерисовкой. */
/* Крупа и паста в рецепте часто записаны ГОТОВЫМ весом (state=cooked) — гарнир
   меряют тем, что кладут в тарелку. Покупать надо СУХОЙ, и пересчёт живёт
   здесь, а не в plan-apply: в модалке человек видит и правит ровно то число,
   которое поедет в список. Раньше state в строку плана не переносился вовсе, и
   «Гречка 195 г готовой» уходила в список как 195 г крупы — перекупка в 2,5
   раза, заметная только у кассы (баг 2026-08-15; инструкция генератора при этом
   обещала обратное — что пометка cooked как раз от этого и защищает).
   Коэффициент — только cooked_ratio продукта из каталога: это SSOT, и он же
   стоит за пересчётом КБЖУ (dishNutritionEstimate). Нет продукта или нет
   коэффициента — НЕ делим втихую по «примерно 2,5», а помечаем строку и
   покупаем как есть: молча заниженная закупка хуже честного «не знаю».
   Только вес: cooked_ratio массовый, для «шт» и «мл» он бессмыслен. */
function cookedToDry(g, qty, p) {
  var nu = (normUnit(g.unit) || "").toLowerCase();
  if (g.state !== "cooked" || qty == null || (nu !== "г" && nu !== "кг")) {
    return { qty: qty, cookedQty: null, noRatio: false };
  }
  if (!p || !(p.cooked_ratio > 0)) return { qty: qty, cookedQty: null, noRatio: true };
  return { qty: roundQty(qty / p.cooked_ratio, g.unit), cookedQty: qty, noRatio: false };
}

function planRows(r, portions) {
  var factor = (r.servings ? portions / r.servings : 1);
  return ingOrder(r.ingredients).map(function (x) {
    var g = x.g;
    var p = g.product_id ? productById(g.product_id) : null;
    var staple = !!(p && p.staple);
    var dry = cookedToDry(g, scaledQty(g, factor), p);
    return {
      name: g.name, unit: g.unit, product_id: g.product_id || null,
      orig_name: g.name, orig_product_id: g.product_id || null, swapped: false,
      qty: dry.qty, cookedQty: dry.cookedQty, noRatio: dry.noRatio, edited: false,
      /* «Всегда есть дома» — галочка снята заранее. Без этого каждый рецепт
         добавлял бы соль, перец и масло, и списку перестали бы верить. */
      checked: g.qty != null && !staple,
      staple: staple,
      taste: g.qty == null            // «по вкусу» — в список не попадает вовсе
    };
  });
}

function planModal() {
  var p = S.plan, r = recipeById(p.recipeId);
  if (!r) return "";
  /* нижняя строка («Добавить в список») живёт в plan-body: её перерисовывает
     patchPlan вместе со списком */
  return uiModalHTML({ title: "Запланировать: " + r.title, sub: "ингредиенты пересчитаются и лягут в список покупок",
    close: "close-modal", body: '<div id="plan-body">' + planBodyHTML(p, r) + '</div>' });   // прокручивается тело окна, patchPlan — только этот блок
}

/* Тело модалки отдельно от оболочки: галочка, порции и правка количества
   меняют только его. Полная перерисовка выбрасывала и саму .modal — а у неё
   собственная прокрутка, и список ингредиентов отматывался к началу (случай
   2026-08-02, из-за него в тестах вёрстки живёт отдельная проверка). Теперь
   элемент модалки не пересоздаётся, и прокрутка сохраняется сама. */
function planBodyHTML(p, r) {
  var factor = r.servings ? p.portions / r.servings : 1;
  var scaled = Math.abs(factor - 1) > 0.001;

  /* Три корзины. Раньше «всегда есть дома» с количеством (масло) висело в
     ОСНОВНОМ списке некупленным, а «по вкусу» (перец) — в нижнем блоке. Оба
     «дома», но в разных местах — сбивало (замечание владельца 2026-07-21).
     Теперь всё домашнее собрано внизу: стейплы полными строками (галочка снята,
     отметь — купим), «по вкусу» — чипами-напоминаниями. */
  var indexed = p.rows.map(function (x, i) { return { x: x, i: i }; });
  var taste = p.rows.filter(function (x) { return x.taste; });
  var real = indexed.filter(function (o) { return !o.x.taste; });
  var mainRows = indexed.filter(function (o) { return !o.x.taste && !o.x.staple; });
  var homeRows = indexed.filter(function (o) { return !o.x.taste && o.x.staple; });

  function planRowHtml(o) {
    var x = o.x, i = o.i;
    var pr = x.product_id ? productById(x.product_id) : null;
    /* packs через packOf, а НЕ pr.pack_size напрямую: packOf читает и
       легаси-формы (stores[] до 2026-08-01), иначе «N уп.» тихо исчезло бы
       у несмигрированных файлов (тот же класс бага, что уже ловили). */
    var pk = packOf(pr);
    var packs = (pk && x.qty && (!pr.unit || !x.unit || pr.unit === x.unit))
      ? Math.ceil(x.qty / pk) + " уп." : "";

    /* Строка в ДВЕ ступени. Раньше имя, ссылка «заменить» и степпер −/кол-во/+
       делили одну горизонтальную строку; на телефоне имя сминалось в столбик,
       «заменить на другое» ломалось на три строки, а степпер лез в середину
       (скриншот 2026-07-21). Теперь: сверху галочка + имя + степпер, снизу —
       замена и «N уп.» отдельной строкой во всю ширину. */
    var stepper = '<div style="flex:none; display:inline-flex; align-items:center; gap:6px;">' +
      '<button data-act="plan-amt" data-arg="' + i + ':-" title="меньше — часть уже есть" style="width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text-muted); font-size:15px; cursor:pointer; line-height:1;">−</button>' +
      '<span class="num" style="font-size:13.5px; font-weight:600; min-width:56px; text-align:center;">' + esc(fmtQty(x.qty, x.unit)) + '</span>' +
      '<button data-act="plan-amt" data-arg="' + i + ':+" title="больше" style="width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text-muted); font-size:15px; cursor:pointer; line-height:1;">+</button>' +
    '</div>';

    /* Вторая ступень: статус замены / ссылка / выпадающий список + «N уп.». */
    var swapUI = x.swapped
      ? '<span style="font-size:11.5px; color:var(--c-2);">куплю: ' +
        esc((productById(x.product_id) || {}).name || "") +
        ' <span data-act="plan-swap-clear" data-arg="' + i + '" style="cursor:pointer; text-decoration:underline;">вернуть</span></span>'
      : (S.planSwap === i
        ? uiSelectHTML({ id: "f-swap", size: "md", label: "Заменить на продукт", attrs: { "data-swap": i },
            placeholder: "Начните вводить продукт…", style: "flex:0 1 260px; max-width:100%;",
            options: [{ value: "", t: "— выберите продукт —" }].concat(
              S.products.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ru"); })
                .map(function (pp) { return { value: pp.id, t: pp.name, selected: pp.id === x.product_id }; })) })
        : '<span data-act="plan-swap" data-arg="' + i + '" style="font-size:11.5px; color:var(--text-faint); cursor:pointer; text-decoration:underline;">заменить на другое</span>');
    var packsChip = packs
      ? '<span class="num" style="font-size:11.5px; color:var(--text-faint);">' + esc(packs) + '</span>' : "";
    var line2 = (swapUI || packsChip)
      ? '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 0 36px; flex-wrap:wrap;">' +
        '<span style="min-width:0;">' + swapUI + '</span>' + packsChip + '</div>'
      : "";

    return '<div style="padding:11px 14px; border-bottom:1px solid var(--border);' +
        (x.checked ? "" : " opacity:.5;") + '">' +
      '<div style="display:flex; align-items:center; gap:12px;">' +
        '<span data-act="plan-check" data-arg="' + i + '" style="flex:none; width:24px; height:24px; border-radius:6px; border:2px solid ' +
          (x.checked ? "var(--c-2)" : "var(--border-strong)") + '; background:' + (x.checked ? "var(--c-2)" : "transparent") +
          '; color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; cursor:pointer;">' +
          (x.checked ? "✓" : "") + '</span>' +
        '<div style="flex:1; min-width:0;">' +
          '<div style="font-size:14px; font-weight:600;">' + esc(curName(x)) + '</div>' +
          (x.staple ? '<div style="font-size:11px; color:var(--text-faint);">обычно есть дома — отметьте, если кончилось</div>' : "") +
          /* Пересчёт готового веса в сухой показываем всегда: иначе число в
             строке расходится с рецептом и выглядит багом. После правки руками
             подпись снимается — она была про исходный пересчёт. Формулировка
             «на N готовой», а не «в рецепте N»: N — это ПЕРЕСЧИТАННАЯ под
             выбранные порции и округлённая величина, в самом рецепте стоит
             другое число, и ссылаться на него было бы враньём. */
          (x.cookedQty != null && !x.edited
            ? '<div style="font-size:11px; color:var(--text-faint);">на ' + esc(fmtQty(x.cookedQty, x.unit)) + ' готовой — покупаем сухой</div>'
            : "") +
          (x.noRatio
            ? '<div style="font-size:11px; color:var(--warn);">вес готового продукта, а разваривание у продукта не задано — берём как есть, проверьте</div>'
            : "") +
        '</div>' +
        stepper +
      '</div>' + line2 +
    '</div>';
  }

  var rows = mainRows.map(planRowHtml).join("");
  var homeHtml = homeRows.map(planRowHtml).join("");

  var willAdd = 0, willMerge = 0;
  real.forEach(function (o) {
    if (!o.x.checked || o.x.qty == null) return;
    findShopMatch(o.x) ? willMerge++ : willAdd++;
  });
  var note = willAdd || willMerge
    ? (willAdd ? willAdd + " " + plural(willAdd, "позиция добавится", "позиции добавятся", "позиций добавится") : "") +
      (willAdd && willMerge ? ", " : "") +
      (willMerge ? willMerge + " " + plural(willMerge, "объединится", "объединятся", "объединятся") + " с уже запланированным" : "")
    : "Ничего не выбрано";

  return '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px;">' +
        '<span style="font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Порций</span>' +
        '<div style="display:inline-flex; align-items:center; gap:11px;">' +
          '<button class="pbtn" data-act="plan-portions" data-arg="-">−</button>' +
          '<span class="num" style="font-family:var(--font-serif); font-size:26px; font-weight:600; min-width:34px; text-align:center;">' + esc(p.portions) + '</span>' +
          '<button class="pbtn" data-act="plan-portions" data-arg="+">+</button>' +
        '</div>' +
        '<span class="num" style="font-size:12px; color:var(--text-faint);">в рецепте ' + esc(r.servings) + '</span>' +
        (scaled ? '<span class="num" style="font-size:12.5px; font-weight:700; color:var(--c-2); background:var(--c2-bg); border-radius:999px; padding:3px 10px;">×' + trimNum(Math.round(factor * 100) / 100) + '</span>' : "") +
      '</div>' +
      (scaled ? '<div style="display:flex; align-items:flex-start; gap:9px; font-size:12.5px; line-height:1.45; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:9px 13px; margin-bottom:16px;"><span style="font-weight:700;">⚠</span><span>Количества пересчитаны линейно. Соль, специи и время готовки не масштабируются — проверьте по вкусу.</span></div>' : "") +
      (mainRows.length
        ? '<div style="border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;">' + rows + '</div>'
        : '<div style="text-align:center; color:var(--text-faint); font-size:13px; padding:18px 0;">Всё в этом рецепте обычно есть дома — купить нечего.</div>') +
      /* Один блок «обычно есть дома»: стейплы (полными строками, отметь — купим)
         и «по вкусу» (чипами). Так все домашние ингредиенты в одном месте. */
      ((homeRows.length || taste.length)
        ? '<details style="margin-top:14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg);"' + (S.planHomeOpen ? " open" : "") + '>' +
          '<summary data-act="plan-home-toggle" style="list-style:none; cursor:pointer; padding:12px 14px; font-size:13px; font-weight:600; color:var(--text-muted); display:flex; align-items:center; gap:8px;"><span style="color:var(--c-2);">' + (S.planHomeOpen ? "▾" : "▸") + '</span> Обычно есть дома (' + (homeRows.length + taste.length) + ')</summary>' +
          '<div style="padding:0 6px 12px;">' +
            (homeRows.length
              ? '<div style="font-size:12px; color:var(--text-faint); padding:2px 8px 8px;">По умолчанию не покупаем. Кончилось — отметьте галочкой:</div>' +
                '<div style="border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin:0 8px;">' + homeHtml + '</div>'
              : "") +
            (taste.length
              ? '<div style="font-size:12px; color:var(--text-faint); padding:12px 8px 6px;">Эти в список не попадают — «по вкусу»:</div>' +
                '<div style="display:flex; gap:8px; flex-wrap:wrap; padding:0 8px;">' +
                  taste.map(function (t) { return '<span style="font-size:12px; color:var(--text-muted); background:var(--bg-alt); border:1px solid var(--border); border-radius:999px; padding:4px 11px;">' + esc(t.name) + '</span>'; }).join("") + '</div>'
              : "") +
          '</div></details>'
        : "") +
      '<div style="display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:20px;">' +
        '<div style="font-size:12px; color:var(--text-faint); flex:1; min-width:180px;">' + esc(note) + '</div>' +
        '<button class="ui-btn" data-act="plan-apply">Добавить в список</button>' +
      '</div>';
}

/* Тело модалки на месте: галочка, порции, ±количество, замена продукта. */
function patchPlan() {
  var r = S.plan && recipeById(S.plan.recipeId);
  return !!r && patchHTML("plan-body", planBodyHTML(S.plan, r));
}

/* Поиск уже существующей строки списка под этот ингредиент.
   Ключ — product_id, а при его отсутствии нормализованное имя. Единица должна
   совпадать: складывать граммы с штуками нельзя, и молча приводить их друг к
   другу тоже (для этого понадобились бы плотности и вес штуки). */
function findShopMatch(row) {
  var key = row.product_id || normName(row.name);
  for (var i = 0; i < S.shopping.length; i++) {
    var it = S.shopping[i];
    if (it.bought) continue;          // купленное — уже в корзине, не трогаем
    var k = it.product_id || normName(it.name);
    if (k === key && normUnit(it.unit || "") === normUnit(row.unit || "")) return it;
  }
  return null;
}

/* ═══════════════════════ модалка добавления позиции ══════════════════════ */
function addModal() {
  var a = S.addItem;
  /* Свой список подсказок, а НЕ нативный <datalist>. Две причины, обе
     наблюдались вживую:
       1. он не фильтровал — на «яблок» показывал «Бульон, Говядина, Говяжий
          фарш»: Chrome сопоставляет по своим правилам и кириллицу здесь
          обрабатывает не так, как ждёшь;
       2. он переживал СВОЙ ЖЕ инпут. Страница перерисовывается целиком, инпут
          исчезает вместе с разметкой, а нативный попап остаётся висеть поверх
          закрытой модалки — ровно то, что было видно на экране.
     Свой список фильтруется предсказуемо и умирает вместе с модалкой. */
  var nm = (a.name || "").trim();
  var sug = addSugList();
  /* Запоминаем сопоставление на момент отрисовки: обработчик ввода по нему
     решает, хватит ли точечной правки подсказки или нужен полный render()
     (поля «Сколько»/«Единица» зависят от продукта, а не от букв). */
  S._addSig = addMatchSig();

  /* Единица берётся ИЗ ПРОДУКТА, а не вводится текстом. Свободный ввод давал
     «шт» там, где продукт в граммах, и наоборот — количество в списке потом
     не суммировалось. Если продукт заматчился — единица его; поле выбора
     показываем только когда есть настоящий выбор (продаётся штучно И известен
     вес штуки). Новый продукт — единственный случай свободного ввода. */
  var mp = null;
  if (nm) { var mt2 = importMatch(nm); if (mt2.how === "exact" || mt2.how === "alias") mp = productById(mt2.id); }
  var effUnit = a.unit || (mp ? (mp.unit || "") : "");
  var unitField;
  var choices = addUnitChoices(mp);
  if (choices.length > 1) {
    // настоящий выбор: вес/объём · штука (если известен вес штуки) · упаковка (если известна фасовка)
    unitField = '<div style="grid-column:span 1;"><span class="fld-lbl">Единица</span>' +
      '<div style="display:flex; gap:7px;">' + choices.map(function (c) {
        var on = effUnit === c[0];
        return '<button class="fchip" data-act="add-unit-pick" data-arg="' + attr(c[0]) + '" style="flex:1; min-height:38px;' +
          (on ? " color:var(--c-2); border-color:var(--c-2); background:var(--c2-bg); font-weight:600;" : "") + '">' + esc(c[1]) + '</button>';
      }).join("") + '</div></div>';
  } else if (mp) {
    // единица известна и одна — показываем её, но не даём путать вводом
    unitField = '<div style="grid-column:span 1;"><span class="fld-lbl">Единица</span>' +
      '<div class="fld" style="display:flex; align-items:center; color:var(--text-muted); background:var(--bg-alt);">' +
      esc(mp.unit || "—") + '</div>' +
      '<input type="hidden" id="f-add-unit" value="' + attr(mp.unit || "") + '"></div>';
  } else {
    unitField = fld("Единица", "add-unit", a.unit, "г / мл / шт");
  }

  /* Живой пересчёт «3 шт ≈ N г». Узел рисуется ВСЕГДА (пустой — скрытым):
     обработчик ввода количества переписывает его текст точечно, а искать
     несуществующий узел и падать на полный render() на каждой цифре — это то же
     мигание, от которого мы уходим. */
  var convTxt = addConvText();

  /* Количество — с шагами ±. Мелкий шаг (50 г / 1 шт) — точечная подгонка,
     крупный — сразу ОДНА УПАКОВКА продукта: реальная единица покупки. Кнопки
     упаковки появляются только когда продукт заматчился, фасовка известна и
     единица согласуется (шагать «+750 г» в штуках — смешение метрик). */
  var mpPack = (mp && (!effUnit || effUnit === (mp.unit || ""))) ? packOf(mp) : null;
  var qtyField =
    '<div style="grid-column:span 1;">' +
      '<label class="fld-lbl" for="f-add-qty">Сколько</label>' +
      '<div style="display:flex; align-items:center; gap:6px;">' +
        stepBtn("add-qty-step", "step|-1", "−", "меньше") +
        '<input class="fld" id="f-add-qty" inputmode="decimal" autocomplete="off" value="' + attr(a.qty || "") + '" placeholder="' + ({ "уп": "1", "шт": "1", "кг": "1", "л": "1" }[effUnit] || "500") + '" style="flex:1; min-width:0; text-align:center;">' +
        stepBtn("add-qty-step", "step|1", "+", "больше") +
      '</div>' +
      (mpPack != null
        ? '<div style="display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;">' +
            stepBtn("add-qty-step", "pack|-1", "− упаковка", "минус " + fmtQty(mpPack, mp.unit)) +
            stepBtn("add-qty-step", "pack|1", "+ упаковка · " + esc(fmtQty(mpPack, mp.unit)), "плюс одна упаковка") +
          '</div>'
        : "") +
    '</div>';

  var inner =
    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">' +
      '<div style="grid-column:span 2;">' +
        '<label class="fld-lbl" for="f-add-name">Что купить</label>' +
        '<input class="fld" id="f-add-name" autocomplete="off" value="' + attr(a.name || "") + '" placeholder="начните вводить — подскажет из каталога"' +
          (sug.length ? ' style="border-radius:8px 8px 0 0;"' : "") + '>' +
        '<div id="add-name-sug">' + addNameHintHTML() + '</div>' +
      '</div>' +
      qtyField +
      unitField +
      '<div id="add-conv" style="grid-column:span 2; font-size:12px; color:var(--text-faint); margin-top:-4px;' +
        (convTxt ? '' : ' display:none;') + '">' + esc(convTxt) + '</div>' +
    '</div>';
  return modal("Добавить в список", "", inner, "add-save");
}

/* Единицы, в которых продукт можно положить в список: [значение, подпись].
