   База — единица продукта (г/мл/шт); «шт» — если известен вес штуки (piece_g);
   «уп» — если известна фасовка (pack_size). «уп» в списке не хранится:
   add-save переводит её в базовую единицу (2 уп × 1000 мл = 2000 мл), иначе
   позиции с разными единицами не суммировались бы между собой и с рецептами. */
function addUnitChoices(mp) {
  if (!mp) return [];
  var base = mp.unit || "г", out = [[base, base]];
  if (mp.piece_g) out.push(base === "шт" ? ["г", "г"] : ["шт", "шт"]);
  if (packOf(mp) != null) out.push(["уп", "уп."]);
  return out.length > 1 ? out : [];
}

/* Подсказки каталога под полем «Что купить» — до 6 штук, точное попадание
   подсказывать нечего. Отдельной функцией, потому что её результат нужен и
   разметке (радиус поля), и обработчику ввода. */
function addSugList() {
  var a = S.addItem;
  var q = normName(a && a.name || "");
  if (!q) return [];
  var sug = S.products.filter(function (p) {
    if (normName(p.name).indexOf(q) >= 0) return true;
    return (p.aliases || []).some(function (al) { return normName(al).indexOf(q) >= 0; });
  }).sort(function (x, y) {
    /* Совпадение с НАЧАЛА имени важнее совпадения в середине: «лук» должен
       давать «Лук репчатый» раньше, чем «Чеснок сушёный». */
    var xs = normName(x.name).indexOf(q) === 0, ys = normName(y.name).indexOf(q) === 0;
    if (xs !== ys) return xs ? -1 : 1;
    return (x.name || "").localeCompare(y.name || "", "ru");
  }).slice(0, 6);
  /* Набранное совпало с продуктом (именем или алиасом) целиком — выбор уже
     сделан, остальные варианты («Кокосовое молоко» на «молоко») только мешают.
     Захотят другой — продолжат печатать, и список вернётся. */
  var exact = S.products.some(function (p) {
    return normName(p.name) === q || (p.aliases || []).some(function (al) { return normName(al) === q; });
  });
  return exact ? [] : sug;
}

/* Список подсказок + строка состояния сопоставления одним узлом: обе части
   зависят ровно от того, что набрано, и меняются вместе. */
function addNameHintHTML() {
  var a = S.addItem;
  if (!a) return "";
  var sug = addSugList();
  var sugHtml = !sug.length ? "" :
    '<div style="border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; overflow:hidden; background:var(--bg-elev);">' +
    sug.map(function (p, i) {
      var pk = packOf(p);
      var side = pk != null ? "уп. " + fmtQty(pk, p.unit) : "";
      return '<div data-act="add-use" data-arg="' + attr(p.name) + '" class="sug-row" style="display:flex; align-items:baseline; gap:8px; padding:8px 12px; cursor:pointer; font-size:13.5px; border-top:1px solid var(--border);' +
        (i === S.addSugIdx ? " background:var(--c2-bg); font-weight:600;" : "") + '">' +
        '<span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(p.name) + '</span>' +
        (side ? '<span class="num" style="font-size:11px; color:var(--text-faint);">' + esc(side) + '</span>' : "") +
      '</div>';
    }).join("") + '</div>';

  /* Состояние сопоставления показывается ПРЯМО ПРИ ВВОДЕ — иначе «малако»
     молча заведёт отдельный продукт, и через полгода в каталоге будет три
     молока. Догадка предлагается, но не применяется сама. */
  var hint = '<div style="font-size:11px; color:var(--text-faint); margin-top:5px;">начните вводить — подскажет из каталога</div>';
  var nm = (a.name || "").trim();
  if (nm) {
    var mt = importMatch(nm);
    if (mt.how === "exact" || mt.how === "alias") {
      var p = productById(mt.id);
      hint = '<div style="font-size:11.5px; color:var(--success); margin-top:5px; font-weight:600;">✓ есть в каталоге: ' + esc(p.name) +
        (packOf(p) != null ? ' <span style="color:var(--text-faint); font-weight:400;">· уп. ' + esc(fmtQty(packOf(p), p.unit)) + '</span>' : "") + '</div>';
    } else if (mt.how === "guess") {
      var g = productById(mt.id);
      hint = '<div style="font-size:11.5px; color:var(--info); margin-top:5px;">Похоже на <b>' + esc(g.name) + '</b> — ' +
        '<span data-act="add-use" data-arg="' + attr(g.name) + '" style="cursor:pointer; text-decoration:underline; font-weight:600;">взять его</span>' +
        ' или оставить как есть, и я заведу новый продукт.</div>';
    } else {
      hint = '<div style="font-size:11.5px; color:var(--warn); margin-top:5px;">Такого в каталоге нет — <b>заведу новый продукт</b> «' + esc(nm) + '». Отдел допишете потом.</div>';
    }
  }
  return sugHtml + hint;
}

/* Продукт, с которым сопоставилось набранное имя (или ""). От него зависят поля
   «Единица» и шаги упаковки — их точечно не подменишь, там своя разметка. */
function addMatchSig() {
  var a = S.addItem, nm = a ? String(a.name || "").trim() : "";
  if (!nm) return "";
  var m = importMatch(nm);
  return (m.how === "exact" || m.how === "alias") ? String(m.id) : "";
}

/* Текст «≈ N г» под количеством — или пусто, если пересчитывать нечего. */
function addConvText() {
  var a = S.addItem;
  if (!a) return "";
  var mp = null, nm = String(a.name || "").trim();
  if (nm) { var m = importMatch(nm); if (m.how === "exact" || m.how === "alias") mp = productById(m.id); }
  var effUnit = a.unit || (mp ? (mp.unit || "") : "");
  var qn = String(a.qty || "").replace(",", ".");
  if (!mp || qn === "" || isNaN(parseFloat(qn))) return "";
  if (effUnit === "шт" && mp.piece_g) return "≈ " + trimNum(Math.round(parseFloat(qn) * mp.piece_g)) + " г";
  if (effUnit === "уп" && packOf(mp) != null) return "≈ " + fmtQty(Math.round(parseFloat(qn) * packOf(mp) * 100) / 100, mp.unit);
  return "";
}

/* Список каталога в модалке подбора — отдельно от неё: при вводе в поиск
   меняется только он (см. обработчик input). Раньше здесь перерисовывалась вся
   страница вместе с модалкой, а прокрутку внутри модалки приходилось
   восстанавливать руками. */
function ingLinkListHTML() {
  var L = S.ingLink;
  if (!L) return "";
  var q = normName(L.q || "");
  var list = S.products.filter(function (p) {
    if (!q) return true;
    if (normName(p.name).indexOf(q) >= 0) return true;
    return (p.aliases || []).some(function (a) { return normName(a).indexOf(q) >= 0; });
  }).slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ru"); });

  var rows = list.slice(0, 60).map(function (p) {
    return '<div class="sug-row" data-act="ing-link-pick" data-arg="' + attr(p.id) + '" style="display:flex; align-items:baseline; gap:9px; padding:9px 12px; cursor:pointer; font-size:13.5px; border-top:1px solid var(--border);">' +
      '<span style="flex:1; min-width:0;">' + esc(p.name) + '</span>' +
      '<span class="num" style="font-size:11px; color:var(--text-faint);">' + esc(deptLabel(p.category)) + '</span>' +
    '</div>';
  }).join("");

  return '<div style="border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; max-height:260px; overflow-y:auto;">' + rows +
      (list.length ? "" : '<div style="padding:12px; font-size:12.5px; color:var(--text-faint);">Ничего не нашлось — заведите продукт кнопкой ниже.</div>') +
    '</div>' +
    (list.length > 60 ? '<div style="font-size:11px; color:var(--text-faint); margin-top:6px;">Показаны первые 60 — уточните поиск.</div>' : "");
}

/* ═══════════════════ модалка «связать ингредиент» ════════════════════════ */
/* Ингредиент, приехавший из внешнего генератора рецептов, продукта в каталоге
   не знает. Чинить это в редакторе рецепта неудобно: там ингредиент можно
   только удалить и добавить заново из каталога, потеряв количество и меру.
   Здесь — подбор на месте: догадка, поиск и «завести продукт» с возвратом. */
function ingLinkModal() {
  var L = S.ingLink, r = recipeById(L.id);
  if (!r) return "";
  var g = (r.ingredients || [])[L.i];
  if (!g) return "";
  var raw = String(g.name || g.raw || "").trim();

  var guessHtml = "";
  var mt = importMatch(raw);
  if (mt.id) {
    var gp = productById(mt.id);
    var how = mt.how === "guess" ? "Похоже на" : "Точное совпадение";
    guessHtml = '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--c2-bg); border-radius:8px; padding:11px 13px; margin-bottom:14px;">' +
      '<span style="font-size:12.5px; color:var(--text-muted);">' + esc(how) + ':</span>' +
      '<span style="font-size:14px; font-weight:600;">' + esc(gp.name) + '</span>' +
      '<button class="ui-btn sm" data-act="ing-link-pick" data-arg="' + attr(gp.id) + '" style="margin-left:auto;">Связать</button>' +
    '</div>';
  }

  var inner =
    '<div style="font-size:12.5px; color:var(--text-muted); margin-bottom:12px;">В рецепте записано: <b style="color:var(--text);">' + esc(raw) + '</b>' +
      (g.qty != null ? ' · ' + esc(fmtQty(g.qty, g.unit)) : ' · по вкусу') + '</div>' +
    guessHtml +
    '<div style="position:relative; margin-bottom:2px;">' +
      '<span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:13px; pointer-events:none;">⌕</span>' +
      '<input class="fld" id="f-ing-link-q" autocomplete="off" value="' + attr(L.q || "") + '" placeholder="найти продукт в каталоге" style="padding-left:32px; padding-right:40px;">' + uiSearchX("f-ing-link-q") +
    '</div>' +
    '<div id="ing-link-list">' + ingLinkListHTML() + '</div>';

  return uiModalHTML({ title: "Связать ингредиент", sub: r.title, close: "close-modal", body: inner,
    foot: '<button class="ui-btn ghost" data-act="ing-link-new"><span style="font-weight:700;">+</span> Завести продукт</button>' +
      '<span class="ui-modal-sp"></span><button class="ui-btn plain" data-act="close-modal">Отмена</button>' });
}

/* Связывание: ингредиент получает product_id, а его исходное написание уходит
   в алиасы продукта — тогда следующий рецепт с «жёлтым луком» сопоставится сам
   (то же делает подтверждение в импорте). Алиас, уже занятый другим продуктом,
   НЕ добавляем: неоднозначный алиас ломает сопоставление молча. */
function linkIngredient(recipeId, idx, productId) {
  var r = recipeById(recipeId), p = productById(productId);
  if (!r || !p) return;
  var g = (r.ingredients || [])[idx];
  if (!g) return;
  g.product_id = p.id;
  /* Единица ингредиента должна жить в той же семье, что и у продукта, иначе
     количество не просуммируется в списке и не посчитается в КБЖУ. Пустую
     единицу дозаполняем продуктовой; расходящуюся не трогаем — это может быть
     осознанное «250 г при штучном продукте». */
  if (!g.unit && g.qty != null) g.unit = p.unit || null;

  /* Пишем написание как есть (в нижнем регистре), а сверяем по normName —
     ровно как делает подтверждение в импорте. Иначе в «других названиях»
     копились бы обеззапятенные огрызки. */
  var raw = String(g.name || "").trim();
  var key = normName(raw);
  var taken = !key || S.products.some(function (o) {
    if (normName(o.name) === key) return true;
    return (o.aliases || []).some(function (a) { return normName(a) === key; });
  });
  if (!taken) p.aliases = (p.aliases || []).concat([raw.toLowerCase()]);

  /* Связывание меняет ДВА файла, и об этом надо сказать: правка каталога —
     побочный эффект нажатия «связать», человек её не заказывал. */
  var note = function () {
    S.saveInfo = "Ингредиент связан с «" + p.name + "»." +
      (taken ? "" : " Написание «" + raw + "» добавлено в другие названия продукта.");
  };
  S.ingLink = null;
  if (!taken) saveProducts(function () { saveRecipe(recipeId, note); });
  else saveRecipe(recipeId, note);
}

/* ═══════════════════════ сборка страницы ═════════════════════════════════ */
function screenBody() {
  if (S.screen === "products") return productsScreen();
  if (S.screen === "shopping") return shoppingScreen();
  if (S.screen === "recipes") return recipesScreen();
  if (S.screen === "read") return readScreen();
  if (S.screen === "cook") return cookScreen();
  if (S.screen === "print") return printScreen();
  if (S.screen === "edit") return editScreen();
  // остальные экраны — следующими стадиями
  return '<section class="screen sc-' + esc(S.screen) + '" style="display:block;">' +
    '<div style="text-align:center; color:var(--text-faint); font-size:13px; padding:60px 0;">Экран в работе.</div></section>';
}

/* ── Точечное обновление вместо render() ───────────────────────────────────
   Полная перерисовка (root.innerHTML) на КАЖДУЮ букву в поиске — это заново
   собранный документ целиком: шапка, рельс, слой бумаги, все карточки; затем
   восстановление оконной прокрутки и возврат фокуса с кареткой руками. На
   телефоне это видно как мигание и рывок под пальцем — жалоба владельца
   2026-08-09: «когда набираю в строке поиска, экран мигает, будто
   перерисовывается».

   От буквы в поиске меняется РОВНО ОДИН узел — список результатов. Его и
   переписываем. Инпут при этом не пересоздаётся, поэтому фокус, каретка,
   выделение и клавиатура на телефоне остаются на месте САМИ: трюк
   focusId/focusPos для этих полей больше не нужен (он и был лечением симптома).

   Возвращает false, если узла в документе нет (ушли с экрана, закрыли модалку) —
   вызывающий тогда откатывается на полный render(). */
function patchHTML(id, html) {
  var el = document.getElementById(id);
  if (!el) return false;
  el.innerHTML = html;
  return true;
}

function render() {
  var root = document.getElementById("app");
  var body;
  /* Полная перерисовка (innerHTML) сбрасывает прокрутку в начало. На длинном
     экране редактора это швыряло к верху при каждом «+ добавить шаг/строку».
     Запоминаем позицию и возвращаем её — КРОМЕ смены экрана, где верх и нужен. */
  var scrollY = window.scrollY || window.pageYOffset || 0;
  var screenChanged = S._lastScreen !== S.screen;
  /* Снимок рабочей копии редактора при открытии: по нему слой страницы понимает,
     есть ли несохранённые правки (меню при открытом редакторе спрашивает). */
  if (S.screen === "edit" && S.edit) { if (S._editKey !== S.edit) { S._editKey = S.edit; try { S._editSnap = JSON.stringify(S.edit); } catch (e) { S._editSnap = null; } } }
  else S._editKey = null;

  if (S.loading) {
    body = '<div style="text-align:center; color:var(--text-faint); font-size:13px; padding:80px 0;">Загружаю…</div>';
  } else if (S.error) {
    body = '<div style="max-width:560px; margin:60px auto; padding:18px 20px; background:var(--err-bg); border:1px solid var(--err); border-radius:var(--radius); font-size:13.5px;">' + esc(S.error) + '</div>';
  } else {
    body = apiBanner() + brokenNote() + readOnlyNote() + screenBody();
  }

  /* Плашка различает ошибку и уведомление: «продукт заведён» — это хорошая
     новость, и рисовать её красной рамкой значит пугать на ровном месте. */
  /* плашка сохранения — общая ui-kit (uiSaveBarHTML): «Сохраняю…», ошибка,
     сообщение; радиус обычный — длинный текст переносится, не раздувая пилюлю */
  var savebar = S.saving ? uiSaveBarHTML({ text: "Сохраняю…", kind: "busy" })
    : (S.saveNote || S.saveInfo) ? uiSaveBarHTML({ text: S.saveNote || S.saveInfo, kind: S.saveNote ? "err" : "ok", dismiss: "dismiss-note" })
    : "";

  /* Пара «что рисуем + чем это назвать» идёт одной цепочкой намеренно: ключ
     нужен ниже, чтобы вернуть прокрутку ВНУТРИ модалки, и две параллельные
     цепочки рано или поздно разошлись бы. */
  var ov = S.resume ? { k: "resume", html: resumeOverlay() }
    : S.import_ ? { k: "import", html: importModal() }
    : S.prodEdit ? { k: "prodEdit", html: prodModal() }
    : S.prodCard ? { k: "prodCard", html: prodCardModal() }
    : S.ingLink ? { k: "ingLink", html: ingLinkModal() }
    : S.addItem ? { k: "addItem", html: addModal() }
    : S.plan ? { k: "plan", html: planModal() }
    : S.sheet ? { k: "sheet", html: cookSheet() }
    : { k: "", html: "" };
  /* Окна стопкой (ui-kit 1.36.0): форма продукта открывается ПОВЕРХ карточки
     («Править») или подбора («Завести продукт»), а не вместо них — «Отмена»
     возвращает туда, откуда пришли. Нижнее окно рисуется первым (тот же слой
     210, верхнее — позже в разметке). */
  var under = ov.k === "prodEdit" && S.prodCard ? { k: "prodCard", html: prodCardModal() }
    : ov.k === "prodEdit" && S.ingLink ? { k: "ingLink", html: ingLinkModal() } : null;
  var layers = (under ? [under] : []).concat(ov.html ? [ov] : []);
  var keys = layers.map(function (l) { return l.k; }), last = S._lastLayers || [];
  /* только что открытое окно — верхнее из тех, что сменились: оно плавно
     въезжает (одиночное — тоже), нижнее плавно уходит назад; перерисовка
     с теми же окнами анимацию не повторяет */
  var fresh = null;
  keys.forEach(function (k, i) { if (k !== last[i]) fresh = i; });
  var overlay = layers.map(function (l, i) {
    return l.html.replace(/^<div class="ui-modal/, '<div class="ui-modal ' + uiStackCls(i, layers.length, fresh));
  }).join("");

  /* Модалка прокручивается ВНУТРИ себя (.modal{overflow-y:auto}), и innerHTML
     обнуляет эту прокрутку ровно так же, как оконную — а её возвращают строчкой
     ниже, про внутреннюю же забыли. Живой случай (2026-08-02): в «Запланировать»
     снимаешь галочку с ингредиента в конце списка — список прыгает к началу, и
     до следующего ингредиента надо прокручивать заново. То же было бы в режиме
     готовки на отметке шага. Возвращаем позицию, только если модалка ТА ЖЕ:
     при открытии другой верх и нужен. Окон стопкой может быть два — каждое
     со своей прокруткой, по месту в стопке. */
  var modalTop = [].map.call(document.querySelectorAll(".ui-modal-body, .modal"),   // тело окна (ui-kit)
    function (b, i) { return keys[i] === last[i] ? b.scrollTop : 0; });

  root.innerHTML =
    /* 100dvh, а не 100vh: на телефоне адресная строка схлопывается, и высота
       в vh остаётся от «большого» видового окна — страница оказывается выше
       экрана на высоту панели. dvh считает по фактическому окну. Обе строки
       нужны: vh — откат для движков без dvh. */
    '<div data-theme="' + attr(S.theme) + '" data-screen="' + attr(S.screen) + '" data-dept="' + attr(S.deptFilter) + '" data-mode="' + attr(S.groupMode) + '" style="min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--text);">' +
    /* Фактура бумаги — отдельным НЕПОДВИЖНЫМ слоем, а не фоном обёртки.
       Было `background-attachment:fixed` на прокручиваемом элементе: три
       слоя (два радиальных градиента + штриховка с шагом 1px) браузер
       перерисовывал на КАЖДОМ кадре прокрутки — отсюда рывки на длинном
       списке рецептов, которых не было на других страницах (там такого
       фона нет вовсе). Позиционированный слой растеризуется один раз и
       дальше только композитится, вид при этом тот же. */
    '<div class="paper-bg no-print" aria-hidden="true"></div>' +
      topBar() +
      '<div class="shell ui-shell">' + (S.loading || S.error ? "" : navRail()) +
        '<div style="min-width:0;">' + body + pageFooter() + '</div></div>' +
    '</div>' + overlay + savebar;

  document.documentElement.setAttribute("data-theme", S.theme);
  mountMobileNav();
  S._lastScreen = S.screen;
  [].forEach.call(document.querySelectorAll(".ui-modal-body, .modal"), function (b, i) {
    if (modalTop[i]) b.scrollTop = modalTop[i];
  });
  S._lastLayers = keys;

  /* Пока открыта модалка, фон скроллиться не должен: иначе «прокрутка» внутри
     модалки на телефоне утаскивает страницу под ней, и человек теряет место. */
  document.body.style.overflow = overlay ? "hidden" : "";

  /* Смена экрана → к верху; всё остальное (правка, +строка, отметка) → на
     прежнем месте. Модалка открывается overlay'ем без смены экрана, и там
     сохранение позиции фона — правильное поведение.

     Смена фильтра или группировки — тоже к верху (_toTop). Список после неё
     переупорядочен целиком, и прежнее смещение ведёт в случайное место: с
     «по типу» на «по алфавиту» человек оказывался в середине чужого списка.
     Заодно исчезает главный триггер сбоя перерисовки на iOS — восстановление
     прокрутки в разметку другой высоты. */
  if ((screenChanged || S._toTop) && !overlay) uiScrollTop();
  else window.scrollTo(0, scrollY);
  S._toTop = false;

  /* Полная перерисовка теряет фокус и каретку — возвращаем их руками, иначе
     поиск по каталогу «выплёвывает» после каждой буквы.

     ОДНОРАЗОВО: сбрасываем focusId после восстановления. Иначе он «залипал» —
     напечатал в поиске ингредиентов, потом нажал «+» порций, и курсор
     прыгал обратно в поиск (баг 2026-07-21). Каждый ввод сам ставит focusId
     заново перед своей перерисовкой. */
  if (S.focusId) {
    var el = document.getElementById(S.focusId);
    if (el) {
      el.focus();
      if (el.setSelectionRange && S.focusPos != null) {
        try { el.setSelectionRange(S.focusPos, S.focusPos); } catch (e) {}
      }
    }
    S.focusId = null; S.focusPos = null;
  }
}

/* ═══════════════════════ действия ════════════════════════════════════════ */
var ACTS = {
  /* Поиск сбрасывается при уходе с экрана: возвращаясь, человек ждёт полный
     список, а не хвост прошлого запроса — и молча получал бы «ничего не
     нашлось» на пустом месте. */
  /* Подъём наверх по пункту меню (в том числе текущему) делает ui-kit. */
  nav: function (id) { set({ screen: id, recipeQuery: "", productQuery: "" }); },
  /* _toTop — список после смены фильтра/группировки другой, старое смещение
     прокрутки в нём ничего не значит (см. render). */
  dept: function (id) { set({ deptFilter: id, _toTop: true }); },
  "rec-cat": function (id) { set({ recipeCatFilter: id, _toTop: true }); },
  group: function (id) { set({ groupMode: id, _toTop: true }); },
  refresh: function () {
    /* Полная перезагрузка, а не только данные. loadAll() обновлял JSON, но НЕ
       саму страницу — после деплоя новый food.html не подхватывался, и
       приходилось жать Cmd+R руками. Caddy отдаёт *.html с Cache-Control:
       no-cache, поэтому reload ревалидирует HTML и берёт свежую версию.
       Новый food-cb гонит фетчи данных мимо HTTP-кеша (как на хабе). */
    S.refreshing = true; render();
    try { localStorage.setItem("food-cb", String(Date.now())); } catch (e) {}
    setTimeout(function () { try { location.reload(); } catch (e) { S.refreshing = false; render(); } }, 300);
  },
  "dismiss-note": function () { set({ saveNote: null, saveInfo: null }); },
  noop: function () {},
  /* ✕, затемнение, «Отмена», Escape — закрывают ВЕРХНЕЕ окно: оно плавно
     уходит (ui-kit uiStackPop), окно под ним возвращается на место. */
  "close-modal": function () {
    var ms = document.querySelectorAll(".ui-modal");
    uiStackPop(ms, ms.length - 1, function () {
      if (S.prodEdit && (S.prodCard || S.ingLink)) return set({ prodEdit: null, prodReturn: null });
      set({ prodEdit: null, prodCard: null, prodReturn: null, addItem: null, plan: null, import_: null, ingLink: null });
    });
  },

  /* Удаление рецепта: кнопка только открывает подтверждение (uiConfirm),
     стирает — «Удалить» в нём (recipeDeleteConfirmed).
     edCollect() до показа окна обязателен: человек мог что-то дописать и нажать
     «Удалить» по ошибке — «Отмена» должна вернуть его к тому же тексту. */
  "ed-delete": function () {
    if (!S.edit || !S.edit.id || !S.writable || !S.canDelete) return;
    edCollect();
    var d = { id: S.edit.id, title: (S.edit.name || "").trim() };
    confirmRecipeDelete(d).then(function (ok) { if (ok) recipeDeleteConfirmed(d); });
  },

  /* Подбор продукта для ингредиента, приехавшего без связи с каталогом. */
  "ing-link": function (i) {
    if (!S.writable || !S.openRecipe) return;
    set({ ingLink: { id: S.openRecipe, i: +i, q: "" } });
  },
  "ing-link-pick": function (pid) {
    if (!S.ingLink) return;
    linkIngredient(S.ingLink.id, S.ingLink.i, pid);
  },
  /* «Завести продукт» из подбора: открываем обычную карточку продукта с
     подставленным названием поверх подбора (окна стопкой: «Отмена» вернёт
     к подбору) и запоминаем, к какому ингредиенту вернуться — иначе человек
     заведёт продукт и снова окажется перед несвязанной строкой, не поняв,
     что связывать надо отдельно. Сохранение связывает и закрывает оба окна
     (linkIngredient снимает ingLink). */
  "ing-link-new": function () {
    var L = S.ingLink;
    if (!L) return;
    var r = recipeById(L.id), g = r && (r.ingredients || [])[L.i];
    set({ prodEdit: { id: null, name: g ? String(g.name || "").trim() : "", aliases: [],
                      category: "", unit: g && g.unit ? g.unit : null, pack_size: null, staple: false,
                      shelf_note: "", cooked_ratio: null, piece_g: null,
                      nutrition_100g: null, note: "" },
          prodReturn: { link: { id: L.id, i: L.i } } });
  },
  "item-del": function (id) {
    var it = S.shopping.filter(function (i) { return i.id === id; })[0];
    if (!it) return;
    var from = it.from || [];
    var go = function () {
      S.shopping = S.shopping.filter(function (i) { return i.id !== id; });
      saveShopping();
    };
    /* удаление — всегда с подтверждением (решение владельца 2026-11-10); строка из рецептов — с пояснением */
    if (!from.length) return uiConfirm({ title: "Убрать из списка?", name: it.name, ok: "Убрать" }).then(function (ok) { if (ok) go(); });
    uiConfirm({ title: "Убрать из списка?", name: it.name, ok: "Убрать",
      text: "Набежало из " + from.length + " " + plural(from.length, "рецепта", "рецептов", "рецептов") +
        ". Рецепты останутся, но количество придётся планировать заново." })
      .then(function (ok) { if (ok) go(); });
  },
  /* Раскрытие «откуда набежало» меняет одну строку списка — перерисовываем
     список, а не документ. В магазине это делают на ходу, и вспышка всей
     страницы там особенно неприятна. */
  expand: function (id) {
    S.expanded = S.expanded === id ? null : id;
    if (!patchHTML("shop-list", shopListHTML())) render();
  },

  /* Отметка «куплено» — самое частое действие, и оно должно быть мгновенным:
     меняем состояние сразу, сохраняем следом. Откат при ошибке не делаем,
     показываем плашку с предложением обновиться (как в health.html). */
  /* Отметка «куплено» НЕ перерисовывает страницу. Две причины, и вторая
     важнее первой:
       1. перерисовка дёргает всю разметку, включая боковой рельс;
       2. строка при этом уезжала из списка в свёрнутый блок «куплено» —
          то есть список менялся под пальцем посреди магазина. Это худшее,
          что может сделать такой инструмент: следующая строка подпрыгивает
          на место нажатой, и следом отмечается не то.
     Теперь строка остаётся на месте, гасится и зачёркивается, а в блок
     «куплено» уходит при следующей полной отрисовке (смена вкладки,
     «Обновить», «убрать купленное»). */
  bought: function (id) {
    if (!S.writable) return;
    var now = null;
    S.shopping = S.shopping.map(function (i) {
      if (i.id !== id) return i;
      now = !i.bought;
      return Object.assign({}, i, { bought: now });
    });
    paintBought(id, now);
    saveShopping(null, true);
  },

  "qty-edit": function (id) { set({ qtyEdit: id, focusId: "f-qty" }); },
  /* Шаг ± прямо в поле, БЕЗ render(): значение живёт в инпуте до «OK», и
     перерисовка на каждый тап потеряла бы и фокус, и несохранённый ввод. */
  "qty-step": function (arg) {
    var parts = String(arg || "").split("|");
    var id = parts[0], kind = parts[1], dir = parseInt(parts[2], 10) || 0;
    var el = document.getElementById("f-qty");
    var it = S.shopping.filter(function (i) { return i.id === id; })[0];
    if (!el || !it || !dir) return;
    var r = stepQtyValue(el.value, it.unit, packOf(prodOf(it)), kind, dir);
    if (r != null) el.value = fmtQty(r.v, r.u) || trimNum(r.v);
  },
  "qty-save": function (id) {
    var el = document.getElementById("f-qty");
    if (!el) return;
    /* Разбираем «1,5 кг» / «500 г» / «2 шт» той же логикой, что показываем:
       если единица совпала с кг/л — приводим обратно в г/мл, потому что
       ХРАНИМ всегда в базовых. */
    var m = String(el.value).trim().replace(",", ".").match(/^([\d.]+)\s*(\S+)?$/);
    if (!m) { set({ qtyEdit: null }); return; }
    var v = parseFloat(m[1]), u = (m[2] || "").toLowerCase();
    if (isNaN(v)) { set({ qtyEdit: null }); return; }
    if (u === "кг") { v *= 1000; u = "г"; }
    else if (u === "л") { v *= 1000; u = "мл"; }
    var arr = S.shopping.map(function (i) {
      if (i.id !== id) return i;
      /* Правка руками кладётся в extra поверх рецептурного qty: так снятие
         рецепта с плана пересчитает свою часть и не затрёт добавленное. */
      var base = i.qty || 0;
      return Object.assign({}, i, { extra: Math.round((v - base) * 100) / 100, unit: u || i.unit });
    });
    S.shopping = arr; S.qtyEdit = null;
    saveShopping();
  },

  "plan-open": function (id) {
    var r = recipeById(id); if (!r) return;
    var port = S.portions[id] || r.servings;
    set({ plan: { recipeId: id, portions: port, rows: planRows(r, port) } });
  },
  "plan-portions": function (dir) {
    var p = S.plan, r = recipeById(p.recipeId);
    var next = p.portions + (dir === "+" ? 1 : -1);
    if (next < 1) return;
    /* Пересчёт порций пересобирает количества, но СОХРАНЯЕТ снятые галочки:
       «этого у меня нет» — решение человека, оно не про число порций. */
    var fresh = planRows(r, next);
    fresh.forEach(function (x, i) { if (p.rows[i]) x.checked = p.rows[i].checked; });
    p.portions = next; p.rows = fresh;
    if (!patchPlan()) render();
  },
  "plan-check": function (i) {
    var x = S.plan.rows[+i]; if (!x) return;
    x.checked = !x.checked;
    if (!patchPlan()) render();
  },
  "plan-home-toggle": function () { S.planHomeOpen = !S.planHomeOpen; if (!patchPlan()) render(); },
  "plan-swap": function (i) { S.planSwap = +i; if (!patchPlan()) render(); },
  "plan-swap-clear": function (i) {
    var x = S.plan.rows[+i]; if (!x) return;
    x.product_id = x.orig_product_id;
    x.name = x.orig_name;
    x.swapped = false;
    if (!patchPlan()) render();
  },
  /* Шаг правки количества — 10% от исходного, но не меньше единицы измерения:
     фиксированный шаг был бы бессмысленным и для 15 г специй, и для 1 кг фарша.
     ШТУКИ — исключение, шаг всегда 1 (как во втором степпере, в строке списка).
     Относительные 10% на штуках ломались о roundQty: на 15 шт шаг становился
     двойкой (roundQty(1.5) → 2), и с 15 набор шёл 17 → 19 → 21 — чётные числа
     выше пятнадцати не набирались ВООБЩЕ. «Нужно 20 яиц» упиралось в 19 и в
     обе стороны (вниз с 19 шаг тоже 2); случай владельца 2026-08-15. Штука —
     целый предмет: перепрыгивать её нельзя, доли ниже единицы (0,5 от пересчёта
     порций) шагаем половинками. Сравнение через normUnit, а не с «шт»
     буквально: «шт.» с точкой уезжало в весовую ветку и шагало по 5. */
  "plan-amt": function (arg) {
    var parts = String(arg).split(":"), x = S.plan.rows[+parts[0]];
    if (!x || x.qty == null) return;
    var piece = (normUnit(x.unit) || "").toLowerCase() === "шт";
    var step = piece
      ? (x.qty < 1 ? 0.5 : 1)
      : Math.max(5, roundQty(x.qty * 0.1, x.unit));
    var v = x.qty + (parts[1] === "+" ? step : -step);
    x.qty = Math.max(0, roundQty(v, x.unit));
    /* Правка руками отменяет подпись «из N готовой»: она объясняла ИСХОДНЫЙ
       пересчёт, а после ± уже не соответствует числу в строке. */
    x.edited = true;
    if (x.qty === 0) x.checked = false;   // обнулили — значит не нужно
    if (!patchPlan()) render();
  },
  "plan-apply": function () {
    var p = S.plan, r = recipeById(p.recipeId);
    if (!r) return;
    var items = S.shopping.slice(), stamp = Date.now(), n = 0;
    p.rows.forEach(function (x, i) {
      if (x.taste || !x.checked || !x.qty) return;
      var entry = { recipe_id: r.id, title: r.title, qty: x.qty };
      var hit = findShopMatch(x);
      if (hit) {
        /* Повторное планирование того же рецепта ЗАМЕНЯЕТ его прежний вклад,
           а не добавляет второй раз — иначе двойное нажатие удваивало бы
           закупку, и заметить это можно было бы только у кассы. */
        var from = (hit.from || []).filter(function (f) { return f.recipe_id !== r.id; }).concat([entry]);
        var idx = items.indexOf(hit);
        items[idx] = Object.assign({}, hit, {
          from: from,
          qty: from.reduce(function (s, f) { return s + (f.qty || 0); }, 0)
        });
      } else {
        items.push({
          id: "i" + stamp + "_" + i, product_id: x.product_id, name: x.name,
          qty: x.qty, unit: x.unit || null, extra: 0, bought: false,
          from: [entry], added: todayISO(), note: ""
        });
      }
      n++;
    });
    S.shopping = items; S.plan = null;
    if (!n) { set({ saveNote: "Ничего не выбрано — список не изменился." }); return; }
    saveShopping(function () { S.screen = "shopping"; });
  },

  /* Снять рецепт с плана: его вклад уходит, чужой и добавленный руками —
     остаётся. Уже купленную строку не трогаем ни при каких условиях: список,
     меняющийся под человеком посреди магазина, — худшее, что может быть. */
  unplan: function (arg) {
    var parts = String(arg).split("|"), itemId = parts[0], recId = parts[1];
    var row = S.shopping.filter(function (i) { return i.id === itemId; })[0];
    var src = row && (row.from || []).filter(function (f) { return f.recipe_id === recId; })[0];
    uiConfirm({ title: "Снять вклад рецепта?", name: (row ? row.name : "") + (src && src.title ? " — " + src.title : ""),
                text: "Количество этого рецепта уйдёт из строки списка; если строка держалась только им, она исчезнет.", ok: "Снять" })
      .then(function (ok) {
        if (!ok) return;
        var items = [];
        S.shopping.forEach(function (it) {
          if (it.id !== itemId || it.bought) { items.push(it); return; }
          var from = (it.from || []).filter(function (f) { return f.recipe_id !== recId; });
          var qty = from.reduce(function (s, f) { return s + (f.qty || 0); }, 0);
          if (!from.length && !it.extra) return;      // строка держалась только этим рецептом
          items.push(Object.assign({}, it, { from: from, qty: qty }));
        });
        S.shopping = items;
        saveShopping();
      });
  },

  /* ── редактор рецепта ── */
  /* Перед любой перерисовкой снимаем ВСЕ поля формы в S.edit — редактор
     пересобирается целиком, и несохранённый ввод иначе пропал бы. Одна
     функция и на промежуточные действия (добавить шаг), и на сохранение. */
  "new-recipe": function () { set({ edit: editFromRecipe(null), edCatQuery: "", screen: "edit" }); },
  "edit-recipe": function (id) {
    var r = recipeById(id);
    if (!r) return;
    set({ edit: editFromRecipe(r), edCatQuery: "", openRecipe: id, screen: "edit" });
  },
  "ed-cancel": function () {
    var e = S.edit;
    set({ edit: null, edCatQuery: "", screen: e && e.id ? "read" : "recipes" });
  },
  /* Кнопки редактора правят СВОЙ узел, а не пересобирают документ. edCollect()
     остаётся обязательным: недописанные поля живут только в DOM, и пересборка
     любого куска формы их потеряет. render() — откат, если узла нет. */
  "ed-diff-dec": function () { edCollect(); S.edit.difficulty = Math.max(1, S.edit.difficulty - 1); if (!patchHTML("ed-diff", edPipsHTML())) render(); },
  "ed-diff-inc": function () { edCollect(); S.edit.difficulty = Math.min(5, S.edit.difficulty + 1); if (!patchHTML("ed-diff", edPipsHTML())) render(); },
  /* Ноль достижим и означает «снять оценку» — иначе поставленную по ошибке
     звезду нельзя было бы убрать вовсе. */
  "ed-rating-dec": function () { edCollect(); S.edit.rating = Math.max(0, (S.edit.rating || 0) - 1); if (!patchHTML("ed-rating", edRatingHTML())) render(); },
  "ed-rating-inc": function () { edCollect(); S.edit.rating = Math.min(RATING_MAX, (S.edit.rating || 0) + 1); if (!patchHTML("ed-rating", edRatingHTML())) render(); },
  /* Оценка одним тапом с экрана рецепта. Повторный тап по текущей звезде
     снимает оценку: иначе поставленную по ошибке единицу пришлось бы убирать
     через редактор — то есть ровно тем путём, от которого мы и уходим.
     Ноль в файл не пишем, поле удаляем: «не оценено» — это ОТСУТСТВИЕ поля,
     а `rating: 0` валидатор сайдкара и не примет. */
  "set-rating": function (arg) {
    if (!S.writable) return;
    var p = String(arg || "").split("|"), r = recipeById(p[0]), v = +p[1];
    if (!r || !(v >= 1 && v <= RATING_MAX)) return;
    if (r.rating === v) delete r.rating; else r.rating = v;
    /* Меняется одна строка — её и переписываем; сохраняем «тихо», без
       перерисовки экрана. Полный render() здесь давал вспышку всей страницы
       на каждый тап по звезде (жалоба владельца 2026-08-09), причём дважды:
       на старте сохранения и по ответу сервера. */
    if (!patchHTML("rating-row", ratingRowHTML(r))) render();
    saveRecipe(r.id, null, true);
  },
  /* Повторный тап по выбранному типу снимает выбор — как у отдела продукта
     (prod-dept). Поле остаётся редактируемым текстом: чип — не единственный
     способ его заполнить. */
  "ed-cat": function (v) {
    edCollect();
    S.edit.category = ((S.edit.category || "").trim().toLowerCase() === v.toLowerCase()) ? "" : v;
    // Чип и поле — одно и то же значение в двух местах: правим оба, иначе
    // поле осталось бы со старым текстом и перетёрло бы выбор при сохранении.
    var f = document.getElementById("f-ed-category");
    if (f) f.value = S.edit.category;
    if (!f || !patchHTML("ed-cat-chips", edCatChipsHTML())) render();
  },
  "ed-portion-dec": function () { edCollect(); S.edit.portions = Math.max(1, S.edit.portions - 1); edPortionsOut(); },
  "ed-portion-inc": function () { edCollect(); S.edit.portions = S.edit.portions + 1; edPortionsOut(); },
  /* «КБЖУ известен» вкл → раскрываем 4 поля (пустые); выкл → прячем и забываем
     введённое. edCollect ПЕРЕД переключением, иначе недописанные шаги/имя
     обнулятся при перерисовке. */
  "ed-nu-toggle": function () {
    edCollect();
    S.edit.nutrition = S.edit.nutrition ? null
      : { kcal: null, protein_g: null, fat_g: null, carb_g: null };
    if (!patchHTML("ed-nu", edNuHTML())) render();
  },
  "ed-ing-add": function (pid) {
    edCollect();
    var p = productById(pid); if (!p) return;
    S.edit.ings = S.edit.ings.concat([{ name: p.name, product_id: p.id, amount: "", measure: "", state: null }]);
    edIngsOut();
  },
  "ed-ing-del": function (i) { edCollect(); S.edit.ings.splice(+i, 1); edIngsOut(); },
  "ed-step-add": function () {
    edCollect();
    S.edit.steps = S.edit.steps.concat([{ name: "", dur: "", text: "" }]);
    if (!patchHTML("ed-steps", edStepsHTML())) render();
  },
  "ed-step-del": function (i) { edCollect(); S.edit.steps.splice(+i, 1); if (!patchHTML("ed-steps", edStepsHTML())) render(); },
  "ed-line-add": function (key) {
    edCollect();
    S.edit.groups[key] = (S.edit.groups[key] || []).concat([""]);
    if (!patchHTML("ed-g-" + key, edGroupRowsHTML(key))) render();
  },
  "ed-line-del": function (arg) {
    edCollect();
    var parts = String(arg).split(":"), key = parts[0], i = +parts[1];
    S.edit.groups[key].splice(i, 1);
    if (!patchHTML("ed-g-" + key, edGroupRowsHTML(key))) render();
  },
  "ed-save": function () {
    edCollect();
    var e = S.edit;
    if (!(e.name || "").trim()) { set({ saveNote: "Название рецепта обязательно." }); return; }
    // id: у нового — из названия, уникальный; у существующего — прежний
    var id = e.id;
    if (!id) {
      id = translitId(e.name); var taken = {};
      S.recipes.forEach(function (x) { taken[x.id] = 1; });
      if (taken[id] || !id) { var base = id || "recipe", k = taken[base] ? 2 : 1; id = base; while (taken[id]) { id = base + "-" + k; k++; } }
      e.id = id;
    }
    var doc = editToRecipe(e);
    doc.id = id;
    // мержим в список рецептов: замена по id или добавление
    var found = false;
    S.recipes = S.recipes.map(function (x) {
      if (x.id === id) { found = true; return doc; } return x;
    });
    if (!found) S.recipes = S.recipes.concat([doc]);
    S.edit = null; S.openRecipe = id;
    saveRecipe(id, function () { S.screen = "read"; });
  },
  "import-open": function () { set({ import_: { text: "", parsed: null, match: [] } }); },
  "import-back": function () {
    S.import_.parsed = null; S.import_.match = []; render();
  },
  "import-parse": function () {
    var el = document.getElementById("f-import");
    var text = el ? el.value : "";
    var parsed = parseRecipeMd(text);
    S.import_.text = text;
    S.import_.parsed = parsed;
    S.import_.match = parsed.ingredients.map(function (g) { return importMatch(g.name); });
    render();
  },
  "import-save": function () {
    var parsed = S.import_.parsed;
    if (!parsed.title) { set({ saveNote: "Без названия сохранить нельзя." }); return; }
    if (!parsed.servings) { set({ saveNote: "Укажите число порций — на него делится пересчёт." }); return; }

    /* Подтверждённое сопоставление уходит в алиасы: это ЕДИНСТВЕННЫЙ механизм,
       который не даёт каталогу загнить. После полусотни рецептов таблица
       сходится к реальному словарю двух человек, включая формулировки
       Perplexity. Глобальный словарь синонимов не ведём — его надо
       поддерживать, и он никогда не покрывает случай перед глазами. */
    var prods = S.products.map(function (p) { return Object.assign({}, p, { aliases: (p.aliases || []).slice() }); });
    var learned = 0;
    var ings = parsed.ingredients.map(function (g, i) {
      var sel = document.getElementById("f-map-" + i);
      var pid = sel ? sel.value : ((S.import_.match[i] || {}).id || "");
      if (pid) {
        var p = prods.filter(function (x) { return x.id === pid; })[0];
        var key = normName(g.name);
        if (p && normName(p.name) !== key && p.aliases.map(normName).indexOf(key) < 0) {
          p.aliases.push(g.name.toLowerCase());
          learned++;
        }
      }
      return { name: g.name, raw: g.raw, product_id: pid || null,
               qty: g.qty, unit: g.unit, state: g.state || undefined };
    });

    var id = translitId(parsed.title);
    var taken = {}; S.recipes.forEach(function (r) { taken[r.id] = 1; });
    if (taken[id]) { var k = 2; while (taken[id + "-" + k]) k++; id = id + "-" + k; }

    S.recipes = S.recipes.concat([{
      id: id, title: parsed.title, cuisine: parsed.cuisine, servings: parsed.servings,
      servings_note: parsed.servings_note, time: parsed.time, difficulty: parsed.difficulty,
      nutrition: parsed.nutrition, tags: [], ingredients: ings, steps: parsed.steps,
      equipment: parsed.equipment, storage: parsed.storage, serving: parsed.serving,
      sources: parsed.sources, source_kind: "paste", added: todayISO()
    }]);
    S.products = prods;
    S.import_ = null;
    saveRecipe(id, function () {
      if (learned) saveProducts();
      S.screen = "read"; S.openRecipe = id;
    });
  },

  "add-open": function () { S.addSugIdx = -1; set({ addItem: { name: "", qty: "", unit: "" }, focusId: "f-add-name" }); },
  "add-use": function (name) {
    S.addItem.name = name;
    S.addItem.unit = "";               // единицу подставит продукт, не прежний ввод
    S.addSugIdx = -1;
    var el = document.getElementById("f-add-name"); if (el) el.value = name;
    S.focusId = "f-add-qty";           // продукт выбран — следующее, что вводят, количество
    render();
  },
  "add-unit-pick": function (u) {
    var q = document.getElementById("f-add-qty");
    if (q) S.addItem.qty = q.value;    // не терять введённое количество при перерисовке
    S.addItem.unit = u; render();
  },
  /* Шаг ± в модалке добавления. В поле — ГОЛОЕ число (без «г»/«кг»): add-save
     парсит его parseFloat'ом, и суффикс «кг» молча потерял бы ×1000. Значение
     кладётся и в S.addItem.qty — модалка перерисовывается на каждый тап
     (обновить «≈ N г» и упаковочные кнопки), и без этого шаг бы откатывался. */
  "add-qty-step": function (arg) {
    var parts = String(arg || "").split("|");
    var kind = parts[0], dir = parseInt(parts[1], 10) || 0;
    var a = S.addItem;
    if (!a || !dir) return;
    var mp = null, nm = (a.name || "").trim();
    if (nm) { var mt = importMatch(nm); if (mt.how === "exact" || mt.how === "alias") mp = productById(mt.id); }
    var effUnit = a.unit || (mp ? (mp.unit || "") : "");
    var el = document.getElementById("f-add-qty");
    if (effUnit === "уп") {            // упаковки считаются целыми: шаг всегда 1
      var cur = parseFloat(String(el ? el.value : a.qty).replace(",", ".")) || 0;
      a.qty = trimNum(Math.max(0, cur + dir));
      S.focusId = "f-add-qty";
      render();
      return;
    }
    var pk = (mp && (!effUnit || effUnit === (mp.unit || ""))) ? packOf(mp) : null;
    var r = stepQtyValue(el ? el.value : a.qty, effUnit, pk, kind, dir);
    if (r == null) return;
    a.qty = trimNum(r.v);
    S.focusId = "f-add-qty";
    render();
  },
  "add-save": function () {
    var v = function (n) { var e = document.getElementById("f-" + n); return e ? e.value.trim() : ""; };
    var name = v("add-name");
    if (!name) { set({ saveNote: "Название обязательно." }); return; }
    var qs = v("add-qty").replace(",", ".");
    var qty = qs === "" ? null : parseFloat(qs);
    if (qs !== "" && isNaN(qty)) { set({ saveNote: "Количество — число." }); return; }

    // единица: явный выбор (чипы шт/г) → скрытое/текстовое поле → продукт
    var pid = null, key = normName(name);
    var unit = S.addItem && S.addItem.unit ? S.addItem.unit : v("add-unit");
    for (var i = 0; i < S.products.length; i++) {
      var p = S.products[i];
      if ([normName(p.name)].concat((p.aliases || []).map(normName)).indexOf(key) >= 0) {
        pid = p.id; if (!unit) unit = p.unit || "";
        /* «уп» переводим в базовую единицу продукта (см. addUnitChoices);
           без известной фасовки перевести нечем — берём единицу продукта. */
        if (unit === "уп") {
          var pk = packOf(p);
          if (pk != null && qty != null) qty = Math.round(qty * pk * 100) / 100;
          unit = p.unit || "";
        }
        break;
      }
    }
    if (unit === "уп") unit = "";      // новый продукт: упаковки у него быть не может

    /* Незнакомого продукта заводим НОВЫЙ, а не оставляем строку без связи:
       иначе он не попадёт ни в группировку по отделам, ни в мердж с
       рецептами — то есть будет вечным сиротой. Отдел
       не спрашиваем здесь: у полки не до анкеты, допишется в каталоге. */
    var newProd = null;
    if (!pid) {
      var id = translitId(name), taken = {};
      S.products.forEach(function (x) { taken[x.id] = 1; });
      if (taken[id]) { var k = 2; while (taken[id + "-" + k]) k++; id = id + "-" + k; }
      newProd = { id: id, name: name, aliases: [], category: "",
                  unit: unit || null, pack_size: null, staple: false,
                  shelf_note: "", last_bought: null, note: "" };
      S.products = S.products.concat([newProd]);
      pid = id;
    }

    S.shopping = S.shopping.concat([{
      id: "i" + Date.now(), product_id: pid, name: name,
      qty: qty, unit: unit || null, extra: 0, bought: false,
      from: [], added: todayISO(), note: ""
    }]);
    S.addItem = null;
    saveShopping(function () {
      if (newProd) {
        saveProducts();
        S.saveInfo = "«" + newProd.name + "» заведён в каталоге — отдел и фасовку допишите на вкладке «Продукты».";
      }
    });
  },

  /* Конец похода: купленное уходит из списка, и ТОЛЬКО здесь двигается
     last_bought у продуктов. Писать его на каждую галочку значило бы дёргать
     products.json десятки раз за поход и ловить 409 на ровном месте. */
  "clear-bought": function (ev) {
    if (!S.writable) return;
    var gone = S.shopping.filter(function (i) { return i.bought; });
    if (!gone.length) return;
    uiConfirm({ title: "Убрать купленное?", text: gone.length + " " + plural(gone.length, "позиция уйдёт", "позиции уйдут", "позиций уйдут") + " из списка покупок.", ok: "Убрать" }).then(function (ok) {
    if (!ok) return;
    var today = todayISO(), touched = false;
    var prods = S.products.map(function (p) {
      var hit = gone.some(function (i) { return i.product_id === p.id; });
      if (!hit) return p;
      touched = true;
      return Object.assign({}, p, { last_bought: today });
    });
    S.shopping = S.shopping.filter(function (i) { return !i.bought; });
    S.products = prods;
    saveShopping(function () { if (touched) saveProducts(); });
    });
  },

  /* prodCard: null — на рецепт можно уйти чипом ИЗ карточки товара, и
     оставленная открытой карточка перекрыла бы страницу рецепта. */
  "open-recipe": function (id) { set({ screen: "read", openRecipe: id, prodCard: null }); },
  "dur-open": function (i) { set({ durEdit: { id: S.openRecipe, i: +i }, focusId: "f-dur" }); },
  "dur-cancel": function () { set({ durEdit: null }); },
  "dur-save": function (i) {
    var r = recipeById(S.openRecipe), el = document.getElementById("f-dur");
    if (!r || !el) return;
    var raw = el.value.trim();
    /* Пустое поле — это «время неизвестно», а не «ноль минут». Стираем скобки
       целиком: шаг честно выпадает из суммы и попадает в «время у N из M». */
    if (raw && !stepMinutes("(" + raw + ")")) {
      set({ saveNote: "Не разобрал длительность. Понимаю «8 мин», «2 м», «4-10 мин», «~3ч», «1,5 часа», «20 сек», «2 ч 10 мин». «~» — если это оценка." });
      return;
    }
    var steps = (r.steps || []).slice();
    var s = steps[+i];
    if (!s) return;
    var name = String(s.title || "").replace(/\s*\([^)]*\)\s*$/, "").trim();
    var dur = normDur(raw);
    var passEl = document.getElementById("f-dur-passive");
    var passive = passEl ? passEl.checked : (s.passive === true);
    steps[+i] = Object.assign({}, s, { title: name + (dur ? " (" + dur + ")" : ""),
                                       passive: passive ? true : undefined });
    S.recipes = S.recipes.map(function (x) {
      return x.id === r.id ? Object.assign({}, x, { steps: steps }) : x;
    });
    S.durEdit = null;
    saveRecipe(r.id);
  },
  "weigh-open": function (id) { set({ weighEdit: id, focusId: "f-weigh" }); },
  "weigh-cancel": function () { set({ weighEdit: null }); },
  "weigh-save": function (id) {
    var el = document.getElementById("f-weigh");
    if (!el) return;
    var s = String(el.value).trim().replace(",", ".");
    var v = s === "" ? null : parseFloat(s);
    if (s !== "" && (isNaN(v) || v <= 0)) {
      set({ saveNote: "Масса — положительное число в граммах." }); return;
    }
    S.recipes = S.recipes.map(function (r) {
      return r.id === id ? Object.assign({}, r, { finished_g: v }) : r;
    });
    S.weighEdit = null;
    saveRecipe(id);
  },
  /* «Печать» с экрана чтения ведёт на лист, а не в диалог принтера сразу:
     иначе выбранное число порций и вёрстку видно только на бумаге. */
  print: function () { set({ screen: "print" }); },
  "do-print": function () { window.print(); },
  cook: function (id) {
    var rid = id || S.openRecipe, saved = cookLoad(rid);
    S.openRecipe = rid;
    S.cook = { recipeId: rid, step: 0, checked: {} };
    /* Есть сохранённый прогресс дальше первого шага → спрашиваем, а не
       продолжаем молча и не сбрасываем молча. */
    if (saved && saved.step > 0) {
      S.resume = { recipeId: rid, step: saved.step, checked: saved.checked || {}, at: saved.at };
    }
    set({ screen: "cook" });
  },
  "back-read": function () {
    cookSave();
    wakeRelease();
    set({ screen: "read", sheet: null });
  },
  /* Листание шагов и галочки правят ТОЛЬКО тело режима готовки (patchCook).
     Полный render() здесь пересобирал весь документ на каждый тап по «вперёд» —
     на кухне это видно как мигание под пальцем. */
  "cook-step-rel": function (d) {
    var r = recipeById(S.cook.recipeId), max = (r.steps || []).length - 1;
    S.cook.step = Math.max(0, Math.min(max, S.cook.step + (+d)));
    cookSave();
    if (!patchCook()) render();
  },
  /* Выбор шага из оглавления ЗАКРЫВАЕТ шторку — а это уже смена разметки
     страницы (оверлей исчезает), точечной правкой не обойтись. */
  "cook-step-abs": function (i) {
    S.cook.step = +i; S.sheet = null; cookSave(); render();
  },
  "cook-sheet": function (which) { set({ sheet: which }); },
  "cook-close-sheet": function () { set({ sheet: null }); },
  "cook-check": function (i) {
    S.cook.checked[+i] = !S.cook.checked[+i];
    cookSave();
    if (!patchCook()) render();
  },
  /* wakeWanted — намерение человека, wakeLock — фактическое удержание. Их надо
     различать: система снимает удержание сама, но желание при этом не
     отменяется, и по возвращении на вкладку его надо восстановить. */
  "cook-awake": function () {
    if (S.wakeLock) { S.wakeWanted = false; wakeRelease(); }
    else { S.wakeWanted = true; wakeRequest(); }
  },
  "resume-cont": function () {
    S.cook.step = S.resume.step; S.cook.checked = S.resume.checked || {};
    set({ resume: null });
  },
  "resume-restart": function () {
    cookClear(S.resume.recipeId);
    S.cook = { recipeId: S.resume.recipeId, step: 0, checked: {} };
    set({ resume: null });
  },

  "portion-inc": function (id) {
    var r = recipeById(id); if (!r) return;
    var cur = S.portions[id] || r.servings;
    S.portions[id] = cur + 1; render();
  },
  "portion-dec": function (id) {
    var r = recipeById(id); if (!r) return;
    var cur = S.portions[id] || r.servings;
    if (cur <= 1) return;
    S.portions[id] = cur - 1; render();
  },

  "prod-edit": function (id) {
    var p = productById(id);
    if (p) set({ prodEdit: Object.assign({}, p) });   // правим копию
  },
  "prod-card": function (id) { set({ prodCard: id }); },
  /* «Править» из карточки: редактор той же записи открывается поверх
     просмотра (окна стопкой) — путь «посмотрел → поправил» в один тап;
     «Отмена» возвращает к карточке, сохранение — к карточке с новыми данными. */
  "prod-card-edit": function (id) {
    var p = productById(id);
    if (p) set({ prodEdit: Object.assign({}, p) });
  },
  /* «Новый продукт» — пустая карточка. Может открываться и из редактора
     рецепта (когда нужного продукта нет в каталоге): запоминаем, куда
     вернуться, а форму редактора снимаем, чтобы не потерять ввод. */
  "prod-new": function () {
    if (S.edit) edCollect();
    set({ prodEdit: { id: null, name: "", aliases: [], category: "", unit: null,
                      pack_size: null, staple: false, shelf_note: "", cooked_ratio: null,
                      piece_g: null, nutrition_100g: null, note: "" },
          prodReturn: S.screen === "edit" ? "edit" : null });
  },
  /* Тап по чипу отдела перерисовывает модалку, поэтому введённое сначала
     СНИМАЕТСЯ с формы — иначе полдесятка полей обнулялись бы при каждом
     переключении. Тот же сбор используется при сохранении. */
  "prod-dept": function (v) {
    var p = readProdForm();
    /* Повторный тап по выбранному отделу снимает выбор: иначе поставленную
       по ошибке категорию нельзя убрать вовсе. */
    p.category = (p.category === v) ? "" : v;
    set({ prodEdit: p });
  },
  "prod-del": function () {
    var p = S.prodEdit;
    if (!p || !p.id) return;
    /* Продукт, на который ссылаются рецепты, удалять опасно: ингредиент
       осиротеет и перестанет находиться. Считаем ссылки и говорим о них. */
    var used = recipesUsing(p.id);
    var inList = S.shopping.some(function (i) { return i.product_id === p.id; });
    var warn = "";
    if (used.length) {
      warn = "На него ссылаются рецепты (" + used.length + "): " +
        used.slice(0, 3).map(function (r) { return r.title; }).join(", ") +
        (used.length > 3 ? "…" : "") +
        ".\nИнгредиент останется в рецепте, но потеряет связь с каталогом: пропадут фасовка и КБЖУ.";
    }
    if (inList) warn += (warn ? "\n\n" : "") + "Позиция из списка покупок останется — её уберите отдельно.";
    uiConfirm({ title: "Удалить из каталога?", name: p.name, warn: warn }).then(function (ok) {
      if (!ok) return;
      S.products = S.products.filter(function (x) { return x.id !== p.id; });
      S.prodEdit = null;
      if (S.prodCard === p.id) S.prodCard = null;   // карточка удалённого под формой — тоже закрыть
      saveProducts();
    });
  },
  "prod-save": function () {
    var p = readProdForm();
    if (!p.name) { set({ saveNote: "Название обязательно." }); return; }
    if (p.cooked_ratio != null && p.cooked_ratio <= 0) {
      set({ saveNote: "Разваривание — положительное число (на него делят)." }); return;
    }
    if (p.piece_g != null && p.piece_g <= 0) {
      set({ saveNote: "Граммов в штуке — положительное число." }); return;
    }
    /* Алиас, принадлежащий двум продуктам, делает сопоставление
       недетерминированным — худший вид поломки, выглядит случайным. */
    for (var i = 0; i < S.products.length; i++) {
      var o = S.products[i];
      if (o.id === p.id) continue;
      var mine = p.aliases.concat([p.name.toLowerCase()]);
      var theirs = (o.aliases || []).concat([(o.name || "").toLowerCase()]);
      for (var j = 0; j < mine.length; j++) {
        if (theirs.indexOf(mine[j]) >= 0) {
          set({ saveNote: "Название «" + mine[j] + "» уже занято продуктом «" + o.name + "»." });
          return;
        }
      }
    }
    /* Новый продукт (без id) получает slug из названия, уникальный. Без этого
       он сохранялся бы с id:undefined и не находился бы ни рецептом, ни
       списком (баг был скрыт тем, что кнопки «Новый продукт» раньше не было). */
    if (!p.id) {
      var nid = translitId(p.name), taken = {};
      S.products.forEach(function (x) { taken[x.id] = 1; });
      if (!nid) nid = "product";
      if (taken[nid]) { var k = 2; while (taken[nid + "-" + k]) k++; nid = nid + "-" + k; }
      p.id = nid;
    }
    var arr = S.products.slice();
    var idx = arr.map(function (x) { return x.id; }).indexOf(p.id);
    if (idx >= 0) arr[idx] = p; else arr.push(p);
    S.products = arr;
    var ret = S.prodReturn;
    S.prodEdit = null; S.prodReturn = null;
    /* Из редактора рецепта — сразу добавляем свежий продукт в его ингредиенты:
       человек затем и заводил его. */
    if (ret === "edit" && S.edit) {
      edCollect();
      S.edit.ings = S.edit.ings.concat([{ name: p.name, product_id: p.id, amount: "", measure: "", state: null }]);
    }
    /* Заводили продукт ради конкретного несвязанного ингредиента — связываем
       сразу же. linkIngredient сам сохранит и каталог, и рецепт. */
    if (ret && ret.link) { linkIngredient(ret.link.id, ret.link.i, p.id); return; }
    saveProducts();
  }
};

/* ═══════════════════════ события ═════════════════════════════════════════ */
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "noop") { ev.stopPropagation(); return; }
  var fn = ACTS[act];
  if (!fn) return;
  ev.preventDefault();
  fn(el.getAttribute("data-arg"));
});
/* Кнопку темы ведёт ui-kit (uiSetTheme); здесь — перерисовка от новой темы. */
document.addEventListener("ui-theme", function (ev) { set({ theme: ev.detail }); });
document.addEventListener("input", function (ev) {
  var t = ev.target;
  /* Единица продукта меняется — суффиксы фасовки должны догнать сразу.
     Перерисовывать модалку ради этого нельзя: пропадёт фокус в поле. */
  if (t.id === "f-unit") {
    var u = t.value.trim();
    [].forEach.call(document.querySelectorAll(".pack-unit"), function (e) { e.textContent = u; });
    /* Смена СЕМЬИ единицы (штука ↔ объём ↔ вес) меняет поле перевода внизу:
       «г в 1 шт» ↔ «г в 100 мл» ↔ нет поля. Перерисовываем модалку только на
       смене семьи (не на каждой букве), сняв форму и восстановив фокус. При
       смене семьи прежний перевод сбрасываем — его вводят под новую единицу. */
    if (S.prodEdit && convKind(u) !== convKind(S.prodEdit.unit)) {
      var snap = readProdForm();
      snap.piece_g = null; snap.g_per_100ml = null;
      S.prodEdit = snap; S.focusId = "f-unit"; S.focusPos = t.selectionStart;
      render();
    }
    return;
  }
  if (t.id === "f-ed-name" && S.edit) {
    /* Кнопка «Сохранить» гаснет при пустом названии. Перерисовываем ТОЛЬКО на
       переходе пусто↔непусто — иначе редактор дёргался бы на каждой букве и
       терял бы фокус в textarea шагов. */
    var was = (S.edit.name || "").trim() !== "";
    S.edit.name = t.value;
    var now = t.value.trim() !== "";
    if (was !== now) { S.focusId = t.id; S.focusPos = t.selectionStart; render(); }
    return;
  }
  /* ── Поля-фильтры: НЕ полный render() ──────────────────────────────────
     От буквы в поиске меняется один узел — список. Его и переписываем
     (patchHTML). Инпут при этом не пересоздаётся, поэтому фокус, каретка и
     клавиатура телефона остаются сами: focusId/focusPos тут не нужны, они и
     были лечением симптома полной перерисовки. Узла нет (успели уйти с экрана
     или закрыть модалку) — честно откатываемся на render(). */
  if (t.id === "f-ed-cat-q" && S.edit) {
    /* edCollect() больше не нужен: форма редактора не пересоздаётся, а значит
       недописанные ингредиенты и шаги никуда не деваются. */
    S.edCatQuery = t.value;
    if (!patchHTML("ed-cat-list", edCatalogHTML())) render();
    return;
  }
  if (t.id === "f-ing-link-q" && S.ingLink) {
    S.ingLink.q = t.value;
    if (!patchHTML("ing-link-list", ingLinkListHTML())) render();
    return;
  }
  if (t.id === "f-prod-q") {
    S.productQuery = t.value;
    S.prodSel = -1;                    // список поменялся — выбор стрелками сброшен
    if (!patchHTML("prod-results", productsResults())) render();
    return;
  }
  if (t.id === "f-rec-q") {
    S.recipeQuery = t.value;
    if (!patchHTML("rec-results", recipesResults())) render();
    return;
  }
  if (t.id === "f-add-qty" && S.addItem) {
    S.addItem.qty = t.value;
    var cv = document.getElementById("add-conv");
    if (cv) {
      var cvTxt = addConvText();
      cv.textContent = cvTxt;
      cv.style.display = cvTxt ? "" : "none";
    }
    return;
  }
  if (t.id === "f-add-name" && S.addItem) {
    S.addItem.name = t.value;
    S.addSugIdx = -1;                  // продолжили печатать — выбор стрелками сброшен
    /* Полная перерисовка нужна ровно на одном событии: заматчился ДРУГОЙ
       продукт (или перестал матчиться совсем) — тогда меняются поля «Единица»
       и шаги упаковки, а их точечно не подменишь. Обычная буква меняет только
       подсказку, и её мы правим на месте. */
    if (addMatchSig() !== S._addSig) {
      S.addItem.unit = "";             // выбор единицы принадлежал прежнему продукту
      S.focusId = t.id; S.focusPos = t.selectionStart;
      render();
      return;
    }
    if (!patchHTML("add-name-sug", addNameHintHTML())) { render(); return; }
    // поле «срастается» с выпавшим списком — радиус зависит от его наличия
    t.style.borderRadius = addSugList().length ? "8px 8px 0 0" : "";
    return;
  }
});
document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.id === "f-swap" && S.plan) {
    var i = +t.getAttribute("data-swap"), x = S.plan.rows[i], p = productById(t.value);
    if (x && p) {
      x.product_id = p.id;
      x.name = p.name;
      x.swapped = p.id !== x.orig_product_id;
      /* Единица берётся у продукта: менять «мл» кефира на «шт» яиц бессмысленно,
         а несовпадение единиц потом разрушило бы мердж в списке. */
      if (p.unit) x.unit = p.unit;
    }
    S.planSwap = null; render();
  }
});
/* Блокировка экрана снимается системой при сворачивании вкладки, а старый
   sentinel переиспользовать нельзя — нужен новый запрос. Сценарий рядовой:
   таймеров в странице нет намеренно (веб-таймер не звучит на заблокированном
   экране и не переживает закрытие браузера), поэтому человек уходит ставить
   таймер на телефоне и возвращается. */
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && S.screen === "cook" && S.wakeWanted && !S.wakeLock) {
    wakeRequest();
  }
});

/* Клавиши поиска (ui-kit ≥1.63: событие ui-search-key; Escape кит делает сам).
   Рецепты: Enter при единственном результате открывает его.
   Продукты: ↓/↑ перебирают результаты (подсветка .kb-sel, без перерисовки),
   Enter открывает выбранный, а если выбора нет, но результат один — его.
   Результаты берём из DOM: он и есть то, что человек видит (фильтры, отделы). */
document.addEventListener("ui-search-key", function (ev) {
  var id = ev.target && ev.target.id, key = ev.detail && ev.detail.key;
  if (id === "f-rec-q") {
    var cards = document.querySelectorAll('#rec-results [data-act="open-recipe"]');
    if (key === "Enter" && cards.length === 1) {
      ev.preventDefault(); ACTS["open-recipe"](cards[0].getAttribute("data-arg"));
    }
    return;
  }
  if (id !== "f-prod-q") return;
  var rows = document.querySelectorAll('#prod-results [data-act="prod-card"]');
  if (!rows.length) return;
  if (key === "ArrowDown" || key === "ArrowUp") {
    ev.preventDefault();
    var ix = S.prodSel + (key === "ArrowDown" ? 1 : -1);
    S.prodSel = Math.max(-1, Math.min(rows.length - 1, ix));
    /* Подсвечиваем всю карточку (строку целиком), а не её текстовый блок */
    [].forEach.call(rows, function (r, i) {
      var card = r.closest(".row-hover") || r;
      card.classList.toggle("kb-sel", i === S.prodSel);
      if (i === S.prodSel) card.scrollIntoView({ block: "nearest" });
    });
    if (S.prodSel < 0) ev.target.scrollIntoView({ block: "nearest" });   // вернулись к строке ввода
  } else if (key === "Enter") {
    var pick = S.prodSel >= 0 && rows[S.prodSel] ? rows[S.prodSel] : (rows.length === 1 ? rows[0] : null);
    if (pick) { ev.preventDefault(); S.prodSel = -1; ACTS["prod-card"](pick.getAttribute("data-arg")); }
  }
});

/* Слой страницы (ui-kit uiLayerBind): Escape и пункты меню при открытых окнах.
   Порядок «что закрыть» прежний: подтверждение удаления (uiConfirm) гасит ui-kit,
   дальше шит готовки, верхнее окно, правка количества, редактор рецепта
   (Esc = «Отмена»: из нового — в список, из правки — на рецепт). */
function foodLayerCloseAll() {
  var p = { sheet: null, prodEdit: null, prodCard: null, prodReturn: null, addItem: null, plan: null, import_: null, ingLink: null, qtyEdit: null };
  if (S.screen === "edit") { var e = S.edit; p.edit = null; p.edCatQuery = ""; p.screen = e && e.id ? "read" : "recipes"; }
  set(p);
}
uiLayerBind({
  depth: function () {
    return (S.sheet ? 1 : 0) + document.querySelectorAll(".ui-modal").length + (S.qtyEdit ? 1 : 0) + (S.screen === "edit" ? 1 : 0);
  },
  closeTop: function () {
    if (S.sheet) { set({ sheet: null }); return; }
    if (document.querySelector(".ui-modal")) { ACTS["close-modal"](); return; }
    if (S.qtyEdit) { set({ qtyEdit: null }); return; }
    if (S.screen === "edit") { ACTS["ed-cancel"](); return; }
    return false;
  },
  dirty: function () {
    var ms = document.querySelectorAll(".ui-modal");
    for (var i = 0; i < ms.length; i++) if (uiFormDirty(ms[i])) return true;
    if (S.screen === "edit" && S.edit && S._editSnap != null && S._editKey === S.edit) {
      try { edCollect(); return JSON.stringify(S.edit) !== S._editSnap; } catch (e) { return false; }
    }
    return false;
  },
  closeAll: foodLayerCloseAll
});
document.addEventListener("keydown", function (ev) {
  /* Подсказки продуктов в окне добавления: ↓/↑ ходят по списку, Enter берёт
     выбранный. Любой ввод буквы сбрасывает выбор (см. input) и печатает дальше. */
  if (S.addItem && ev.target && ev.target.id === "f-add-name") {
    var sg = addSugList();
    if ((ev.key === "ArrowDown" || ev.key === "ArrowUp") && sg.length) {
      ev.preventDefault();
      var ix = S.addSugIdx == null ? -1 : S.addSugIdx;
      ix += ev.key === "ArrowDown" ? 1 : -1;
      S.addSugIdx = Math.max(-1, Math.min(sg.length - 1, ix));
      patchHTML("add-name-sug", addNameHintHTML());
    } else if (ev.key === "Enter" && S.addSugIdx >= 0 && sg[S.addSugIdx]) {
      ev.preventDefault();
      ACTS["add-use"](sg[S.addSugIdx].name);
    }
  }
  /* Стрелки листают шаги: на десктопе это быстрее, чем целиться в кнопку. */
  if (S.screen === "cook" && !S.sheet && !S.resume) {
    if (ev.key === "ArrowRight") { ev.preventDefault(); ACTS["cook-step-rel"]("1"); }
    if (ev.key === "ArrowLeft") { ev.preventDefault(); ACTS["cook-step-rel"]("-1"); }
  }
  // Enter в поле количества = кнопка OK: у полки лишний тап лишний
  if (ev.key === "Enter" && S.qtyEdit && ev.target && ev.target.id === "f-qty") {
    ev.preventDefault();
    ACTS["qty-save"](S.qtyEdit);
  }
});

/* ═══════════════════════ старт ═══════════════════════════════════════════ */
/* Диплинк ?recipe=<id>[&print=1] — тот же приём, что ?trip= в travel.html.
   Нужен и сам по себе (закладка на рецепт с телефона), и как единственный
   способ открыть страницу сразу на нужном экране: страница перерисовывается
   целиком и адрес обычной навигацией не меняет. Порций тут НЕТ намеренно —
   пересчёт живёт в сеансе, ссылка «на 10 порций» протухала бы молча. */
var _deepLinkDone = false;
function applyDeepLink() {
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var id = q.get("recipe");
  if (!id) return;
  /* Кириллица в адресе приезжает и в NFC, и в NFD (Safari/Finder) — сравнение
     байт-в-байт промахивается. Нормализуем обе стороны. */
  function nfc(s) { try { return String(s).normalize("NFC"); } catch (e) { return String(s); } }
  var want = nfc(id);
  var r = S.recipes.filter(function (x) { return nfc(x.id) === want; })[0];
  if (!r) return;                       // неизвестный id — просто список рецептов
  S.openRecipe = r.id;
  S.screen = q.get("print") ? "print" : "read";
}

(function boot() {
  var saved = null;
  try { saved = localStorage.getItem("hub-theme"); } catch (e) {}
  S.theme = saved === "dark" ? "dark" : "light";
  loadAll().catch(function (e) {
    S.loading = false; S.error = describeError(e); render();
  });
})();

})();
</script>
