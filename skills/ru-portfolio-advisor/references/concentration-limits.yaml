# concentration-limits.yaml — SSOT лимитов концентрации акционной книги
#
# Единственный источник ЧИСЕЛ для проверки concentration_limits.py. Знаменатель
# всех долей — фактическая акционная книга (L2_cur = сумма value_rub активных
# holdings), а НЕ T* (неподвижная точка сайзинга). Это намеренно: цели размещения
# считаются от того, куда книга ИДЁТ (T*); лимиты концентрации — от того, какой
# риск несётся СЕГОДНЯ (L2_cur). Не унифицировать эти два знаменателя.
#
# Постановка — docs/investment/spec-gate-aware-sizing-trim-fix.md §9 (задача C).
#
# ГДЕ ЛЕЖИТ И ПОЧЕМУ. Файл внутри скилла, в references/ — попадает в .skill-бандл
# (доступен прогону в Claude.ai) и версионируется git'ом. Тот же класс, что
# cbr_rates_bundled.json рядом: курируемые данные модели, не наблюдения.
# Правка требует переупаковки скилла (./pack.sh), иначе в Claude.ai останутся
# старые лимиты.
#
# Пересмотр — по решению владельца, не автоматически. Именованное исключение без
# review_date конфиг не принимает (это была бы молчаливая отмена лимита) —
# concentration_limits.py откажется грузить такой файл с exit 2.

schema_version: 1
as_of: 2026-08-21
spec: docs/investment/spec-gate-aware-sizing-trim-fix.md §9
snapshot_basis: portfolio-2026-08-21.json

# ── лимит по эмитенту (группе эмитента), по умолчанию ──
default_issuer_limit_pct: 15.0

# ── лимит по сектору (активируется отдельным флагом --sector в CLI) ──
sector_limit_pct: 35.0

# Порог качества данных для секторного лимита: если доля holdings с sector: null
# в L2_cur превышает этот порог — секторный расчёт отказывает (status: disabled),
# а не считает по грязным данным. Поле sector сейчас (снапшот 2026-08-21) содержит
# 45,57% null и задвоенные схемы именования (Финансовый/banks_finance,
# IT/it_telecom) — починка поля sector вне этой задачи (portfolio-data-loader).
sector_null_share_threshold_pct: 5.0

# ── группировка эмитента: обыкновенные + привилегированные одной компании ──
# Группы — явный конфиг, НЕ эвристика по суффиксу "P" (эвристика встречается
# часто, но не универсально — ломается на первом же исключении из правила).
# Тикер, не упомянутый ни в одной группе, — своя отдельная группа из одного тикера.
issuer_groups:
  SBER: ["SBER", "SBERP"]

# ── именованные исключения из лимита по умолчанию ──
# Запись, а не число: эмитент (issuer — должен совпадать с ключом issuer_groups
# либо с тикером-одиночкой), значение лимита, текстовое обоснование, дата
# пересмотра. Исключение с истёкшей review_date НЕ применяется — проверка идёт
# по default_issuer_limit_pct + warning exception_expired:<id>. Исключение БЕЗ
# review_date конфиг не принимает вовсе (exit 2 при загрузке).
issuer_exceptions:
  sber:
    issuer: SBER
    limit_pct: 20.0
    basis: >
      Сбербанк (SBER+SBERP) — крупнейший и наиболее ликвидный эмитент индекса
      Мосбиржи, вес в IMOEX существенно выше среднего эмитента портфеля;
      санкционный периметр внутренний (домашний рынок), устойчивая прибыль.
      Повышенный лимit принят как решение владельца при вводе лимитов
      концентрации 21.08.2026.
    review_date: "2027-02-21"

# Журнал решений владельца — каждая правка лимитов/исключений строкой, чтобы
# через месяцы было видно, что менялось и почему (по образцу sanctions-positions.yaml).
changelog:
  - date: 2026-08-21
    change: >
      Первичный ввод: лимит по эмитенту 15% по умолчанию, именованное исключение
      SBER+SBERP 20% (review_date 2027-02-21), секторный лимит 35% (принят, но
      не активируется автоматически — ждёт починки поля sector), порог качества
      данных для секторного расчёта 5%.
    trigger: "spec-gate-aware-sizing-trim-fix.md §9 — задача C"
