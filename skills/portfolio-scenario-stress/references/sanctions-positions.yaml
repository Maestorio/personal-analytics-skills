# sanctions-positions.yaml — SSOT значений `sanctions_position`
#
# Единственный источник ЧИСЕЛ. Обоснования и якоря — sanctions-position-rubric.md,
# человекочитаемый разбор — sanctions-position-draft.md (значения там обязаны
# совпадать с этим файлом, проверяется тестом).
#
# `as_of` — дата, на которую значения соответствовали санкционному статусу.
# От неё считается устаревание: check_position_freshness.py читает эту дату и
# список тикеров и строит запросы «что изменилось с тех пор».
#
# ГДЕ ЛЕЖИТ И ПОЧЕМУ. Файл внутри скилла, в references/ — значит попадает в
# .skill-бандл и доступен прогону в Claude.ai, и при этом версионируется git'ом.
# Это тот же класс, что таблицы бет в sector-sensitivities.md: курируемые числа
# модели, меняются при калибровке, а не наблюдения. В docs/ его класть нельзя —
# pack.sh кладёт в бандл только skills/<имя>/, и шаг проверки свежести упал бы
# на отсутствующем файле.
#
# Правка значений требует ПЕРЕУПАКОВКИ скилла (./pack.sh), иначе в Claude.ai
# останутся старые числа.
#
# Пересматривать ПО РУБРИКЕ, а не на глаз. Скилл: /sanctions-positions
# Рубрика: docs/investment/portfolio/sanctions-position-rubric.md (в репозитории)

schema_version: 1
as_of: 2026-11-06
rubric: docs/investment/portfolio/sanctions-position-rubric.md
snapshot_basis: portfolio-2026-08-06.json
# Порог устаревания в днях: дольше — прогон стресса потребует проверки событий.
stale_after_days: 30

# confidence: high | medium | low — насколько уверены в юридическом статусе.
# low и medium первыми идут в веб-проверку при пересмотре.
positions:
  # ── под блокирующими мерами ──
  SBER:
    position: 0.90
    confidence: high
    basis: "блокирующие с 2022, отрезан от SWIFT и корсчетов; ядро бизнеса"
  SBERP:
    position: 0.90
    confidence: high
    basis: "преф той же бумаги, статус общий"
  MOEX:
    position: 0.85
    confidence: high
    basis: "SDN июня-2024; торги вне валютной секции продолжаются"
  MBNK:
    position: 0.85
    confidence: medium
    basis: "SDN США 2024; цена ошибки ~0.03 п.п. по портфелю"
  T:
    position: 0.75
    confidence: medium
    basis: "блокирующие по существу одной юрисдикции (ЕС); розничный банк, внутренний контур"
  NVTK:
    position: 0.65
    confidence: high
    basis: "Арктик СПГ-2 под блокирующими с 11.2023, проект остановлен; компания под секторальными"
  PLZL:
    position: 0.55
    confidence: medium
    basis: "блокирующие одной юрисдикции + экспорт перенаправлен (поправка −0.10)"

  # ── косвенная экспозиция ──
  GMKN:
    position: 0.30
    confidence: medium
    basis: "прямых блокирующих нет (Pd/Ni критичны покупателям), задеты платежи и логистика"
  TGLD:
    position: 0.25
    confidence: medium
    basis: "товарный фонд: задет не металл, а инфраструктура хранения и расчётов"
  OZON:
    position: 0.45
    confidence: medium
    basis: "блокирующие на дочерний Озон Банк (ЕС, регламент 2026/1843 от 23.07.2026; Великобритания, RUS3709 от 06.08.2026), компания не затронута: полоса 0.55, −0.10 — бизнес работает как прежде"
  YDEX:
    position: 0.35
    confidence: medium
    basis: "блокирующие на дочерний Яндекс Банк (Великобритания, RUS3621 от 16.06.2026; ЕС, регламент 2026/1843 от 23.07.2026), компания не затронута; банк — не ключевая часть группы: ниже полосы 0.55, к уровню «только секторальные»"
  RENI:
    position: 0.20
    confidence: medium
    basis: "внутреннее страхование; задето перестрахование"
  DATA:
    position: 0.15
    confidence: medium
    basis: "внутренний софт; ограничения скорее в пользу бизнеса"
  FINAMAR:
    position: 0.15
    confidence: low
    basis: "алгоритмическая стратегия на RU-рынке; экспозиция через инфраструктуру"

  # ── внутренний бизнес ──
  MDMG: {position: 0.10, confidence: medium, basis: "частная медицина, внутренний спрос"}
  PRMD: {position: 0.10, confidence: medium, basis: "фарма; задет импорт субстанций"}
  CNRU: {position: 0.10, confidence: medium, basis: "классифайд недвижимости"}
  BTBR: {position: 0.10, confidence: low,    basis: "внутренняя площадка"}
  WUSH: {position: 0.10, confidence: medium, basis: "кикшеринг; регуляторная, не санкционная история"}
  MRKP:  {position: 0.05, confidence: medium, basis: "Россети Центр и Приволжье — внутренняя сетевая, тарифная выручка; прямых мер US/EU/UK не найдено (проверка 2026-08-06)"}
  LSNGP: {position: 0.05, confidence: medium, basis: "Россети Ленэнерго (преф) — внутренняя сетевая; блокирующих US/EU/UK нет, укр. список без эффекта на тарифный бизнес (проверка 2026-08-06)"}
  DOMRF: {position: 0.05, confidence: medium, basis: "институт развития, внутренний контур"}
  X5:    {position: 0.05, confidence: high,   basis: "продуктовый ритейл"}
  GLRX:  {position: 0.05, confidence: medium, basis: "девелопер"}
  LENT:  {position: 0.05, confidence: high,   basis: "ритейл"}
  XXXXXX: {position: 0.05, confidence: medium, basis: "ЗПИФ коммерческой недвижимости (Рентал ПРО)"}

# Позиция НЕ задаётся: облигации (β выводится формулой, доли пункта) и
# money-market (TPAY, TMON — движок их priors не читает).
not_applicable:
  reason_bonds: "β = −duration × Δspread/100, влияние в долях п.п."
  reason_money_market: "движок использует betas_for_money_market(), priors не читает"

# Журнал пересмотров: каждая правка — строка. Нужен, чтобы через месяц было видно,
# что именно менялось и по какому событию, а не только текущее состояние.
changelog:
  - date: 2026-08-04
    change: "первичное назначение по рубрике; T и PLZL подтверждены владельцем, MBNK принят 0.85"
    trigger: "PSS-4 P1-3 — введение sanctions_position"
  - date: 2026-08-06
    change: "добавлены MRKP 0.05 и LSNGP 0.05 (полоса «внутренний бизнес»; web-проверка: прямых мер US/EU/UK нет, у LSNGP только укр. список; совпадает с рубричным слотом, который стресс 08-06 использовал ad-hoc). Существующие 24 бумаги не пересматривались — freshness-скрипт: свежие (2 дн из 30)"
    trigger: "новые бумаги в портфеле с 08-04 (PSS-11 п.1)"
  - date: 2026-11-06
    change: "OZON 0.20 → 0.45, YDEX 0.20 → 0.35 (подтверждено владельцем); пересмотрены якоря полосы 0.20 — в ней остаётся RENI. MBNK, MOEX, SBER: включение в 21-й пакет ЕС значения не меняет (у потолка). По остальным бумагам событий 06.08–06.11 не найдено. Не просмотрены поимённо: список ЕС от 12.10.2026 (826 компаний ВПК), действия OFAC 06.08–14.10"
    trigger: "плановый пересмотр (92 дн. при пороге 30); события: Великобритания — Яндекс Банк 16.06.2026 (RUS3621), Озон Банк 06.08.2026 (RUS3709); ЕС — регламент 2026/1843 от 23.07.2026. События предшествуют прежней дате значений: назначение 08-04 их не учло"
