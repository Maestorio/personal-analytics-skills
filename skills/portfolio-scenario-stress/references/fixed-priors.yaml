# fixed-priors.yaml — бумаги, чувствительность которых задана решением владельца и не назначается моделью.
# Читает stress_build.py при СБОРКЕ стресса: запись отсюда сильнее и переноса из прошлого файла (--priors-from),
# и --priors. Пересчёт сайта (stress_recalc) файл не читает — там чувствительности уже лежат в сохранённом стрессе.
# Закрытый перечень: правка требует переупаковки скилла (./pack.sh), иначе в Claude.ai останутся старые значения.
schema_version: 1
fixed:
  FINAMAR:
    factor_betas: {sanctions: 0, geopol: 0, cbr_rate: 0, usdrub: 0, cnyrub: 0, brent: 0, xauusd: 0}
    factor_betas_method: "алгоритмическая торговая стратегия — к рассматриваемым макро-факторам нечувствительна; риск стратегии моделью не покрыт"
    asset_type: fund_algo
    sector_group: algo_strategies
    note: "решение владельца 06.11.2026"
