# ── Латентные оси вкуса (для серендипности — кросс-жанровый матчинг) ──
# Питают explore-квоту: discovery-пик обязан лежать на «любит»-оси, даже если жанр новый.
latent_axes:
  любит:
    - системная песочница со стержнем/прогрессией (DRG Survivor, Death Stranding, ELDEN RING)
    - читаемая структура и направление (Metroid Dread, PoP: Lost Crown, Into the Breach)
    - тактика и просчёт хода (FE: Three Houses, Into the Breach, контроль в Ace Combat 7)
    - >-
      реальный челлендж / риск проигрыша как источник вовлечения (2026-08-28, уточнено
      пользователем) — Three Houses напрягал больше половины прохождения (восторг),
      Into the Breach — частые проигрыши, вовлекало (понравилось); в противовес — Unicorn
      Overlord «не напрягает» (дроп на 25ч) и Fire Emblem Engage на normal не напрягал
      с самого начала (быстрый дроп). Вывод: не глубина тактики сама по себе, а ощутимая
      сложность/давление и риск поражения — без него тактика быстро наскучивает, даже
      если механика хороша. Подтверждено вне тактики: Zelda Echoes of Wisdom (2026-09-21) —
      «неплохая, но слишком простая», оценка нормально
    - «ещё один заход» — короткая петля с ощутимым прогрессом (roguelike/survivor-like)
    - сильный арт и атмосфера (Cloudpunk, Death Stranding, ANIMAL WELL)
    - >-
      нелогичный сюжет с резкими поворотами, который затягивает сам по себе — даже в
      непривычной механике (Inscryption, восторг 2026-08-28 — «затягивает нелогичностью
      и поворотами», деккбилдинг не стал препятствием)
  не_любит:
    - «потеряйся сам» без направления (Hollow Knight, Nine Sols, Nobody Saves the World, открытый MMO-сэндбокс)
    - принудительный гринд, ломающий темп (Octopath, Xenoblade X)
    - построение деки с нуля / глубокие синергии-движки (Balatro, The King is Watching)
    - текстонасыщенность без русского — трение (не жёсткий блок)
    - диффузный прогресс без явного вектора — бросает, даже если игра нравится (Dave the Diver, No Man's Sky, Disco Elysium)
    - >-
      непрозрачные системы без онбординга — «не понял, что делать» уже в начале (2026-09-23:
      Noita, Frostpunk, ASTRONEER; ранее Monster Hunter Rise — «не разобрался в системах»).
      Отличие от «потеряйся сам»: не про навигацию, а про правила игры
    - надоедливые побочные квесты / филлер (Astral Chain, 2026-09-21 — одно наблюдение, не паттерн; у FF VII Remake рецензенты тоже ругают побочки)

# ── Анти-паттерны (негативные сигналы, фильтровать) ──────────────────
anti_patterns:
  - pattern: open-world без нарративного стержня / MMO-подобная структура
    evidence: Xenoblade X (stated dislike), EVE 16.6ч заброшен, Black Desert 3м, The First Descendant 1.4ч (не понравилось, 2026-09-23)
    caveat: Skyrim понравился (давно, ПК) — паттерн не абсолютный; Witcher 3 брошен из-за боёвки, а не структуры (2026-09-21); Path of Exile — много играл, понравилось, но «сейчас уже не моё» (2026-09-23)
  - pattern: survival/building с упором на выживание, а не прогрессию
    evidence: 'ASTRONEER 0.4ч (не понравилось — скучно, неясно что делать), Terraria 0.4ч (брошено — «идея классная, но не моё»), Frostpunk 0.1ч (брошено — не разобрался + Deck), Oxygen Not Included 6.5ч и Ratopia 8ч (брошено) — подтверждено вердиктами 2026-09-23 (NMS убран — игра понравилась, см. library)'
  - pattern: сверхсложные «hardcore-престиж» игры без структуры
    evidence: 'Noita 0.9ч (не понравилось — «идея интересная, но не понял»), Cuphead 0.4ч, Dead Cells 3.6ч (не понравилось, 2026-09-23)'
  - pattern: линейные шутеры/слэшеры старой школы — не держат
    evidence: '"Control" 1.5ч (не понравилось), "DMC5" 0.6ч (брошено — понравилась, но стало скучно), "Mass Effect LE" 1.3ч (брошено — нормально), Darksiders Genesis 9.9ч (брошено) — вердикты 2026-09-23'
    caveat: BioShock Remastered сейчас в процессе (46м, июль 2026) — паттерн под наблюдением; NieR:Automata (Platinum-экшен с сильным сюжетом, восторг, 3 прохождения) — исключение, паттерн не про слэшеры с нарративным крючком. Уточнено 2026-09-23 — DMC5 понравилась, так что паттерн не «не нравится», а «надоедает без нарративного крючка»
  - pattern: управление/производительность на Steam Deck — техническое трение, не вкус
    evidence: 'Against the Storm (управление), while True: learn() (неудобно), Warhammer 40,000: Space Marine 2 (не играбельна), Frostpunk (не играбельна), Palworld (вылеты) — 2026-09-23'
    action: для Steam Deck-кандидатов проверять статус Deck Verified и свежие отзывы про управление с геймпада и производительность; стратегии/симуляторы под мышь и тяжёлые AAA — флаг «на Deck может не пойти»
  - pattern: классические пиксельные топ-дауны без hook
    evidence: '"Hyper Light Drifter" 0.2ч, "Crypt of NecroDancer" 0.1ч'

  - pattern: тактика/SRPG без реального давления сложности — быстро наскучивает даже
      при хорошей механике
    evidence: 'Unicorn Overlord — не напрягает, дроп на 25ч; Fire Emblem Engage — normal
      не напрягал с начала, дроп сразу; контраст: Three Houses (сложно больше половины
      игры, восторг), Into the Breach (частые проигрыши, вовлекало, понравилось)'
    action: для тактики/SRPG-кандидатов проверять отзывы на репутацию жёсткая/пунишащая
      боевая система, избегать игр с щадящим/казуальным балансом на стандартной сложности;
      RNG-тяжёлые/punishing системы (как в Front Mission) — скорее плюс, чем минус, для этого
      профиля
  - pattern: слишком низкая сложность в любом жанре (не только тактика) — игра оценивается
      «нормально» или наскучивает даже при хорошей механике
    evidence: 'Unicorn Overlord (не напрягает, дроп), Fire Emblem Engage (дроп), Zelda Echoes of Wisdom (2026-09-21, пройдена, «слишком простая», нормально)'
    action: для любых кандидатов проверять в отзывах «слишком лёгкая / нет вызова»; при таком сигнале — флаг «низкая сложность» и понижение в списке
  - pattern: стена гринда в JRPG (принудительный фарм опыта ломает темп)
    evidence: 'Octopath Traveler — брошена на стене гринда (заявлено); Xenoblade X — гринд-вол (заявлено); Chained Echoes 0.8ч (2026-09-23 — брошено по темпу, «не завлекла», не гринд; оставлено как слабый сигнал)'
    action: для JRPG-кандидатов проверять отзывы на обязательный фарм
  - pattern: текстонасыщенные игры без русской локализации — фактор трения
    evidence: 'Chained Echoes — отложена частично из-за английского; Caves of Qud (2026-09-23, не понравилось — «слишком много английского»); Bastion (Steam Deck, 2026-09-21) — трудно на слух (рассказчик), чтение по-английски даётся проще: трение касается озвучки без русских субтитров, а не письменного текста'
    action: указывать наличие русского языка в каждой рекомендации; для
      текстонасыщенных жанров (JRPG, CRPG, визуальные новеллы) отсутствие
      русского — минус к приоритету, не жёсткий фильтр
  - pattern: декбилдеры с построением деки с нуля / глубокие синергии-движки — трение
    evidence: 'Balatro и The King is Watching — концепция нравится, но «не умею строить деки»; Cobalt Core не тянет по той же причине'
    action: отделять «готовые архетипы» (Monster Train-тип, где часы есть — ок) от «собери синергию с нуля» (Balatro/Slay-тип — трение); декбилдеры-с-нуля не предлагать наравне, помечать сложность построения деки
    caveat: 'Inscryption (2026-08-28) — исключение: паттерн трения снят нарративным крючком
      (нелогичность сюжета, повороты, смена жанра по ходу игры) — деккбилдинг не был
      препятствием, игра пройдена с вердиктом восторг. Не отменяет паттерн для чистых
      деккбилдеров без сильного сюжетного стержня (Balatro/Slay the Spire остаются трением),
      но при сильном нарративном крючке вокруг механики — можно предлагать с пометкой «как Inscryption»'

