# Известные расхождения сверки «сборка с «Общим балансом» ↔ сборка без него» одного дня
# (parity_check.py --known …; build_snapshot.py --parity-against, этап 6 ухода от Numbers,
# docs/investment/portfolio/numbers-exit-plan.md §4–§5.6).
#
# A — снапшот с балансом (Numbers), B — сборка из сделок + plan.json. Каждая запись — шаблон пути
# поля (`*` — фрагмент без точки, `**` — что угодно, скобки буквально) и причина: расхождение законно
# по самому устройству двух сборок. Это правило, а не исключение «по факту».
# НЕ входят (расхождение здесь — находка, а не норма): стоимость и количество позиций (в том числе
# FINAMAR: план и баланс обязаны совпасть), классы и матрица факта (class_plan_vs_fact,
# matrix_plan_vs_fact), цели классов/матрицы/корзин в долях, факт корзин облигаций из holdings,
# кэш (cash.total_rub, liquid_rub), итоги balance_summary, доходности, плановые поля IE по бумагам.
#
# Формат:
#   - path: "$.input_files.balance"
#     reason: "почему расхождение законно"
#     since: "YYYY-MM-DD"

known:
  # ── происхождение снапшота ──
  - path: "$.input_files.balance"
    reason: "по построению: у сборки без баланса файла «Общий баланс» нет"
    since: "2026-10-28"
  - path: "$.snapshot_type"
    reason: "trades_holdings (сборка из сделок) против снапшота с балансом"
    since: "2026-10-28"
  - path: "$.balance_carried_from"
    reason: "у сборки без баланса — дата снапшота, откуда перенесено то, чего нет в плане, сделках и котировках (ИИС-3, названия, дрейф кэша); у балансной сборки поля нет"
    since: "2026-10-28"
  - path: "$.balance_summary.carried"
    reason: "перечень переноса из прошлого снапшота есть только у сборки без баланса"
    since: "2026-10-28"
  - path: "$.balance_summary.carried_from"
    reason: "то же, что balance_carried_from"
    since: "2026-10-28"
  - path: "$.balance_summary.summary"
    reason: "«Имеется (RUB)» и итоги листа «Общий баланс» без баланса не переносятся (устаревают с ценами)"
    since: "2026-10-28"
  - path: "$.balance_summary.errors_check"
    reason: "таблица «Проверка» листа Numbers; без баланса её нет"
    since: "2026-10-28"
  - path: "$.type_check.**"
    reason: "сверка типов бумаг строится по прошлому снапшоту и сети конкретной сборки"
    since: "2026-10-28"
  - path: "$.plan_check.**"
    reason: "в балансной сборке план сверяется с Numbers (both), без баланса сравнивать не с чем (plan_only, applied)"
    since: "2026-10-28"
  - path: "$.parity"
    reason: "служебный блок самой сверки"
    since: "2026-10-28"
  - path: "$.parity.**"
    reason: "служебный блок самой сверки"
    since: "2026-10-28"

  - path: "$.balance_summary.by_account.iis_3.funds_rub"
